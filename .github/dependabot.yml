{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "github-actions",
      "directories": [
        "/"
      ],
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "05:30",
        "timezone": "Africa/Nairobi"
      },
      "open-pull-requests-limit": 2,
      "cooldown": {
        "default-days": 3
      },
      "groups": {
        "routine-updates": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "commit-message": {
        "prefix": "deps"
      }
    },
    {
      "package-ecosystem": "npm",
      "directories": [
        "/"
      ],
      "schedule": {
        "interval": "weekly",
        "day": "monday",
        "time": "05:30",
        "timezone": "Africa/Nairobi"
      },
      "open-pull-requests-limit": 2,
      "cooldown": {
        "default-days": 3
      },
      "groups": {
        "routine-updates": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "commit-message": {
        "prefix": "deps"
      }
    }
  ]
}
