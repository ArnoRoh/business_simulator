name: Checks

# Application, content, document and browser checks. Browser tooling is development-only.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Engine, content and app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Programme portal
        run: npm run test:portal

      - name: Financial regressions
        run: node scripts/test-corrections.mjs

      - name: Short introduction
        run: node scripts/test-asha-entry.mjs

      - name: Browser lifecycle
        run: node scripts/browser-checks.mjs

      - name: Programme model and generated outputs
        run: |
          python3 scripts/check-generated.py
          python3 scripts/check-model.py

      - name: Engine
        run: node scripts/test-engine.mjs

      - name: Scenarios
        run: node scripts/validate-scenario.mjs

      - name: Both languages
        run: node scripts/validate-i18n.mjs

      # This one prints numbers a person is meant to read; CI can only tell you it did
      # not find a whole-business failure. See its header comment.
      - name: Full playthroughs
        run: node scripts/simulate-runs.mjs

      - name: App wiring
        run: node scripts/smoke-app.mjs

      # Every chapter played to the end in both languages, reading what the screens
      # actually say. This is the check that meets the defects a playthrough meets.
      - name: Every chapter, every screen
        run: node scripts/playthrough.mjs


  links:
    name: Internal links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative Markdown links
        run: bash scripts/check-links.sh
