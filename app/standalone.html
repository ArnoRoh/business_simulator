ier gives you more time. Each product leaves less after ingredients, so weekly profit falls even though the bank gets some breathing room.","sw":"Msambazaji anakupa muda zaidi. Kila bidhaa inaacha kidogo baada ya malighafi, kwa hiyo faida ya wiki inashuka ingawa benki inapata nafasi ya kupumua."},"lesson":{"en":"Supplier credit is useful working capital, not free money. You pay for the time through a higher input cost.","sw":"Credit ya msambazaji ni working capital yenye matumizi, si pesa bure. Unalipia muda huo kwa gharama kubwa ya malighafi."},"later":[{"inWeeks":3,"effects":{"lines.bread.unitCost":"+10","lines.mandazi.unitCost":"+5"},"cause":{"en":"the account terms that gave the supplier room to raise the flour price later","sw":"masharti ya akaunti yaliyompa msambazaji nafasi ya kuongeza bei ya unga baadaye"}}]},{"id":"split-order","label":{"en":"Split the purchase between cash and account","sw":"Gawa ununuzi kati ya taslimu na akaunti"},"detail":{"en":"Keep some cash room and some of the saving.","sw":"Baki na nafasi ya pesa na sehemu ya punguzo."},"effects":{"creditorWeeks":1,"lines.bread.unitCost":"+10","lines.mandazi.unitCost":"+5","lines.cake.unitCost":"+100"},"predictAnswer":"down","outcome":{"en":"You avoid the strongest price in either direction. The direct cost moves only a little and the supplier balance stays near its old level.","sw":"Unaepuka bei kali ya upande wowote. Gharama ya moja kwa moja inabadilika kidogo na salio la msambazaji linabaki karibu na kiwango cha zamani."},"lesson":{"en":"A mixed term can be a sensible bridge when neither the cash saving nor the cash protection is large enough on its own.","sw":"Mchanganyiko wa masharti unaweza kuwa daraja la maana wakati punguzo la pesa wala ulinzi wa pesa haujitoshelezi peke yake."}}]}},{"id":"t09","concept":"financing-asset","conceptLabel":{"en":"Financing a second oven","sw":"Kufadhili oveni ya pili"},"scene":"market","unverified":true,"situation":{"en":"The shop orders are using most of the first oven. A second-hand oven is available. You can wait and save, borrow to buy it, or take a lease with a weekly payment. The oven can add capacity, but every financing choice has a tail.","sw":"Oda za maduka zinatumia sehemu kubwa ya oveni ya kwanza. Oveni ya mtumba inapatikana. Unaweza kusubiri na kuweka akiba, kukopa kuinunua, au kukodisha kwa malipo ya wiki. Oveni inaweza kuongeza uwezo, lakini kila uchaguzi wa ufadhili una mkia wa gharama."},"info":[{"id":"compare-oven-finance","label":{"en":"Write the cash, interest and weekly payment beside the extra capacity","sw":"Andika pesa, interest na malipo ya wiki karibu na uwezo wa ziada"},"costHours":2,"costCash":0,"reveals":{"en":"The purchase price is 1,200,000 in this simulation. A loan adds that amount to debt, charges annual interest and asks for a weekly repayment. A lease avoids that debt but adds a weekly rent-like cost. These are teaching assumptions, not a local offer.","sw":"Bei ya kununua katika simulation hii ni 1,200,000. Mkopo unaongeza kiasi hicho kwenye deni, unatoza interest ya mwaka na unaomba marejesho ya wiki. Lease inaepuka deni hilo lakini inaongeza gharama ya wiki kama kodi. Haya ni makadirio ya kufundishia, si ofa ya eneo."}}],"decision":{"prompt":{"en":"How do you get the second oven?","sw":"Unapataje oveni ya pili?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"wait-save","label":{"en":"Wait and save before adding another oven","sw":"Subiri na uweke akiba kabla ya kuongeza oveni nyingine"},"detail":{"en":"No new weekly payment. Some orders may wait.","sw":"Hakuna malipo mapya ya wiki. Baadhi ya oda zinaweza kusubiri."},"effects":{},"predictAnswer":"same","outcome":{"en":"You keep the oven you can already pay for. You may turn away some growth, but the business does not add a new fixed payment.","sw":"Unaweka oveni ambayo tayari unaweza kuilipa. Unaweza kuacha ukuaji fulani, lakini biashara haiongezi malipo mapya yasiyobadilika."},"lesson":{"en":"Waiting is a real financing choice. It protects cash and leaves the business at a size its current cash can support.","sw":"Kusubiri ni uamuzi halisi wa ufadhili. Kunailinda pesa na kuiacha biashara kwenye ukubwa ambao pesa yake ya sasa inaweza kubeba."}},{"id":"borrow-oven","label":{"en":"Borrow 1,200,000 for the second oven","sw":"Kopa 1,200,000 kwa oveni ya pili"},"detail":{"en":"The loan pays for the oven. Interest and a 60,000 weekly repayment follow.","sw":"Mkopo unalipia oveni. Interest na marejesho ya 60,000 kwa wiki vinafuata."},"effects":{"debt":1200000,"assetValue":1200000,"interestRate":0.18,"repayPerWeek":60000,"lines.bread.capacity":"+80","lines.mandazi.capacity":"+40","lines.bread.unitCost":"+100","lines.mandazi.unitCost":"+50","tookCredit":true},"predictAnswer":"down","outcome":{"en":"The second oven is available and the loan is now on the ledger. Interest and the extra running cost lower profit. The repayment leaves cash whether every extra loaf sells or not.","sw":"Oveni ya pili inapatikana na mkopo sasa uko kwenye daftari. Interest na gharama ya ziada ya uendeshaji zinapunguza faida. Marejesho yanatoa pesa hata kila mkate wa ziada usipouzwa."},"lesson":{"en":"Borrowing turns one purchase into two ongoing questions: does the asset earn enough, and can the bank survive the repayment schedule?","sw":"Kukopa hubadilisha ununuzi mmoja kuwa maswali mawili ya kuendelea: mali inaleta kiasi cha kutosha, na benki inaweza kuvumilia ratiba ya marejesho?"}},{"id":"lease-oven","label":{"en":"Lease the oven with a 50,000 weekly payment","sw":"Kodi oveni kwa malipo ya 50,000 kwa wiki"},"detail":{"en":"No loan balance, but the weekly cost continues.","sw":"Hakuna salio la mkopo, lakini gharama ya wiki inaendelea."},"effects":{"rent":50000,"lines.bread.capacity":"+80","lines.mandazi.capacity":"+40"},"predictAnswer":"down","outcome":{"en":"You add capacity without a debt balance. The weekly lease cost arrives even in a slow week, so the oven must earn more than it costs.","sw":"Unaongeza uwezo bila salio la deni. Gharama ya lease ya wiki inafika hata wiki ikiwa ndogo, kwa hiyo oveni lazima itengeneze zaidi ya gharama yake."},"lesson":{"en":"Different financing names do not remove the basic test. Extra capacity must produce contribution greater than the payment that supports it.","sw":"Majina tofauti ya ufadhili hayaondoi kipimo cha msingi. Uwezo wa ziada lazima utoe mchango mkubwa kuliko malipo yanayouwezesha."}}]}},{"id":"t10","concept":"cost-of-capital","conceptLabel":{"en":"Cost of borrowed money","sw":"Gharama ya pesa iliyokopwa"},"scene":"office","unverified":true,"situation":{"en":"If you borrowed for the second oven, the lender asks what weekly repayment you can actually carry. Interest is a cost in the profit line. Repayment is cash leaving the bank, but it is not another cost in the profit line. Choose a payment that leaves room for an ordinary bad week.","sw":"Kama ulikopa kwa oveni ya pili, mkopeshaji anauliza ni marejesho gani ya wiki unaweza kubeba hasa. Interest ni gharama kwenye mstari wa faida. Marejesho ni pesa inayotoka benki, lakini si gharama nyingine kwenye mstari wa faida. Chagua malipo yanayoacha nafasi kwa wiki mbaya ya kawaida."},"info":[{"id":"read-loan-lines","label":{"en":"Read interest and repayment as two different lines","sw":"Soma interest na marejesho kama mistari miwili tofauti"},"costHours":1,"costCash":0,"reveals":{"en":"The interest rate is annual and the engine charges a weekly share of it on the outstanding debt. The repayment reduces the debt and cash. A payment can be affordable in profit but still too heavy for the bank if customers pay late.","sw":"Interest rate ni ya mwaka na engine inatoza sehemu ya wiki juu ya deni lililobaki. Marejesho hupunguza deni na pesa. Malipo yanaweza kumudu kwenye faida lakini bado yawe mazito kwa benki wateja wakilipa kwa kuchelewa."}}],"workout":true,"decision":{"type":"number","prompt":{"en":"Set the weekly repayment you will service.","sw":"Panga marejesho ya wiki utakayoweza kulipa."},"predict":"number","input":{"field":"repayPerWeek","min":0,"max":80000,"step":10000,"start":"current","valueAs":"money","hint":{"en":"A larger repayment clears debt faster but removes more cash each week.","sw":"Marejesho makubwa yanaondoa deni haraka lakini yanatoa pesa zaidi kila wiki."},"responses":[{"field":"ownerHoursUsed","perStep":10000,"change":0}]},"bands":[{"outcome":{"en":"A low payment protects cash this week, but the debt stays for longer and interest continues while it is outstanding.","sw":"Malipo madogo yanalinda pesa wiki hii, lakini deni linabaki muda mrefu na interest inaendelea wakati bado lipo."},"lesson":{"en":"The cheapest-looking weekly payment is not always the cheapest total cost. Time on a loan has a price.","sw":"Malipo ya wiki yanayoonekana rahisi si lazima yawe gharama ndogo kwa jumla. Muda kwenye mkopo una bei."},"upTo":20000},{"outcome":{"en":"The payment leaves some working cash while reducing the debt steadily. It still needs to fit weeks when sales are late.","sw":"Malipo yanaacha pesa ya kazi huku yakipunguza deni kwa utaratibu. Bado lazima yalingane na wiki ambazo mauzo yanachelewa."},"lesson":{"en":"Debt service should be sized from the cash the business can reliably produce, not from the best week it once had.","sw":"Huduma ya deni inapaswa kupangwa kutoka pesa ambayo biashara inaweza kutoa kwa uhakika, si wiki bora iliyowahi kutokea."},"upTo":50000},{"outcome":{"en":"The debt falls faster, but the bank has less room for flour, wages and delayed customer payments.","sw":"Deni linashuka haraka, lakini benki inaacha nafasi ndogo kwa unga, mishahara na malipo ya wateja yaliyochelewa."},"lesson":{"en":"A repayment is not a profit cost, but it is a real cash claim. Keep both panels in view.","sw":"Marejesho si gharama ya faida, lakini ni dai halisi kwenye pesa. Weka paneli zote mbili mbele yako."},"upTo":70000},{"outcome":{"en":"You try to clear the loan quickly. A strong week may manage it, but a late wholesale payment can push the bank into trouble.","sw":"Unajaribu kuondoa mkopo haraka. Wiki nzuri inaweza kuubeba, lakini malipo ya wholesale yakichelewa yanaweza kuiingiza benki kwenye tatizo."},"lesson":{"en":"The right loan size is the one the business can service in ordinary weeks, not only when every oven is full.","sw":"Ukubwa sahihi wa mkopo ni ule ambao biashara inaweza kuuhudumia katika wiki za kawaida, si wakati oveni zote zimejaa tu."}}]}},{"id":"t11","concept":"depreciation","conceptLabel":{"en":"The oven wears out","sw":"Oveni inachakaa"},"scene":"office","unverified":true,"situation":{"en":"The ovens are earning well, but the ledger says their value is lower than when you bought them. Depreciation is the weekly share of an asset's value that has been used. It lowers profit without taking cash from the bank that week.","sw":"Oveni zinaingiza vizuri, lakini daftari linasema thamani yake ni ndogo kuliko uliponunua. Depreciation ni sehemu ya wiki ya thamani ya mali iliyotumika. Inapunguza faida bila kutoa pesa benki wiki hiyo."},"info":[{"id":"check-oven-life","label":{"en":"Check the oven's condition and expected working life","sw":"Kagua hali ya oveni na maisha yake ya kazi yanayotarajiwa"},"costHours":2,"costCash":0,"reveals":{"en":"The second-hand oven has an estimated value of 1,200,000 and a working life of 200 weeks in this simulation. The old oven is already being written down. A useful life is an estimate, not a cash payment.","sw":"Oveni ya mtumba ina thamani ya makadirio ya 1,200,000 na maisha ya kazi ya wiki 200 katika simulation hii. Oveni ya zamani tayari inaandikwa chini. Maisha ya matumizi ni makadirio, si malipo ya pesa."}}],"decision":{"prompt":{"en":"How do you record the ovens' value and useful life?","sw":"Unaandikaje thamani na maisha ya matumizi ya oveni?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"short-life","label":{"en":"Use a shorter life because the second-hand oven is worn","sw":"Tumia maisha mafupi kwa sababu oveni ya mtumba imechakaa"},"detail":{"en":"Write down 200,000 of value and use 100 weeks for the estimate.","sw":"Andika chini 200,000 ya thamani na utumie wiki 100 kwa makadirio."},"effects":{"assetValue":"-200000","assetLifeWeeks":100},"predictAnswer":"down","outcome":{"en":"The weekly depreciation charge rises. Profit falls a little, but the ledger is closer to the wear you expect from the oven.","sw":"Gharama ya depreciation ya wiki inapanda. Faida inashuka kidogo, lakini daftari linakaribia uchakavu unaotarajia wa oveni."},"lesson":{"en":"A realistic asset life makes profit more honest. The charge is not cash leaving today; it is a reminder that replacement will need cash later.","sw":"Maisha halisi ya mali hufanya faida iwe ya kweli zaidi. Gharama hiyo si pesa inayotoka leo; ni ukumbusho kwamba uingizaji mpya utahitaji pesa baadaye."}},{"id":"normal-life","label":{"en":"Keep the current book value and use a 250-week life after checking the history","sw":"Weka thamani ya sasa ya daftari na utumie maisha ya wiki 250 baada ya kukagua historia"},"detail":{"en":"Keep the recorded value and use 250 weeks for the estimate.","sw":"Weka thamani iliyoandikwa na utumie wiki 250 kwa makadirio."},"effects":{"assetValue":0,"assetLifeWeeks":250},"predictAnswer":"same","outcome":{"en":"The weekly charge is lower than the short-life estimate. Cash does not change today, but the replacement reserve will need to be planned over more time.","sw":"Gharama ya wiki ni ndogo kuliko makadirio ya maisha mafupi. Pesa haibadiliki leo, lakini akiba ya kubadilisha itahitaji kupangwa kwa muda mrefu zaidi."},"lesson":{"en":"Depreciation is an estimate with consequences. A longer life lowers today's charge but may leave too little ready when the machine fails.","sw":"Depreciation ni makadirio yenye matokeo. Maisha marefu yanapunguza gharama ya leo lakini yanaweza kuacha kidogo wakati mashine itakapoharibika."}},{"id":"ignore-wear","label":{"en":"Leave depreciation out because no cash left this week","sw":"Acha depreciation kwa sababu hakuna pesa iliyotoka wiki hii"},"detail":{"en":"Set the useful life to zero in the weekly ledger.","sw":"Weka maisha ya matumizi kuwa sifuri kwenye daftari la wiki."},"effects":{"assetValue":0,"assetLifeWeeks":0},"predictAnswer":"up_bit","outcome":{"en":"Profit looks better because the charge disappears. The oven still wears out, but the ledger no longer tells you that a replacement is coming.","sw":"Faida inaonekana bora kwa sababu gharama imetoweka. Oveni bado inachakaa, lakini daftari halikwambii tena kwamba uingizaji mpya unakuja."},"lesson":{"en":"A cost can be real without being a payment this week. Removing depreciation does not stop the asset from wearing out.","sw":"Gharama inaweza kuwa halisi bila kuwa malipo ya wiki hii. Kuondoa depreciation hakusimamishi mali kuchakaa."}}]}},{"id":"t12","concept":"capacity-utilisation","conceptLabel":{"en":"Using capacity and choosing batch size","sw":"Kutumia uwezo na kuchagua ukubwa wa kundi"},"scene":"kitchen","situation":{"en":"Two large bread bakes use the oven efficiently, but they leave little room to correct a bad demand estimate. Several smaller mixed bakes take more attention, yet they let you move capacity between bread, mandazi and cakes as orders change.","sw":"Uokaji wa mikate wa makundi mawili makubwa unatumia oveni kwa ufanisi, lakini unaacha nafasi ndogo kurekebisha makadirio mabaya ya mahitaji. Uokaji mdogo wa mchanganyiko unahitaji uangalifu zaidi, lakini unakuwezesha kuhamisha uwezo kati ya mikate, mandazi na keki oda zinapobadilika."},"info":[{"id":"map-capacity","label":{"en":"Compare what the oven can make with what each line can sell","sw":"Linganisha oveni inaweza kutengeneza nini na kila mstari unaweza kuuza nini"},"costHours":1,"costCash":0,"reveals":{"en":"Capacity is not sales. A line can be full because the oven is busy, or because customers are waiting. Moving some capacity from mandazi to cake changes both the possible sales and the risk of unsold stock.","sw":"Uwezo si mauzo. Mstari unaweza kuwa umejaa kwa sababu oveni ina shughuli, au kwa sababu wateja wanasubiri. Kuhamisha uwezo fulani kutoka mandazi kwenda keki hubadilisha mauzo yanayowezekana na hatari ya bidhaa kubaki."}}],"decision":{"prompt":{"en":"Which bake pattern do you use this week?","sw":"Unatumia mpangilio gani wa uokaji wiki hii?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"big-bread-batches","label":{"en":"Run two large bread batches and move capacity from mandazi","sw":"Fanya makundi mawili makubwa ya mikate na uhamishe uwezo kutoka mandazi"},"detail":{"en":"Efficient oven time, less flexibility.","sw":"Muda wa oveni wenye ufanisi, unyumbufu mdogo."},"effects":{"lines.bread.capacity":"+80","lines.mandazi.capacity":"-200"},"predictAnswer":"down","outcome":{"en":"The bread oven is busy, but mandazi customers meet a shorter line. The lost mandazi contribution is larger than the bread you can sell into the existing queue.","sw":"Oveni ya mikate ina shughuli, lakini wateja wa mandazi wanakutana na foleni fupi ya bidhaa. Mchango wa mandazi uliopotea ni mkubwa kuliko mikate unayoweza kuuza kwenye foleni iliyopo."},"lesson":{"en":"High utilisation is not automatically good. Capacity is useful only when the product placed there has a buyer.","sw":"Kutumia uwezo mkubwa si jambo zuri moja kwa moja. Uwezo unasaidia tu bidhaa iliyowekwa hapo ikiwa na mnunuzi."}},{"id":"small-mixed-batches","label":{"en":"Use smaller mixed batches and put more capacity into cake orders","sw":"Tumia makundi madogo ya mchanganyiko na uweke uwezo zaidi kwenye oda za keki"},"detail":{"en":"More checking, but you can follow the orders that are real.","sw":"Ukaguzi zaidi, lakini unaweza kufuata oda zilizopo kweli."},"effects":{"lines.mandazi.capacity":"+200","lines.mandazi.demand":"+200","ownerHoursFixed":2},"predictAnswer":"up_lot","outcome":{"en":"The smaller batches give you room to move. Four cake orders add more contribution than the mandazi capacity you give up.","sw":"Makundi madogo yanakupa nafasi ya kubadilika. Oda nne za keki zinaongeza mchango mkubwa kuliko uwezo wa mandazi unaouacha."},"lesson":{"en":"Capacity utilisation is about useful output, not a full oven. Smaller batches can protect margin when demand is mixed.","sw":"Kutumia uwezo ni kuhusu uzalishaji wenye matumizi, si oveni kujaa tu. Makundi madogo yanaweza kulinda margin mahitaji yanapochanganyika."}},{"id":"keep-pattern","label":{"en":"Keep the current pattern until orders are clearer","sw":"Weka mpangilio wa sasa hadi oda ziwe wazi zaidi"},"detail":{"en":"No extra change to capacity this week.","sw":"Hakuna mabadiliko ya ziada ya uwezo wiki hii."},"effects":{},"predictAnswer":"same","outcome":{"en":"The bakery makes the usual mix. You do not gain the possible cake contribution, and you do not expose the oven to a new batch risk.","sw":"Bakery inatengeneza mchanganyiko wa kawaida. Hupati mchango unaowezekana wa keki, na huiweki oveni kwenye hatari mpya ya kundi."},"lesson":{"en":"A stable pattern can be sensible when information is weak. It is a choice to wait, not proof that the old mix is best.","sw":"Mpangilio thabiti unaweza kuwa na maana taarifa zikiwa chache. Ni uamuzi wa kusubiri, si uthibitisho kwamba mchanganyiko wa zamani ni bora."}}]}},{"id":"t13","concept":"yield-wastage","conceptLabel":{"en":"Yield and wastage","sw":"Mavuno na upotevu"},"scene":"kitchen","unverified":true,"situation":{"en":"The baker reports that one batch of dough does not always become the same number of sellable items. Separately, some finished items sit unsold at the end of the day. Production waste and retail spoilage are two different leaks in the bakery.","sw":"Mwokaji anaripoti kwamba kundi moja la donge halizai kila mara idadi ileile ya bidhaa zinazoweza kuuzwa. Kando na hilo, baadhi ya bidhaa zilizokamilika hubaki bila kuuzwa mwisho wa siku. Upotevu wa uzalishaji na bidhaa kuharibika dukani ni uvujaji miwili tofauti ya bakery."},"info":[{"id":"weigh-one-batch","label":{"en":"Weigh the input and count the sellable output","sw":"Pima malighafi na hesabu uzalishaji unaoweza kuuzwa"},"costHours":2,"costCash":0,"reveals":{"en":"A batch can lose value before sale through poor yield, then lose more through unsold stock. Lowering spoilage does not fix a recipe that produces too little; improving yield does not help if you keep making far more than customers buy.","sw":"Kundi linaweza kupoteza thamani kabla ya kuuzwa kupitia mavuno mabaya, kisha lipoteze zaidi kupitia bidhaa zisizouzwa. Kupunguza spoilage hakurekebishi recipe inayozalisha kidogo; kuboresha yield hakusaidii kama unaendelea kutengeneza zaidi kuliko wateja wanavyonunua."}}],"decision":{"prompt":{"en":"How do you respond to the two kinds of waste?","sw":"Unajibu vipi aina hizi mbili za upotevu?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"measure-yield","label":{"en":"Measure the yield and adjust the recipe before scaling the batch","sw":"Pima yield na rekebisha recipe kabla ya kuongeza kundi"},"detail":{"en":"The measured sellable unit costs more for now, but you stop pretending the lost input was free.","sw":"Bidhaa iliyopimwa inayoweza kuuzwa inagharimu zaidi kwa sasa, lakini unaacha kujifanya malighafi iliyopotea ilikuwa bure."},"effects":{"lines.bread.unitCost":"+100","lines.mandazi.unitCost":"+50"},"predictAnswer":"down","outcome":{"en":"The true cost of a sellable item is higher than your old note said. The recipe's yield is now visible as a cost instead of disappearing from the ledger.","sw":"Gharama halisi ya bidhaa inayoweza kuuzwa ni kubwa kuliko daftari lako la zamani lilivyosema. Yield ya recipe sasa inaonekana kama gharama badala ya kutoweka kwenye daftari."},"lesson":{"en":"Good records can make profit look worse before they make the business better. Seeing the real yield is the first step to fixing it.","sw":"Kumbukumbu nzuri zinaweza kufanya faida ionekane mbaya kabla hazijaiboresha biashara. Kuona yield halisi ni hatua ya kwanza ya kuirekebisha."}},{"id":"buffer-batch","label":{"en":"Make a large buffer batch so a weak yield cannot cause a stock-out","sw":"Tengeneza kundi kubwa la akiba ili yield ndogo isisababishe bidhaa kuisha"},"detail":{"en":"More items ready, more chance of unsold stock.","sw":"Bidhaa nyingi tayari, nafasi kubwa ya bidhaa kubaki."},"effects":{"lines.bread.capacity":"+300","lines.mandazi.capacity":"+200","lines.bread.unitCost":"+200","lines.mandazi.unitCost":"+100"},"predictAnswer":"down","outcome":{"en":"The shelves look full. When the expected customers do not arrive, the extra made stock becomes spoilage and eats the contribution from good sales.","sw":"Rafu zinaonekana zimejaa. Wateja wanaotarajiwa wasipofika, bidhaa za ziada zilizotengenezwa zinakuwa spoilage na kula mchango wa mauzo mazuri."},"lesson":{"en":"Making more to hide a yield problem can turn a production leak into a cash loss. Measure before you add capacity.","sw":"Kutengeneza zaidi kuficha tatizo la yield kunaweza kugeuza uvujaji wa uzalishaji kuwa hasara ya pesa. Pima kabla ya kuongeza uwezo."},"later":[{"inWeeks":2,"effects":{"reputation":-3,"demand":-18},"cause":{"en":"the buffer stock that sat too long after you made it without a confirmed buyer","sw":"stock ya akiba iliyokaa muda mrefu baada ya kuitengeneza bila mnunuzi aliyethibitishwa"}}]},{"id":"track-spoilage","label":{"en":"Track what is unsold and reduce the next batch to match it","sw":"Fuatilia kisichouzwa na punguza kundi linalofuata kulingana nacho"},"detail":{"en":"The bakery makes less excess stock while you learn the pattern.","sw":"Bakery inatengeneza stock ya ziada kidogo wakati unajifunza mwenendo."},"effects":{"spoilRate":0.15,"lines.cake.capacity":"-3","lines.bread.unitCost":"-100","lines.mandazi.unitCost":"-50"},"predictAnswer":"up_lot","outcome":{"en":"You make fewer cakes without an order and lose less finished food. The result is modest, but it returns money that used to be thrown away.","sw":"Unatengeneza keki chache zisizo na oda na unapoteza chakula kidogo kilichokamilika. Matokeo ni ya kiasi, lakini yanarudisha pesa iliyokuwa ikitupwa."},"lesson":{"en":"Unsold stock is a production decision already made. Count it, then let the next batch respond to evidence.","sw":"Stock isiyouzwa ni uamuzi wa uzalishaji ambao tayari umefanywa. Ihesabu, kisha acha kundi linalofuata lijibu ushahidi."}}]}},{"id":"t14","concept":"capital-allocation","conceptLabel":{"en":"Allocating capital","sw":"Kugawa mtaji"},"scene":"office","situation":{"en":"The bakery has money in hand that could go in several directions. The loan needs servicing, the ovens need stock, the household needs income, and a reserve could protect a bad week. There is no one correct use for every coin — and whatever leaves the bakery now, the bakery runs the next six weeks without it.","sw":"Bakery ina pesa mkononi inayoweza kwenda kwenye matumizi kadhaa. Mkopo unahitaji kuhudumiwa, oveni zinahitaji stock, kaya inahitaji kipato, na akiba inaweza kulinda wiki mbaya. Hakuna matumizi moja sahihi kwa kila senti — na chochote kinachotoka kwenye bakery sasa, bakery itaendesha wiki sita zijazo bila hicho."},"info":[{"id":"list-capital-uses","label":{"en":"Write what each use would change next week","sw":"Andika kila matumizi yangebadilisha nini wiki ijayo"},"costHours":1,"costCash":0,"reveals":{"en":"Repaying debt lowers future cash pressure. Stock can support sales only when customers are there. Money taken home meets a real household need. A reserve stays available when an oven, supplier or customer creates a surprise.","sw":"Kulipa deni kunapunguza shinikizo la pesa baadaye. Stock inaweza kusaidia mauzo tu wateja wakiwa wapo. Pesa inayokwenda nyumbani inakidhi hitaji halisi la kaya. Akiba inabaki tayari oveni, msambazaji au mteja anapotoa mshangao."}}],"workout":true,"decision":{"type":"allocate","prompt":{"en":"How will you split the available capital?","sw":"Utagawanya vipi mtaji uliopo?"},"predict":"number","allocate":{"amountFrom":"cash","fraction":0.4,"step":50000,"buckets":[{"id":"repay-loan","label":{"en":"Repay the loan","sw":"Lipa deni"},"perStep":{"debt":-50000}},{"id":"buy-stock","label":{"en":"Buy stock for confirmed orders","sw":"Nunua stock kwa oda zilizothibitishwa"},"perStep":{"lines.bread.capacity":20,"lines.bread.demand":15,"lines.cake.capacity":1,"lines.cake.demand":1}},{"id":"home","label":{"en":"Take some home","sw":"Peleka sehemu nyumbani"},"perStep":{}},{"id":"reserve","label":{"en":"Keep it as a reserve","sw":"Weka kama akiba"},"perStep":{},"keepsCash":true}]},"bands":[{"outcome":{"en":"You keep most of the available money for the household and reserve. The bakery changes little, but the next surprise has more protection.","sw":"Unaweka pesa nyingi kwa kaya na akiba. Bakery inabadilika kidogo, lakini mshangao unaofuata una ulinzi zaidi."},"lesson":{"en":"A reserve is capital too. It does not increase today's capacity, but it can keep one setback from forcing a rushed sale.","sw":"Akiba pia ni mtaji. Haiongezi uwezo wa leo, lakini inaweza kuzuia setback moja kulazimisha uuzaji wa haraka."},"upTo":0.25},{"outcome":{"en":"You split the capital between debt, confirmed stock, home and reserve. No use gets everything, but the business and household both remain in view.","sw":"Unagawa mtaji kati ya deni, stock iliyothibitishwa, nyumbani na akiba. Hakuna matumizi yanayopata yote, lakini biashara na kaya zote zinaonekana."},"lesson":{"en":"Capital allocation is a choice among real needs. A balanced split can protect the business without pretending the household has no needs.","sw":"Ugawaji wa mtaji ni uchaguzi kati ya mahitaji halisi. Mgawanyo wenye mizani unaweza kulinda biashara bila kujifanya kaya haina mahitaji."},"upTo":0.65},{"outcome":{"en":"You put most of the available capital into the bakery. Capacity and sales may grow, but little remains for home or a cash shock.","sw":"Unaweka sehemu kubwa ya mtaji uliopo kwenye bakery. Uwezo na mauzo vinaweza kukua, lakini kidogo kinabaki nyumbani au kwa mshtuko wa pesa."},"lesson":{"en":"Reinvestment can build a larger operation, while a reserve can protect a smaller one. Both are legitimate uses; the trade-off is yours to see.","sw":"Kurudisha mtaji kunaweza kujenga uendeshaji mkubwa, huku akiba ikilinda uendeshaji mdogo. Yote ni matumizi halali; uamuzi ni kuona tofauti yake."}}]}},{"id":"t15","concept":"hiring","conceptLabel":{"en":"Hiring past the first employee","sw":"Kuajiri zaidi ya mfanyakazi wa kwanza"},"scene":"kitchen","situation":{"en":"The first employee can handle the basic bake, but the bakery now has two ovens, counter sales and shop orders. You can hire a second baker, or give the first employee authority to supervise the work already there. More people are not automatically more organisation.","sw":"Mfanyakazi wa kwanza anaweza kushughulikia uokaji wa msingi, lakini bakery sasa ina oveni mbili, mauzo ya kaunta na oda za maduka. Unaweza kuajiri mwokaji wa pili, au kumpa mfanyakazi wa kwanza mamlaka ya kusimamia kazi iliyopo. Watu wengi si lazima wawe mpangilio bora zaidi."},"info":[{"id":"map-next-role","label":{"en":"Write down the work no one owns yet","sw":"Andika kazi ambayo bado hakuna anayemiliki"},"costHours":2,"costCash":0,"reveals":{"en":"The second oven needs hands, but the first employee is also waiting for your instructions. One new baker adds output. A supervisor with authority can make daily decisions without waiting for you.","sw":"Oveni ya pili inahitaji mikono, lakini mfanyakazi wa kwanza pia anasubiri maelekezo yako. Mwokaji mpya anaongeza uzalishaji. Supervisor mwenye mamlaka anaweza kufanya maamuzi ya kila siku bila kukusubiri."}}],"decision":{"prompt":{"en":"Which role do you build next?","sw":"Unajenga nafasi gani inayofuata?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"second-baker","label":{"en":"Hire a second baker for the extra oven","sw":"Ajiri mwokaji wa pili kwa oveni ya ziada"},"detail":{"en":"More hands and a second weekly wage. Training is still your job.","sw":"Mikono zaidi na mshahara wa pili wa wiki. Mafunzo bado ni kazi yako."},"effects":{"staff":2,"capacity":120,"demand":120,"builtTeam":true},"predictAnswer":"down","outcome":{"en":"The bakery can serve more orders, but the second wage arrives immediately. The extra contribution is not yet large enough to cover it in this week's mix.","sw":"Bakery inaweza kuhudumia oda zaidi, lakini mshahara wa pili unafika mara moja. Mchango wa ziada bado hautoshi kuufunika katika mchanganyiko wa wiki hii."},"lesson":{"en":"A hire is an investment only when the work it adds produces more than its full cost. A second employee can be right later and too early today.","sw":"Mwajiriwa ni uwekezaji tu kazi anayoongeza inapozalisha zaidi ya gharama yake kamili. Mfanyakazi wa pili anaweza kuwa sahihi baadaye na mapema sana leo."},"later":[{"inWeeks":2,"effects":{"hygiene":-8,"reputation":-4},"cause":{"en":"the second baker you hired before a training routine was ready","sw":"mwokaji wa pili uliyemwajiri kabla utaratibu wa mafunzo kuwa tayari"}}]},{"id":"supervisor","label":{"en":"Give the first employee authority to supervise the current work","sw":"Mpe mfanyakazi wa kwanza mamlaka ya kusimamia kazi iliyopo"},"detail":{"en":"No new wage yet. The supervisor can make agreed daily decisions.","sw":"Bado hakuna mshahara mpya. Supervisor anaweza kufanya maamuzi ya kila siku yaliyokubaliwa."},"effects":{"lines.bread.capacity":"+120","lines.bread.demand":"+120","lines.mandazi.capacity":"+100","lines.mandazi.demand":"+100","ownerHoursFixed":-4,"builtTeam":true},"predictAnswer":"up_lot","outcome":{"en":"The first employee stops waiting for every small decision. You gain some useful capacity and recover hours to watch the numbers and customers.","sw":"Mfanyakazi wa kwanza anaacha kusubiri kila uamuzi mdogo. Unapata uwezo wenye matumizi na unarudishiwa masaa ya kuangalia namba na wateja."},"lesson":{"en":"Building a team starts when another person can act with real authority. Delegation removes a bottleneck only when decisions move too.","sw":"Kujenga timu huanza mtu mwingine anapoweza kutenda akiwa na mamlaka halisi. Kukabidhi kazi huondoa kikwazo maamuzi yanapohama pia."}},{"id":"wait-hire","label":{"en":"Keep one employee until the order pattern is clearer","sw":"Baki na mfanyakazi mmoja hadi mwenendo wa oda uwe wazi zaidi"},"detail":{"en":"Protect this week's cash and keep deciding yourself.","sw":"Linda pesa ya wiki hii na uendelee kuamua mwenyewe."},"effects":{},"predictAnswer":"same","outcome":{"en":"You keep the current wage and current capacity. The bakery stays manageable, but the work still waits for you when the first employee needs a decision.","sw":"Unaweka mshahara na uwezo wa sasa. Bakery inabaki rahisi kusimamia, lakini kazi bado inakusubiri mfanyakazi wa kwanza anapohitaji uamuzi."},"lesson":{"en":"Not hiring is a defensible choice when demand is uncertain. It also leaves the organisation dependent on the founder.","sw":"Kutoajiri ni uamuzi unaokubalika mahitaji yakiwa hayana uhakika. Pia kunaacha mpangilio ukimtegemea mwanzilishi."}}]}},{"id":"t16","concept":"standard-procedure","conceptLabel":{"en":"A standard procedure","sw":"Utaratibu wa kawaida"},"scene":"inspection","unverified":true,"situation":{"en":"On days you are away, the bread is sometimes darker and the cake orders are packed differently. You can write a standard procedure: a short recipe and check-list that says what to do and what to check. The aim is the same quality without your eyes in every batch.","sw":"Siku ambazo haupo, wakati mwingine mikate inakuwa myeusi zaidi na oda za keki zinafungwa tofauti. Unaweza kuandika utaratibu wa kawaida: recipe fupi na checklist inayoeleza cha kufanya na cha kukagua. Lengo ni ubora uleule bila macho yako kwenye kila kundi."},"info":[{"id":"watch-variation","label":{"en":"Compare two batches made without you","sw":"Linganisha makundi mawili yaliyotengenezwa bila wewe"},"costHours":2,"costCash":0,"reveals":{"en":"The ingredients were similar, but the mixing time and oven check were different. A standard procedure turns your repeated decisions into steps another person can follow and record.","sw":"Malighafi zilifanana, lakini muda wa kuchanganya na ukaguzi wa oveni vilitofautiana. Utaratibu wa kawaida hubadilisha maamuzi yako ya kurudiwa kuwa hatua mtu mwingine anaweza kufuata na kuandika."}}],"decision":{"prompt":{"en":"How do you make quality repeatable?","sw":"Unafanyaje ubora urudiwe?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"write-procedure","label":{"en":"Write a recipe and batch check-list for the team","sw":"Andika recipe na checklist ya kundi kwa timu"},"detail":{"en":"It takes time to write and check, but the steps can be used when you are away.","sw":"Inachukua muda kuandika na kukagua, lakini hatua zinaweza kutumika ukiwa mbali."},"effects":{"hygiene":15,"lines.bread.unitCost":"-25","lines.mandazi.unitCost":"-15","ownerHoursFixed":2},"predictAnswer":"up_lot","outcome":{"en":"The team has one method to follow. The written checks reduce some input waste, so the first week leaves more contribution while quality is easier to repeat.","sw":"Timu ina njia moja ya kufuata. Ukaguzi ulioandikwa unapunguza upotevu wa malighafi, kwa hiyo wiki ya kwanza inaacha mchango zaidi huku ubora ukiwa rahisi kurudiwa."},"lesson":{"en":"A standard procedure is organisation in a form another person can use. It turns quality from the founder's memory into a repeatable action.","sw":"Utaratibu wa kawaida ni mpangilio katika mfumo ambao mtu mwingine anaweza kutumia. Hubadilisha ubora kutoka kumbukumbu ya mwanzilishi kuwa tendo linaloweza kurudiwa."}},{"id":"teach-by-watching","label":{"en":"Stand beside the team and correct each batch yourself","sw":"Simama karibu na timu na usahihishe kila kundi mwenyewe"},"detail":{"en":"The quality is visible, but the method stays in your head.","sw":"Ubora unaonekana, lakini njia inabaki kichwani mwako."},"effects":{"hygiene":8,"ownerHoursUsed":4},"predictAnswer":"same","outcome":{"en":"The batches look better while you are there. The team still waits for you to notice and correct the next variation.","sw":"Makundi yanaonekana bora ukiwa hapo. Timu bado inakusubiri utambue na usahihishe tofauti inayofuata."},"lesson":{"en":"Supervision can protect today's quality. A procedure is what lets quality continue when the founder is doing another job.","sw":"Usimamizi unaweza kulinda ubora wa leo. Utaratibu ndio unaofanya ubora uendelee mwanzilishi akiwa anafanya kazi nyingine."}},{"id":"keep-in-head","label":{"en":"Keep the method in your head and fix mistakes when you see them","sw":"Weka njia kichwani na rekebisha makosa unayoyaona"},"detail":{"en":"No writing time now. The bakery still depends on your memory.","sw":"Hakuna muda wa kuandika sasa. Bakery bado inategemea kumbukumbu yako."},"effects":{},"predictAnswer":"same","outcome":{"en":"This week looks familiar. When you are absent, the team has no shared reference for the decisions you normally make.","sw":"Wiki hii inaonekana ya kawaida. Usipokuwepo, timu haina rejea ya pamoja ya maamuzi unayofanya kwa kawaida."},"lesson":{"en":"A business cannot delegate a standard that exists only in one person's memory. What is not written is hard to check and hard to improve.","sw":"Biashara haiwezi kukabidhi kiwango kilichopo kwenye kumbukumbu ya mtu mmoja tu. Kisichoandikwa ni kigumu kukagua na kuboresha."},"later":[{"inWeeks":3,"effects":{"hygiene":-10,"reputation":-6,"demand":-25},"cause":{"en":"the quality variation that continued because no shared procedure was written","sw":"tofauti ya ubora iliyoendelea kwa sababu hakuna utaratibu wa pamoja ulioandikwa"}}]}]}},{"id":"t17","concept":"record-keeping","conceptLabel":{"en":"Records a lender can accept","sw":"Kumbukumbu ambazo mkopeshaji anaweza kukubali"},"scene":"office","unverified":true,"carryVariant":{"flag":"keepsRecords","when":true,"situation":{"en":"Because you kept a book before taking the bakery, the lender can already see part of the story. They still ask you to keep the same record for six months of bakery trading.","sw":"Kwa sababu ulitunza daftari kabla ya kuanza bakery, mkopeshaji anaweza kuona sehemu ya historia. Bado anakuomba uendelee na kumbukumbu hiyo kwa miezi sita ya biashara ya bakery."}},"situation":{"en":"A lender asks for six months of books before discussing a larger facility. They want sales, costs, debts and money taken out by the owner. You have receipts and a cash box, but no regular record that joins them.","sw":"Mkopeshaji anaomba kumbukumbu za miezi sita kabla ya kuzungumzia mkopo mkubwa zaidi. Anataka mauzo, gharama, madeni na pesa iliyotolewa na mmiliki. Una risiti na sanduku la pesa, lakini huna kumbukumbu ya kawaida inayoviunganisha."},"info":[{"id":"list-records","label":{"en":"Ask what the lender needs to see each month","sw":"Uliza mkopeshaji anahitaji kuona nini kila mwezi"},"costHours":1,"costCash":0,"reveals":{"en":"A useful book shows what was sold, what was spent, what customers still owe and what the bakery owes suppliers. A pile of receipts is evidence, but it is not yet a readable record.","sw":"Daftari lenye matumizi linaonyesha kilichouzwa, kilichotumika, wateja bado wanadaiwa nini na bakery inadaiwa nini na wasambazaji. Rundo la risiti ni ushahidi, lakini bado si kumbukumbu inayosomeka."}}],"decision":{"prompt":{"en":"What record will you keep?","sw":"Utunzaje kumbukumbu gani?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"keep-books","label":{"en":"Keep a daily book of sales, costs and money owed","sw":"Tunza daftari la kila siku la mauzo, gharama na pesa zinazodaiwa"},"detail":{"en":"A small daily task makes six months readable.","sw":"Kazi ndogo ya kila siku inafanya miezi sita isomeke."},"effects":{"keepsRecords":true,"ownerHoursUsed":4,"ownerHoursFixed":1},"predictAnswer":"same","outcome":{"en":"The book costs time and does not add profit this week. Later, a lender can see how sales, costs and customer credit moved together.","sw":"Daftari linatumia muda na haliongezi faida wiki hii. Baadaye, mkopeshaji anaweza kuona mauzo, gharama na credit ya wateja vilivyobadilika pamoja."},"lesson":{"en":"Records are not a score and they do not create profit by themselves. They make the business's decisions and cash movement visible to another person.","sw":"Kumbukumbu si alama na hazitengenezi faida zenyewe. Zinafanya maamuzi na mzunguko wa pesa wa biashara uonekane kwa mtu mwingine."}},{"id":"pay-bookkeeper","label":{"en":"Pay someone weekly to keep the book and rebuild the old months","sw":"Mlipe mtu kila wiki atunze daftari na ajenge upya miezi iliyopita"},"detail":{"en":"The work leaves your evenings. The fee is a new weekly cost.","sw":"Kazi inatoka kwenye jioni zako. Ada ni gharama mpya ya kila wiki."},"effects":{"keepsRecords":true,"licenceFees":20000,"ownerHoursUsed":1},"predictAnswer":"down","outcome":{"en":"The book is kept without your evenings, and the receipt pile becomes a rough story of the old months — with gaps, because a sale nobody wrote down cannot be recovered. The fee comes out of this week's profit, and out of every week you keep paying it.","sw":"Daftari linatunzwa bila jioni zako, na rundo la risiti linakuwa historia ya kukadiria ya miezi iliyopita — yenye mapengo, kwa sababu mauzo ambayo hakuna aliyeyaandika hayawezi kurudishwa. Ada inatoka kwenye faida ya wiki hii, na kila wiki utakayoendelea kulipa."},"lesson":{"en":"A record costs you time or it costs you money. Neither one raises this week's profit, and paying for it puts the cost on the ledger where you can see it every week.","sw":"Kumbukumbu inakugharimu muda au inakugharimu pesa. Hakuna kati ya hizo inayoongeza faida ya wiki hii, na kulipia kunaweka gharama kwenye daftari mahali unapoiona kila wiki."}},{"id":"no-books","label":{"en":"Tell the lender the cash box is enough evidence","sw":"Mwambie mkopeshaji sanduku la pesa ni ushahidi wa kutosha"},"detail":{"en":"Keep your time for production and selling.","sw":"Weka muda wako kwa uzalishaji na mauzo."},"effects":{},"predictAnswer":"same","outcome":{"en":"The bakery keeps running, but the lender cannot see which sales paid for which costs or how much is still owed.","sw":"Bakery inaendelea, lakini mkopeshaji hawezi kuona ni mauzo gani yalilipia gharama gani au bado unadaiwa kiasi gani."},"lesson":{"en":"A cash box tells you what is there now. A record tells you what happened, what is owed and what the business can learn.","sw":"Sanduku la pesa linakuambia kilichopo sasa. Kumbukumbu inakuambia kilichotokea, kinachodaiwa na biashara inaweza kujifunza nini."}}]}},{"id":"t18","concept":"formalisation","conceptLabel":{"en":"Formalisation","sw":"Kuwa rasmi"},"scene":"office","unverified":true,"carryVariant":{"flag":"formality","atLeast":2,"situation":{"en":"You already have some formal footing from before the bakery. A buyer now asks whether your business licence, TIN and food-handling documents are current and whether you can keep the related records.","sw":"Tayari una msingi fulani wa kuwa rasmi kabla ya bakery. Mnunuzi sasa anauliza kama leseni ya biashara, TIN na nyaraka za kushughulikia chakula bado ni halali na kama unaweza kutunza kumbukumbu zinazohusiana."}},"situation":{"en":"A larger buyer says they need a business licence, a TIN and food-handling documentation before they can buy regularly. You have heard different stories about the time and cost. The exact local requirements and fees need checking.","sw":"Mnunuzi mkubwa anasema anahitaji leseni ya biashara, TIN na nyaraka za kushughulikia chakula kabla ya kununua mara kwa mara. Umesikia hadithi tofauti kuhusu muda na gharama. Mahitaji na ada halisi za eneo vinahitaji kuthibitishwa."},"info":[{"id":"check-formal-cost","label":{"en":"Ask for the current list of documents, visits and fees","sw":"Uliza orodha ya sasa ya nyaraka, ziara na ada"},"costHours":4,"costCash":5000,"reveals":{"en":"The buyer's requirements are clear, but the time and official amounts must be confirmed locally. Travel, repeat visits and preparation can add to the cash cost even when a fee list exists.","sw":"Mahitaji ya mnunuzi yako wazi, lakini muda na kiasi rasmi lazima vithibitishwe eneo hili. Safari, ziara za kurudia na maandalizi vinaweza kuongeza gharama ya pesa hata kama orodha ya ada ipo."}}],"decision":{"prompt":{"en":"How do you handle becoming formal?","sw":"Unashughulikiaje kuwa rasmi?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"complete-formal","label":{"en":"Start the formal process and budget 120,000 for it","sw":"Anza mchakato wa kuwa rasmi na tenga 120,000 kwa ajili yake"},"detail":{"en":"The cost arrives before the larger buyer does.","sw":"Gharama inafika kabla mnunuzi mkubwa hajafika."},"effects":{"formality":3,"cash":-120000,"licenceFees":9000,"ownerHoursUsed":8},"predictAnswer":"down","outcome":{"en":"You spend cash and working time before the new buyer places an order. The bakery's weekly profit falls by the running fee, while the door to a larger customer opens later.","sw":"Unatumia pesa na muda wa kazi kabla mnunuzi mpya hajaweka oda. Faida ya wiki inashuka kwa ada inayoendelea, huku mlango wa mteja mkubwa ukifunguka baadaye."},"lesson":{"en":"Formalisation is an operating cost, not a magic switch. It can open customers and documents, but the bakery must carry the cost before the benefit arrives.","sw":"Kuwa rasmi ni gharama ya uendeshaji, si swichi ya miujiza. Kunaweza kufungua wateja na nyaraka, lakini bakery lazima ibebe gharama kabla faida haijafika."},"later":[{"inWeeks":3,"effects":{"demand":80,"reputation":4},"cause":{"en":"the formal documents you obtained for the larger buyer","sw":"nyaraka rasmi ulizopata kwa ajili ya mnunuzi mkubwa"}}]},{"id":"verify-first","label":{"en":"Verify the requirements before paying or applying","sw":"Thibitisha mahitaji kabla ya kulipa au kuomba"},"detail":{"en":"Spend time to avoid paying for the wrong step.","sw":"Tumia muda kuepuka kulipia hatua isiyo sahihi."},"effects":{"cash":-5000,"ownerHoursUsed":4},"predictAnswer":"same","outcome":{"en":"You do not become formal this week. You do learn which documents and costs need confirmation before the bakery commits cash.","sw":"Huwi rasmi wiki hii. Unajifunza ni nyaraka na gharama gani zinahitaji kuthibitishwa kabla bakery haijatoa pesa."},"lesson":{"en":"Checking a formal requirement is information-seeking, not delay for its own sake. It can prevent a costly wrong turn.","sw":"Kukagua hitaji rasmi ni kutafuta taarifa, si kuchelewesha bila sababu. Kunaweza kuzuia kuingia kwenye njia yenye gharama isiyo sahihi."}},{"id":"stay-informal","label":{"en":"Keep serving current customers and stay informal for now","sw":"Endelea kuhudumia wateja wa sasa na ubaki si rasmi kwa sasa"},"detail":{"en":"No new cost today. Some buyers remain closed to you.","sw":"Hakuna gharama mpya leo. Baadhi ya wanunuzi wanaendelea kuwa nje yako."},"effects":{},"predictAnswer":"same","outcome":{"en":"The bakery keeps its current sales and keeps today's cash. The larger buyer looks elsewhere because their purchasing process needs documents you do not have.","sw":"Bakery inaweka mauzo ya sasa na pesa ya leo. Mnunuzi mkubwa anaangalia kwingine kwa sababu utaratibu wao wa kununua unahitaji nyaraka usizo nazo."},"lesson":{"en":"Staying informal can be a reasonable choice for a small operation. Its trade-off is that some customers cannot buy from you at all.","sw":"Kubaki si rasmi kunaweza kuwa uamuzi unaofaa kwa biashara ndogo. Hasara yake ni kwamba baadhi ya wateja hawawezi kununua kwako kabisa."},"later":[{"inWeeks":3,"effects":{"demand":-60},"cause":{"en":"the larger buyers you could not serve without the documents they require","sw":"wanunuzi wakubwa ambao hukuweza kuwahudumia bila nyaraka wanazohitaji"}}]}]}},{"id":"t19","concept":"seasonality","conceptLabel":{"en":"Seasonality","sw":"Mabadiliko ya misimu"},"scene":"market","situation":{"en":"The next weeks will not look like the last ones. School terms, holidays and the fasting month can move which customers order and when. You do not need to guess a date; you do need a way to change the bake when the orders change.","sw":"Wiki zinazofuata hazitafanana na zilizopita. Vipindi vya shule, likizo na mwezi wa kufunga vinaweza kubadilisha ni wateja gani wanaoagiza na lini. Huhitaji kubahatisha tarehe; unahitaji njia ya kubadilisha uokaji oda zinapobadilika."},"info":[{"id":"ask-seasonal-orders","label":{"en":"Ask customers what they expect to order next month","sw":"Waulize wateja wanatarajia kuagiza nini mwezi ujao"},"costHours":3,"costCash":0,"reveals":{"en":"Some bread buyers expect a quieter school period. Cake customers will confirm closer to their events. A small order list is more useful than one average demand number.","sw":"Baadhi ya wanunuzi wa mikate wanatarajia kipindi tulivu cha shule. Wateja wa keki watathibitisha karibu na shughuli zao. Orodha ndogo ya oda ni yenye matumizi kuliko namba moja ya wastani wa mahitaji."}}],"decision":{"prompt":{"en":"How do you plan for the change?","sw":"Unapangaje kwa ajili ya mabadiliko?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"plan-orders","label":{"en":"Confirm orders and adjust each line before baking","sw":"Thibitisha oda na rekebisha kila mstari kabla ya kuoka"},"detail":{"en":"Move bread and cake capacity with real orders.","sw":"Hamisha uwezo wa mikate na keki pamoja na oda halisi."},"effects":{"lines.bread.capacity":"+80","lines.bread.demand":"+80","lines.cake.capacity":"+3","lines.cake.demand":"+3","ownerHoursUsed":3},"predictAnswer":"up_lot","outcome":{"en":"You prepare for the orders customers actually confirm. The bakery uses more capacity without making the same amount blindly every week.","sw":"Unaandaa kwa oda ambazo wateja wamethibitisha kweli. Bakery inatumia uwezo zaidi bila kutengeneza kiasi kilekile kwa kubahatisha kila wiki."},"lesson":{"en":"Seasonality is easier to manage when demand is turned into a short order list. Plan the change, then let production follow it.","sw":"Mabadiliko ya msimu ni rahisi kusimamia mahitaji yanapogeuzwa kuwa orodha fupi ya oda. Panga mabadiliko, kisha acha uzalishaji uyafuate."}},{"id":"make-buffer","label":{"en":"Bake a large stock now so no customer waits","sw":"Oka stock kubwa sasa ili hakuna mteja asubiri"},"detail":{"en":"You prepare before the seasonal orders are certain.","sw":"Unaandaa kabla oda za msimu kuwa na uhakika."},"effects":{"lines.bread.capacity":"+300","lines.mandazi.capacity":"+200","lines.bread.unitCost":"+80","lines.mandazi.unitCost":"+40"},"predictAnswer":"down","outcome":{"en":"The bakery has plenty ready. If the quieter period arrives as customers said, unsold bread and mandazi absorb the margin.","sw":"Bakery ina bidhaa nyingi tayari. Kipindi tulivu kikifika kama wateja walivyosema, mikate na mandazi zisizouzwa zinakula margin."},"lesson":{"en":"A seasonal guess becomes expensive when it is baked into stock. A plan should change capacity, not only increase it.","sw":"Kubahatisha kwa msimu kunakuwa ghali kunapogeuzwa kuwa stock. Mpango unapaswa kubadilisha uwezo, si kuuongeza tu."}},{"id":"react-later","label":{"en":"Keep the usual bake and react when sales change","sw":"Weka uokaji wa kawaida na ujibu mauzo yakibadilika"},"detail":{"en":"No planning time now. You will use the next sales figures.","sw":"Hakuna muda wa kupanga sasa. Utatumia namba za mauzo zinazofuata."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes before the season moves. You keep the current mix, then have to make a quick decision when the first quiet or busy week arrives.","sw":"Hakuna kinachobadilika kabla msimu haujabadilika. Unaweka mchanganyiko wa sasa, kisha lazima ufanye uamuzi wa haraka wiki ya kwanza tulivu au yenye shughuli inapofika."},"lesson":{"en":"Reacting can be sensible when information is weak, but it leaves less time to change suppliers, staff and batch sizes.","sw":"Kujibu baadaye kunaweza kuwa na maana taarifa zikiwa chache, lakini kunaacha muda mdogo wa kubadilisha wasambazaji, wafanyakazi na ukubwa wa makundi."},"later":[{"inWeeks":2,"effects":{"lines.bread.demand":"-60","lines.cake.demand":"-3"},"cause":{"en":"the seasonal demand change you chose to meet only after it arrived","sw":"mabadiliko ya mahitaji ya msimu uliyochagua kuyakabili baada tu ya kufika"}}]}]}},{"id":"t20","concept":"setback","conceptLabel":{"en":"A large unpaid shop order","sw":"Oda kubwa ya duka ambayo haijalipwa"},"scene":"office","unverified":true,"situation":{"en":"The larger shop has not paid for nine weeks. Its account is still profitable on paper, but the bank is carrying flour, wages and deliveries for a customer who has not sent the money. The shop asks for another delivery while it promises to settle later.","sw":"Duka kubwa halijalipa kwa wiki tisa. Akaunti yake bado ina faida kwenye karatasi, lakini benki inabeba unga, mishahara na usafirishaji kwa mteja ambaye hajatuma pesa. Duka linaomba delivery nyingine huku likiahidi kulipa baadaye."},"info":[{"id":"check-exposure","label":{"en":"Add up what this one shop owes and what it pays for","sw":"Jumlisha duka hili linachodaiwa na linacholipia"},"costHours":2,"costCash":0,"reveals":{"en":"The shop is now a large share of your bread sales. If you keep delivering, the unpaid balance grows. If you stop, you may lose the customer but you stop financing its operations with your cash.","sw":"Duka sasa ni sehemu kubwa ya mauzo yako ya mikate. Ukiendelea kupeleka, salio lisilolipwa linakua. Ukisimama, unaweza kumpoteza mteja lakini unaacha kufadhili uendeshaji wake kwa pesa yako."}}],"decision":{"prompt":{"en":"What do you do with the unpaid account?","sw":"Unafanya nini kuhusu akaunti ambayo haijalipa?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"pause-collect","label":{"en":"Pause new deliveries and collect the old balance","sw":"Sitisha delivery mpya na kukusanya salio la zamani"},"detail":{"en":"You may lose the shop, but you stop adding unpaid sales.","sw":"Unaweza kulipoteza duka, lakini unaacha kuongeza mauzo yasiyolipwa."},"effects":{"debtorWeeks":0,"lines.bread.capacity":"-240","lines.bread.demand":"-240","lines.bread.price":"-100"},"predictAnswer":"down","outcome":{"en":"Bread sales fall because you stop the account, and the counter price is lower while you rebuild regular trade. The bank is no longer asked to fund another delivery for a shop that has not paid.","sw":"Mauzo ya mikate yanashuka kwa sababu unasimamisha akaunti, na bei ya kaunta iko chini wakati unajenga upya biashara ya kawaida. Benki haiombwi tena kufadhili delivery nyingine kwa duka ambalo halijalipa."},"lesson":{"en":"A customer can be profitable on paper and still be dangerous to the bank. Stopping a sale can protect the business that remains.","sw":"Mteja anaweza kuwa na faida kwenye karatasi na bado kuwa hatari kwa benki. Kusimamisha mauzo kunaweza kulinda biashara iliyobaki."}},{"id":"one-last-week","label":{"en":"Give one last small delivery with a written payment plan","sw":"Toa delivery ndogo ya mwisho na mpango wa malipo ulioandikwa"},"detail":{"en":"Limit the new exposure while you test whether the promise is real.","sw":"Punguza hatari mpya wakati unapima kama ahadi ni ya kweli."},"effects":{"debtorWeeks":2,"concentrated":true},"predictAnswer":"same","outcome":{"en":"You keep a small relationship alive and shorten the terms. Profit changes little now; the important change is that you stop treating an open promise as unlimited credit.","sw":"Unaweka uhusiano mdogo hai na unafupisha masharti. Faida inabadilika kidogo sasa; mabadiliko muhimu ni kuacha kuchukulia ahadi wazi kama credit isiyo na kikomo."},"lesson":{"en":"A setback does not always require an all-or-nothing answer. A written limit can turn a vague promise into a risk you can watch.","sw":"Setback si lazima kila mara ihitaji jibu la yote au hakuna. Kikomo kilichoandikwa kinaweza kugeuza ahadi isiyo wazi kuwa hatari unayoweza kuifuatilia."},"later":[{"inWeeks":2,"effects":{"cash":200000},"cause":{"en":"the written payment plan you required before the last small delivery","sw":"mpango wa malipo ulioandikwa ulioutaka kabla ya delivery ndogo ya mwisho"}}]},{"id":"borrow-invoice","label":{"en":"Borrow 400,000 against the unpaid invoice and keep delivering","sw":"Kopa 400,000 dhidi ya ankara isiyolipwa na uendelee kupeleka"},"detail":{"en":"Cash arrives now, with a new debt and a concentrated customer risk.","sw":"Pesa inafika sasa, na deni jipya pamoja na hatari ya mteja mmoja."},"effects":{"cash":400000,"debt":400000,"interestRate":0.3,"repayPerWeek":30000,"concentrated":true,"tookCredit":true},"predictAnswer":"down","outcome":{"en":"The borrowed cash covers part of the gap. Profit falls by the new interest, and the bakery now owes a lender while still waiting for the shop.","sw":"Pesa iliyokopwa inafunika sehemu ya pengo. Faida inashuka kwa interest mpya, na bakery sasa inadaiwa na mkopeshaji huku bado ikisubiri duka."},"lesson":{"en":"Borrowing against an unpaid invoice can buy time, but it does not remove concentration risk. One late customer can now affect two creditors.","sw":"Kukopa dhidi ya ankara isiyolipwa kunaweza kununua muda, lakini hakuondoi hatari ya kutegemea mteja mmoja. Mteja mmoja akichelewa sasa anaweza kuwaathiri wadai wawili."},"later":[{"inWeeks":3,"effects":{"reputation":-5,"demand":-40},"cause":{"en":"the unpaid shop account you kept funding with a second loan","sw":"akaunti ya duka isiyolipa uliyoendelea kuifadhili kwa mkopo wa pili"}}]}]}}]},"scenario-factory.json":{"id":"factory","version":1,"unverified":true,"title":{"en":"Asha's Factory","sw":"Kiwanda cha Asha"},"blurb":{"en":"Run a small factory where the hardest decisions are about who decides, not what to sell.","sw":"Endesha kiwanda kidogo ambako maamuzi magumu zaidi ni kuhusu nani anaamua, si nini cha kuuza."},"currency":"TZS","_bandsNote":"Opening weekly profit is about TZS 788,000. The stall's 1,500/12,000 edges would call almost everything 'up a lot'. Scaled here so all four prediction outcomes are reachable across the chapter's options: 'same' within 40,000, 'up a lot' beyond 300,000.","bands":{"same":40000,"lot":300000},"startState":{"cash":15000000,"spoilRate":0.15,"rent":1200000,"staff":9,"wagePerStaff":180000,"payrollOnCost":0.18,"licenceFees":60000,"reputation":60,"hygiene":70,"formality":2,"ownerHours":70,"ownerHoursFixed":30,"hoursPerCapacity":0.004,"hoursPerStaff":4,"assetValue":40000000,"assetLifeWeeks":300,"debt":30000000,"interestRate":0.22,"repayPerWeek":450000,"debtorWeeks":3,"inventoryWeeks":2,"creditorWeeks":2,"lines":[{"id":"loaves","label":{"en":"Wholesale loaves","sw":"Mikate ya jumla"},"price":900,"unitCost":620,"demand":9000,"capacity":9000},{"id":"buns","label":{"en":"Buns","sw":"Maandazi ya kiwanda"},"price":400,"unitCost":250,"demand":6000,"capacity":6000},{"id":"premium","label":{"en":"Premium line","sw":"Bidhaa za hali ya juu"},"price":2500,"unitCost":1500,"demand":800,"capacity":800}]},"carryIn":[{"flag":"builtTeam","when":true,"startState":{"ownerHoursFixed":27},"note":{"en":"You have delegated real decisions before, at the bakery. Handing authority to a factory supervisor is not a new muscle.","sw":"Umeshawahi kukabidhi maamuzi halisi hapo awali, kwenye bakery. Kumkabidhi mamlaka msimamizi wa kiwanda si kitu kipya kwako."}},{"flag":"tookCredit","when":true,"startState":{"interestRate":0.2},"note":{"en":"The bank saw you take a loan and repay it before. The factory's term loan carries a slightly better rate because of it.","sw":"Benki iliona ulichukua mkopo na kuulipa hapo awali. Mkopo wa muda mrefu wa kiwanda una riba nafuu kidogo kwa sababu hiyo."}},{"flag":"keepsRecords","when":true,"startState":{"cash":15800000},"note":{"en":"Clean books from the bakery made the lease and the loan easier to arrange. You start with a little more cash because of it.","sw":"Vitabu safi kutoka bakery vilirahisisha mpangilio wa kukodi jengo na mkopo. Unaanza na pesa kidogo zaidi kwa sababu hiyo."}}],"goal":{"title":{"en":"Three things to keep in view","sw":"Mambo matatu ya kuyaangalia"},"description":{"en":"This goal gives your run a direction. It is not a pass mark. You can finish without every condition; the record reports what was true at the end.","sw":"Lengo hili linakupa mwelekeo katika safari yako. Si alama ya kufaulu. Unaweza kumaliza bila kutimiza kila sharti; kumbukumbu itaonyesha hali ya mwisho."},"conditions":[{"id":"weekly-profit","label":{"en":"Your latest week leaves a positive profit after its costs.","sw":"Wiki yako ya mwisho inaacha faida baada ya gharama zake."},"metric":"weeklyProfit","min":0},{"id":"cash-buffer","label":{"en":"Your cash covers at least two weeks of the factory's costs.","sw":"Pesa yako inatosha kugharamia angalau wiki mbili za gharama za kiwanda."},"metric":"weeksOfCostsCovered","min":2},{"id":"cash-cycle","label":{"en":"Money is tied up in the trading cycle for no more than five weeks.","sw":"Pesa imefungwa kwenye mzunguko wa biashara kwa muda usiozidi wiki tano."},"metric":"cashCycleWeeks","max":5}]},"recovery":{"id":"recovery","concept":"recovery","conceptLabel":{"en":"Trading out of a cash hole","sw":"Kutoka kwenye shimo la pesa"},"scene":"office","unverified":true,"situation":{"en":"Your cash has gone below zero. Wages, the loan repayment and a supplier invoice are due before the distributors pay what they owe you. The factory is still producing. This is a hard week, not the end of it.","sw":"Pesa yako imeshuka chini ya sifuri. Mishahara, marejesho ya mkopo na ankara ya msambazaji vinatakiwa kabla wasambazaji hawajalipa wanachodaiwa. Kiwanda bado kinazalisha. Hii ni wiki ngumu, si mwisho wake."},"info":[{"id":"map-factory-gap","label":{"en":"List what must be paid before the next distributor payment lands","sw":"Andika kinachopaswa kulipwa kabla malipo ya wasambazaji yanayofuata hayajaingia"},"costHours":1,"costCash":0,"reveals":{"en":"You can see the gap now. Asking your largest distributor to pay part of an old invoice brings cash but tests the relationship. Cutting a non-bottleneck shift protects cash but slows one line. Selling the van brings cash and removes delivery capacity.","sw":"Sasa unaona pengo. Kumwomba msambazaji wako mkubwa alipe sehemu ya ankara ya zamani kunaleta pesa lakini kunajaribu uhusiano. Kupunguza zamu isiyo kizuizi kunalinda pesa lakini kunapunguza mstari mmoja. Kuuza gari kunaleta pesa na kuondoa uwezo wa usafirishaji."}}],"decision":{"prompt":{"en":"Which way out do you choose?","sw":"Unachagua njia gani ya kutoka?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"collect-part","label":{"en":"Ask your largest distributor for part-payment before the next delivery","sw":"Mwombe msambazaji wako mkubwa alipe sehemu kabla ya upelekaji unaofuata"},"detail":{"en":"You protect the relationship but ask for cash to keep the line running.","sw":"Unalinda uhusiano lakini unaomba pesa ili mstari uendelee kufanya kazi."},"effects":{"debtorWeeks":"-1","cash":2500000},"predictAnswer":"same","outcome":{"en":"The distributor pays part of an old invoice. The factory keeps running and the time your money sits with customers shortens.","sw":"Msambazaji analipa sehemu ya ankara ya zamani. Kiwanda kinaendelea kufanya kazi na muda ambao pesa yako inakaa kwa wateja unapungua."},"lesson":{"en":"When cash is tight, collecting money already earned can be safer than chasing new orders. It does not create new profit; it releases your own money.","sw":"Pesa ikiwa ngumu, kukusanya pesa uliyokwisha ipata kunaweza kuwa salama kuliko kufukuza oda mpya. Hakutengenezi faida mpya; kunatoa pesa yako iliyofungwa."}},{"id":"cut-shift","label":{"en":"Cut the buns shift for two weeks and one weekly cost","sw":"Punguza zamu ya maandazi kwa wiki mbili na gharama moja ya wiki"},"detail":{"en":"Keep the loan and wages moving. The buns line loses volume for now.","sw":"Endelea kulipa mkopo na mishahara. Mstari wa maandazi unapoteza kiasi kwa sasa."},"effects":{"lines.buns.capacity":"-1500","rent":"-100000"},"predictAnswer":"down","outcome":{"en":"Buns volume falls and the factory gives up part of its premises cost. Weekly profit drops, but wages and the loan stay serviced.","sw":"Kiasi cha maandazi kinashuka na kiwanda kinaacha sehemu ya gharama ya eneo. Faida ya wiki inashuka, lakini mishahara na mkopo vinaendelea kulipwa."},"lesson":{"en":"Cutting back is not giving up. It matches the size of the factory to the cash it can actually use this month.","sw":"Kupunguza si kukata tamaa. Kunalinganisha ukubwa wa kiwanda na pesa inayoweza kutumia mwezi huu."}},{"id":"sell-van","label":{"en":"Sell the delivery van and use a distributor-run collection instead","sw":"Uza gari la usafirishaji na tumia utaratibu wa wasambazaji kuja kuchukua bidhaa"},"detail":{"en":"Cash now, less delivery capacity and a lighter loan later.","sw":"Pesa sasa, uwezo mdogo wa usafirishaji na mzigo mwepesi wa mkopo baadaye."},"effects":{"cash":4000000,"assetValue":"-6000000","lines.loaves.capacity":"-500","repayPerWeek":"-30000"},"predictAnswer":"down","outcome":{"en":"You turn an asset into cash. The factory can move less loaves volume, but the weekly repayment is lighter and distributors collect their own orders.","sw":"Unageuza mali kuwa pesa. Kiwanda kinaweza kusafirisha kiasi kidogo cha mikate, lakini marejesho ya wiki yanapungua na wasambazaji wanachukua oda zao wenyewe."},"lesson":{"en":"An asset can protect the business in a crisis, but selling it solves today's cash gap by giving up tomorrow's capacity.","sw":"Mali inaweza kulinda biashara wakati wa tatizo, lakini kuiuza kunatatua pengo la pesa la leo kwa kuacha uwezo wa kesho."}}]}},"turns":[{"id":"t01","concept":"unit-economics","conceptLabel":{"en":"Cost per unit at scale","sw":"Gharama ya kila kipande kwa wingi"},"scene":"kitchen","situation":{"en":"A distributor asks whether you can supply loaves every week instead of when they call. The premium line sells far fewer units but leaves much more on each one. You cannot chase both at once with the same hours.","sw":"Msambazaji anauliza kama unaweza kusambaza mikate kila wiki badala ya wanapopiga simu. Mstari wa bidhaa za hali ya juu unauza vipande vichache zaidi lakini unaacha zaidi kwa kila kimoja. Huwezi kufukuza vyote viwili kwa masaa yaleyale."},"info":[{"id":"compare-unit-costs","label":{"en":"Compare what stays flat per unit against what falls with volume","sw":"Linganisha kinachobaki tulivu kwa kila kipande na kinachoshuka kwa wingi"},"costHours":1,"costCash":0,"reveals":{"en":"Flour and packaging cost the same per loaf whether you make ten or ten thousand. Rent, the manager's time and the loan do not — spread over more units, each one carries less of them. Volume lowers the average cost; it does not lower the direct cost.","sw":"Unga na vifungashio vinagharimu sawa kwa kila mkate uzalishe kumi au elfu kumi. Kodi, muda wa msimamizi na mkopo havifanani — vikigawanywa kwa vipande vingi, kila kimoja kinabeba kidogo zaidi yake. Wingi unapunguza gharama ya wastani; haupunguzi gharama ya moja kwa moja."}}],"decision":{"prompt":{"en":"Where do you put the next useful hours?","sw":"Unaweka wapi masaa yanayofuata yenye matumizi?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"push-loaves-volume","label":{"en":"Commit to the distributor's weekly loaves volume","sw":"Ahidi kiasi cha mikate cha kila wiki kwa msambazaji"},"detail":{"en":"Lower margin per loaf, but a real, standing order.","sw":"Margin ndogo kwa kila mkate, lakini oda halisi ya kudumu."},"effects":{"lines.loaves.capacity":"+900","lines.loaves.demand":"+900"},"predictAnswer":"up_bit","outcome":{"en":"The distributor takes the extra loaves every week. Each one leaves less than a premium item, but the standing order fills the ovens well.","sw":"Msambazaji anachukua mikate ya ziada kila wiki. Kila mmoja unaacha kidogo kuliko bidhaa ya hali ya juu, lakini oda ya kudumu inajaza oveni vizuri."},"lesson":{"en":"A lower-margin product with a confirmed buyer can carry a factory's fixed costs further than a high-margin product with no order behind it.","sw":"Bidhaa yenye margin ndogo ikiwa na mnunuzi aliyethibitika inaweza kubeba gharama zisizobadilika za kiwanda zaidi kuliko bidhaa yenye margin kubwa isiyo na oda."}},{"id":"chase-premium-margin","label":{"en":"Reserve the next hours for the premium line instead","sw":"Tenga masaa yanayofuata kwa mstari wa bidhaa za hali ya juu"},"detail":{"en":"Fewer units, but more contribution per unit.","sw":"Vipande vichache, lakini mchango mkubwa kwa kila kimoja."},"effects":{"lines.premium.capacity":"+30","lines.premium.demand":"+30"},"predictAnswer":"same","outcome":{"en":"A small number of extra premium orders fit into the plan. The margin is strong, but there are not yet enough of them to move the week much.","sw":"Oda chache za ziada za bidhaa za hali ya juu zinaingia kwenye mpango. Margin ni nzuri, lakini bado hazitoshi kubadilisha wiki sana."},"lesson":{"en":"The line with the best margin is not automatically the best use of the next hour. Check whether there is enough real demand behind it.","sw":"Mstari wenye margin bora si lazima uwe matumizi bora ya saa inayofuata. Angalia kama kuna mahitaji ya kutosha halisi nyuma yake."}},{"id":"shift-without-orders","label":{"en":"Move packing time from buns to loaves on a guess","sw":"Hamisha muda wa kufunga kutoka maandazi kwenda mikate kwa kubahatisha"},"detail":{"en":"No new order for either line. Just a bet on which sells faster.","sw":"Hakuna oda mpya kwa mstari wowote. Ni dhana tu ya nani anauzwa haraka zaidi."},"effects":{"lines.buns.capacity":"-500","lines.loaves.capacity":"+500"},"predictAnswer":"down","outcome":{"en":"Buns customers wait longer and some orders go unmet, while the extra loaves capacity has no matching order and sits unsold.","sw":"Wateja wa maandazi wanasubiri zaidi na baadhi ya oda hazitimizwi, huku uwezo wa ziada wa mikate ukikaa bila kuuzwa kwa sababu hauna oda inayolingana."},"lesson":{"en":"Moving capacity between lines without a matching order loses sales on one side and spoils stock on the other. Unit economics needs a real buyer, not a guess.","sw":"Kuhamisha uwezo kati ya mistari bila oda inayolingana kunapoteza mauzo upande mmoja na kuharibu bidhaa upande mwingine. Gharama ya kila kipande inahitaji mnunuzi halisi, si dhana."}}]}},{"id":"t02","concept":"fixed-cost-absorption","conceptLabel":{"en":"Fixed cost absorption","sw":"Kubeba gharama zisizobadilika"},"scene":"kitchen","situation":{"en":"A consultant suggests a second buns mixer to raise throughput. No new orders are confirmed yet. A nearby factory installed a second line last year with no order behind it either; it ran at less than half capacity and nearly sank them.","sw":"Mshauri anapendekeza mashine ya pili ya kuchanganya maandazi ili kuongeza uzalishaji. Hakuna oda mpya iliyothibitishwa bado. Kiwanda kingine karibu kiliweka mstari wa pili mwaka jana bila oda nyuma yake pia; kilifanya kazi kwa chini ya nusu ya uwezo wake na karibu kikazama."},"info":[{"id":"check-utilisation","label":{"en":"Ask what a mixer running at 40% would still cost every week","sw":"Uliza mashine inayofanya kazi kwa 40% ingegharimu kiasi gani kila wiki"},"costHours":2,"costCash":0,"reveals":{"en":"A machine bought on spec still depreciates whether it is busy or not, and what it makes without a buyer becomes spoilage, not profit. A second line only helps once real demand can fill it.","sw":"Mashine iliyonunuliwa kwa matumaini bado inachakaa ikiwa na kazi au la, na kile inachozalisha bila mnunuzi kinakuwa uharibifu, si faida. Mstari wa pili unasaidia tu mahitaji halisi yanapoweza kuujaza."}}],"workout":true,"decision":{"prompt":{"en":"What do you do about the second mixer?","sw":"Unafanya nini kuhusu mashine ya pili?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"buy-second-mixer-now","label":{"en":"Buy the second mixer now, on spec","sw":"Nunua mashine ya pili sasa, kwa matumaini"},"detail":{"en":"More capacity than any current order needs.","sw":"Uwezo zaidi kuliko oda yoyote ya sasa inavyohitaji."},"effects":{"assetValue":"+8000000","lines.premium.capacity":"+300"},"predictAnswer":"down","outcome":{"en":"The mixer is installed, but demand has not grown to match it. Most of the extra output goes unsold, and the machine's weekly depreciation runs whether it is used or not.","sw":"Mashine imewekwa, lakini mahitaji hayajakua kulingana nayo. Uzalishaji mwingi wa ziada hauuzwi, na uchakavu wa wiki wa mashine unaendelea ikiwa na kazi au la."},"lesson":{"en":"A second line at low utilisation is worse than no second line. It adds a fixed cost that has nothing yet to absorb it.","sw":"Mstari wa pili wenye matumizi madogo ni mbaya zaidi kuliko kutokuwa na mstari wa pili. Unaongeza gharama isiyobadilika ambayo bado haina cha kuibeba."}},{"id":"wait-for-orders","label":{"en":"Wait until orders confirm the extra capacity is needed","sw":"Subiri hadi oda zithibitishe uwezo wa ziada unahitajika"},"detail":{"en":"No new machine yet. No new cost yet either.","sw":"Hakuna mashine mpya bado. Hakuna gharama mpya pia."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes this week. The factory keeps its current capacity and keeps watching for a real order large enough to justify the machine.","sw":"Hakuna kinachobadilika wiki hii. Kiwanda kinaendelea na uwezo wake wa sasa na kinaendelea kuangalia oda halisi kubwa ya kutosha kuhalalisha mashine."},"lesson":{"en":"Declining to expand is not the same as standing still forever. It can be the responsible choice while the order that would fill the new capacity has not arrived.","sw":"Kukataa kupanuka si sawa na kusimama milele. Kunaweza kuwa uamuzi wa kuwajibika wakati oda ambayo ingejaza uwezo mpya bado haijafika."}},{"id":"rent-for-confirmed-order","label":{"en":"Rent short-term capacity for the premium line's confirmed order","sw":"Kodi uwezo wa muda mfupi kwa oda iliyothibitishwa ya mstari wa hali ya juu"},"detail":{"en":"A real order first, and equipment sized to fit it.","sw":"Oda halisi kwanza, na vifaa vilivyopimwa kulingana nayo."},"effects":{"rent":"+40000","lines.premium.capacity":"+150","lines.premium.demand":"+150"},"predictAnswer":"up_bit","outcome":{"en":"The rented capacity matches an order that already exists. The weekly rental cost is real, but every unit it makes has a buyer.","sw":"Uwezo uliokodiwa unalingana na oda iliyopo tayari. Gharama ya wiki ya kukodi ni halisi, lakini kila kipande kinachozalishwa kina mnunuzi."},"lesson":{"en":"Sizing capacity to a confirmed order, even a rented and temporary one, absorbs its fixed cost from the first week.","sw":"Kupima uwezo kulingana na oda iliyothibitishwa, hata ikiwa ni ya kukodi na ya muda, unabeba gharama yake isiyobadilika tangu wiki ya kwanza."}}]}},{"id":"t03","concept":"bottleneck","conceptLabel":{"en":"Finding the bottleneck","sw":"Kutafuta kizuizi"},"scene":"kitchen","situation":{"en":"You spend a full day watching the floor. Mixing finishes early and the ovens run steadily, but pallets pile up at the loading bay while the packing table works through them one at a time.","sw":"Unatumia siku nzima ukiangalia eneo la uzalishaji. Uchanganyaji unamalizika mapema na oveni zinafanya kazi kwa utaratibu, lakini mizigo inarundikana eneo la kupakia huku meza ya ufungashaji ikiifanyia kazi kimoja baada ya kingine."},"info":[{"id":"watch-where-it-piles","label":{"en":"Watch where product waits, not where staff look busiest","sw":"Angalia mahali bidhaa inaposubiri, si mahali wafanyakazi wanaonekana na shughuli nyingi"},"costHours":3,"costCash":0,"reveals":{"en":"Mixing and baking finish
