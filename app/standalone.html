/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}

h1 { font-size: 1.05rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0 0 0.7em; }
ul { margin: 0; padding-left: 1.1em; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 12px 40px;
}

/* ---------- shell ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 2px 8px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
}

.banner-unverified {
  margin: 0 0 10px;
  padding: 9px 12px;
  background: var(--surface-alt);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 0.83rem;
  color: var(--text-muted);
}

.progress {
  height: 5px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-bar {
  height: 100%;
  background: var(--accent-2);
  border-radius: 99px;
  transition: width 400ms ease;
}

.scene {
  margin-bottom: 12px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface-alt);
  line-height: 0;
}
.scene svg { display: block; width: 100%; height: auto; }

.foot {
  margin-top: 26px;
  text-align: center;
  font-size: 0.76rem;
  color: var(--text-muted);
}
.foot p { margin: 0; }

/* ---------- stats ---------- */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 6px;
  text-align: center;
  min-width: 0;
}
.stat-label {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-value {
  font-size: 0.98rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  overflow-wrap: anywhere;
}
.negative { color: var(--danger); }

/* ---------- P&L ---------- */
.pnl-toggle { display: block; margin: 0 0 8px auto; }

.pnl {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 0.9rem;
}
.pnl-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 3px 0;
}
.pnl-row.total {
  border-top: 2px solid var(--border);
  margin-top: 6px;
  padding-top: 7px;
  font-weight: 700;
  font-size: 1rem;
}
.pnl-label { color: var(--text-muted); }
.pnl-row.total .pnl-label { color: var(--text); }
.pnl-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pnl-note {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-size: 0.83rem;
  color: var(--text-muted);
}

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px var(--shadow);
}
.card-title {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 9px;
}
.concept-tag {
  display: inline-block;
  background: var(--surface-alt);
  color: var(--text-muted);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 0.7rem;
  letter-spacing: 0.03em;
}
.situation {
  font-size: 1.02rem;
  line-height: 1.55;
  margin: 0;
}

/* ---------- information step ---------- */
.info-list { display: flex; flex-direction: column; gap: 8px; }

.info-item {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--tap);
  padding: 11px 13px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 0.93rem;
  cursor: pointer;
}
.info-item:active { transform: scale(0.98); }
.info-label { display: block; font-weight: 600; }
.info-cost {
  display: inline-block;
  margin-top: 3px;
  font-size: 0.78rem;
  color: var(--text-muted);
}
.info-item.used {
  background: var(--ok-bg);
  border-color: var(--accent-2);
  cursor: default;
  opacity: 1;
}
.info-item.used .info-label { font-weight: 600; }
.info-reveals {
  display: block;
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.45;
}

/* ---------- decision step ---------- */
.options { display: flex; flex-direction: column; gap: 9px; }

.option {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--tap);
  padding: 13px 14px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease;
}
.option:hover { border-color: var(--accent); }
.option:active { transform: scale(0.98); }
/* Buttons carry the whole interaction, so a press has to feel like one on a cheap
   touchscreen where there is no cursor and no hover. */
.option, .info-item, .predict-choice, .btn, .lang-btn {
  transition: transform 90ms ease, border-color 140ms ease, background 140ms ease, opacity 140ms ease;
}
.option:disabled:not(.selected) { opacity: 0.45; }
.option.selected {
  border-color: var(--accent);
  background: var(--surface-alt);
}
.option-label { display: block; font-weight: 650; font-size: 1rem; }
.option-detail {
  display: block;
  margin-top: 4px;
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* ---------- prediction step ---------- */
.predict { border-color: var(--accent); border-width: 2px; }
.predict-question {
  font-weight: 650;
  font-size: 1.02rem;
  margin: 10px 0 12px;
}
.predict-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.predict-choice {
  min-height: var(--tap);
  padding: 11px 8px;
  background: var(--surface-alt);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 140ms ease;
}
.predict-choice:hover:not(:disabled) { border-color: var(--accent); }
.predict-choice:active:not(:disabled) { transform: scale(0.97); }
.predict-choice.selected {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}
.predict-choice:disabled:not(.selected) { opacity: 0.45; cursor: default; }

/* ---------- reveal step ---------- */
.reveal {
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 14px;
  background: var(--surface);
  box-shadow: 0 1px 3px var(--shadow);
}
.reveal.correct { border-color: var(--accent-2); background: var(--ok-bg); }
.reveal.wrong { border-color: var(--danger); background: var(--danger-bg); }

.reveal-verdict {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}
/* Glyph carries the meaning, not colour alone. */
.reveal-mark {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 1.05rem;
  font-weight: 700;
  background: var(--surface);
  border: 2px solid currentColor;
}
.reveal.correct .reveal-mark { color: var(--accent-2); }
.reveal.wrong .reveal-mark { color: var(--danger); }
.reveal-text { font-weight: 700; font-size: 1.02rem; }

.reveal-delta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 9px 11px;
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 11px;
}
.reveal-delta-label { font-size: 0.83rem; color: var(--text-muted); }
.reveal-delta-value {
  font-size: 1.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.outcome { font-size: 0.97rem; line-height: 1.55; }
.lesson {
  font-size: 0.94rem;
  line-height: 1.5;
  padding: 10px 12px;
  background: var(--surface);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 12px;
}

/* ---------- end profile ---------- */
.profile-head {
  text-align: center;
  padding: 14px 10px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.profile-tally {
  font-size: 2rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  color: var(--accent-2);
  line-height: 1.1;
}
.profile-tally-label {
  font-size: 0.84rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.profile-trend {
  margin-top: 8px;
  font-size: 0.9rem;
  font-weight: 600;
}
.profile-chart { margin-top: 14px; }
.profile-chart svg { display: block; width: 100%; height: auto; }

.indicator {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.indicator:last-of-type { border-bottom: 0; }
.indicator-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 3px;
}
.indicator-text { font-size: 0.97rem; line-height: 1.5; }
.indicator-evidence {
  margin-top: 4px;
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.45;
}

.limitations { background: var(--surface-alt); }
.limitations-list {
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text-muted);
}
.limitations-list li { margin-bottom: 6px; }

.end-actions {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 6px;
}

/* ---------- buttons ---------- */
.btn {
  min-height: var(--tap);
  padding: 12px 18px;
  border-radius: var(--radius);
  border: 2px solid transparent;
  font: inherit;
  font-weight: 650;
  font-size: 0.97rem;
  cursor: pointer;
  transition: filter 140ms ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; }

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); }

.btn-small {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.82rem;
  font-weight: 600;
}

/* ---------- language toggle ---------- */
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.lang-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 99px;
  overflow: hidden;
  background: var(--surface);
}
.lang-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 7px 11px;
  min-height: 34px;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}
.lang-btn.selected { background: var(--accent); color: var(--accent-ink); }
.lang-btn:not(.selected):hover { color: var(--text); }

.banner-draft { border-left-color: var(--accent-2); }

/* ---------- owner time ---------- */
.time-bar {
  margin: 8px 0 12px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.time-bar.over { border-color: var(--danger); background: var(--danger-bg); }
.time-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}
.time-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.time-value { font-size: 0.84rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.time-bar.over .time-value { color: var(--danger); }
.time-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.time-fill {
  height: 100%;
  width: 0;
  background: var(--accent-2);
  border-radius: 99px;
  transition: width 500ms cubic-bezier(0.22, 1, 0.36, 1);
}
.time-bar.over .time-fill { background: var(--danger); }

/* ---------- the ledger ----------
   Magnitude has to be visible, not just readable — docs/localization.md, "Numbers". */
.ledger {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.ledger-group-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin: 8px 0 4px;
}
.ledger-group-title:first-child { margin-top: 0; }

.ledger-row {
  display: grid;
  grid-template-columns: 1fr 64px auto;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 0.9rem;
}
.ledger-label { color: var(--text-muted); }
.ledger-bar {
  height: 7px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.ledger-fill {
  height: 100%;
  width: 0;
  border-radius: 99px;
  transition: width 520ms cubic-bezier(0.22, 1, 0.36, 1);
}
.ledger-fill.in { background: var(--accent-2); }
.ledger-fill.out { background: var(--accent); }
.ledger-value { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }

.ledger-row.total {
  border-top: 2px solid var(--border);
  margin-top: 8px;
  padding-top: 9px;
  font-size: 1rem;
}
.ledger-row.total .ledger-label { color: var(--text); font-weight: 700; }
.ledger-row.total .ledger-value { font-weight: 800; }

.pnl-note.warn { color: var(--danger); }

/* ---------- trajectory ---------- */
.trajectory {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--surface-alt);
  border-radius: var(--radius);
}
.trajectory-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 4px;
}
.trajectory-cash { font-size: 0.92rem; line-height: 1.45; }
.trajectory-note { font-size: 0.83rem; margin-top: 3px; font-weight: 600; }
.trajectory-note.falling { color: var(--danger); }
.trajectory-note.rising { color: var(--accent-2); }
.trajectory-note.flat { color: var(--text-muted); }
.trajectory-chart { margin-top: 8px; }
.trajectory-chart svg { display: block; width: 100%; height: auto; }

/* ---------- what a choice touches ---------- */
.option-touches { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 9px; }
.option-touches-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 600;
  margin-right: 1px;

  font-weight: 600;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--surface-alt);
  color: var(--text-muted);
  border: 1px solid var(--border);

.chip-cash { border-color: var(--accent); color: var(--accent); }
.chip-time { border-color: var(--focus); color: var(--focus); }
.chip-quality, .chip-reputation { border-color: var(--accent-2); color: var(--accent-2); }

.workout { border-color: var(--accent-2); border-width: 2px; }
.workout-intro { font-size: 0.88rem; color: var(--text-muted); margin: 0 0 10px; }
.workout-lines { display: flex; flex-direction: column; }
.workout-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.92rem;
}
.workout-label { color: var(--text-muted); }
.workout-value { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.workout-row.total {
  border-bottom: 0;
  border-top: 2px solid var(--border);
  margin-top: 4px;
  padding-top: 10px;
}
.workout-row.total .workout-label { color: var(--text); font-weight: 700; }
.workout-row.total .workout-value { font-weight: 800; font-size: 1.15rem; }
.workout-ready { font-size: 0.9rem; font-weight: 600; margin: 12px 0; }

/* ---------- prediction bands ---------- */
.predict-choice-label { display: block; font-weight: 650; }
.predict-choice-band {
  display: block;
  margin-top: 3px;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.predict-choice.selected .predict-choice-band { color: inherit; opacity: 0.85; }

/* ---------- before and after ---------- */
.compare {
  margin: 12px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
}
.compare-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 5px 0;
  font-size: 0.87rem;
}
.compare-row.head {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  font-weight: 700;
  border-bottom: 1px solid var(--border);
}
.compare-label { color: var(--text-muted); }
.compare-value {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
  min-width: 82px;
}
/* The line that moved is the whole point of showing both columns. */
.compare-row.changed { background: var(--surface-alt); border-radius: 6px; }
.compare-row.changed .compare-label { color: var(--text); font-weight: 650; }
.compare-row.changed .compare-value:last-child { font-weight: 800; }
.compare-row.total {
  border-top: 2px solid var(--border);
  margin-top: 6px;
  padding-top: 8px;
  font-size: 0.96rem;
}
.compare-row.total .compare-label { color: var(--text); font-weight: 700; }
.compare-row.total .compare-value { font-weight: 800; }

.reveal-said { font-size: 0.9rem; margin: 4px 0 10px; }

.second-look {
  margin: 10px 0;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--focus);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.second-look-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 4px;
}
.second-look p { margin: 0; font-size: 0.92rem; line-height: 1.5; }

/* ---------- time passing ---------- */
.weeks-passed {
  margin-bottom: 10px;
  padding: 7px 12px;
  background: var(--surface-alt);
  border-radius: 99px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
  letter-spacing: 0.02em;
}

/* ---------- a consequence arriving from an earlier week ---------- */
.consequence {
  border-left: 4px solid var(--focus);
  background: var(--surface-alt);
}
.consequence .card-title { color: var(--focus); }
.consequence-text { margin: 0; font-size: 0.95rem; line-height: 1.5; }

/* ---------- finished ---------- */
.finished { border-color: var(--accent-2); border-width: 2px; }
.finished .card-title { color: var(--accent-2); font-size: 1.1rem; }
.finished-body { margin: 0; font-size: 0.95rem; line-height: 1.55; }

/* ---------- animation ---------- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.fade-in { animation: fadeIn 240ms ease both; }
.slide-up { animation: slideUp 300ms cubic-bezier(0.22, 1, 0.36, 1) both; }

/* Never let motion gate reading or interaction. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- wider screens ---------- */
@media (min-width: 480px) {
  .predict-choices { grid-template-columns: repeat(4, 1fr); }
  .end-actions { flex-direction: row; }
  .end-actions .btn { flex: 1; }
}

// The weekly P&L is COMPUTED here, never authored in content. That matters: if a
// scenario author could hand-write the outcome, the numbers would stop being
// consistent and the learner would be memorising a story instead of reasoning about
// a system. Content supplies decisions and their effects on state; the economics
// fall out.
//
// See docs/game-design.md ("Systems modelled").

  cash: 150000,
  price: 500,
  unitCost: 300,
  demand: 200,

  // `demand` towards a scaled version of this rather than accumulating without limit.

  capacity: 180,
  reputation: 50,
  hygiene: 60,
  formality: 0,
  staff: 0,
  ownerHours: 60,
  ownerHoursUsed: 40,

  // Content adjusts THIS for a permanent change to the owner's weekly load; adjusting
  // `ownerHoursUsed` only affects the current week, because advanceWeek recomputes it.
  ownerHoursFixed: 15,

  rent: 20000,
  wagePerStaff: 30000,
  licenceFees: 0,
  spoilRate: 0.5,

  if (delta <= BAND_LOT) return 'up_bit';

  'ownerHoursUsed', 'ownerHours', 'ownerHoursFixed', 'rent', 'licenceFees',

]);

// takes active neglect (see the overload penalty in advanceWeek).

function weeklyPnl(state) {

    unmetDemand: Math.max(0, state.demand - state.capacity),
    revenue,
    variableCost,
    grossProfit: revenue - variableCost,

    rent: state.rent,

    spoilage,

  // drain the real playthrough's scheduled consequences.

      else next.flags[key] = raw;

    const value = Number(raw);

      continue;

      continue;

  // mood swing — so it moves the baseline the weekly reputation drift pulls towards.
  // Without this, winning the hotel contract would be undone over the following weeks.
  //
  // The floor matters: several authored penalties in a row would otherwise take the
  // baseline to nothing and the business could never recover, which is not how a stall
  // by a bus stand behaves however badly it is run. Being reduced to passing trade is
  // the lesson; being erased is just an unwinnable game.

 * Schedule a consequence to arrive some weeks from now.
 *

 * decision caused it. A consequence the learner cannot trace back to a choice teaches
 * nothing except that the world is arbitrary.
 */

      dueWeek: state.week + (item.inWeeks || 1),
      effects: item.effects || {},
      cause: item.cause || cause,
      causeWeek: state.week,
    });

 *
 * Reputation and hygiene drift because neglect has a cost — a business does not hold
 * still. Demand follows reputation with a lag, so the consequence of a hygiene
 * failure arrives after the decision that caused it, not alongside it
 * (docs/game-design.md: consequences arrive on a realistic lag).
 *

 */

  next.week = state.week + 1;

  // 1. Fire consequences that have come due, before drift, so their effects then drift
  //    like anything else.
  const fired = [];
  const stillPending = [];
  for (const item of next.pending) {
    if (item.dueWeek <= next.week) fired.push(item);
    else stillPending.push(item);

  next.pending = stillPending;
  for (const item of fired) next = applyEffects(next, item.effects);

/* ---- record ---- */
const NS_record = (function () {

// The behavioural record.
//
// Governed by docs/assessment.md. Three layers, and the separation is deliberate:
//
//   1. Observations  — raw, factual, durable. Never interpreted at write time.
//   2. Indicators    — derived patterns, each of which MUST cite its evidence.
//   3. Profile       — human-readable, hedged, anchored to observations.
//
// Two rules that are easy to break and expensive to fix:
//
//   * Scoring is never baked into storage. Observations outlive every change to how
//     we interpret them, so interpretation happens at read time only.
//   * No composite score. No rank. No percentile. A single number invites the
//     mechanical filtering that makes business-plan scores harmful, and hides which
//     behaviours produced it.

const SCHEMA_VERSION = 1;

function createRecord(scenarioId) {
  return {
    schemaVersion: SCHEMA_VERSION,
    scenarioId,
    startedAt: new Date().toISOString(),
    observations: [],
  };
}

/** Layer 1. Append-only. Called at every decision point. */
function observe(record, entry) {
  record.observations.push({
    at: new Date().toISOString(),
    ...entry,
  });
  return record;
}

function observeInfoSought(record, turnId, infoId, label) {
  return observe(record, { kind: 'info-sought', turnId, infoId, label });
}

function observePrediction(record, turnId, predicted, actual, correct, metric) {
  return observe(record, { kind: 'prediction', turnId, predicted, actual, correct, metric });
}

function observeDecision(record, turnId, concept, optionId, optionLabel, infoSoughtCount, pnlBefore, pnlAfter) {
  return observe(record, {
    kind: 'decision',
    turnId,
    concept,
    optionId,
    optionLabel,
    infoSoughtCount,
    profitBefore: pnlBefore,
    profitAfter: pnlAfter,
  });
}

function observeConstraint(record, turnId, text) {
  return observe(record, { kind: 'constraint-named', turnId, text });
}

// ---------------------------------------------------------------------------
// Layer 2 — indicators. Each returns { id, label, summary, evidence: [] }.
// An indicator that cannot point at its evidence is an opinion and does not ship.
// ---------------------------------------------------------------------------

function predictions(record) {
  return record.observations.filter((o) => o.kind === 'prediction');
}

function decisions(record) {
  return record.observations.filter((o) => o.kind === 'decision');
}

/**
 * Calibration — does the learner correctly anticipate the consequence of their own
 * choice? The strongest indicator available, because becoming well-calibrated about a
 * system requires understanding it. Hard to fake by performing for an assessor.
 */
function calibration(record) {
  const preds = predictions(record);
  const correct = preds.filter((p) => p.correct);

  // Split early vs late to see whether calibration IMPROVED — learning, rather than
  // arriving already knowing.
  const half = Math.floor(preds.length / 2);
  const early = preds.slice(0, half);
  const late = preds.slice(half);
  const rate = (arr) => (arr.length ? arr.filter((p) => p.correct).length / arr.length : null);

  const earlyRate = rate(early);
  const lateRate = rate(late);
  let trend = null;
  if (earlyRate !== null && lateRate !== null && preds.length >= 6) {
    if (lateRate - earlyRate > 0.15) trend = 'improved';
    else if (earlyRate - lateRate > 0.15) trend = 'declined';
    else trend = 'steady';
  }

  return {
    id: 'calibration',
    label: 'Anticipating consequences',
    total: preds.length,
    correct: correct.length,
    earlyRate,
    lateRate,
    trend,
    evidence: preds.map((p) => ({
      turnId: p.turnId,
      predicted: p.predicted,
      actual: p.actual,
      correct: p.correct,
    })),
  };
}

/** Does the learner buy information before committing, or decide blind? */
function informationSeeking(record) {
  const decs = decisions(record);
  const withInfo = decs.filter((d) => (d.infoSoughtCount || 0) > 0);
  return {
    id: 'information-seeking',
    label: 'Checking before deciding',
    total: decs.length,
    withInfo: withInfo.length,
    evidence: decs.map((d) => ({
      turnId: d.turnId,
      concept: d.concept,
      infoSought: d.infoSoughtCount || 0,
      choice: d.optionLabel,
    })),
  };
}

/** What did they do immediately after a decision that lost money? */
function recovery(record) {
  const decs = decisions(record);
  const events = [];
  for (let i = 0; i < decs.length - 1; i += 1) {
    const d = decs[i];
    if (typeof d.profitAfter === 'number' && typeof d.profitBefore === 'number' && d.profitAfter < d.profitBefore) {
      events.push({
        setbackTurn: d.turnId,
        drop: d.profitBefore - d.profitAfter,
        nextChoice: decs[i + 1].optionLabel,
        nextTurn: decs[i + 1].turnId,
      });
    }
  }
  return {
    id: 'recovery',
    label: 'After a setback',
    total: events.length,
    evidence: events,
  };
}

/** Breadth — which concepts did they actually engage with? */
function conceptCoverage(record) {
  const seen = new Map();
  for (const d of decisions(record)) {
    if (!d.concept) continue;
    seen.set(d.concept, (seen.get(d.concept) || 0) + 1);
  }
  return {
    id: 'concept-coverage',
    label: 'Concepts encountered',
    total: seen.size,
    evidence: [...seen.entries()].map(([concept, times]) => ({ concept, times })),
  };
}

function allIndicators(record) {
  return [
    calibration(record),
    informationSeeking(record),
    recovery(record),
    conceptCoverage(record),
  ];
}

// ---------------------------------------------------------------------------
// Layer 3 — profile. Human-readable, hedged, observation-anchored.
// ---------------------------------------------------------------------------

/**
 * Statements are written so that deleting "in the simulation" would make them false.
 * That is the test from docs/assessment.md for whether we are overclaiming.
 *
 * Each statement carries BOTH a canonical English `text` and a `key`/`params` pair.
 * The interface renders the key in the learner's language; the downloaded artefact
 * keeps the English, because the record is read by a programme that may not share the
 * learner's language and because a translated record should not be the only copy of
 * what was observed. The two must say the same thing — scripts/validate-i18n.mjs
 * checks the keys exist in both languages, not that the meanings match, so edit them
 * together.
 */
function buildProfile(record) {
  const cal = calibration(record);
  const info = informationSeeking(record);
  const rec = recovery(record);
  const cov = conceptCoverage(record);

  const statements = [];

  if (cal.total > 0) {
    const trendKey = cal.trend ? `profile.detail.${cal.trend}` : null;
    statements.push({
      indicator: cal.label,
      indicatorKey: 'indicator.calibration',
      key: 'profile.stmt.calibration',
      params: { correct: cal.correct, total: cal.total },
      text: `Correctly anticipated the effect of their own decision in ${cal.correct} of ${cal.total} predictions.`,
      detailKey: trendKey,
      detail: cal.trend === 'improved'
        ? 'Accuracy was higher in the second half of the playthrough than the first.'
        : cal.trend === 'declined'
          ? 'Accuracy was lower in the second half than the first.'
          : cal.trend === 'steady'
            ? 'Accuracy was broadly steady across the playthrough.'
            : null,
    });
  }

  if (info.total > 0) {
    statements.push({
      indicator: info.label,
      indicatorKey: 'indicator.information',
      key: 'profile.stmt.information',
      params: { withInfo: info.withInfo, total: info.total },
      text: `Sought information before deciding in ${info.withInfo} of ${info.total} decisions.`,
      detailKey: null,
      detail: null,
    });
  }

  if (rec.total > 0) {
    statements.push({
      indicator: rec.label,
      indicatorKey: 'indicator.recovery',
      countKey: 'profile.stmt.recovery',
      count: rec.total,
      text: `Faced ${rec.total} decision${rec.total === 1 ? '' : 's'} that reduced weekly profit, and continued afterwards.`,
      detailKey: 'profile.detail.recovery',
      detail: 'What they chose next is listed in the evidence below.',
    });
  }

  statements.push({
    indicator: cov.label,
    indicatorKey: 'indicator.coverage',
    countKey: 'profile.stmt.coverage',
    count: cov.total,
    text: `Made decisions across ${cov.total} business concept${cov.total === 1 ? '' : 's'}.`,
    detailKey: null,
    detail: null,
  });

  return {
    scenarioId: record.scenarioId,
    startedAt: record.startedAt,
    generatedAt: new Date().toISOString(),
    statements,
    indicators: allIndicators(record),

    // Carried INSIDE the artefact, not as a footnote. This will be read out of
    // context, so the caveat has to travel with it. docs/assessment.md, item 3.
    limitationKeys: [
      'profile.limit.1', 'profile.limit.2', 'profile.limit.3', 'profile.limit.4',
    ],
    limitations: [
      'This describes what happened inside a simulation. It is not a measure of how this person runs a real business.',
      'It has not been validated against real business outcomes. No such study exists yet.',
      'It should not be used as an automatic cut-off, or to rank one person against another.',
      'Figures in the simulation are illustrative placeholders, not researched local data.',
    ],
  };
}

/**
 * Deliberately NOT a score.
 *
 * Prediction accuracy is reported as a proportion because it is the one signal the
 * project owner wants to gate a funnel on. Presenting it as a bare percentage would
 * make it trivially sortable, which is the failure mode assessment.md exists to
 * prevent — so callers get the raw counts and must show the evidence alongside.
 */
function predictionTally(record) {
  const cal = calibration(record);
  return { correct: cal.correct, total: cal.total, trend: cal.trend };
}

  return { createRecord, observe, observeInfoSought, observePrediction, observeDecision, observeConstraint, calibration, informationSeeking, recovery, conceptCoverage, allIndicators, buildProfile, predictionTally };
})();

/* ---- storage ---- */
const NS_storage = (function () {

// Local-first persistence.
//
// The learner holds their own record (SECURITY.md). Nothing is transmitted anywhere —
// there is no network code in this application at all, by design.
//
// Save continuously and assume the app is killed mid-decision, because on the target
// devices it will be (docs/localization.md).

const KEY = 'business-simulator:v1';

function save(session) {
  try {
    localStorage.setItem(KEY, JSON.stringify(session));
    return true;
  } catch (err) {
    // Private browsing or a full quota. Play continues in memory rather than dying.
    console.warn('Could not save progress:', err);
    return false;
  }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return parsed;
  } catch (err) {
    console.warn('Could not load saved progress:', err);
    return null;
  }
}

function clear() {
  try {
    localStorage.removeItem(KEY);
    return true;
  } catch {
    return false;
  }
}

function hasSave() {
  return load() !== null;
}

/** Export the learner's own record so they can keep or share it deliberately. */

}

const NS_scene = (function () {

// scene.js — generated SVG illustrations and small animation helpers.
// No dependencies. No network. No innerHTML with user data.
// All drawing is document.createElementNS so nothing here needs a build step.

const NS = 'http://www.w3.org/2000/svg';
const REDUCE = typeof matchMedia === 'function'
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : { matches: false };

function svg(name, attrs) {
  const node = document.createElementNS(NS, name);
  if (attrs) {
    for (const key in attrs) node.setAttribute(key, attrs[key]);
  }

}

}

function clear(el) {

const VB_H = 160;

}

  }));
  root.appendChild(svg('rect', {
    x: 0, y: GROUND_Y, width: VB_W, height: VB_H - GROUND_Y,
    class: night ? 'scene-ground scene-ground-night' : 'scene-ground',
  }));

      class: 'scene-figure-apron',

// A stall / kiosk whose footprint grows with capacity.

    x: -w / 2 - 4, y: -h * 0.42, width: w + 8, height: h * 0.42,
    class: 'scene-stall-counter',

// ---- scene builders --------------------------------------------------

function deriveCustomerCount(state) {
  const demand = state.demand == null ? 100 : state.demand;
  return clamp(Math.round(demand / 40), 0, 7);
}

function deriveScale(state) {
  const capacity = state.capacity == null ? 180 : state.capacity;
  return clamp(capacity / 180, 0.65, 1.7);
}

function buildStallScene(root, state, mode) {
  const day = mode !== 'night';
  skyGround(root, false);
  cloud(root, 60, 26, 1);
  cloud(root, 230, 20, 0.7);
  sun(root, 40, 26, 15);

  const scale = deriveScale(state);
  let count = deriveCustomerCount(state);
  if (mode === 'empty') count = Math.min(count, 1);
  if (mode === 'busy') count = Math.max(count, 4);

  const { h } = stall(root, VB_W / 2, GROUND_Y, scale, { pot: true, closed: mode === 'empty' && (state.reputation ?? 50) < 20 });
  customerRow(root, count, GROUND_Y, 220);
  staffRow(root, state.staff || 0, GROUND_Y, VB_W / 2 - 40);
  grimeOrSparkle(root, state.hygiene == null ? 60 : state.hygiene, VB_W / 2, GROUND_Y - h - 20);

  const reputation = state.reputation == null ? 50 : state.reputation;
  if (reputation < 35) dimOverlay(root, (35 - reputation) / 60);
}

function buildKitchenScene(root, state) {

  root.appendChild(svg('rect', {
    x: VB_W / 2 - 22 * scale, y: GROUND_Y - 20, width: 44 * scale, height: 20, class: 'scene-stove',
  }));
  root.appendChild(svg('ellipse', {
    cx: VB_W / 2, cy: GROUND_Y - 22, rx: 20 * scale, ry: 8, class: 'scene-pot',

function buildMarketScene(root, state) {
  skyGround(root, false);

}

function buildOfficeScene(root, state) {
  skyGround(root, false);
  root.appendChild(svg('rect', { x: 0, y: 10, width: VB_W, height: GROUND_Y - 10, class: 'scene-office-wall' }));
  root.appendChild(svg('rect', { x: 30, y: GROUND_Y - 46, width: 200, height: 30, class: 'scene-desk' }));
  root.appendChild(svg('rect', { x: 30, y: GROUND_Y - 16, width: 200, height: 16, class: 'scene-desk-front' }));

  if (neat) {
    for (let i = 0; i < 3; i++) {

}

function buildTruckScene(root, state) {
  skyGround(root, false);
  sun(root, 40, 24, 14);
  root.appendChild(svg('rect', { x: 0, y: GROUND_Y - 2, width: VB_W, height: 4, class: 'scene-road' }));
  const dashes = 6;
  for (let i = 0; i < dashes; i++) {
    root.appendChild(svg('rect', {
      x: i * 56, y: GROUND_Y - 1, width: 24, height: 2, class: 'scene-road-dash',
    }));
  }
  const scale = deriveScale(state);
  const g = svg('g', { class: 'scene-truck', transform: `translate(120 ${GROUND_Y - 4})` });
  g.appendChild(svg('rect', { x: 0, y: -30 * scale, width: 70 * scale, height: 30 * scale, class: 'scene-truck-bed' }));
  g.appendChild(svg('rect', { x: 70 * scale, y: -20 * scale, width: 26 * scale, height: 20 * scale, class: 'scene-truck-cab' }));
  g.appendChild(svg('circle', { cx: 14 * scale, cy: 0, r: 6 * scale, class: 'scene-truck-wheel' }));
  g.appendChild(svg('circle', { cx: 84 * scale, cy: 0, r: 6 * scale, class: 'scene-truck-wheel' }));

  const capacity = state.capacity == null ? 180 : state.capacity;
  const demand = state.demand == null ? 100 : state.demand;
  const surplus = capacity > demand;
  const boxCount = clamp(Math.round(capacity / 40), 1, 6);
  for (let i = 0; i < boxCount; i++) {
    g.appendChild(svg('rect', {
      x: 6 * scale + (i % 3) * 20 * scale,
      y: -30 * scale - Math.floor(i / 3) * 16 * scale,
      width: 16 * scale, height: 14 * scale,
      class: surplus ? 'scene-box scene-box-surplus' : 'scene-box',
    }));
  }
  root.appendChild(g);
  figure(root, 220, GROUND_Y, { scale: 0.9, staff: (state.staff || 0) > 0 });
}

function buildInspectionScene(root, state) {
  skyGround(root, false);
  const scale = deriveScale(state);
  stall(root, VB_W / 2 - 40, GROUND_Y, scale, {});
  const hygiene = state.hygiene == null ? 60 : state.hygiene;
  grimeOrSparkle(root, hygiene, VB_W / 2 - 40, GROUND_Y - 60);

  // inspector figure with a clipboard
  const g = svg('g', { class: 'scene-figure scene-inspector', transform: `translate(220 ${GROUND_Y})` });
  g.appendChild(svg('rect', { x: -5.5, y: -20, width: 11, height: 20, rx: 5, class: 'scene-figure-body' }));
  g.appendChild(svg('circle', { cx: 0, cy: -25, r: 5, class: 'scene-figure-head' }));
  g.appendChild(svg('rect', { x: 6, y: -18, width: 9, height: 12, class: 'scene-clipboard' }));
  root.appendChild(g);

  const pass = hygiene >= 50;
  const badgeX = 262, badgeY = GROUND_Y - 40;
  root.appendChild(svg('circle', {
    cx: badgeX, cy: badgeY, r: 12,
