/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}

h1 { font-size: 1.05rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0 0 0.7em; }
ul { margin: 0; padding-left: 1.1em; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 12px 40px;
}

/* ---------- shell ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 2px 8px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
}

.banner-unverified {
  margin: 0 0 10px;
  padding: 9px 12px;
  background: var(--surface-alt);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 0.83rem;
  color: var(--text-muted);
}

.progress {
  height: 5px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-bar {
  height: 100%;
  background: var(--accent-2);
  border-radius: 99px;
  transition: width 400ms ease;
}

.scene {
  margin-bottom: 12px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface-alt);
  line-height: 0;
}
.scene svg { display: block; width: 100%; height: auto; }

.foot {
  margin-top: 26px;
  text-align: center;
  font-size: 0.76rem;
  color: var(--text-muted);
}
.foot p { margin: 0; }

/* ---------- stats ---------- */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 6px;
  text-align: center;
  min-width: 0;
}
.stat-label {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-value {
  font-size: 0.98rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  overflow-wrap: anywhere;
}
.negative { color: var(--danger); }

/* ---------- P&L ---------- */
.pnl-toggle { display: block; margin: 0 0 8px auto; }

.pnl {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 0.9rem;
}
.pnl-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 3px 0;
}
.pnl-row.total {
  border-top: 2px solid var(--border);
  margin-top: 6px;
  padding-top: 7px;
  font-weight: 700;
  font-size: 1rem;
}
.pnl-label { color: var(--text-muted); }
.pnl-row.total .pnl-label { color: var(--text); }
.pnl-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pnl-note {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-size: 0.83rem;
  color: var(--text-muted);
}

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px var(--shadow);
}
.card-title {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 9px;
}
.concept-tag {
  display: inline-block;
  background: var(--surface-alt);
  color: var(--text-muted);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 0.7rem;
  letter-spacing: 0.03em;
}
.situation {
  font-size: 1.02rem;
  line-height: 1.55;
  margin: 0;
}

/* ---------- information step ---------- */
.info-list { display: flex; flex-direction: column; gap: 8px; }

.info-item {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--tap);
  padding: 11px 13px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 0.93rem;
  cursor: pointer;
}
.info-item:active { transform: scale(0.98); }
.info-label { display: block; font-weight: 600; }
.info-cost {
  display: inline-block;
  margin-top: 3px;
  font-size: 0.78rem;
  color: var(--text-muted);
}
.info-item.used {
  background: var(--ok-bg);
  border-color: var(--accent-2);
  cursor: default;
  opacity: 1;
}
.info-item.used .info-label { font-weight: 600; }
.info-reveals {
  display: block;
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.45;
}

/* ---------- decision step ---------- */
.options { display: flex; flex-direction: column; gap: 9px; }

.option {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--tap);
  padding: 13px 14px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease;
}
.option:hover { border-color: var(--accent); }
.option:active { transform: scale(0.98); }
/* Buttons carry the whole interaction, so a press has to feel like one on a cheap
   touchscreen where there is no cursor and no hover. */
.option, .info-item, .predict-choice, .btn, .lang-btn {
  transition: transform 90ms ease, border-color 140ms ease, background 140ms ease, opacity 140ms ease;
}
.option:disabled:not(.selected) { opacity: 0.45; }
.option.selected {
  border-color: var(--accent);
  background: var(--surface-alt);
}
.option-label { display: block; font-weight: 650; font-size: 1rem; }
.option-detail {
  display: block;
  margin-top: 4px;
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* ---------- free-input decisions ---------- */
.number-decision,
.allocation-decision,
.diagnose { border-width: 2px; border-color: var(--accent); }
.number-decision .predict-question,
.allocation-decision .predict-question,
.diagnose .predict-question { margin-top: 4px; }
.number-hint {
  margin: 0 0 12px;
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}
.stepper {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
  margin: 8px 0 12px;
}
.stepper-controls {
  display: grid;
  grid-template-columns: repeat(4, minmax(48px, 1fr));
  gap: 6px;
  min-width: 0;
}
.stepper-button {
  min-width: var(--tap);
  min-height: var(--tap);
  padding: 7px 5px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font: inherit;
  font-size: 1.15rem;
  font-weight: 750;
  line-height: 1;
  cursor: pointer;
}
.stepper-button:hover { border-color: var(--accent); }
.stepper-button:active { transform: scale(0.95); }
.stepper-value-wrap {
  min-width: 0;
  padding: 8px 12px;
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  background: var(--surface);
  text-align: center;
}
.stepper-label {
  color: var(--text-muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.stepper-value {
  overflow-wrap: anywhere;
  color: var(--text);
  font-size: clamp(1.45rem, 7vw, 2rem);
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  line-height: 1.2;
}
.number-feedback {
  margin: 4px 0 12px;
  padding: 9px 12px;
  border-left: 4px solid var(--accent-2);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--surface-alt);
}
.number-feedback-line {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.45;
}
.number-feedback-line + .number-feedback-line { margin-top: 5px; }
.number-feedback-line.keep { font-weight: 750; }

/* ---------- allocation ---------- */
.allocation-amount,
.allocation-remaining,
.allocation-cash {
  margin: 0 0 8px;
  font-size: 0.9rem;
  line-height: 1.45;
}
.allocation-remaining {
  padding: 8px 10px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-weight: 650;
}
.allocation-buckets { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
.allocation-bucket {
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
}
.allocation-bucket-label {
  margin-bottom: 7px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.allocation-stepper { margin: 0; }
.allocation-stepper .stepper-value-wrap { background: var(--surface); }
.allocation-cash { color: var(--text-muted); }

/* ---------- diagnosis ---------- */
.diagnose-options { display: flex; flex-direction: column; gap: 8px; }
.diagnose-option {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.diagnose-option:hover { border-color: var(--accent); }
.diagnose-option:active { transform: scale(0.98); }
.diagnose-option.selected { border-color: var(--accent); background: var(--surface); }
.diagnose-label { overflow-wrap: anywhere; font-weight: 650; }
.diagnose-value { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }

/* ---------- goal context ---------- */
.goal-panel {
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--focus);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--surface-alt);
}
.goal-title {
  margin-bottom: 3px;
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 800;
}
.goal-description { margin: 0 0 8px; color: var(--text-muted); font-size: 0.84rem; line-height: 1.45; }
.goal-conditions { display: flex; flex-direction: column; gap: 8px; }
.goal-condition {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: 8px;
  align-items: baseline;
  padding-top: 7px;
  border-top: 1px solid var(--border);
}
.goal-status { display: flex; align-items: center; gap: 4px; grid-column: 1 / -1; }
.goal-status-mark {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border: 2px solid currentColor;
  border-radius: 50%;
  font-size: 0.78rem;
  font-weight: 800;
}
.goal-condition[data-met="true"] .goal-status { color: var(--accent-2); }
.goal-condition[data-met="false"] .goal-status { color: var(--text-muted); }
.goal-status-word { font-size: 0.75rem; font-weight: 750; text-transform: uppercase; letter-spacing: 0.04em; }
.goal-condition-label { min-width: 0; font-size: 0.88rem; font-weight: 650; overflow-wrap: anywhere; }
.goal-condition-value { min-width: 0; color: var(--text-muted); font-size: 0.82rem; text-align: right; overflow-wrap: anywhere; }

/* ---------- prediction step ---------- */
.predict { border-color: var(--accent); border-width: 2px; }
.predict-question {
  font-weight: 650;
  font-size: 1.02rem;
  margin: 10px 0 12px;
}
.predict-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.predict-choice {
  min-height: var(--tap);
  padding: 11px 8px;
  background: var(--surface-alt);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 140ms ease;
}
.predict-choice:hover:not(:disabled) { border-color: var(--accent); }
.predict-choice:active:not(:disabled) { transform: scale(0.97); }
.predict-choice.selected {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}
.predict-choice:disabled:not(.selected) { opacity: 0.45; cursor: default; }

/* ---------- reveal step ---------- */
.reveal {
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 14px;
  background: var(--surface);
  box-shadow: 0 1px 3px var(--shadow);
}
.reveal.correct { border-color: var(--accent-2); background: var(--ok-bg); }
.reveal.near { border-color: var(--accent); background: var(--surface-alt); }
.reveal.wrong { border-color: var(--danger); background: var(--danger-bg); }

.reveal-verdict {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}
/* Glyph carries the meaning, not colour alone. */
.reveal-mark {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 1.05rem;
  font-weight: 700;
  background: var(--surface);
  border: 2px solid currentColor;
}
.reveal.correct .reveal-mark { color: var(--accent-2); }
.reveal.near .reveal-mark { color: var(--accent); }
.reveal.wrong .reveal-mark { color: var(--danger); }
.reveal-text { font-weight: 700; font-size: 1.02rem; }

.reveal-delta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 9px 11px;
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 11px;
}
.reveal-delta-label { font-size: 0.83rem; color: var(--text-muted); }
.reveal-delta-value {
  font-size: 1.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.outcome { font-size: 0.97rem; line-height: 1.55; }
.lesson {
  font-size: 0.94rem;
  line-height: 1.5;
  padding: 10px 12px;
  background: var(--surface);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 12px;
}

/* ---------- end profile ---------- */
.profile-head {
  text-align: center;
  padding: 14px 10px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.profile-tally {
  font-size: 2rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  color: var(--accent-2);
  line-height: 1.1;
}
.profile-tally-label {
  font-size: 0.84rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.profile-trend {
  margin-top: 8px;
  font-size: 0.9rem;
  font-weight: 600;
}
.profile-chart { margin-top: 14px; }
.profile-chart svg { display: block; width: 100%; height: auto; }

.indicator {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.indicator:last-of-type { border-bottom: 0; }
.indicator-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 3px;
}
.indicator-text { font-size: 0.97rem; line-height: 1.5; }
.indicator-evidence {
  margin-top: 4px;
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.45;
}

.limitations { background: var(--surface-alt); }
.limitations-list {
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text-muted);
}
.limitations-list li { margin-bottom: 6px; }

.end-actions {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 6px;
}

/* ---------- buttons ---------- */
.btn {
  min-height: var(--tap);
  padding: 12px 18px;
  border-radius: var(--radius);
  border: 2px solid transparent;
  font: inherit;
  font-weight: 650;
  font-size: 0.97rem;
  cursor: pointer;
  transition: filter 140ms ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; }

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); }

.btn-small {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.82rem;
  font-weight: 600;
}

/* ---------- language toggle ---------- */
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.lang-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 99px;
  overflow: hidden;
  background: var(--surface);
}
.lang-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 7px 11px;
  min-height: 34px;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}
.lang-btn.selected { background: var(--accent); color: var(--accent-ink); }
.lang-btn:not(.selected):hover { color: var(--text); }

.banner-draft { border-left-color: var(--accent-2); }

/* ---------- owner time ---------- */
.time-bar {
  margin: 8px 0 12px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.time-bar.over { border-color: var(--danger); background: var(--danger-bg); }
.time-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}
.time-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.time-value { font-size: 0.84rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.time-bar.over .time-value { color: var(--danger); }
.time-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.time-fill {
  height: 100%;
  width: 0;
  background: var(--accent-2);
  border-radius: 99px;
  transition: width 500ms cubic-bezier(0.22, 1, 0.36, 1);
}
.time-bar.over .time-fill { background: var(--danger); }

/* ---------- the ledger ----------
   Magnitude has to be visible, not just readable — docs/localization.md, "Numbers". */
.ledger {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.ledger-group-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin: 8px 0 4px;
}
.ledger-group-title:first-child { margin-top: 0; }

.ledger-row {
  display: grid;
  grid-template-columns: 1fr 64px auto;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 0.9rem;
}
.ledger-label { color: var(--text-muted); }
.ledger-bar {
  height: 7px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.ledger-fill {
  height: 100%;
  width: 0;
  border-radius: 99px;
  transition: width 520ms cubic-bezier(0.22, 1, 0.36, 1);
}
.ledger-fill.in { background: var(--accent-2); }
.ledger-fill.out { background: var(--accent); }
.ledger-value { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }

.ledger-row.total {
  border-top: 2px solid var(--border);
  margin-top: 8px;
  padding-top: 9px;
  font-size: 1rem;
}
.ledger-row.total .ledger-label { color: var(--text); font-weight: 700; }
.ledger-row.total .ledger-value { font-weight: 800; }

.pnl-note.warn { color: var(--danger); }

/* ---------- trajectory ---------- */
.trajectory {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--surface-alt);
  border-radius: var(--radius);
}
.trajectory-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 4px;
}
.trajectory-cash { font-size: 0.92rem; line-height: 1.45; }
.trajectory-note { font-size: 0.83rem; margin-top: 3px; font-weight: 600; }
.trajectory-note.falling { color: var(--danger); }
.trajectory-note.rising { color: var(--accent-2); }
.trajectory-note.flat { color: var(--text-muted); }
.trajectory-chart { margin-top: 8px; }
.trajectory-chart svg { display: block; width: 100%; height: auto; }

/* ---------- what a choice touches ---------- */
.option-touches { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 9px; }
.option-touches-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 600;
  margin-right: 1px;
}
.chip {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--surface-alt);
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.chip-cash { border-color: var(--accent); color: var(--accent); }
.chip-time { border-color: var(--focus); color: var(--focus); }
.chip-quality, .chip-reputation { border-color: var(--accent-2); color: var(--accent-2); }

/* ---------- work it out ---------- */
.workout { border-color: var(--accent-2); border-width: 2px; }
.workout-intro { font-size: 0.88rem; color: var(--text-muted); margin: 0 0 10px; }
.workout-lines { display: flex; flex-direction: column; }
.workout-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.92rem;
}
.workout-label { color: var(--text-muted); }
.workout-value { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.workout-row.total {
  border-bottom: 0;
  border-top: 2px solid var(--border);
  margin-top: 4px;
  padding-top: 10px;
}
.workout-row.total .workout-label { color: var(--text); font-weight: 700; }
.workout-row.total .workout-value { font-weight: 800; font-size: 1.15rem; }
.workout-ready { font-size: 0.9rem; font-weight: 600; margin: 12px 0; }

/* ---------- prediction bands ---------- */
.predict-choice-label { display: block; font-weight: 650; }
.predict-choice-band {
  display: block;
  margin-top: 3px;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.predict-choice.selected .predict-choice-band { color: inherit; opacity: 0.85; }

/* ---------- before and after ---------- */
.compare {
  margin: 12px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
}
.compare-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 5px 0;
  font-size: 0.87rem;
}
.compare-row.head {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  font-weight: 700;
  border-bottom: 1px solid var(--border);
}
.compare-label { color: var(--text-muted); }
.compare-value {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
  min-width: 82px;
}
/* The line that moved is the whole point of showing both columns. */
.compare-row.changed { background: var(--surface-alt); border-radius: 6px; }
.compare-row.changed .compare-label { color: var(--text); font-weight: 650; }
.compare-row.changed .compare-value:last-child { font-weight: 800; }
.compare-row.total {
  border-top: 2px solid var(--border);
  margin-top: 6px;
  padding-top: 8px;
  font-size: 0.96rem;
}
.compare-row.total .compare-label { color: var(--text); font-weight: 700; }
.compare-row.total .compare-value { font-weight: 800; }

.reveal-said { font-size: 0.9rem; margin: 4px 0 10px; }

.second-look {
  margin: 10px 0;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--focus);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.second-look-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 4px;
}
.second-look p { margin: 0; font-size: 0.92rem; line-height: 1.5; }

/* ---------- time passing ---------- */
.weeks-passed {
  margin-bottom: 10px;
  padding: 7px 12px;
  background: var(--surface-alt);
  border-radius: 99px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
  letter-spacing: 0.02em;
}

/* ---------- a consequence arriving from an earlier week ---------- */
.consequence {
  border-left: 4px solid var(--focus);
  background: var(--surface-alt);
}
.consequence .card-title { color: var(--focus); }
.consequence-text { margin: 0; font-size: 0.95rem; line-height: 1.5; }

/* ---------- finished ---------- */
.finished { border-color: var(--accent-2); border-width: 2px; }
.finished .card-title { color: var(--accent-2); font-size: 1.1rem; }
.finished-body { margin: 0; font-size: 0.95rem; line-height: 1.55; }

/* ---------- animation ---------- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.fade-in { animation: fadeIn 240ms ease both; }
.slide-up { animation: slideUp 300ms cubic-bezier(0.22, 1, 0.36, 1) both; }

/* Never let motion gate reading or interaction. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- wider screens ---------- */
@media (min-width: 480px) {
  .predict-choices { grid-template-columns: repeat(4, 1fr); }
  .end-actions { flex-direction: row; }
  .end-actions .btn { flex: 1; }
}

/* ---------- SVG scenes ----------
   scene.js assigns classes and expects fills from here, so that scenes
   re-theme with light/dark without regenerating the SVG. */
.scene-svg { display: block; width: 100%; height: auto; background: var(--scene-sky); }

.scene-sun { fill: var(--scene-sun); }
.scene-moon { fill: var(--scene-moon); }
.scene-star { fill: var(--scene-star); }
.scene-cloud { fill: var(--scene-cloud); opacity: 0.9; }

.scene-stall { fill: var(--scene-stall-wall); }
.scene-stall-wall { fill: var(--scene-stall-wall); }
.scene-stall-roof { fill: var(--scene-stall-roof); }
.scene-stall-counter { fill: var(--scene-stall-counter); }
.scene-stall-goods { fill: var(--scene-goods); }
.scene-stall-shutter { fill: var(--scene-stall-counter); opacity: 0.85; }

.scene-figure,

.scene-figure-head { fill: var(--scene-figure-2); }
.scene-figure-apron { fill: var(--scene-awning-b); }
.scene-figure-cap { fill: var(--scene-staff-mark); }

.scene-pot,

.scene-steam { fill: none; stroke: var(--scene-steam); stroke-width: 2.5; stroke-linecap: round; opacity: 0.75; }
.scene-jar { fill: var(--scene-goods); opacity: 0.9; }
.scene-shelf,
.scene-table,
.scene-desk { fill: var(--scene-stall-counter); }
.scene-desk-front { fill: var(--scene-stall-counter); opacity: 0.8; }
.scene-kitchen-wall { fill: var(--scene-stall-wall); }
.scene-office-wall { fill: var(--scene-stall-wall); }

.scene-truck-cab { fill: var(--scene-awning-a); }
.scene-truck-bed,
.scene-truck { fill: var(--scene-stall-counter); }
.scene-truck-wheel { fill: var(--scene-figure); }

.scene-inspector { fill: var(--scene-staff-mark); }
.scene-clipboard { fill: var(--scene-awning-b); }
.scene-badge { fill: var(--scene-staff-mark); }
.scene-badge-check { stroke: var(--scene-awning-b); stroke-width: 2.5; fill: none; stroke-linecap: round; }
.scene-ledger-neat { stroke: var(--scene-line); stroke-width: 1.5; opacity: 0.6; }
.scene-ledger-scatter { stroke: var(--scene-line); stroke-width: 1.5; opacity: 0.3; }

.scene-coin { fill: var(--scene-goods); }
.scene-sparkle { fill: var(--scene-goods); }
.scene-lamp-glow { fill: var(--scene-sun); opacity: 0.22; }
.scene-grime { fill: var(--danger); opacity: 0.28; }
.scene-dim-overlay { fill: #000; }

/* ---------- chart ---------- */
.chart-svg { display: block; width: 100%; height: auto; }
.chart-baseline { stroke: var(--border); stroke-width: 1.5; }
.chart-bar-pos { fill: var(--accent-2); }
/* hatched, so profit and loss differ by texture as well as colour */
.chart-bar-neg { fill: url(#chartNegHatch); stroke: var(--danger); stroke-width: 1; }
.chart-hatch-bg { fill: var(--danger-bg); }
.chart-hatch-line { stroke: var(--danger); stroke-width: 2; }
.chart-cash-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart-cash-dot { fill: var(--accent); }
.chart-tick { fill: var(--text-muted); font-size: 9px; }
.chart-empty { fill: var(--text-muted); font-size: 11px; text-anchor: middle; }

@keyframes pulseOnce {
  0% { transform: scale(1); }
  45% { transform: scale(1.09); }
  100% { transform: scale(1); }
}
.is-pulsing { animation: pulseOnce 520ms ease; }

/* Set via ternaries in scene.js, so easy to miss when scanning for classes. */
.scene-sky { fill: var(--scene-sky); }
.scene-sky-night { fill: var(--scene-sky-night); }
.scene-ground { fill: var(--scene-ground); }
.scene-ground-night { fill: var(--scene-ground-night); }
.scene-stall-awning-a { fill: var(--scene-awning-a); }
.scene-stall-awning-b { fill: var(--scene-awning-b); }
.scene-box { fill: var(--scene-stall-counter); }

.chart-bar { stroke-linejoin: round; }

const NS_format = (function () {

//

// time — AGENTS.md section 6. Never author a currency symbol into content.

  currency = nextCurrency || currency;
}

//

// detail is exactly what AGENTS.md section 6 forbids — it is logged for local review
// instead.

}

// a bare "150k" sitting next to a unit count is ambiguous.

  const n = Math.round(Number(amount) || 0);
  const abs = Math.abs(n);

  if (abs >= 1000) return `${sign}${currency} ${Math.round(abs / 1000)}k`;
  return `${sign}${currency} ${abs}`;
}

// Without the currency — for axes and anywhere the unit is already established.

  const n = Math.round(Number(amount) || 0);
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1000000) return `${sign}${(abs / 1000000).toFixed(1)}M`;
  if (abs >= 1000) return `${sign}${Math.round(abs / 1000)}k`;

// docs/localization.md. Used for prediction accuracy.

// share a word order, and docs/localization.md rule 2 forbids assembling sentences
// from fragments.

  const w = Math.round(Number(whole) || 0);

const NS_engine = (function () {

// Simulation engine.
//
// The weekly P&L is COMPUTED here, never authored in content. That matters: if a
// scenario author could hand-write the outcome, the numbers would stop being
// consistent and the learner would be memorising a story instead of reasoning about
// a system. Content supplies decisions and their effects on state; the economics
// fall out.
//
// See docs/game-design.md ("Systems modelled").

const DEFAULT_STATE = {
  week: 1,
  cash: 150000,
  price: 500,
  unitCost: 300,
  demand: 200,

  // The demand this business would have at an average reputation. Weekly drift pulls
  // `demand` towards a scaled version of this rather than accumulating without limit.
  baseDemand: 200,

  capacity: 180,
  reputation: 50,
  hygiene: 60,
  formality: 0,
  staff: 0,
  ownerHours: 60,
  ownerHoursUsed: 40,

  // Weekly overhead that is not proportional to output — buying, banking, travel.
  // Content adjusts THIS for a permanent change to the owner's weekly load; adjusting
  // `ownerHoursUsed` only affects the current week, because advanceWeek recomputes it.
  ownerHoursFixed: 15,

  rent: 20000,
  wagePerStaff: 30000,
  licenceFees: 0,
  spoilRate: 0.5,
  keepsRecords: false,
  flags: {},

  // Each is { dueWeek, effects, cause, causeWeek }. See scheduleLater().

//
// These used to live only in scripts/validate-scenario.mjs, which meant "up a little"
// had a precise meaning to the validator and a vague one to the learner — the learner
// was graded against a boundary nobody had shown them (Q-014). They are exported now so
// the app can label each choice with the actual amounts.
const BAND_SAME = 1500;
const BAND_LOT = 12000;

function bandFor(delta) {
  if (delta < -BAND_SAME) return 'down';
  if (delta <= BAND_SAME) return 'same';
  if (delta <= BAND_LOT) return 'up_bit';
  return 'up_lot';
}

const ADDITIVE = new Set([
  'cash', 'demand', 'capacity', 'reputation', 'hygiene',
  'ownerHoursUsed', 'ownerHours', 'ownerHoursFixed', 'rent', 'licenceFees',

// Fields where a plain number REPLACES the current value.
const ABSOLUTE = new Set([
  'price', 'unitCost', 'staff', 'formality', 'wagePerStaff', 'spoilRate', 'week',

const CLAMPED = { reputation: [0, 100], hygiene: [0, 100], formality: [0, 3] };

// The standard an owner holds without effort. Weekly slippage stops here; going below
// takes active neglect (see the overload penalty in advanceWeek).
const HYGIENE_FLOOR = 40;

  if (!('openingDemand' in overrides)) state.openingDemand = state.demand;

 * ahead of demand pays for it — that is the lesson, so it must be real.
 */
function weeklyPnl(state) {
  const unitsSold = Math.max(0, Math.min(state.demand, state.capacity));
  const revenue = unitsSold * state.price;
  const variableCost = unitsSold * state.unitCost;

  const unsoldCapacity = Math.max(0, state.capacity - state.demand);
  const spoilage = Math.round(unsoldCapacity * state.unitCost * (state.spoilRate || 0));

  const wages = state.staff * state.wagePerStaff;
  const fixedCost = state.rent + wages + (state.licenceFees || 0);

  const profit = revenue - variableCost - fixedCost - spoilage;
  const margin = revenue > 0 ? (revenue - variableCost) / revenue : 0;

  return {
    unitsSold,
    unmetDemand: Math.max(0, state.demand - state.capacity),
    revenue,
    variableCost,
    grossProfit: revenue - variableCost,
    margin,
    wages,
    rent: state.rent,
    licenceFees: state.licenceFees || 0,
    fixedCost,
    spoilage,
    profit,

 * Apply a content-authored `effects` object to state.

    figure(root, start + i * spacing, groundY, { scale: 0.85, staff: true });
  }
}

// A stall / kiosk whose footprint grows with capacity.
function stall(root, cx, baseY, scale, opts) {
  opts = opts || {};
  const w = 76 * scale;
  const h = 46 * scale;
  const g = svg('g', { class: 'scene-stall', transform: `translate(${cx} ${baseY})` });

  // roof
  g.appendChild(svg('polygon', {
    points: `${-w / 2 - 8},${-h} ${w / 2 + 8},${-h} ${w / 2 - 2},${-h - 16} ${-w / 2 + 2},${-h - 16}`,
    class: 'scene-stall-roof',
  }));
  // awning stripes (shape-based, not colour-only)
  const stripeCount = 5;
  const stripeW = (w + 16) / stripeCount;
  for (let i = 0; i < stripeCount; i++) {
    g.appendChild(svg('rect', {
      x: -w / 2 - 8 + i * stripeW, y: -h - 16, width: stripeW, height: 5,
      class: i % 2 === 0 ? 'scene-stall-awning-a' : 'scene-stall-awning-b',
    }));
  }
  // wall
  g.appendChild(svg('rect', { x: -w / 2, y: -h, width: w, height: h, class: 'scene-stall-wall' }));
  // counter
  g.appendChild(svg('rect', {
    x: -w / 2 - 4, y: -h * 0.42, width: w + 8, height: h * 0.42,
    class: 'scene-stall-counter',
  }));
  // goods on counter — count nods to capacity
  const goods = clamp(Math.round(scale * 4), 1, 7);
  for (let i = 0; i < goods; i++) {
    g.appendChild(svg('circle', {
      cx: -w / 2 + 8 + i * ((w - 16) / Math.max(1, goods - 1 || 1)),
      cy: -h * 0.42 - 3, r: 3, class: 'scene-stall-goods',
    }));
  }
  if (opts.pot) {
    const potX = 0, potY = -h - 4;
    g.appendChild(svg('ellipse', { cx: potX, cy: potY, rx: 9, ry: 5, class: 'scene-pot' }));
    const steam = svg('path', {
      d: `M ${potX - 3} ${potY - 4} q 3 -8 0 -14 q -3 6 0 -12`,
      class: 'scene-steam',
    });
    g.appendChild(steam);
  }
  if (opts.closed) {
    g.appendChild(svg('rect', {
      x: -w / 2, y: -h * 0.42, width: w, height: h * 0.42, class: 'scene-stall-shutter',
    }));
  }
  root.appendChild(g);
  return { w, h };
}

function dimOverlay(root, amount) {
  if (amount <= 0) return;
  root.appendChild(svg('rect', {
    x: 0, y: 0, width: VB_W, height: VB_H,
    class: 'scene-dim-overlay', 'fill-opacity': clamp(amount, 0, 0.55),
  }));
}

function grimeOrSparkle(root, hygiene, cx, cy) {
  if (hygiene < 40) {
    const specks = [[-14, 4], [10, 8], [2, -4], [-6, 10]];
    specks.forEach(([dx, dy]) => {
      root.appendChild(svg('circle', {
        cx: cx + dx, cy: cy + dy, r: 1.6, class: 'scene-grime',
      }));
    });
  } else if (hygiene >= 70) {
    const sparks = [[-16, -2], [14, 2], [0, -10]];
    sparks.forEach(([dx, dy]) => {
      const s = svg('path', {
        d: `M ${cx + dx} ${cy + dy - 4} L ${cx + dx} ${cy + dy + 4} M ${cx + dx - 4} ${cy + dy} L ${cx + dx + 4} ${cy + dy}`,
        class: 'scene-sparkle',
      });
      root.appendChild(s);
    });
  }
}

function formalityBadges(root, level, x, y) {
  const n = clamp(level, 0, 3);
  for (let i = 0; i < 3; i++) {
    const cx = x + i * 16;
    root.appendChild(svg('circle', {
      cx, cy: y, r: 6,
      class: 'scene-badge' + (i < n ? ' scene-badge-earned' : ' scene-badge-empty'),
    }));
    if (i < n) {
      root.appendChild(svg('path', {
        d: `M ${cx - 3} ${y} l 2 2.5 l 4 -5`,
        class: 'scene-badge-check',
      }));
    }
  }
}

function cashStack(root, cx, baseY, cash) {
  const coins = clamp(Math.round((cash || 0) / 60000), 1, 6);
  for (let i = 0; i < coins; i++) {
    root.appendChild(svg('ellipse', {
      cx, cy: baseY - i * 4, rx: 10, ry: 3.4, class: 'scene-coin',
    }));
  }
}

function deriveCustomerCount(state) {
  const demand = state.demand == null ? 100 : state.demand;
  return clamp(Math.round(demand / 40), 0, 7);
}

function deriveScale(state) {
  const capacity = state.capacity == null ? 180 : state.capacity;
  return clamp(capacity / 180, 0.65, 1.7);
}

function buildStallScene(root, state, mode) {
  const day = mode !== 'night';
  skyGround(root, false);
  cloud(root, 60, 26, 1);
  cloud(root, 230, 20, 0.7);
  sun(root, 40, 26, 15);

  const scale = deriveScale(state);
  let count = deriveCustomerCount(state);
  if (mode === 'empty') count = Math.min(count, 1);
  if (mode === 'busy') count = Math.max(count, 4);

  const { h } = stall(root, VB_W / 2, GROUND_Y, scale, { pot: true, closed: mode === 'empty' && (state.reputation ?? 50) < 20 });
  customerRow(root, count, GROUND_Y, 220);
  staffRow(root, state.staff || 0, GROUND_Y, VB_W / 2 - 40);
  grimeOrSparkle(root, state.hygiene == null ? 60 : state.hygiene, VB_W / 2, GROUND_Y - h - 20);

  const reputation = state.reputation == null ? 50 : state.reputation;
  if (reputation < 35) dimOverlay(root, (35 - reputation) / 60);
}

function buildNightScene(root, state) {

  root.appendChild(svg('circle', { cx: 90, cy: GROUND_Y - 40, r: 18, class: 'scene-lamp-glow' }));
