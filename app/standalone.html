ulivyokuwa, kwa sababu mafuta ni ghali. Wateja wawili wametaja kwamba mandazi yana ladha tofauti. Mmoja alisema tumbo lake liliumwa, ingawa hakuwa na uhakika ni yako."},"info":[{"id":"taste-test","label":{"en":"Taste yesterday's batch yourself","sw":"Onja mwenyewe kundi la jana"},"costHours":1,"costCash":0,"reveals":{"en":"There is a bitter edge you had stopped noticing. Your customers noticed before you did.","sw":"Kuna uchungu kidogo uliokuwa umeacha kuutambua. Wateja wako waliutambua kabla yako."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"change-oil","label":{"en":"Change the oil more often and cover the food properly","sw":"Badilisha mafuta mara kwa mara na funika chakula vizuri"},"detail":{"en":"Your costs go up. Nothing else visibly changes this week.","sw":"Gharama zako zinapanda. Hakuna kingine kinachoonekana kubadilika wiki hii."},"effects":{"unitCost":"+25","hygiene":30,"reputation":6},"predictAnswer":"down","outcome":{"en":"Each mandazi costs a little more to make. The taste comes back. Nobody thanks you, because customers rarely notice a problem that stopped happening.","sw":"Kila andazi linagharimu kidogo zaidi kutengeneza. Ladha inarudi. Hakuna anayekushukuru, kwa sababu wateja mara chache wanatambua tatizo lililoacha kutokea."},"lesson":{"en":"Food safety costs money now and pays you back by preventing something that never happens. That makes it very easy to keep putting off.","sw":"Usalama wa chakula unagharimu pesa sasa na unakulipa kwa kuzuia kitu ambacho hakitokei kamwe. Hilo linafanya iwe rahisi sana kuendelea kuahirisha."}},{"id":"keep-oil","label":{"en":"Carry on. Oil is expensive and nobody has proved anything","sw":"Endelea. Mafuta ni ghali na hakuna aliyethibitisha kitu"},"detail":{"en":"Save the money.","sw":"Okoa pesa."},"effects":{"hygiene":-25,"reputation":-8},"predictAnswer":"same","outcome":{"en":"Your costs stay low this week. Word about the taste spreads slowly, the way word always does.","sw":"Gharama zako zinabaki chini wiki hii. Habari kuhusu ladha zinaenea polepole, kama habari zinavyoenea daima."},"lesson":{"en":"A food safety problem does not arrive as a bill. It arrives later, as customers who quietly stop coming.","sw":"Tatizo la usalama wa chakula halifiki kama bili. Linafika baadaye, kama wateja wanaoacha kuja kimyakimya."},"later":[{"inWeeks":4,"effects":{"reputation":-14,"demand":-45},"cause":{"en":"the frying oil you kept reusing","sw":"mafuta ya kukaanga uliyoendelea kuyatumia"}}]},{"id":"dilute","label":{"en":"Mix a little fresh oil into the old","sw":"Changanya mafuta kidogo mapya na ya zamani"},"detail":{"en":"A compromise that costs less.","sw":"Njia ya kati inayogharimu kidogo."},"effects":{"unitCost":"+20","hygiene":8},"predictAnswer":"down","outcome":{"en":"The taste improves slightly. The underlying problem is still there, just slower.","sw":"Ladha inaboreka kidogo. Tatizo la msingi bado lipo, ni la polepole tu."},"lesson":{"en":"Half-solving a safety problem often costs you most of the money and buys you little of the protection.","sw":"Kutatua nusu tatizo la usalama mara nyingi kunakugharimu pesa nyingi na kunakununulia ulinzi kidogo."},"later":[{"inWeeks":5,"effects":{"reputation":-6,"demand":-18},"cause":{"en":"the old oil you only partly replaced","sw":"mafuta ya zamani uliyobadilisha kwa sehemu tu"}}]}]}},{"id":"t11","concept":"setback","conceptLabel":{"en":"A bad week","sw":"Wiki mbaya"},"scene":"stall-empty","situation":{"en":"A power cut ran for two days. Your fridge stopped. The milk for the chai spoiled, and so did a large batch of dough. You threw away a great deal of food. Two regular customers saw you doing it.","sw":"Umeme ulikatika kwa siku mbili. Friji yako ilisimama. Maziwa ya chai yaliharibika, na vilevile donge kubwa la unga uliokandwa. Ulitupa chakula kingi sana. Wateja wawili wa kawaida walikuona ukifanya hivyo."},"info":[{"id":"count-loss","label":{"en":"Work out exactly what you lost","sw":"Hesabu hasa ulichopoteza"},"costHours":2,"costCash":0,"reveals":{"en":"The wasted stock is most of a week's profit. Painful, but survivable. The bigger problem is the two customers who watched.","sw":"Bidhaa zilizopotea ni karibu faida ya wiki nzima. Inauma, lakini unaweza kuvumilia. Tatizo kubwa zaidi ni wale wateja wawili walioangalia."}}],"diagnose":{"prompt":{"en":"Which line caused this loss?","sw":"Ni kipengele gani kilisababisha hasara hii?"},"answer":"pnl.spoilage","options":["pnl.sales","pnl.costOfSales","pnl.rent","pnl.wages","pnl.fees","pnl.spoilage"],"right":{"en":"The wasted stock is the spoilage line. It is food you made but could not sell.","sw":"Bidhaa zilizopotea ziko kwenye kipengele cha spoilage. Ni chakula ulichotengeneza lakini hukuuza."},"wrong":{"en":"Look at the money-out lines. The loss came from stock that spoiled, not from rent or wages.","sw":"Angalia vipengele vya pesa iliyotoka. Hasara ilitoka kwenye bidhaa zilizoharibika, si kodi ya pango au mishahara."}},"decision":{"prompt":{"en":"What now?","sw":"Sasa nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"smaller-batches","label":{"en":"Make smaller batches more often","sw":"Tengeneza makundi madogo mara kwa mara"},"detail":{"en":"Less waste when something goes wrong. Slightly less efficient.","sw":"Upotevu mdogo kitu kikienda vibaya. Ufanisi kidogo pungufu."},"effects":{"unitCost":"-3","cash":-20000,"ownerHoursUsed":4},"predictAnswer":"same","outcome":{"en":"You lose a little efficiency and a lot of risk. The next time something goes wrong, you throw away far less.","sw":"Unapoteza ufanisi kidogo na hatari nyingi. Mara ijayo kitu kikienda vibaya, unatupa kidogo zaidi."},"lesson":{"en":"You cannot stop power cuts. You can decide how much they cost you when they happen.","sw":"Huwezi kuzuia kukatika kwa umeme. Unaweza kuamua kunakugharimu kiasi gani kunapotokea."}},{"id":"buy-generator","label":{"en":"Borrow money for a small generator","sw":"Kopa pesa ununue jenereta ndogo"},"detail":{"en":"Solves it properly. You take on a debt.","sw":"Inatatua vizuri. Unabeba deni."},"effects":{"unitCost":"-8","cash":-180000,"rent":16000},"predictAnswer":"down","outcome":{"en":"The fridge stays cold. You now owe money and have a weekly repayment whether or not the power goes out.","sw":"Friji inabaki baridi. Sasa unadaiwa pesa na una marejesho ya wiki umeme ukikatika au usikatike."},"lesson":{"en":"Borrowing to fix a problem turns an occasional loss into a fixed cost. Sometimes worth it, and it must be paid every week regardless.","sw":"Kukopa ili kutatua tatizo kunageuza hasara ya mara chache kuwa gharama ya kudumu. Mara nyingine inafaa, na lazima ilipwe kila wiki bila kujali."}},{"id":"carry-on","label":{"en":"Absorb the loss and carry on as before","sw":"Vumilia hasara na uendelee kama zamani"},"detail":{"en":"It was bad luck. It may not happen again.","sw":"Ilikuwa bahati mbaya. Huenda isitokee tena."},"effects":{"cash":-5000},"predictAnswer":"same","outcome":{"en":"You rebuild your stock and continue. Nothing has changed about what happens next time.","sw":"Unajenga upya bidhaa zako na kuendelea. Hakuna kilichobadilika kuhusu kitakachotokea mara ijayo."},"lesson":{"en":"Treating a repeatable problem as bad luck means agreeing to pay for it again.","sw":"Kuchukulia tatizo linaloweza kujirudia kama bahati mbaya ni kukubali kulilipia tena."}}]},"advanceWeeks":2},{"id":"t12","concept":"owner-time","conceptLabel":{"en":"Your own hours","sw":"Masaa yako mwenyewe"},"scene":"kitchen","situation":{"en":"You have not had a full day off in months. You open, you fry, you sell, you close. Someone asks when you last spent an hour thinking about where the business is going, rather than working in it. You cannot remember.","sw":"Hujapata siku nzima ya mapumziko kwa miezi. Unafungua, unakaanga, unauza, unafunga. Mtu anakuuliza ni lini mara ya mwisho ulitumia saa moja kufikiria biashara inakoelekea, badala ya kuifanyia kazi. Hukumbuki."},"info":[{"id":"count-own-hours","label":{"en":"Write down where your hours actually go","sw":"Andika masaa yako yanakoenda hasa"},"costHours":2,"costCash":0,"reveals":{"en":"Almost all of it is work anyone could be trained to do. The parts only you can do — choosing what to sell, setting prices, deciding who to serve — get whatever is left, which is nothing.","sw":"Karibu yote ni kazi ambayo mtu yeyote angeweza kufundishwa kuifanya. Sehemu ambazo wewe pekee unaweza — kuchagua cha kuuza, kupanga bei, kuamua wa kumhudumia — zinapata kilichobaki, ambacho ni hakuna."}}],"decision":{"type":"number","prompt":{"en":"How many hours each week will you protect for work on the business?","sw":"Kila wiki utatenga masaa mangapi kuifanyia biashara mipango?"},"predict":"number","input":{"field":"ownerHoursUsed","min":5,"max":15,"step":5,"start":0,"valueAs":"count","hint":{"en":"These hours are for planning, not for selling.","sw":"Masaa haya ni ya kupanga, si ya kuuza."},"responses":[{"field":"capacity","perStep":5,"change":40},{"field":"demand","perStep":5,"change":25},{"field":"unitCost","perStep":5,"change":15}]},"bands":[{"outcome":{"en":"You keep nearly all your selling time, but little time goes to the decisions only you can make.","sw":"Unaweka karibu muda wote wa kuuza, lakini muda mchache unaenda kwenye maamuzi ambayo wewe pekee unaweza kufanya."},"lesson":{"en":"Working in the business can fill the week and leave no space to work on it.","sw":"Kuifanyia biashara kazi kunaweza kujaza wiki na kusiache nafasi ya kuifanyia mipango."},"upTo":5},{"outcome":{"en":"You protect some time to look at customers, prices and the next step. You organize more output, but each unit costs more as you step away from frying.","sw":"Unatenga muda wa kuangalia wateja, bei na hatua inayofuata. Unapanga uzalishaji zaidi, lakini kila kimoja kinagharimu zaidi unapoacha kukaanga."},"lesson":{"en":"Time on the business is useful when it changes what the business does. The middle amount leaves room for both.","sw":"Muda wa kuifanyia biashara mipango unasaidia unapobadilisha kile biashara inachofanya. Kiasi cha kati kinaacha nafasi ya yote mawili."},"upTo":15},{"outcome":{"en":"You spend many hours planning. Demand and capacity rise, but the cost of each unit rises too as you step away from production.","sw":"Unatumia masaa mengi kupanga. Mahitaji na uwezo wa uzalishaji vinaongezeka, lakini gharama ya kila kimoja pia inapanda unapoacha uzalishaji."},"lesson":{"en":"Time set aside has an opportunity cost. Protect enough to steer, but not so much that selling stops.","sw":"Muda uliotengwa una gharama ya kuacha kitu kingine. Tenga wa kutosha kuongoza, lakini si mwingi kiasi cha kuuza kusimama."}}]}},{"id":"t13","concept":"hiring","conceptLabel":{"en":"Hiring","sw":"Kuajiri"},"scene":"kitchen","situation":{"en":"You are working from four in the morning until seven at night. Your niece has offered to help. She is reliable but knows nothing about the work, and she would need paying.","sw":"Unafanya kazi kuanzia saa kumi alfajiri hadi saa moja usiku. Mpwa wako amejitolea kusaidia. Ni wa kuaminika lakini hajui chochote kuhusu kazi, na angehitaji kulipwa."},"info":[{"id":"count-hours","label":{"en":"Add up your own hours honestly","sw":"Jumlisha masaa yako mwenyewe kwa ukweli"},"costHours":1,"costCash":0,"reveals":{"en":"You are working around seventy hours a week. You have not had a full day off in four months.","sw":"Unafanya kazi takriban masaa sabini kwa wiki. Hujapata siku nzima ya mapumziko kwa miezi minne."}}],"decision":{"type":"number","prompt":{"en":"How many people will you take on this week?","sw":"Wiki hii utachukua watu wangapi wa kukusaidia?"},"predict":"number","input":{"field":"staff","min":0,"max":3,"step":1,"start":"current","valueAs":"count","hint":{"en":"Each person adds a weekly wage. Their extra output must pay for it.","sw":"Kila mtu anaongeza mshahara wa wiki. Kazi yake ya ziada lazima ilipie."},"responses":[{"field":"capacity","perStep":1,"change":180},{"field":"demand","perStep":1,"change":160}]},"bands":[{"outcome":{"en":"You keep the whole margin and keep doing the work yourself. There is no new capacity for waiting customers.","sw":"Unabaki na margin yote na unaendelea kufanya kazi mwenyewe. Hakuna uwezo mpya kwa wateja wanaosubiri."},"lesson":{"en":"Not hiring protects this week's cash, but leaves the business tied to your own two hands.","sw":"Kutoajiri kunalinda pesa ya wiki hii, lakini kunaacha biashara ifungwe na mikono yako miwili."},"upTo":0},{"outcome":{"en":"One person gives the stall room to serve more customers. The wage is real, so extra sales must cover it.","sw":"Mtu mmoja anaipa biashara nafasi ya kuhudumia wateja zaidi. Mshahara ni gharama halisi, kwa hiyo mauzo ya ziada lazima yaulipie."},"lesson":{"en":"A first hire can remove a bottleneck. Hire for work that produces more than the wage.","sw":"Mwajiriwa wa kwanza anaweza kuondoa kikwazo. Ajiri kwa kazi inayozalisha zaidi ya mshahara."},"upTo":1},{"outcome":{"en":"More people add output, but the next wage arrives even when customers do not. Later hires bring less room than the first.","sw":"Watu zaidi wanaongeza uzalishaji, lakini mshahara unaofuata unakuja hata bila wateja. Waajiriwa wa baadaye wanaongeza nafasi kidogo kuliko wa kwanza."},"lesson":{"en":"Hiring has a point where another person costs more than the sales they add. Build one useful role at a time.","sw":"Kuajiri kuna sehemu ambapo mtu mwingine anagharimu zaidi ya mauzo anayoongeza. Jenga nafasi moja yenye kazi ya maana kwa wakati."}}]}},{"id":"t14","concept":"delegation","conceptLabel":{"en":"Delegation","sw":"Kukabidhi kazi"},"scene":"stall-busy","situation":{"en":"Your helper is competent now. But you still do the buying, the frying, the pricing and the money. She waits for you to tell her what to do next, and she often waits a long time.","sw":"Msaidizi wako sasa ana uwezo. Lakini bado wewe ndiye unanunua, unakaanga, unapanga bei na unashika pesa. Anasubiri umwambie afanye nini kinachofuata, na mara nyingi anasubiri muda mrefu."},"info":[{"id":"watch-her","label":{"en":"Watch how much time she spends waiting","sw":"Angalia muda anaotumia kusubiri"},"costHours":2,"costCash":0,"reveals":{"en":"She spends nearly two hours a day waiting for you to be free. You are paying her to stand still.","sw":"Anatumia karibu masaa mawili kwa siku akisubiri uwe huru. Unamlipa asimame tu."}}],"decision":{"prompt":{"en":"What do you change?","sw":"Unabadilisha nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"hand-over-buying","label":{"en":"Hand her the morning buying, with a written list and a fixed budget","sw":"Mkabidhi manunuzi ya asubuhi, kwa orodha iliyoandikwa na bajeti maalum"},"detail":{"en":"She will make mistakes at first. You will not be there to correct them.","sw":"Atafanya makosa mwanzoni. Hutakuwepo kumsahihisha."},"effects":{"capacity":28,"demand":28,"ownerHoursUsed":-12,"reputation":4},"predictAnswer":"up_bit","outcome":{"en":"She buys the wrong flour once. After that she is better at it than you, because she is doing it every single day.","sw":"Ananunua unga usio sahihi mara moja. Baada ya hapo ni bora kuliko wewe, kwa sababu anafanya kila siku."},"lesson":{"en":"Handing over a task means handing over the decisions inside it. If you keep the decisions, you have not actually delegated anything.","sw":"Kukabidhi kazi kunamaanisha kukabidhi maamuzi yaliyomo ndani yake. Ukibakiza maamuzi, hujakabidhi chochote."}},{"id":"detailed-instructions","label":{"en":"Give her more detailed instructions each morning","sw":"Mpe maelekezo ya kina zaidi kila asubuhi"},"detail":{"en":"Keep control, reduce the waiting.","sw":"Shikilia udhibiti, punguza kusubiri."},"effects":{"ownerHoursUsed":2,"capacity":3},"predictAnswer":"same","outcome":{"en":"She waits slightly less. You now spend part of every morning writing instructions instead of working.","sw":"Anasubiri kidogo pungufu. Sasa unatumia sehemu ya kila asubuhi kuandika maelekezo badala ya kufanya kazi."},"lesson":{"en":"Giving instructions is not delegation. You are still the person the whole business waits for.","sw":"Kutoa maelekezo si kukabidhi. Bado wewe ndiye mtu ambaye biashara nzima inamsubiri."}},{"id":"keep-control","label":{"en":"Keep doing the important parts yourself","sw":"Endelea kufanya sehemu muhimu mwenyewe"},"detail":{"en":"Mistakes are expensive.","sw":"Makosa ni ghali."},"effects":{"ownerHoursUsed":3},"predictAnswer":"same","outcome":{"en":"Nothing goes wrong. Nothing gets better either. She keeps waiting.","sw":"Hakuna kinachoenda vibaya. Wala hakuna kinachoboreka. Anaendelea kusubiri."},"lesson":{"en":"The cost of never delegating is invisible. It is everything the business did not do while waiting for you.","sw":"Gharama ya kutokabidhi kamwe haionekani. Ni kila kitu biashara isichokifanya ikikusubiri."}}]}},{"id":"t15","concept":"formalisation","conceptLabel":{"en":"Becoming official","sw":"Kuwa rasmi"},"scene":"office","unverified":true,"situation":{"en":"A hotel wants to buy from you regularly. It would be your largest customer. Their buyer explains that they can only buy from registered businesses that can issue a proper receipt. You have never registered anything.","sw":"Hoteli inataka kununua kwako mara kwa mara. Ingekuwa mteja wako mkubwa zaidi. Mnunuzi wao anaeleza kwamba wanaweza kununua tu kutoka kwa biashara zilizosajiliwa zinazoweza kutoa risiti halali. Hujawahi kusajili chochote."},"info":[{"id":"ask-around","label":{"en":"Ask other traders what registering involved","sw":"Waulize wafanyabiashara wengine usajili ulihusisha nini"},"costHours":6,"costCash":0,"reveals":{"en":"Answers vary a lot. Everyone agrees it took longer than they expected and cost more than the official amount, once travel and repeat visits were counted.","sw":"Majibu yanatofautiana sana. Wote wanakubali ilichukua muda mrefu kuliko walivyotegemea na iligharimu zaidi ya kiasi rasmi, ukihesabu safari na ziara za kurudia."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"register","label":{"en":"Start the registration process","sw":"Anza mchakato wa usajili"},"detail":{"en":"Money and many days of your time, before any benefit arrives.","sw":"Pesa na siku nyingi za muda wako, kabla faida yoyote haijafika."},"effects":{"formality":1,"cash":-95000,"ownerHoursUsed":10,"licenceFees":6000},"predictAnswer":"down","outcome":{"en":"It takes weeks of queuing and several trips. You pay fees, and you lose mornings you would have been selling. The hotel contract has not started yet.","sw":"Inachukua wiki za kupanga foleni na safari kadhaa. Unalipa ada, na unapoteza asubuhi ambazo ungekuwa unauza. Mkataba wa hoteli bado haujaanza."},"lesson":{"en":"Formalising costs real money and a lot of time before it earns anything. Most people are surprised by the time, not the money.","sw":"Kuwa rasmi kunagharimu pesa halisi na muda mwingi kabla ya kuleta chochote. Watu wengi wanashangazwa na muda, si pesa."}},{"id":"informal-deal","label":{"en":"Ask the hotel to pay you informally","sw":"Iombe hoteli ikulipe bila utaratibu rasmi"},"detail":{"en":"No paperwork, no cost.","sw":"Hakuna karatasi, hakuna gharama."},"effects":{"reputation":-4},"predictAnswer":"same","outcome":{"en":"The buyer says he cannot. His own accounts have to show where the money went. He is apologetic and firm.","sw":"Mnunuzi anasema hawezi. Hesabu zake mwenyewe lazima zionyeshe pesa ilikoenda. Anaomba radhi lakini yuko imara."},"lesson":{"en":"Your customer's rules are often set by someone above them. Staying informal does not just limit you — it locks you out of certain customers entirely.","sw":"Sheria za mteja wako mara nyingi zinawekwa na mtu aliye juu yake. Kubaki bila usajili hakukuzuii tu — kunakufungia nje ya wateja fulani kabisa."}},{"id":"stay-informal","label":{"en":"Let the hotel go and stay as you are","sw":"Iache hoteli na ubaki ulivyo"},"detail":{"en":"Your current customers do not ask for receipts.","sw":"Wateja wako wa sasa hawaombi risiti."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes this week. The hotel finds another supplier, and so does the next one who asks the same question.","sw":"Hakuna kinachobadilika wiki hii. Hoteli inapata msambazaji mwingine, na vivyo hivyo anayefuata anayeuliza swali lilelile."},"lesson":{"en":"Staying informal has no cost today. Its cost is the ceiling it puts on which customers you can ever serve.","sw":"Kubaki bila usajili hakuna gharama leo. Gharama yake ni kikomo kinachowekwa kwa wateja unaoweza kuwahudumia."},"later":[{"inWeeks":5,"effects":{"demand":-30},"cause":{"en":"the customers who need a receipt you cannot give","sw":"wateja wanaohitaji risiti usiyoweza kuitoa"}}]}]},"advanceWeeks":3},{"id":"t16","concept":"quality-assurance","conceptLabel":{"en":"Quality you can prove","sw":"Ubora unaoweza kuthibitisha"},"scene":"inspection","unverified":true,"situation":{"en":"The hotel's buyer wants to visit your kitchen before signing anything. He will look at how you store food, how you handle it, and whether you can show what you did yesterday.","sw":"Mnunuzi wa hoteli anataka kutembelea jikoni kwako kabla ya kusaini chochote. Ataangalia jinsi unavyohifadhi chakula, jinsi unavyokishika, na kama unaweza kuonyesha ulichofanya jana."},"info":[{"id":"walk-through","label":{"en":"Walk through your own kitchen as if you were him","sw":"Pita jikoni kwako mwenyewe kana kwamba wewe ni yeye"},"costHours":2,"costCash":0,"reveals":{"en":"The dough is covered. The floor is clean. But there is no way to show what you did yesterday, or where the flour came from.","sw":"Unga uliokandwa umefunikwa. Sakafu ni safi. Lakini hakuna njia ya kuonyesha ulichofanya jana, wala unga ulikotoka."}}],"decision":{"prompt":{"en":"How do you prepare?","sw":"Unajiandaaje?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"prepare-properly","label":{"en":"Clean up and start writing down what you make and where it came from","sw":"Safisha na uanze kuandika unachotengeneza na kilikotoka"},"detail":{"en":"Sealed containers and a written record, every day from now on.","sw":"Vyombo vilivyofungwa na kumbukumbu iliyoandikwa, kila siku kuanzia sasa."},"effects":{"hygiene":25,"keepsRecords":true,"ownerHoursUsed":5,"cash":-25000,"rent":6000},"predictAnswer":"down","outcome":{"en":"The visit goes well. He is more impressed by the written records than by the clean floor, because the records show it was clean yesterday too.","sw":"Ziara inaenda vizuri. Amevutiwa zaidi na kumbukumbu zilizoandikwa kuliko sakafu safi, kwa sababu kumbukumbu zinaonyesha ilikuwa safi jana pia."},"lesson":{"en":"Quality that you cannot show is quality your customer cannot buy. Being clean and proving you are clean are two different things.","sw":"Ubora usioweza kuuonyesha ni ubora ambao mteja wako hawezi kuununua. Kuwa safi na kuthibitisha kwamba u safi ni mambo mawili tofauti."}},{"id":"clean-only","label":{"en":"Give everything a deep clean the day before","sw":"Fanya usafi wa kina siku moja kabla"},"detail":{"en":"Make a good impression.","sw":"Toa taswira nzuri."},"effects":{"hygiene":12,"ownerHoursUsed":3,"cash":-8000},"predictAnswer":"same","outcome":{"en":"The kitchen looks excellent. He asks what you did last Tuesday and you cannot tell him. He says he will think about it.","sw":"Jiko linaonekana bora sana. Anauliza ulifanya nini Jumanne iliyopita na huwezi kumwambia. Anasema atafikiria."},"lesson":{"en":"A one-day clean shows what you can do once. A buyer is trying to find out what you do every day.","sw":"Usafi wa siku moja unaonyesha unachoweza kufanya mara moja. Mnunuzi anajaribu kujua unachofanya kila siku."}},{"id":"no-prep","label":{"en":"Let him come as things are","sw":"Mwache aje kama mambo yalivyo"},"detail":{"en":"You have nothing to hide.","sw":"Huna cha kuficha."},"effects":{"reputation":-6},"predictAnswer":"same","outcome":{"en":"He is polite. He notices the oil container without a lid, and he does not sign.","sw":"Ana adabu. Anaona chombo cha mafuta bila mfuniko, na hasaini."},"lesson":{"en":"A buyer inspecting you is managing their own risk. What is normal to you may be unacceptable to them.","sw":"Mnunuzi anayekukagua anasimamia hatari yake mwenyewe. Kinachokuwa cha kawaida kwako kinaweza kisikubalike kwake."},"later":[{"inWeeks":3,"effects":{"reputation":-10,"demand":-25},"cause":{"en":"the kitchen inspection you did not prepare for","sw":"ukaguzi wa jikoni ambao hukujiandaa kwa ajili yake"}}]}]}},{"id":"t17","concept":"compliance-cost","conceptLabel":{"en":"Staying official","sw":"Kubaki rasmi"},"scene":"office","situation":{"en":"You are registered now. A letter arrives about filing your returns. There is also a licence to renew every year and an inspection fee nobody mentioned when you signed up.","sw":"Sasa umesajiliwa. Barua inafika kuhusu kuwasilisha marejesho yako. Pia kuna leseni ya kuhuisha kila mwaka na ada ya ukaguzi ambayo hakuna aliyeitaja ulipojisajili."},"advanceWeeks":2,"info":[{"id":"ask-what-is-owed","label":{"en":"Find out what is actually owed and when","sw":"Tafuta kinachodaiwa hasa na lini"},"costHours":4,"costCash":5000,"reveals":{"en":"The amounts themselves are manageable. The penalties for filing late are not, and they grow every month you leave it.","sw":"Viwango vyenyewe vinawezekana. Adhabu za kuchelewa kuwasilisha haziwezekani, na zinakua kila mwezi unapoiacha."}}],"decision":{"prompt":{"en":"How do you handle it?","sw":"Unalishughulikiaje?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"pay-bookkeeper","label":{"en":"Pay someone to keep the books and file for you","sw":"Mlipe mtu atunze hesabu na awasilishe kwa niaba yako"},"detail":{"en":"A cost every week. It is handled and it stays handled.","sw":"Gharama kila wiki. Inashughulikiwa na inabaki imeshughulikiwa."},"effects":{"licenceFees":8000},"predictAnswer":"down","outcome":{"en":"Your profit falls by what you pay her. The filings go in on time and you stop thinking about it.","sw":"Faida yako inashuka kwa kiasi unachomlipa. Marejesho yanawasilishwa kwa wakati na unaacha kuwaza kuhusu hilo."},"lesson":{"en":"Compliance is a running cost of being the kind of business a hotel can buy from. It does not stop after registration — that is the part people are not told.","sw":"Kufuata sheria ni gharama endelevu ya kuwa biashara ambayo hoteli inaweza kununua kwake. Hakuishii baada ya usajili — hiyo ndiyo sehemu watu hawaambiwi."}},{"id":"diy-filing","label":{"en":"Learn to do the filing yourself in the evenings","sw":"Jifunze kuwasilisha mwenyewe jioni"},"detail":{"en":"No money leaves your hand.","sw":"Hakuna pesa inayotoka mkononi mwako."},"effects":{"ownerHoursFixed":7},"predictAnswer":"same","outcome":{"en":"It costs you nothing in money and seven hours a week that used to be sleep. The filings go in, late twice.","sw":"Haikugharimu pesa yoyote na masaa saba kwa wiki yaliyokuwa ya kulala. Marejesho yanawasilishwa, yakiwa yamechelewa mara mbili."},"lesson":{"en":"Your own hours are the one cost that never appears in the accounts, which is why they are the first thing spent.","sw":"Masaa yako mwenyewe ndiyo gharama pekee isiyoonekana kwenye hesabu, ndiyo sababu ndiyo kitu cha kwanza kutumika."}},{"id":"ignore-letter","label":{"en":"Put the letter aside and deal with it later","sw":"Weka barua kando uishughulikie baadaye"},"detail":{"en":"There is a queue of more urgent things.","sw":"Kuna foleni ya mambo ya dharura zaidi."},"effects":{},"later":[{"inWeeks":4,"effects":{"cash":-55000,"licenceFees":6000},"cause":{"en":"the tax letter you left unopened","sw":"barua ya kodi uliyoiacha bila kuifungua"}}],"predictAnswer":"same","outcome":{"en":"Nothing happens this week. The letter sits where you put it and the business runs exactly as it did.","sw":"Hakuna kinachotokea wiki hii. Barua inakaa ulipoiweka na biashara inaenda sawasawa kama ilivyokuwa."},"lesson":{"en":"A compliance problem costs nothing at all until the moment it costs a great deal, and by then the penalty is larger than the bill was.","sw":"Tatizo la kufuata sheria haligharimu kitu hadi dakika linapogharimu sana, na hapo adhabu inakuwa kubwa kuliko bili ilivyokuwa."}}]}},{"id":"t18","concept":"concentration-risk","conceptLabel":{"en":"Depending on one customer","sw":"Kutegemea mteja mmoja"},"scene":"office","situation":{"en":"The hotel now takes more than half of everything you make. It is your best customer by far, and paying you on time. Your other customers have slowly drifted since you started prioritising the hotel order.","sw":"Hoteli sasa inachukua zaidi ya nusu ya kila unachotengeneza. Ni mteja wako bora kwa mbali, na analipa kwa wakati. Wateja wako wengine wamepungua polepole tangu ulipoanza kuipa kipaumbele oda ya hoteli."},"info":[{"id":"check-share","label":{"en":"Work out how much of your business the hotel is","sw":"Hesabu hoteli ni sehemu gani ya biashara yako"},"costHours":1,"costCash":0,"reveals":{"en":"They are about sixty percent of your sales. If they left tomorrow you could not cover your rent and wages.","sw":"Ni takriban asilimia sitini ya mauzo yako. Wakiondoka kesho usingeweza kulipa kodi na mishahara."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"find-second-buyer","label":{"en":"Spend time finding a second buyer of similar size","sw":"Tumia muda kutafuta mnunuzi wa pili wa ukubwa unaofanana"},"detail":{"en":"Time away from the work you already have.","sw":"Muda mbali na kazi uliyo nayo tayari."},"effects":{"ownerHoursUsed":8,"demand":25,"capacity":25,"cash":-10000},"predictAnswer":"up_bit","outcome":{"en":"It takes weeks and several refusals. You find a second hotel that takes a smaller order. Neither one can now sink you on their own.","sw":"Inachukua wiki na makatao kadhaa. Unapata hoteli ya pili inayochukua oda ndogo zaidi. Sasa hakuna hata mmoja anayeweza kukuzamisha peke yake."},"lesson":{"en":"The time to find your second big customer is while your first one is happy, not after they leave.","sw":"Wakati wa kutafuta mteja wako mkubwa wa pili ni pale wa kwanza akiwa bado ana furaha, si baada ya kuondoka."}},{"id":"serve-hotel-more","label":{"en":"Give the hotel even more of your attention","sw":"Ipe hoteli uangalifu zaidi"},"detail":{"en":"They are your best customer. Keep them very happy.","sw":"Ni mteja wako bora. Mfanye awe na furaha sana."},"effects":{"demand":20,"capacity":20,"reputation":-5,"ownerHoursUsed":5},"predictAnswer":"up_bit","outcome":{"en":"They are delighted. You are now almost entirely dependent on one buyer, who knows it.","sw":"Wana furaha sana. Sasa unategemea karibu kabisa mnunuzi mmoja, ambaye anajua hivyo."},"lesson":{"en":"A customer who accounts for most of your sales does not just buy from you. They set your prices, because you cannot afford to say no.","sw":"Mteja anayechukua sehemu kubwa ya mauzo yako hanunui tu kwako. Anapanga bei zako, kwa sababu huwezi kumudu kusema hapana."}},{"id":"do-nothing-risk","label":{"en":"Leave it. Nothing is wrong right now","sw":"Iache. Hakuna kilichoharibika kwa sasa"},"detail":{"en":"They are paying on time.","sw":"Wanalipa kwa wakati."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing happens this week. Your exposure is exactly the same as it was.","sw":"Hakuna kinachotokea wiki hii. Hatari yako ni ileile kama ilivyokuwa."},"lesson":{"en":"Concentration risk causes no problems at all, right up until the moment it causes every problem at once.","sw":"Hatari ya kutegemea mteja mmoja haileti tatizo lolote, hadi dakika inayoleta matatizo yote kwa mara moja."}}]},"advanceWeeks":3},{"id":"t19","concept":"negotiation","conceptLabel":{"en":"Holding your price","sw":"Kushikilia bei yako"},"scene":"office","situation":{"en":"The hotel buyer asks for a discount. He says another supplier has quoted him lower. He also mentions, almost in passing, that they would like delivery seven mornings a week instead of five.","sw":"Mnunuzi wa hoteli anaomba punguzo. Anasema msambazaji mwingine amempa bei ya chini. Pia anataja, karibu kwa kupita tu, kwamba wangependa bidhaa zifike asubuhi saba kwa wiki badala ya tano."},"info":[{"id":"check-margin","label":{"en":"Work out what the discount would leave you","sw":"Hesabu punguzo lingekuachia nini"},"costHours":2,"costCash":0,"reveals":{"en":"The discount alone you could absorb. The discount plus two more delivery mornings takes more than it gives.","sw":"Punguzo peke yake ungeweza kulivumilia. Punguzo pamoja na asubuhi mbili zaidi za kupeleka kinachukua zaidi ya kinachotoa."}}],"decision":{"type":"number","prompt":{"en":"Set the price you will offer the hotel.","sw":"Panga bei utakayompa hoteli."},"predict":"number","input":{"field":"price","min":400,"max":750,"step":25,"start":"current","valueAs":"money","hint":{"en":"The hotel wants a discount. A lower price should buy you a larger order.","sw":"Hoteli inataka punguzo. Bei ya chini inapaswa kukuletea oda kubwa zaidi."},"responses":[{"field":"demand","perStep":25,"change":-13}]},"bands":[{"outcome":{"en":"The hotel gets a large discount. More units may move, but each one leaves less after cost and delivery work.","sw":"Hoteli inapata punguzo kubwa. Bidhaa nyingi zinaweza kuondoka, lakini kila moja linakuachia kidogo baada ya gharama na kazi ya kupeleka."},"lesson":{"en":"A discount is useful only when the extra order pays for what you give up on each unit.","sw":"Punguzo linafaa tu wakati oda ya ziada inalipia unachoacha kwa kila kimoja."},"upTo":450},{"outcome":{"en":"You offer a middle price. The hotel has a reason to order more, while you keep enough from each unit.","sw":"Unatoa bei ya kati. Hoteli ina sababu ya kuagiza zaidi, huku ukibaki na kiasi cha kutosha kwa kila kimoja."},"lesson":{"en":"Negotiate the whole order, not only the price. Volume can pay for a smaller margin when the numbers are visible.","sw":"Jadili oda yote, si bei tu. Wingi unaweza kulipia margin ndogo wakati namba zinaonekana."},"upTo":600},{"outcome":{"en":"You protect the price on each unit, but the hotel wants fewer at that price. Margin is close to the volume you lose.","sw":"Unalinda bei kwa kila kimoja, lakini hoteli inataka vichache kwa bei hiyo. Margin iko karibu na wingi unaopoteza."},"lesson":{"en":"Ask what volume or certainty comes with a discount before you give one.","sw":"Uliza ni wingi au uhakika gani unaokuja na punguzo kabla hujatoa."}}]}},{"id":"t20","concept":"reinvestment","conceptLabel":{"en":"What to do with profit","sw":"Nini cha kufanya na faida"},"scene":"stall-busy","situation":{"en":"For the first time you have real money left over at the end of the month, after everything is paid. Your family knows it. There are things at home that need doing.","sw":"Kwa mara ya kwanza una pesa halisi iliyobaki mwisho wa mwezi, baada ya kila kitu kulipwa. Familia yako inajua. Kuna mambo nyumbani yanayohitaji kufanyika."},"info":[{"id":"list-options","label":{"en":"Write down what the money could do","sw":"Andika pesa ingeweza kufanya nini"},"costHours":1,"costCash":0,"reveals":{"en":"The roof at home needs repair. A second fryer would let you take the order you turned down last week. Some of it should probably just sit in the box for emergencies.","sw":"Paa la nyumbani linahitaji matengenezo. Mashine ya pili ya kukaanga ingekuwezesha kuchukua oda uliyoikataa wiki iliyopita. Sehemu yake pengine inapaswa kubaki tu sandukuni kwa dharura."}}],"decision":{"type":"allocate","prompt":{"en":"How will you split this profit?","sw":"Utagawanya vipi faida hii?"},"predict":"number","allocate":{"amountFrom":"cash","fraction":0.6,"step":10000,"buckets":[{"id":"business","label":{"en":"Business","sw":"Biashara"},"perStep":{"capacity":8,"demand":5,"rent":1200}},{"id":"home","label":{"en":"Home","sw":"Nyumbani"},"perStep":{}},{"id":"reserve","label":{"en":"Keep as reserve","sw":"Weka kama akiba"},"perStep":{},"keepsCash":true}]},"bands":[{"outcome":{"en":"You protect most of the money for home and emergencies. The business gets only a small push, so growth is slower.","sw":"Unalinda pesa nyingi kwa nyumbani na dharura. Biashara inapata msukumo mdogo, kwa hiyo ukuaji ni wa polepole."},"lesson":{"en":"A reserve can keep one bad week from becoming a crisis. It also means slower business growth.","sw":"Akiba inaweza kuzuia wiki moja mbaya kuwa tatizo kubwa. Pia inamaanisha biashara ikue polepole."},"upTo":0.3},{"outcome":{"en":"You divide the money between business, home and a reserve. No part gets everything, but the business grows without using every coin.","sw":"Unagawa pesa kati ya biashara, nyumbani na akiba. Sehemu hakuna inayopata kila kitu, lakini biashara inakua bila kutumia kila senti."},"lesson":{"en":"Profit has more than one job. A split can keep the household, business and next bad week in view. New capacity also brings a weekly cost.","sw":"Faida ina kazi zaidi ya moja. Mgawanyo unaweza kuangalia kaya, biashara na wiki mbaya inayofuata. Uwezo mpya pia huleta gharama ya wiki."},"upTo":0.7},{"outcome":{"en":"You put most of the money into the business. More customers can be served, but little is left for home or a surprise cost.","sw":"Unaweka pesa nyingi kwenye biashara. Wateja zaidi wanaweza kuhudumiwa, lakini kidogo kinabaki nyumbani au kwa gharama ya ghafla."},"lesson":{"en":"Reinvestment can build capacity, but new capacity brings a weekly cost and a business without a reserve is exposed. Growth and safety are both real needs.","sw":"Kurudisha faida kunaweza kujenga uwezo, lakini uwezo mpya huleta gharama ya wiki na biashara const NS_i18n = (function () {

// Language, strings and plurals.
//
// Rules this file exists to enforce (docs/localization.md, "Language"):
//
//   1. No user-facing string lives in code. Everything comes from content/ui.json.
//   2. No sentence is built by concatenation. Word order differs between languages,
//      so templates carry whole sentences with named placeholders.
//   3. Plurals go through Intl.PluralRules, never `if (n === 1)`.
//
// Strings are stored key-major — { "btn.continue": { en: "...", sw: "..." } } — so a
// reviewer reads the two languages side by side instead of scrolling between two
// blocks. Scenario content uses the same shape, which is what `localised()` reads.

const LANGUAGES = [
  { code: 'en', label: 'English' },
  { code: 'sw', label: 'Kiswahili' },
];

const FALLBACK = 'en';

let language = FALLBACK;
let strings = {};
let onChange = null;

function loadStrings(table) {
  strings = table || {};
}

function setLanguage(code) {
  if (!LANGUAGES.some((l) => l.code === code)) return language;
  language = code;
  if (typeof document !== 'undefined') document.documentElement.lang = code;
  if (onChange) onChange(code);
  return language;
}

function getLanguage() {
  return language;
}

function onLanguageChange(fn) {
  onChange = fn;
}

/**
 * Pick the right variant out of a localised value.
 *
 * Accepts a bare string too, so scenario content can be part-translated during

    evidence: preds.map((p) => ({
      turnId: p.turnId,
      predicted: p.predicted,
      actual: p.actual,
      correct: p.correct,
    })),
  };
}

/** Does the learner buy information before committing, or decide blind? */
function informationSeeking(record) {
  const decs = decisions(record);
  const withInfo = decs.filter((d) => (d.infoSoughtCount || 0) > 0);
  return {
    id: 'information-seeking',
    label: 'Checking before deciding',
    total: decs.length,
    withInfo: withInfo.length,
    evidence: decs.map((d) => ({
      turnId: d.turnId,
      concept: d.concept,
      infoSought: d.infoSoughtCount || 0,
      choice: d.optionLabel,
    })),
  };
}

/** What did they do immediately after a decision that lost money? */
function recovery(record) {
  const decs = decisions(record);
  const events = [];
  for (let i = 0; i < decs.length - 1; i += 1) {
    const d = decs[i];
    if (typeof d.profitAfter === 'number' && typeof d.profitBefore === 'number' && d.profitAfter < d.profitBefore) {
      events.push({
        setbackTurn: d.turnId,
        drop: d.profitBefore - d.profitAfter,
        nextChoice: decs[i + 1].optionLabel,
        nextTurn: decs[i + 1].turnId,
      });
    }
  }
  return {
    id: 'recovery',
    label: 'After a setback',
    total: events.length,
    evidence: events,
  };
}

/** Breadth — which concepts did they actually engage with? */
function conceptCoverage(record) {
  const seen = new Map();
  for (const d of decisions(record)) {
    if (!d.concept) continue;
    seen.set(d.concept, (seen.get(d.concept) || 0) + 1);
  }
  return {
    id: 'concept-coverage',
    label: 'Concepts encountered',
    total: seen.size,
    evidence: [...seen.entries()].map(([concept, times]) => ({ concept, times })),
  };
}

/** Which ledger line did the learner identify as the source of a loss? */
function diagnosis(record) {
  const entries = diagnoses(record);
  const correct = entries.filter((entry) => entry.correct);
  return {
    id: 'diagnosis',
    label: 'Identifying the source of a loss',
    total: entries.length,
    correct: correct.length,
    evidence: entries.map((entry) => ({
      turnId: entry.turnId,
      picked: entry.picked,
      answer: entry.answer,
      correct: entry.correct,
    })),
  };
}

function allIndicators(record) {
  return [
    calibration(record),
    informationSeeking(record),
    recovery(record),
    conceptCoverage(record),
    diagnosis(record),
  ];
}

// ---------------------------------------------------------------------------
// Layer 3 — profile. Human-readable, hedged, observation-anchored.
// ---------------------------------------------------------------------------

/**
 * Statements are written so that deleting "in the simulation" would make them false.
 * That is the test from docs/assessment.md for whether we are overclaiming.
 *
 * Each statement carries BOTH a canonical English `text` and a `key`/`params` pair.
 * The interface renders the key in the learner's language; the downloaded artefact
 * keeps the English, because the record is read by a programme that may not share the
 * learner's language and because a translated record should not be the only copy of
 * what was observed. The two must say the same thing — scripts/validate-i18n.mjs
 * checks the keys exist in both languages, not that the meanings match, so edit them
 * together.
 */
function buildProfile(record) {
  const cal = calibration(record);
  const info = informationSeeking(record);
  const rec = recovery(record);
  const cov = conceptCoverage(record);
  const diag = diagnosis(record);

  const statements = [];

  if (cal.total > 0) {
    const trendKey = cal.trend ? `profile.detail.${cal.trend}` : null;
    statements.push({
      indicator: cal.label,
      indicatorKey: 'indicator.calibration',
      key: 'profile.stmt.calibration',
      params: { correct: cal.correct, total: cal.total },
      text: `Correctly anticipated the effect of their own decision in ${cal.correct} of ${cal.total} predictions.`,
      detailKey: trendKey,
      detail: cal.trend === 'improved'
        ? 'Accuracy was higher in the second half of the playthrough than the first.'
        : cal.trend === 'declined'
          ? 'Accuracy was lower in the second half than the first.'
          : cal.trend === 'steady'
            ? 'Accuracy was broadly steady across the playthrough.'
            : null,
    });
  }

  if (info.total > 0) {
    statements.push({
      indicator: info.label,
      indicatorKey: 'indicator.information',
      key: 'profile.stmt.information',
      params: { withInfo: info.withInfo, total: info.total },
      text: `Sought information before deciding in ${info.withInfo} of ${info.total} decisions.`,
      detailKey: null,
      detail: null,
    });
  }

  if (rec.total > 0) {
    statements.push({
      indicator: rec.label,
      indicatorKey: 'indicator.recovery',
      countKey: 'profile.stmt.recovery',
      count: rec.total,
      text: `Faced ${rec.total} decision${rec.total === 1 ? '' : 's'} that reduced weekly profit, and continued afterwards.`,
      detailKey: 'profile.detail.recovery',
      detail: 'What they chose next is listed in the evidence below.',
    });
  }

  statements.push({
    indicator: cov.label,
    indicatorKey: 'indicator.coverage',
    countKey: 'profile.stmt.coverage',
    count: cov.total,
    text: `Made decisions across ${cov.total} business concept${cov.total === 1 ? '' : 's'}.`,
    detailKey: null,
    detail: null,
  });

  if (diag.total > 0) {
    statements.push({
      indicator: diag.label,
      indicatorKey: 'indicator.diagnosis',
      key: 'profile.stmt.diagnosis',
      params: { correct: diag.correct, total: diag.total },
      text: `Identified the ledger line that caused the loss correctly in ${diag.correct} of ${diag.total} diagnosis steps.`,
      detailKey: null,
      detail: null,
    });
  }

  if (record.goalProgress) {
    const goal = record.goalProgress;
    statements.push({
      indicator: 'Goal progress',
      indicatorKey: 'indicator.goal',
      key: 'profile.stmt.goal',
      params: { met: goal.metCount, total: goal.total },
      text: `Met ${goal.metCount} of ${goal.total} goal conditions in the simulation.`,
      detailKey: null,
      detail: null,
    });
  }

  return {
    scenarioId: record.scenarioId,
    startedAt: record.startedAt,
    generatedAt: new Date().toISOString(),
    statements,
    indicators: allIndicators(record),

    // Carried INSIDE the artefact, not as a footnote. This will be read out of
    // context, so the caveat has to travel with it. docs/assessment.md, item 3.
    limitationKeys: [
      'profile.limit.1', 'profile.limit.2', 'profile.limit.3', 'profile.limit.4',
    ],
    limitations: [
      'This describes what happened inside a simulation. It is not a measure of how this person runs a real business.',
      'It has not been validated against real business outcomes. No such study exists yet.',
      'It should not be used as an automatic cut-off, or to rank one person against another.',
      'Figures in the simulation are illustrative placeholders, not researched local data.',
    ],
  };
}

/**
 * Deliberately NOT a score.
 *
 * Prediction accuracy is reported as a proportion because it is the one signal the
 * project owner wants to gate a funnel on. Presenting it as a bare percentage would
 * make it trivially sortable, which is the failure mode assessment.md exists to
 * prevent — so callers get the raw counts and must show the evidence alongside.
 */
function predictionTally(record) {
  const cal = calibration(record);
  return { correct: cal.correct, total: cal.total, trend: cal.trend };
}

  return { createRecord, observe, observeInfoSought, observePrediction, observeDecision, observeConstraint, observeDiagnosis, observeInput, calibration, informationSeeking, recovery, conceptCoverage, diagnosis, allIndicators, buildProfile, predictionTally };
})();

/* ---- storage ---- */
const NS_storage = (function () {

// Local-first persistence.
//
// The learner holds their own record (SECURITY.md). Nothing is transmitted anywhere —
// there is no network code in this application at all, by design.
//
// Save continuously and assume the app is killed mid-decision, because on the target
// devices it will be (docs/localization.md).

const KEY = 'business-simulator:v1';

function save(session) {
  try {
    localStorage.setItem(KEY, JSON.stringify(session));
    return true;
  } catch (err) {
    // Private browsing or a full quota. Play continues in memory rather than dying.
    console.warn('Could not save progress:', err);
    return false;
  }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return parsed;
  } catch (err) {
    console.warn('Could not load saved progress:', err);
    return null;
  }
}

function clear() {
  try {
    localStorage.removeItem(KEY);
    return true;
  } catch {
    return false;
  }
}

function hasSave() {
  return load() !== null;
}

// --- chapters (ADR-0007) ---------------------------------------------------
//
// Two things persist beyond a single chapter: which chapters have been finished, and
// the six carried flags. Both are small, both are the learner's own, and both stay on
// the device like everything else here.

const CARRY_KEY = 'business-simulator:carry:v1';

function loadCarry() {
  try {
    const raw = localStorage.getItem(CARRY_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if (!parsed || typeof parsed !== 'object') return { flags: {}, completed: [] };
    return { flags: parsed.flags || {}, completed: parsed.completed || [] };
  } catch (err) {
    console.warn('Could not load chapter progress:', err);
    return { flags: {}, completed: [] };
  }
}

function saveCarry(carry) {
  try {
    localStorage.setItem(CARRY_KEY, JSON.stringify({
      flags: carry.flags || {},
      completed: carry.completed || [],
    }));
    return true;
  } catch (err) {
    console.warn('Could not save chapter progress:', err);
    return false;
  }
}

function clearCarry() {
  try {
    localStorage.removeItem(CARRY_KEY);
    return true;
  } catch {
    return false;
  }
}

/** Export the learner's own record so they can keep or share it deliberately. */
function exportJson(session) {
  return JSON.stringify(session, null, 2);
}

  return { save, load, clear, hasSave, loadCarry, saveCarry, clearCarry, exportJson };
})();

/* ---- scene ---- */
const NS_scene = (function () {

// scene.js — generated SVG illustrations and small animation helpers.
// No dependencies. No network. No innerHTML with user data.
// All drawing is document.createElementNS so nothing here needs a build step.

const NS = 'http://www.w3.org/2000/svg';
const REDUCE = typeof matchMedia === 'function'
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : { matches: false };

function svg(name, attrs) {
  const node = document.createElementNS(NS, name);
  if (attrs) {
    for (const key in attrs) node.setAttribute(key, attrs[key]);
  }
  return node;
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

// ---- shared scene primitives --------------------------------------------

const VB_W = 320;
const VB_H = 160;
const GROUND_Y = 132;

function baseSvg(extraClass) {
  const root = svg('svg', {
    viewBox: `0 0 ${VB_W} ${VB_H}`,
    class: 'scene-svg' + (extraClass ? ' ' + extraClass : ''),
    role: 'img',
    'aria-hidden': 'true',
    preserveAspectRatio: 'xMidYMax meet',
  });
  return root;
}

function skyGround(root, night) {
  root.appendChild(svg('rect', {
    x: 0, y: 0, width: VB_W, height: GROUND_Y,
    class: night ? 'scene-sky scene-sky-night' : 'scene-sky',
  }));
  root.appendChild(svg('rect', {
    x: 0, y: GROUND_Y, width: VB_W, height: VB_H - GROUND_Y,
    class: night ? 'scene-ground scene-ground-night' : 'scene-ground',
  }));
}

function sun(root, cx, cy, r) {
  root.appendChild(svg('circle', { cx, cy, r, class: 'scene-sun' }));
}

function moonAndStars(root, count) {
  root.appendChild(svg('circle', { cx: 262, cy: 30, r: 16, class: 'scene-moon' }));
  const positions = [
    [24, 20], [60, 42], [110, 18], [150, 34], [190, 16],
    [220, 46], [30, 58], [130, 52], [95, 34], [200, 62],
  ];
  const n = clamp(count, 3, positions.length);
  for (let i = 0; i < n; i++) {
    const [x, y] = positions[i];
    root.appendChild(svg('circle', { cx: x, cy: y, r: 1.4, class: 'scene-star' }));
  }
}

function cloud(root, x, y, scale) {
  const g = svg('g', { class: 'scene-cloud', transform: `translate(${x} ${y}) scale(${scale})` });
  g.appendChild(svg('ellipse', { cx: 0, cy: 0, rx: 14, ry: 8 }));
  g.appendChild(svg('ellipse', { cx: 12, cy: -3, rx: 10, ry: 7 }));
  g.appendChild(svg('ellipse', { cx: -12, cy: 2, rx: 9, ry: 6 }));
  root.appendChild(g);
}

// A simple flat figure: head + body, feet at (x, groundY).
function figure(root, x, groundY, opts) {
  opts = opts || {};
  const scale = opts.scale || 1;
  const cls = 'scene-figure' + (opts.staff ? ' scene-figure-staff' : ' scene-figure-customer');
  const g = svg('g', { class: cls, transform: `translate(${x} ${groundY})` });
  const bodyH = 20 * scale;
  const bodyW = 11 * scale;
  g.appendChild(svg('rect', {
    x: -bodyW / 2, y: -bodyH, width: bodyW, height: bodyH, rx: bodyW / 2.2,
    class: 'scene-figure-body',
  }));
  g.appendChild(svg('circle', { cx: 0, cy: -bodyH - 5 * scale, r: 5 * scale, class: 'scene-figure-head' }));
  if (opts.staff) {
    // small apron / cap mark so staff read as distinct without relying on colour alone
    g.appendChild(svg('rect', {
      x: -bodyW / 2, y: -bodyH * 0.55, width: bodyW, height: bodyH * 0.45,
      class: 'scene-figure-apron',
    }));
    g.appendChild(svg('rect', {
      x: -4 * scale, y: -bodyH - 9 * scale, width: 8 * scale, height: 3 * scale,
      class: 'scene-figure-cap',
    }));
  }
  if (opts.idle) g.setAttribute('class', g.getAttribute('class') + ' scene-figure-idle');
  root.appendChild(g);
  return g;
}

function customerRow(root, count, groundY, spanX) {
  count = clamp(count, 0, 8);
  if (count === 0) return;
  const startX = (VB_W - spanX) / 2 + 10;
  const step = count > 1 ? spanX / (count - 1 || 1) : 0;
  for (let i = 0; i < count; i++) {
    const x = count === 1 ? VB_W / 2 : startX + step * i;
    figure(root, x, groundY, { scale: 0.8 + (i % 2) * 0.06, idle: i % 3 === 0 });
  }
}

function staffRow(root, count, groundY, cx) {
  count = clamp(count, 0, 4);
  const spacing = 16;
  const start = cx - ((count - 1) * spacing) / 2;
  for (let i = 0; i < count; i++) {
    figure(root, start + i * spacing, groundY, { scale: 0.85, staff: true });
  }
}

// A stall / kiosk whose footprint grows with capacity.
function stall(root, cx, baseY, scale, opts) {
  opts = opts || {};
  const w = 76 * scale;
  const h = 46 * scale;
  const g = svg('g', { class: 'scene-stall', transform: `translate(${cx} ${baseY})` });

  // roof
  g.appendChild(svg('polygon', {
    points: `${-w / 2 - 8},${-h} ${w / 2 + 8},${-h} ${w / 2 - 2},${-h - 16} ${-w / 2 + 2},${-h - 16}`,
    class: 'scene-stall-roof',
  }));
  // awning stripes (shape-based, not colour-only)
  const stripeCount = 5;
  const stripeW = (w + 16) / stripeCount;
  for (let i = 0; i < stripeCount; i++) {
    g.appendChild(svg('rect', {
      x: -w / 2 - 8 + i * stripeW, y: -h - 16, width: stripeW, height: 5,
      class: i % 2 === 0 ? 'scene-stall-awning-a' : 'scene-stall-awning-b',
    }));
  }
  // wall
  g.appendChild(svg('rect', { x: -w / 2, y: -h, width: w, height: h, class: 'scene-stall-wall' }));
  // counter
  g.appendChild(svg('rect', {
    x: -w / 2 - 4, y: -h * 0.42, width: w + 8, height: h * 0.42,
    class: 'scene-stall-counter',
  }));
  // goods on counter — count nods to capacity
  const goods = clamp(Math.round(scale * 4), 1, 7);
  for (let i = 0; i < goods; i++) {
    g.appendChild(svg('circle', {
      cx: -w / 2 + 8 + i * ((w - 16) / Math.max(1, goods - 1 || 1)),
      cy: -h * 0.42 - 3, r: 3, class: 'scene-stall-goods',
    }));
  }
  if (opts.pot) {
    const potX = 0, potY = -h - 4;
    g.appendChild(svg('ellipse', { cx: potX, cy: potY, rx: 9, ry: 5, class: 'scene-pot' }));
    const steam = svg('path', {
      d: `M ${potX - 3} ${potY - 4} q 3 -8 0 -14 q -3 6 0 -12`,
      class: 'scene-steam',
    });
    g.appendChild(steam);
  }
  if (opts.closed) {
    g.appendChild(svg('rect', {
      x: -w / 2, y: -h * 0.42, width: w, height: h * 0.42, class: 'scene-stall-shutter',
    }));
  }
  root.appendChild(g);
  return { w, h };
}

function dimOverlay(root, amount) {
  if (amount <= 0) return;
  root.appendChild(svg('rect', {
    x: 0, y: 0, width: VB_W, height: VB_H,
    class: 'scene-dim-overlay', 'fill-opacity': clamp(amount, 0, 0.55),
  }));
}

function grimeOrSparkle(root, hygiene, cx, cy) {
  if (hygiene < 40) {
    const specks = [[-14, 4], [10, 8], [2, -4], [-6, 10]];
    specks.forEach(([dx, dy]) => {
      root.appendChild(svg('circle', {
        cx: cx + dx, cy: cy + dy, r: 1.6, class: 'scene-grime',

    const sparks = [[-16, -2], [14, 2], [0, -10]];
    sparks.forEach(([dx, dy]) => {
      const s = svg('path', {
        d: `M ${cx + dx} ${cy + dy - 4} L ${cx + dx} ${cy + dy + 4} M ${cx + dx - 4} ${cy + dy} L ${cx + dx + 4} ${cy + dy}`,
        class: 'scene-sparkle',
      });
      root.appendChild(s);
    });
  }
}

function formalityBadges(root, level, x, y) {
  const n = clamp(level, 0, 3);
  for (let i = 0; i < 3; i++) {
    const cx = x + i * 16;
    root.appendChild(svg('circle', {
      cx, cy: y, r: 6,
      class: 'scene-badge' + (i < n ? ' scene-badge-earned' : ' scene-badge-empty'),
    }));
    if (i < n) {
      root.appendChild(svg('path', {
        d: `M ${cx - 3} ${y} l 2 2.5 l 4 -5`,

}

function cashStack(root, cx, baseY, cash) {

}

// ---- scene builders --------------------------------------------------

function deriveCustomerCount(state) {
  const demand = state.demand == null ? 100 : state.demand;
  return clamp(Math.round(demand / 40), 0, 7);
}

function deriveScale(state) {
  const capacity = state.capacity == null ? 180 : state.capacity;
  return clamp(capacity / 180, 0.65, 1.7);
}

function buildStallScene(root, state, mode) {
  const day = mode !== 'night';
  skyGround(root, false);

  cloud(root, 230, 20, 0.7);
  sun(root, 40, 26, 15);

  const scale = deriveScale(state);
  let count = deriveCustomerCount(state);
  if (mode === 'empty') count = Math.min(count, 1);
  if (mode === 'busy') count = Math.max(count, 4);

  const { h } = stall(root, VB_W / 2, GROUND_Y, scale, { pot: true, closed: mode === 'empty' && (state.reputation ?? 50) < 20 });
  customerRow(root, count, GROUND_Y, 220);
  staffRow(root, state.staff || 0, GROUND_Y, VB_W / 2 - 40);
  grimeOrSparkle(root, state.hygiene == null ? 60 : state.hygiene, VB_W / 2, GROUND_Y - h - 20);

  const reputation = state.reputation == null ? 50 : state.reputation;
  if (reputation < 35) dimOverlay(root, (35 - reputation) / 60);
}
