"effects":{"reputation":-6,"demand":-18},"cause":{"en":"the old oil you only partly replaced","sw":"mafuta ya zamani uliyobadilisha kwa sehemu tu"}}]}]}},{"id":"t11","concept":"setback","conceptLabel":{"en":"A bad week","sw":"Wiki mbaya"},"scene":"stall-empty","situation":{"en":"A power cut ran for two days. Your fridge stopped. The milk for the chai spoiled, and so did a large batch of dough. You threw away a great deal of food. Two regular customers saw you doing it.","sw":"Umeme ulikatika kwa siku mbili. Friji yako ilisimama. Maziwa ya chai yaliharibika, na vilevile donge kubwa la unga uliokandwa. Ulitupa chakula kingi sana. Wateja wawili wa kawaida walikuona ukifanya hivyo."},"info":[{"id":"count-loss","label":{"en":"Work out exactly what you lost","sw":"Hesabu hasa ulichopoteza"},"costHours":2,"costCash":0,"reveals":{"en":"The wasted stock is most of a week's profit. Painful, but survivable. The bigger problem is the two customers who watched.","sw":"Bidhaa zilizopotea ni karibu faida ya wiki nzima. Inauma, lakini unaweza kuvumilia. Tatizo kubwa zaidi ni wale wateja wawili walioangalia."}}],"diagnose":{"prompt":{"en":"Which line caused this loss?","sw":"Ni kipengele gani kilisababisha hasara hii?"},"answer":"pnl.spoilage","options":["pnl.sales","pnl.costOfSales","pnl.rent","pnl.wages","pnl.fees","pnl.spoilage"],"right":{"en":"The wasted stock is the spoilage line. It is food you made but could not sell.","sw":"Bidhaa zilizopotea ziko kwenye kipengele cha spoilage. Ni chakula ulichotengeneza lakini hukuuza."},"wrong":{"en":"Look at the money-out lines. The loss came from stock that spoiled, not from rent or wages.","sw":"Angalia vipengele vya pesa iliyotoka. Hasara ilitoka kwenye bidhaa zilizoharibika, si kodi ya pango au mishahara."}},"decision":{"prompt":{"en":"What now?","sw":"Sasa nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"smaller-batches","label":{"en":"Make smaller batches more often","sw":"Tengeneza makundi madogo mara kwa mara"},"detail":{"en":"Less waste when something goes wrong. Slightly less efficient.","sw":"Upotevu mdogo kitu kikienda vibaya. Ufanisi kidogo pungufu."},"effects":{"unitCost":"-3","cash":-20000,"ownerHoursUsed":4},"predictAnswer":"same","outcome":{"en":"You lose a little efficiency and a lot of risk. The next time something goes wrong, you throw away far less.","sw":"Unapoteza ufanisi kidogo na hatari nyingi. Mara ijayo kitu kikienda vibaya, unatupa kidogo zaidi."},"lesson":{"en":"You cannot stop power cuts. You can decide how much they cost you when they happen.","sw":"Huwezi kuzuia kukatika kwa umeme. Unaweza kuamua kunakugharimu kiasi gani kunapotokea."}},{"id":"buy-generator","label":{"en":"Borrow money for a small generator","sw":"Kopa pesa ununue jenereta ndogo"},"detail":{"en":"Solves it properly. You take on a debt.","sw":"Inatatua vizuri. Unabeba deni."},"effects":{"unitCost":"-8","cash":-180000,"assetValue":180000,"rent":16000},"predictAnswer":"down","outcome":{"en":"The fridge stays cold. You now owe money and have a weekly repayment whether or not the power goes out.","sw":"Friji inabaki baridi. Sasa unadaiwa pesa na una marejesho ya wiki umeme ukikatika au usikatike."},"lesson":{"en":"Borrowing to fix a problem turns an occasional loss into a fixed cost. Sometimes worth it, and it must be paid every week regardless.","sw":"Kukopa ili kutatua tatizo kunageuza hasara ya mara chache kuwa gharama ya kudumu. Mara nyingine inafaa, na lazima ilipwe kila wiki bila kujali."}},{"id":"carry-on","label":{"en":"Absorb the loss and carry on as before","sw":"Vumilia hasara na uendelee kama zamani"},"detail":{"en":"It was bad luck. It may not happen again.","sw":"Ilikuwa bahati mbaya. Huenda isitokee tena."},"effects":{"cash":-5000},"predictAnswer":"same","outcome":{"en":"You rebuild your stock and continue. Nothing has changed about what happens next time.","sw":"Unajenga upya bidhaa zako na kuendelea. Hakuna kilichobadilika kuhusu kitakachotokea mara ijayo."},"lesson":{"en":"Treating a repeatable problem as bad luck means agreeing to pay for it again.","sw":"Kuchukulia tatizo linaloweza kujirudia kama bahati mbaya ni kukubali kulilipia tena."}}]},"advanceWeeks":2},{"id":"t12","concept":"owner-time","conceptLabel":{"en":"Your own hours","sw":"Masaa yako mwenyewe"},"scene":"kitchen","situation":{"en":"You have not had a full day off in months. You open, you fry, you sell, you close. Someone asks when you last spent an hour thinking about where the business is going, rather than working in it. You cannot remember.","sw":"Hujapata siku nzima ya mapumziko kwa miezi. Unafungua, unakaanga, unauza, unafunga. Mtu anakuuliza ni lini mara ya mwisho ulitumia saa moja kufikiria biashara inakoelekea, badala ya kuifanyia kazi. Hukumbuki."},"info":[{"id":"count-own-hours","label":{"en":"Write down where your hours actually go","sw":"Andika masaa yako yanakoenda hasa"},"costHours":2,"costCash":0,"reveals":{"en":"Almost all of it is work anyone could be trained to do. The parts only you can do — choosing what to sell, setting prices, deciding who to serve — get whatever is left, which is nothing.","sw":"Karibu yote ni kazi ambayo mtu yeyote angeweza kufundishwa kuifanya. Sehemu ambazo wewe pekee unaweza — kuchagua cha kuuza, kupanga bei, kuamua wa kumhudumia — zinapata kilichobaki, ambacho ni hakuna."}}],"decision":{"type":"number","prompt":{"en":"How many hours each week will you protect for work on the business?","sw":"Kila wiki utatenga masaa mangapi kuifanyia biashara mipango?"},"predict":"number","input":{"field":"ownerHoursUsed","min":5,"max":15,"step":5,"start":0,"valueAs":"count","unit":{"en":"hours a week","sw":"saa kwa wiki"},"hint":{"en":"These hours are for planning, not for selling.","sw":"Masaa haya ni ya kupanga, si ya kuuza."},"responses":[{"field":"capacity","perStep":5,"change":40},{"field":"demand","perStep":5,"change":25},{"field":"unitCost","perStep":5,"change":15}]},"bands":[{"outcome":{"en":"You keep nearly all your selling time, but little time goes to the decisions only you can make.","sw":"Unaweka karibu muda wote wa kuuza, lakini muda mchache unaenda kwenye maamuzi ambayo wewe pekee unaweza kufanya."},"lesson":{"en":"Working in the business can fill the week and leave no space to work on it.","sw":"Kuifanyia biashara kazi kunaweza kujaza wiki na kusiache nafasi ya kuifanyia mipango."},"upTo":5},{"outcome":{"en":"You protect some time to look at customers, prices and the next step. You organize more output, but each unit costs more as you step away from frying.","sw":"Unatenga muda wa kuangalia wateja, bei na hatua inayofuata. Unapanga uzalishaji zaidi, lakini kila kimoja kinagharimu zaidi unapoacha kukaanga."},"lesson":{"en":"Time on the business is useful when it changes what the business does. The middle amount leaves room for both.","sw":"Muda wa kuifanyia biashara mipango unasaidia unapobadilisha kile biashara inachofanya. Kiasi cha kati kinaacha nafasi ya yote mawili."},"upTo":15},{"outcome":{"en":"You spend many hours planning. Demand and capacity rise, but the cost of each unit rises too as you step away from production.","sw":"Unatumia masaa mengi kupanga. Mahitaji na uwezo wa uzalishaji vinaongezeka, lakini gharama ya kila kimoja pia inapanda unapoacha uzalishaji."},"lesson":{"en":"Time set aside has an opportunity cost. Protect enough to steer, but not so much that selling stops.","sw":"Muda uliotengwa una gharama ya kuacha kitu kingine. Tenga wa kutosha kuongoza, lakini si mwingi kiasi cha kuuza kusimama."}}]}},{"id":"t13","concept":"hiring","conceptLabel":{"en":"Hiring","sw":"Kuajiri"},"scene":"kitchen","situation":{"en":"You are working from four in the morning until seven at night. Your niece has offered to help. She is reliable but knows nothing about the work, and she would need paying.","sw":"Unafanya kazi kuanzia saa kumi alfajiri hadi saa moja usiku. Mpwa wako amejitolea kusaidia. Ni wa kuaminika lakini hajui chochote kuhusu kazi, na angehitaji kulipwa."},"info":[{"id":"count-hours","label":{"en":"Add up your own hours honestly","sw":"Jumlisha masaa yako mwenyewe kwa ukweli"},"costHours":1,"costCash":0,"reveals":{"en":"You are working around seventy hours a week. You have not had a full day off in four months.","sw":"Unafanya kazi takriban masaa sabini kwa wiki. Hujapata siku nzima ya mapumziko kwa miezi minne."}}],"decision":{"type":"number","prompt":{"en":"How many people will you take on this week?","sw":"Wiki hii utachukua watu wangapi wa kukusaidia?"},"predict":"number","input":{"field":"staff","min":0,"max":3,"step":1,"start":"current","valueAs":"count","unit":{"en":"people","sw":"watu"},"hint":{"en":"Each person adds a weekly wage. Their extra output must pay for it.","sw":"Kila mtu anaongeza mshahara wa wiki. Kazi yake ya ziada lazima ilipie."},"responses":[{"field":"capacity","perStep":1,"change":180},{"field":"demand","perStep":1,"change":160}]},"bands":[{"outcome":{"en":"You keep the whole margin and keep doing the work yourself. There is no new capacity for waiting customers.","sw":"Unabaki na margin yote na unaendelea kufanya kazi mwenyewe. Hakuna uwezo mpya kwa wateja wanaosubiri."},"lesson":{"en":"Not hiring protects this week's cash, but leaves the business tied to your own two hands.","sw":"Kutoajiri kunalinda pesa ya wiki hii, lakini kunaacha biashara ifungwe na mikono yako miwili."},"upTo":0},{"outcome":{"en":"One person gives the stall room to serve more customers. The wage is real, so extra sales must cover it.","sw":"Mtu mmoja anaipa biashara nafasi ya kuhudumia wateja zaidi. Mshahara ni gharama halisi, kwa hiyo mauzo ya ziada lazima yaulipie."},"lesson":{"en":"A first hire can remove a bottleneck. Hire for work that produces more than the wage.","sw":"Mwajiriwa wa kwanza anaweza kuondoa kikwazo. Ajiri kwa kazi inayozalisha zaidi ya mshahara."},"upTo":1},{"outcome":{"en":"More people add output, but the next wage arrives even when customers do not. Later hires bring less room than the first.","sw":"Watu zaidi wanaongeza uzalishaji, lakini mshahara unaofuata unakuja hata bila wateja. Waajiriwa wa baadaye wanaongeza nafasi kidogo kuliko wa kwanza."},"lesson":{"en":"Hiring has a point where another person costs more than the sales they add. Build one useful role at a time.","sw":"Kuajiri kuna sehemu ambapo mtu mwingine anagharimu zaidi ya mauzo anayoongeza. Jenga nafasi moja yenye kazi ya maana kwa wakati."}}]}},{"id":"t14","concept":"delegation","conceptLabel":{"en":"Delegation","sw":"Kukabidhi kazi"},"scene":"stall-busy","situation":{"en":"Your helper is competent now. But you still do the buying, the frying, the pricing and the money. She waits for you to tell her what to do next, and she often waits a long time.","sw":"Msaidizi wako sasa ana uwezo. Lakini bado wewe ndiye unanunua, unakaanga, unapanga bei na unashika pesa. Anasubiri umwambie afanye nini kinachofuata, na mara nyingi anasubiri muda mrefu."},"info":[{"id":"watch-her","label":{"en":"Watch how much time she spends waiting","sw":"Angalia muda anaotumia kusubiri"},"costHours":2,"costCash":0,"reveals":{"en":"She spends nearly two hours a day waiting for you to be free. You are paying her to stand still.","sw":"Anatumia karibu masaa mawili kwa siku akisubiri uwe huru. Unamlipa asimame tu."}}],"decision":{"prompt":{"en":"What do you change?","sw":"Unabadilisha nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"hand-over-buying","label":{"en":"Hand her the morning buying, with a written list and a fixed budget","sw":"Mkabidhi manunuzi ya asubuhi, kwa orodha iliyoandikwa na bajeti maalum"},"detail":{"en":"She will make mistakes at first. You will not be there to correct them.","sw":"Atafanya makosa mwanzoni. Hutakuwepo kumsahihisha."},"effects":{"capacity":28,"demand":28,"ownerHoursUsed":-12,"reputation":4},"predictAnswer":"up_bit","outcome":{"en":"She buys the wrong flour once. After that she is better at it than you, because she is doing it every single day.","sw":"Ananunua unga usio sahihi mara moja. Baada ya hapo ni bora kuliko wewe, kwa sababu anafanya kila siku."},"lesson":{"en":"Handing over a task means handing over the decisions inside it. If you keep the decisions, you have not actually delegated anything.","sw":"Kukabidhi kazi kunamaanisha kukabidhi maamuzi yaliyomo ndani yake. Ukibakiza maamuzi, hujakabidhi chochote."}},{"id":"detailed-instructions","label":{"en":"Give her more detailed instructions each morning","sw":"Mpe maelekezo ya kina zaidi kila asubuhi"},"detail":{"en":"Keep control, reduce the waiting.","sw":"Shikilia udhibiti, punguza kusubiri."},"effects":{"ownerHoursUsed":2,"capacity":3},"predictAnswer":"same","outcome":{"en":"She waits slightly less. You now spend part of every morning writing instructions instead of working.","sw":"Anasubiri kidogo pungufu. Sasa unatumia sehemu ya kila asubuhi kuandika maelekezo badala ya kufanya kazi."},"lesson":{"en":"Giving instructions is not delegation. You are still the person the whole business waits for.","sw":"Kutoa maelekezo si kukabidhi. Bado wewe ndiye mtu ambaye biashara nzima inamsubiri."}},{"id":"keep-control","label":{"en":"Keep doing the important parts yourself","sw":"Endelea kufanya sehemu muhimu mwenyewe"},"detail":{"en":"Mistakes are expensive.","sw":"Makosa ni ghali."},"effects":{"ownerHoursUsed":3},"predictAnswer":"same","outcome":{"en":"Nothing goes wrong. Nothing gets better either. She keeps waiting.","sw":"Hakuna kinachoenda vibaya. Wala hakuna kinachoboreka. Anaendelea kusubiri."},"lesson":{"en":"The cost of never delegating is invisible. It is everything the business did not do while waiting for you.","sw":"Gharama ya kutokabidhi kamwe haionekani. Ni kila kitu biashara isichokifanya ikikusubiri."}}]}},{"id":"t15","concept":"formalisation","conceptLabel":{"en":"Becoming official","sw":"Kuwa rasmi"},"scene":"office","unverified":true,"situation":{"en":"A hotel wants to buy from you regularly. It would be your largest customer. Their buyer explains that they can only buy from registered businesses that can issue a proper receipt. You have never registered anything.","sw":"Hoteli inataka kununua kwako mara kwa mara. Ingekuwa mteja wako mkubwa zaidi. Mnunuzi wao anaeleza kwamba wanaweza kununua tu kutoka kwa biashara zilizosajiliwa zinazoweza kutoa risiti halali. Hujawahi kusajili chochote."},"info":[{"id":"ask-around","label":{"en":"Ask other traders what registering involved","sw":"Waulize wafanyabiashara wengine usajili ulihusisha nini"},"costHours":6,"costCash":0,"reveals":{"en":"Answers vary a lot. Everyone agrees it took longer than they expected and cost more than the official amount, once travel and repeat visits were counted.","sw":"Majibu yanatofautiana sana. Wote wanakubali ilichukua muda mrefu kuliko walivyotegemea na iligharimu zaidi ya kiasi rasmi, ukihesabu safari na ziara za kurudia."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"register","label":{"en":"Start the registration process","sw":"Anza mchakato wa usajili"},"detail":{"en":"Money and many days of your time, before any benefit arrives.","sw":"Pesa na siku nyingi za muda wako, kabla faida yoyote haijafika."},"effects":{"formality":1,"cash":-95000,"ownerHoursUsed":10,"licenceFees":6000},"predictAnswer":"down","outcome":{"en":"It takes weeks of queuing and several trips. You pay fees, and you lose mornings you would have been selling. The hotel contract has not started yet.","sw":"Inachukua wiki za kupanga foleni na safari kadhaa. Unalipa ada, na unapoteza asubuhi ambazo ungekuwa unauza. Mkataba wa hoteli bado haujaanza."},"lesson":{"en":"Formalising costs real money and a lot of time before it earns anything. Most people are surprised by the time, not the money.","sw":"Kuwa rasmi kunagharimu pesa halisi na muda mwingi kabla ya kuleta chochote. Watu wengi wanashangazwa na muda, si pesa."}},{"id":"informal-deal","label":{"en":"Ask the hotel to pay you informally","sw":"Iombe hoteli ikulipe bila utaratibu rasmi"},"detail":{"en":"No paperwork, no cost.","sw":"Hakuna karatasi, hakuna gharama."},"effects":{"reputation":-4},"predictAnswer":"same","outcome":{"en":"The buyer says he cannot. His own accounts have to show where the money went. He is apologetic and firm.","sw":"Mnunuzi anasema hawezi. Hesabu zake mwenyewe lazima zionyeshe pesa ilikoenda. Anaomba radhi lakini yuko imara."},"lesson":{"en":"Your customer's rules are often set by someone above them. Staying informal does not just limit you — it locks you out of certain customers entirely.","sw":"Sheria za mteja wako mara nyingi zinawekwa na mtu aliye juu yake. Kubaki bila usajili hakukuzuii tu — kunakufungia nje ya wateja fulani kabisa."}},{"id":"stay-informal","label":{"en":"Let the hotel go and stay as you are","sw":"Iache hoteli na ubaki ulivyo"},"detail":{"en":"Your current customers do not ask for receipts.","sw":"Wateja wako wa sasa hawaombi risiti."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes this week. The hotel finds another supplier, and so does the next one who asks the same question.","sw":"Hakuna kinachobadilika wiki hii. Hoteli inapata msambazaji mwingine, na vivyo hivyo anayefuata anayeuliza swali lilelile."},"lesson":{"en":"Staying informal has no cost today. Its cost is the ceiling it puts on which customers you can ever serve.","sw":"Kubaki bila usajili hakuna gharama leo. Gharama yake ni kikomo kinachowekwa kwa wateja unaoweza kuwahudumia."},"later":[{"inWeeks":5,"effects":{"demand":-30},"cause":{"en":"the customers who need a receipt you cannot give","sw":"wateja wanaohitaji risiti usiyoweza kuitoa"}}]}]},"advanceWeeks":3},{"id":"t16","concept":"quality-assurance","conceptLabel":{"en":"Quality you can prove","sw":"Ubora unaoweza kuthibitisha"},"scene":"inspection","unverified":true,"situation":{"en":"The hotel's buyer wants to visit your kitchen before signing anything. He will look at how you store food, how you handle it, and whether you can show what you did yesterday.","sw":"Mnunuzi wa hoteli anataka kutembelea jikoni kwako kabla ya kusaini chochote. Ataangalia jinsi unavyohifadhi chakula, jinsi unavyokishika, na kama unaweza kuonyesha ulichofanya jana."},"info":[{"id":"walk-through","label":{"en":"Walk through your own kitchen as if you were him","sw":"Pita jikoni kwako mwenyewe kana kwamba wewe ni yeye"},"costHours":2,"costCash":0,"reveals":{"en":"The dough is covered. The floor is clean. But there is no way to show what you did yesterday, or where the flour came from.","sw":"Unga uliokandwa umefunikwa. Sakafu ni safi. Lakini hakuna njia ya kuonyesha ulichofanya jana, wala unga ulikotoka."}}],"decision":{"prompt":{"en":"How do you prepare?","sw":"Unajiandaaje?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"prepare-properly","label":{"en":"Clean up and start writing down what you make and where it came from","sw":"Safisha na uanze kuandika unachotengeneza na kilikotoka"},"detail":{"en":"Sealed containers and a written record, every day from now on.","sw":"Vyombo vilivyofungwa na kumbukumbu iliyoandikwa, kila siku kuanzia sasa."},"effects":{"hygiene":25,"keepsRecords":true,"ownerHoursUsed":5,"cash":-25000,"rent":6000},"predictAnswer":"down","outcome":{"en":"The visit goes well. He is more impressed by the written records than by the clean floor, because the records show it was clean yesterday too.","sw":"Ziara inaenda vizuri. Amevutiwa zaidi na kumbukumbu zilizoandikwa kuliko sakafu safi, kwa sababu kumbukumbu zinaonyesha ilikuwa safi jana pia."},"lesson":{"en":"Quality that you cannot show is quality your customer cannot buy. Being clean and proving you are clean are two different things.","sw":"Ubora usioweza kuuonyesha ni ubora ambao mteja wako hawezi kuununua. Kuwa safi na kuthibitisha kwamba u safi ni mambo mawili tofauti."}},{"id":"clean-only","label":{"en":"Give everything a deep clean the day before","sw":"Fanya usafi wa kina siku moja kabla"},"detail":{"en":"Make a good impression.","sw":"Toa taswira nzuri."},"effects":{"hygiene":12,"ownerHoursUsed":3,"cash":-8000},"predictAnswer":"same","outcome":{"en":"The kitchen looks excellent. He asks what you did last Tuesday and you cannot tell him. He says he will think about it.","sw":"Jiko linaonekana bora sana. Anauliza ulifanya nini Jumanne iliyopita na huwezi kumwambia. Anasema atafikiria."},"lesson":{"en":"A one-day clean shows what you can do once. A buyer is trying to find out what you do every day.","sw":"Usafi wa siku moja unaonyesha unachoweza kufanya mara moja. Mnunuzi anajaribu kujua unachofanya kila siku."}},{"id":"no-prep","label":{"en":"Let him come as things are","sw":"Mwache aje kama mambo yalivyo"},"detail":{"en":"You have nothing to hide.","sw":"Huna cha kuficha."},"effects":{"reputation":-6},"predictAnswer":"same","outcome":{"en":"He is polite. He notices the oil container without a lid, and he does not sign.","sw":"Ana adabu. Anaona chombo cha mafuta bila mfuniko, na hasaini."},"lesson":{"en":"A buyer inspecting you is managing their own risk. What is normal to you may be unacceptable to them.","sw":"Mnunuzi anayekukagua anasimamia hatari yake mwenyewe. Kinachokuwa cha kawaida kwako kinaweza kisikubalike kwake."},"later":[{"inWeeks":3,"effects":{"reputation":-10,"demand":-25},"cause":{"en":"the kitchen inspection you did not prepare for","sw":"ukaguzi wa jikoni ambao hukujiandaa kwa ajili yake"}}]}]}},{"id":"t17","concept":"reinvestment","conceptLabel":{"en":"What to do with profit","sw":"Nini cha kufanya na faida"},"scene":"stall-busy","situation":{"en":"For the first time you have real money left over at the end of the month, after everything is paid. Your family knows it. There are things at home that need doing. Whatever you take out now, the stall trades the next six weeks without it.","sw":"Kwa mara ya kwanza una pesa halisi iliyobaki mwisho wa mwezi, baada ya kila kitu kulipwa. Familia yako inajua. Kuna mambo nyumbani yanayohitaji kufanyika. Chochote utakachotoa sasa, kibanda kitafanya biashara wiki sita zijazo bila hicho."},"info":[{"id":"list-options","label":{"en":"Write down what the money could do","sw":"Andika pesa ingeweza kufanya nini"},"costHours":1,"costCash":0,"reveals":{"en":"The roof at home needs repair. A second fryer would let you take the order you turned down last week. Some of it should probably just sit in the box for emergencies.","sw":"Paa la nyumbani linahitaji matengenezo. Mashine ya pili ya kukaanga ingekuwezesha kuchukua oda uliyoikataa wiki iliyopita. Sehemu yake pengine inapaswa kubaki tu sandukuni kwa dharura."}}],"decision":{"type":"allocate","prompt":{"en":"How will you split this profit?","sw":"Utagawanya vipi faida hii?"},"predict":"number","allocate":{"amountFrom":"cash","fraction":0.6,"step":10000,"buckets":[{"id":"business","label":{"en":"Business","sw":"Biashara"},"perStep":{"capacity":6,"demand":6,"assetValue":10000,"rent":1200}},{"id":"home","label":{"en":"Home","sw":"Nyumbani"},"perStep":{}},{"id":"reserve","label":{"en":"Keep as reserve","sw":"Weka kama akiba"},"perStep":{},"keepsCash":true}]},"bands":[{"outcome":{"en":"You protect most of the money for home and emergencies. The business gets only a small push, so growth is slower.","sw":"Unalinda pesa nyingi kwa nyumbani na dharura. Biashara inapata msukumo mdogo, kwa hiyo ukuaji ni wa polepole."},"lesson":{"en":"A reserve can keep one bad week from becoming a crisis. It also means slower business growth.","sw":"Akiba inaweza kuzuia wiki moja mbaya kuwa tatizo kubwa. Pia inamaanisha biashara ikue polepole."},"upTo":0.3},{"outcome":{"en":"You divide the money between business, home and a reserve. No part gets everything, but the business grows without using every coin.","sw":"Unagawa pesa kati ya biashara, nyumbani na akiba. Sehemu hakuna inayopata kila kitu, lakini biashara inakua bila kutumia kila senti."},"lesson":{"en":"Profit has more than one job. A split can keep the household, business and next bad week in view. New capacity also brings a weekly cost.","sw":"Faida ina kazi zaidi ya moja. Mgawanyo unaweza kuangalia kaya, biashara na wiki mbaya inayofuata. Uwezo mpya pia huleta gharama ya wiki."},"upTo":0.7},{"outcome":{"en":"You put most of the money into the business. More customers can be served, but little is left for home or a surprise cost.","sw":"Unaweka pesa nyingi kwenye biashara. Wateja zaidi wanaweza kuhudumiwa, lakini kidogo kinabaki nyumbani au kwa gharama ya ghafla."},"lesson":{"en":"Reinvestment can build capacity, but new capacity brings a weekly cost and a business without a reserve is exposed. Growth and safety are both real needs.","sw":"Kurudisha faida kunaweza kujenga uwezo, lakini uwezo mpya huleta gharama ya wiki na biashara bila akiba iko wazi kwa hatari. Ukuaji na usalama vyote ni mahitaji halisi."}}]}},{"id":"t18","concept":"compliance-cost","conceptLabel":{"en":"Staying official","sw":"Kubaki rasmi"},"scene":"office","situation":{"en":"You are registered now. A letter arrives about filing your returns. There is also a licence to renew every year and an inspection fee nobody mentioned when you signed up.","sw":"Sasa umesajiliwa. Barua inafika kuhusu kuwasilisha marejesho yako. Pia kuna leseni ya kuhuisha kila mwaka na ada ya ukaguzi ambayo hakuna aliyeitaja ulipojisajili."},"advanceWeeks":2,"info":[{"id":"ask-what-is-owed","label":{"en":"Find out what is actually owed and when","sw":"Tafuta kinachodaiwa hasa na lini"},"costHours":4,"costCash":5000,"reveals":{"en":"The amounts themselves are manageable. The penalties for filing late are not, and they grow every month you leave it.","sw":"Viwango vyenyewe vinawezekana. Adhabu za kuchelewa kuwasilisha haziwezekani, na zinakua kila mwezi unapoiacha."}}],"decision":{"prompt":{"en":"How do you handle it?","sw":"Unalishughulikiaje?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"pay-bookkeeper","label":{"en":"Pay someone to keep the books and file for you","sw":"Mlipe mtu atunze hesabu na awasilishe kwa niaba yako"},"detail":{"en":"A cost every week. It is handled and it stays handled.","sw":"Gharama kila wiki. Inashughulikiwa na inabaki imeshughulikiwa."},"effects":{"licenceFees":8000},"predictAnswer":"down","outcome":{"en":"Your profit falls by what you pay her. The filings go in on time and you stop thinking about it.","sw":"Faida yako inashuka kwa kiasi unachomlipa. Marejesho yanawasilishwa kwa wakati na unaacha kuwaza kuhusu hilo."},"lesson":{"en":"Compliance is a running cost of being the kind of business a hotel can buy from. It does not stop after registration — that is the part people are not told.","sw":"Kufuata sheria ni gharama endelevu ya kuwa biashara ambayo hoteli inaweza kununua kwake. Hakuishii baada ya usajili — hiyo ndiyo sehemu watu hawaambiwi."}},{"id":"diy-filing","label":{"en":"Learn to do the filing yourself in the evenings","sw":"Jifunze kuwasilisha mwenyewe jioni"},"detail":{"en":"No money leaves your hand.","sw":"Hakuna pesa inayotoka mkononi mwako."},"effects":{"ownerHoursFixed":7},"predictAnswer":"same","outcome":{"en":"It costs you nothing in money and seven hours a week that used to be sleep. The filings go in, late twice.","sw":"Haikugharimu pesa yoyote na masaa saba kwa wiki yaliyokuwa ya kulala. Marejesho yanawasilishwa, yakiwa yamechelewa mara mbili."},"lesson":{"en":"Your own hours are the one cost that never appears in the accounts, which is why they are the first thing spent.","sw":"Masaa yako mwenyewe ndiyo gharama pekee isiyoonekana kwenye hesabu, ndiyo sababu ndiyo kitu cha kwanza kutumika."}},{"id":"ignore-letter","label":{"en":"Put the letter aside and deal with it later","sw":"Weka barua kando uishughulikie baadaye"},"detail":{"en":"There is a queue of more urgent things.","sw":"Kuna foleni ya mambo ya dharura zaidi."},"effects":{},"later":[{"inWeeks":4,"effects":{"cash":-55000,"licenceFees":6000},"cause":{"en":"the tax letter you left unopened","sw":"barua ya kodi uliyoiacha bila kuifungua"}}],"predictAnswer":"same","outcome":{"en":"Nothing happens this week. The letter sits where you put it and the business runs exactly as it did.","sw":"Hakuna kinachotokea wiki hii. Barua inakaa ulipoiweka na biashara inaenda sawasawa kama ilivyokuwa."},"lesson":{"en":"A compliance problem costs nothing at all until the moment it costs a great deal, and by then the penalty is larger than the bill was.","sw":"Tatizo la kufuata sheria haligharimu kitu hadi dakika linapogharimu sana, na hapo adhabu inakuwa kubwa kuliko bili ilivyokuwa."}}]}},{"id":"t19","concept":"concentration-risk","conceptLabel":{"en":"Depending on one customer","sw":"Kutegemea mteja mmoja"},"scene":"office","situation":{"en":"The hotel now takes more than half of everything you make. It is your best customer by far, and paying you on time. Your other customers have slowly drifted since you started prioritising the hotel order.","sw":"Hoteli sasa inachukua zaidi ya nusu ya kila unachotengeneza. Ni mteja wako bora kwa mbali, na analipa kwa wakati. Wateja wako wengine wamepungua polepole tangu ulipoanza kuipa kipaumbele oda ya hoteli."},"info":[{"id":"check-share","label":{"en":"Work out how much of your business the hotel is","sw":"Hesabu hoteli ni sehemu gani ya biashara yako"},"costHours":1,"costCash":0,"reveals":{"en":"They are about sixty percent of your sales. If they left tomorrow you could not cover your rent and wages.","sw":"Ni takriban asilimia sitini ya mauzo yako. Wakiondoka kesho usingeweza kulipa kodi na mishahara."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"find-second-buyer","label":{"en":"Spend time finding a second buyer of similar size","sw":"Tumia muda kutafuta mnunuzi wa pili wa ukubwa unaofanana"},"detail":{"en":"Time away from the work you already have.","sw":"Muda mbali na kazi uliyo nayo tayari."},"effects":{"ownerHoursUsed":8,"demand":25,"capacity":25,"cash":-10000},"predictAnswer":"up_bit","outcome":{"en":"It takes weeks and several refusals. You find a second hotel that takes a smaller order. Neither one can now sink you on their own.","sw":"Inachukua wiki na makatao kadhaa. Unapata hoteli ya pili inayochukua oda ndogo zaidi. Sasa hakuna hata mmoja anayeweza kukuzamisha peke yake."},"lesson":{"en":"The time to find your second big customer is while your first one is happy, not after they leave.","sw":"Wakati wa kutafuta mteja wako mkubwa wa pili ni pale wa kwanza akiwa bado ana furaha, si baada ya kuondoka."}},{"id":"serve-hotel-more","label":{"en":"Give the hotel even more of your attention","sw":"Ipe hoteli uangalifu zaidi"},"detail":{"en":"They are your best customer. Keep them very happy.","sw":"Ni mteja wako bora. Mfanye awe na furaha sana."},"effects":{"demand":20,"capacity":20,"reputation":-5,"ownerHoursUsed":5},"predictAnswer":"up_bit","outcome":{"en":"They are delighted. You are now almost entirely dependent on one buyer, who knows it.","sw":"Wana furaha sana. Sasa unategemea karibu kabisa mnunuzi mmoja, ambaye anajua hivyo."},"lesson":{"en":"A customer who accounts for most of your sales does not just buy from you. They set your prices, because you cannot afford to say no.","sw":"Mteja anayechukua sehemu kubwa ya mauzo yako hanunui tu kwako. Anapanga bei zako, kwa sababu huwezi kumudu kusema hapana."}},{"id":"do-nothing-risk","label":{"en":"Leave it. Nothing is wrong right now","sw":"Iache. Hakuna kilichoharibika kwa sasa"},"detail":{"en":"They are paying on time.","sw":"Wanalipa kwa wakati."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing happens this week. Your exposure is exactly the same as it was.","sw":"Hakuna kinachotokea wiki hii. Hatari yako ni ileile kama ilivyokuwa."},"lesson":{"en":"Concentration risk causes no problems at all, right up until the moment it causes every problem at once.","sw":"Hatari ya kutegemea mteja mmoja haileti tatizo lolote, hadi dakika inayoleta matatizo yote kwa mara moja."}}]},"advanceWeeks":3},{"id":"t20","concept":"negotiation","conceptLabel":{"en":"Holding your price","sw":"Kushikilia bei yako"},"scene":"office","situation":{"en":"The hotel buyer asks for a discount. He says another supplier has quoted him lower. He also mentions, almost in passing, that they would like delivery seven mornings a week instead of five.","sw":"Mnunuzi wa hoteli anaomba punguzo. Anasema msambazaji mwingine amempa bei ya chini. Pia anataja, karibu kwa kupita tu, kwamba wangependa bidhaa zifike asubuhi saba kwa wiki badala ya tano."},"info":[{"id":"check-margin","label":{"en":"Work out what the discount would leave you","sw":"Hesabu punguzo lingekuachia nini"},"costHours":2,"costCash":0,"reveals":{"en":"The discount alone you could absorb. The discount plus two more delivery mornings takes more than it gives.","sw":"Punguzo peke yake ungeweza kulivumilia. Punguzo pamoja na asubuhi mbili zaidi za kupeleka kinachukua zaidi ya kinachotoa."}}],"decision":{"type":"number","prompt":{"en":"Set the price you will offer the hotel.","sw":"Panga bei utakayompa hoteli."},"predict":"number","input":{"field":"price","min":400,"max":750,"step":25,"start":"current","valueAs":"money","hint":{"en":"The hotel wants a discount. A lower price should buy you a larger order.","sw":"Hoteli inataka punguzo. Bei ya chini inapaswa kukuletea oda kubwa zaidi."},"responses":[{"field":"demand","perStep":25,"change":-13}]},"bands":[{"outcome":{"en":"The hotel gets a large discount. More units may move, but each one leaves less after cost and delivery work.","sw":"Hoteli inapata punguzo kubwa. Bidhaa nyingi zinaweza kuondoka, lakini kila moja linakuachia kidogo baada ya gharama na kazi ya kupeleka."},"lesson":{"en":"A discount is useful only when the extra order pays for what you give up on each unit.","sw":"Punguzo linafaa tu wakati oda ya ziada inalipia unachoacha kwa kila kimoja."},"upTo":450},{"outcome":{"en":"You offer a middle price. The hotel has a reason to order more, while you keep enough from each unit.","sw":"Unatoa bei ya kati. Hoteli ina sababu ya kuagiza zaidi, huku ukibaki na kiasi cha kutosha kwa kila kimoja."},"lesson":{"en":"Negotiate the whole order, not only the price. Volume can pay for a smaller margin when the numbers are visible.","sw":"Jadili oda yote, si bei tu. Wingi unaweza kulipia margin ndogo wakati namba zinaonekana."},"upTo":600},{"outcome":{"en":"You protect the price on each unit, but the hotel wants fewer at that price. Margin is close to the volume you lose.","sw":"Unalinda bei kwa kila kimoja, lakini hoteli inataka vichache kwa bei hiyo. Margin iko karibu na wingi unaopoteza."},"lesson":{"en":"Ask what volume or certainty comes with a discount before you give one.","sw":"Uliza ni wingi au uhakika gani unaokuja na punguzo kabla hujatoa."}}]}}]},"scenario-bakery.json":{"id":"bakery","version":2,"unverified":true,"title":{"en":"Asha's Bakery","sw":"Bakery ya Asha"},"blurb":{"en":"Run a small bakery where profit can arrive before the money does.","sw":"Endesha bakery ndogo ambako faida inaweza kuonekana kabla pesa haijaingia."},"currency":"TZS","_bandsNote":"This chapter keeps the engine's default prediction edges: 1,500 for \"about the same\" and 12,000 for \"up a lot\". The option effects were authored against these readable edges.","bands":{"same":2000,"lot":21200},"startState":{"cash":900000,"spoilRate":0.35,"rent":180000,"staff":1,"wagePerStaff":90000,"reputation":55,"hygiene":65,"formality":1,"ownerHours":70,"ownerHoursFixed":20,"hoursPerCapacity":0.05,"hoursPerStaff":12,"assetValue":3000000,"assetLifeWeeks":250,"inventoryWeeks":1,"creditorWeeks":1,"lines":[{"id":"bread","label":{"en":"Bread","sw":"Mikate"},"price":1200,"unitCost":800,"demand":500,"capacity":500},{"id":"mandazi","label":{"en":"Mandazi","sw":"Mandazi"},"price":500,"unitCost":300,"demand":400,"capacity":400},{"id":"cake","label":{"en":"Cakes to order","sw":"Keki za oda"},"price":12000,"unitCost":6500,"demand":12,"capacity":15}]},"carryIn":[{"flag":"keepsRecords","when":true,"startState":{"keepsRecords":true,"ownerHoursFixed":18},"note":{"en":"You arrive with a simple book of sales and spending. You do not have to start from memory.","sw":"Unafika na daftari rahisi la mauzo na matumizi. Huanzi kwa kukumbuka tu."}},{"flag":"formality","atLeast":2,"startState":{"formality":2,"licenceFees":5000},"note":{"en":"You arrive with some formal footing already in place. It opens a door, and it also has a running cost.","sw":"Unafika ukiwa tayari umeanza kuwa rasmi. Hii inafungua mlango, na pia ina gharama inayoendelea."}}],"goal":{"title":{"en":"Three things to keep in view","sw":"Mambo matatu ya kuyaangalia"},"description":{"en":"This goal gives your run a direction. It is not a pass mark. You can finish without every condition; the record reports what was true at the end.","sw":"Lengo hili linakupa mwelekeo katika safari yako. Si alama ya kufaulu. Unaweza kumaliza bila kutimiza kila sharti; kumbukumbu itaonyesha hali ya mwisho."},"conditions":[{"id":"weekly-profit","label":{"en":"Your latest week leaves a positive profit after its costs.","sw":"Wiki yako ya mwisho inaacha faida baada ya gharama zake."},"metric":"weeklyProfit","min":0},{"id":"cash-buffer","label":{"en":"Your cash covers at least two weeks of the business's costs.","sw":"Pesa yako inatosha kugharamia angalau wiki mbili za gharama za biashara."},"metric":"weeksOfCostsCovered","min":2},{"id":"cash-cycle","label":{"en":"Money is tied up in the trading cycle for no more than four weeks.","sw":"Pesa imefungwa kwenye mzunguko wa biashara kwa muda usiozidi wiki nne."},"metric":"cashCycleWeeks","max":4}]},"recovery":{"id":"recovery","concept":"recovery","conceptLabel":{"en":"Trading out of a cash hole","sw":"Kutoka kwenye shimo la pesa"},"scene":"kitchen","unverified":true,"situation":{"en":"Your cash has gone below zero. The bakery is still open, but flour, wages and the next oven payment are due before enough customer money reaches you. This is a hard week, not the end of the bakery.","sw":"Pesa yako imeshuka chini ya sifuri. Bakery bado iko wazi, lakini unga, mishahara na malipo ya oveni yanayofuata vinatakiwa kabla pesa ya kutosha kutoka kwa wateja haijakufikia. Hii ni wiki ngumu, si mwisho wa bakery."},"info":[{"id":"map-bakery-gap","label":{"en":"List what must be paid before the next sales come in","sw":"Andika kinachopaswa kulipwa kabla mauzo yanayofuata hayajaingia"},"costHours":1,"costCash":0,"reveals":{"en":"You can see the gap now. Asking a shop to pay part of an old invoice brings cash but may cost the relationship. Cutting batches protects cash but leaves some customers waiting. Selling an oven brings cash and removes capacity.","sw":"Sasa unaona pengo. Kuomba duka lilipie sehemu ya ankara ya zamani kunaleta pesa lakini kunaweza kuharibu uhusiano. Kupunguza makundi kunalinda pesa lakini kunaacha baadhi ya wateja wakisubiri. Kuuza oveni kunaleta pesa na kuondoa uwezo wa uzalishaji."}}],"decision":{"prompt":{"en":"Which way out do you choose?","sw":"Unachagua njia gani ya kutoka?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"collect-part","label":{"en":"Ask the shops for part-payment before another delivery","sw":"Waombe maduka walipe sehemu kabla ya kupeleka bidhaa nyingine"},"detail":{"en":"You protect the relationship but ask for cash to keep baking.","sw":"Unalinda uhusiano lakini unaomba pesa ili uendelee kuoka."},"effects":{"debtorWeeks":0,"cash":2000000},"predictAnswer":"same","outcome":{"en":"One shop pays part of an old invoice. You keep the bakery open and shorten the time your money is stuck with customers.","sw":"Duka moja linalipa sehemu ya ankara ya zamani. Unaendelea na bakery na unapunguza muda ambao pesa yako imekwama kwa wateja."},"lesson":{"en":"When cash is tight, collecting money already earned can be safer than chasing new sales. It does not create new profit; it releases your own money.","sw":"Pesa ikiwa ngumu, kukusanya pesa uliyokwisha pata kunaweza kuwa salama kuliko kufukuza mauzo mapya. Hakutengenezi faida mpya; kunatoa pesa yako iliyofungwa."}},{"id":"cut-batches","label":{"en":"Reduce the bake and one weekly burden until cash returns","sw":"Punguza uokaji na gharama moja ya wiki hadi pesa irudi"},"detail":{"en":"Make less for now. Keep the ovens and the business alive.","sw":"Tengeneza kidogo kwa sasa. Weka oveni na biashara hai."},"effects":{"lines.bread.capacity":"-120","lines.mandazi.capacity":"-100","lines.cake.capacity":"-3","rent":"-30000"},"predictAnswer":"down","outcome":{"en":"You sell less and give up part of the premises cost. The bakery loses some weekly profit, but the smaller operation has room to breathe.","sw":"Unauza kidogo na unaacha sehemu ya gharama ya eneo. Bakery inapoteza faida ya wiki, lakini biashara ndogo inapata nafasi ya kupumua."},"lesson":{"en":"Cutting back is not giving up. It matches the size of the bakery to the cash it can actually use.","sw":"Kupunguza si kukata tamaa. Kunalinganisha ukubwa wa bakery na pesa inayoweza kutumia hasa."}},{"id":"sell-oven","label":{"en":"Sell the second oven and keep one production line","sw":"Uza oveni ya pili na ubaki na mstari mmoja wa uzalishaji"},"detail":{"en":"Cash now, less capacity and less debt pressure later.","sw":"Pesa sasa, uwezo mdogo na shinikizo dogo la deni baadaye."},"effects":{"cash":300000,"assetValue":"-600000","lines.bread.capacity":"-150","lines.mandazi.capacity":"-100","repayPerWeek":"-20000"},"predictAnswer":"down","outcome":{"en":"You turn part of the equipment into cash. The bakery is smaller, but the weekly repayment is lighter and one oven is still working.","sw":"Unageuza sehemu ya vifaa kuwa pesa. Bakery inakuwa ndogo, lakini marejesho ya wiki yanapungua na oveni moja bado inafanya kazi."},"lesson":{"en":"An asset can protect the business in a crisis, but selling it solves today's cash gap by giving up tomorrow's capacity.","sw":"Mali inaweza kulinda biashara wakati wa tatizo, lakini kuiuza kunatatua pengo la pesa la leo kwa kuacha uwezo wa kesho."}}]}},"turns":[{"id":"t01","concept":"operating-leverage","conceptLabel":{"en":"Fixed costs and a bad week","sw":"Gharama zisizobadilika na wiki mbaya"},"scene":"kitchen","situation":{"en":"The oven is ready every morning, whether customers come or not. Rent, your employee's wage and the oven's weekly wear still have to be covered. Rain has made this week's orders uncertain. You must decide how much of the bakery to keep ready.","sw":"Oveni iko tayari kila asubuhi, wateja waje au wasije. Kodi, mshahara wa mfanyakazi wako na uchakavu wa oveni bado lazima vilipwe. Mvua imefanya oda za wiki hii zisitabirike. Lazima uamue ni kiasi gani cha bakery ubakize kikiwa tayari."},"info":[{"id":"list-fixed-costs","label":{"en":"List the costs that remain in a quiet week","sw":"Andika gharama zinazobaki katika wiki tulivu"},"costHours":1,"costCash":0,"reveals":{"en":"The oven does not become free because sales are slow. Rent, wages and depreciation still appear in the weekly ledger. These are fixed costs: they stay while output moves.","sw":"Oveni haiwi bure kwa sababu mauzo ni madogo. Kodi, mishahara na depreciation bado vinaonekana kwenye daftari la wiki. Hizi ni gharama zisizobadilika: zinabaki wakati uzalishaji unabadilika."}}],"decision":{"prompt":{"en":"How do you run this uncertain week?","sw":"Unaendesha vipi wiki hii isiyotabirika?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"run-full","label":{"en":"Keep the oven and employee ready for normal sales","sw":"Weka oveni na mfanyakazi tayari kwa mauzo ya kawaida"},"detail":{"en":"The fixed costs stay. You may be ready if orders return.","sw":"Gharama zisizobadilika zinabaki. Unaweza kuwa tayari oda zikirejea."},"effects":{},"predictAnswer":"same","outcome":{"en":"You keep the bakery ready. The oven, rent and wage still cost the same while the rain keeps some customers away.","sw":"Unaweka bakery ikiwa tayari. Oveni, kodi na mshahara bado vinagharimu vilevile wakati mvua inawaweka baadhi ya wateja mbali."},"lesson":{"en":"A fixed cost makes a bad week hurt more because it does not fall with sales. It can also make a good week more valuable when the same setup serves more orders.","sw":"Gharama isiyobadilika hufanya wiki mbaya iume zaidi kwa sababu haishuki pamoja na mauzo. Pia inaweza kufanya wiki nzuri iwe na thamani zaidi wakati mpangilio uleule unahudumia oda nyingi."}},{"id":"cut-one-shift","label":{"en":"Make smaller batches and close one morning","sw":"Tengeneza makundi madogo na ufunge asubuhi moja"},"detail":{"en":"You save some work, but rent and the oven remain.","sw":"Unaokoa kazi fulani, lakini kodi na oveni vinabaki."},"effects":{"lines.bread.capacity":"-100","lines.mandazi.capacity":"-80","lines.cake.capacity":"-3","ownerHoursFixed":"-2"},"predictAnswer":"down","outcome":{"en":"You make less and miss some sales. Your rent and oven cost do not shrink with the smaller bake.","sw":"Unatengeneza kidogo na unapoteza baadhi ya mauzo. Kodi na gharama ya oveni hazishuki pamoja na uokaji mdogo."},"lesson":{"en":"Cutting output does not remove every fixed cost. In a bakery, a smaller week can still carry a large bill.","sw":"Kupunguza uzalishaji hakuondoi kila gharama isiyobadilika. Katika bakery, wiki ndogo bado inaweza kubeba bili kubwa."},"later":[{"inWeeks":3,"effects":{"reputation":-5,"demand":-30},"cause":{"en":"the reduced bake schedule that left regular customers without their usual bread","sw":"ratiba iliyopunguza uokaji na kuwaacha wateja wa kawaida bila mikate yao ya kawaida"}}]},{"id":"standing-order","label":{"en":"Use the oven fully for a small standing order you can already sell","sw":"Tumia oveni kikamilifu kwa oda ya kudumu unayoweza kuuza tayari"},"detail":{"en":"More output only where a customer is waiting for it.","sw":"Uzalishaji zaidi pale tu ambapo mteja anausubiri."},"effects":{"lines.bread.capacity":"+120","lines.bread.demand":"+120","ownerHoursFixed":3},"predictAnswer":"up_lot","outcome":{"en":"The extra bread is sold instead of sitting on the shelf. The same oven now spreads its fixed cost over more useful sales.","sw":"Mikate ya ziada inauzwa badala ya kukaa kwenye rafu. Sasa oveni ileile inasambaza gharama yake isiyobadilika juu ya mauzo yenye matumizi zaidi."},"lesson":{"en":"Operating leverage is not a reason to make stock without a buyer. It is useful when a fixed setup carries more paid work.","sw":"Operating leverage si sababu ya kutengeneza bidhaa bila mnunuzi. Inasaidia wakati mpangilio usiobadilika unabeba kazi zaidi iliyolipiwa."}}]}},{"id":"t02","concept":"break-even","conceptLabel":{"en":"Break-even volume","sw":"Kiasi cha kuvuka hasara"},"scene":"kitchen","situation":{"en":"You can make more than the usual number of items, but more capacity also means more unsold stock when customers do not come. Before you accept another order, work out the weekly volume that gives the oven a chance to pay for its fixed costs.","sw":"Unaweza kutengeneza bidhaa nyingi kuliko kawaida, lakini uwezo mkubwa pia unamaanisha bidhaa nyingi zisizouzwa wateja wasipokuja. Kabla ya kukubali oda nyingine, hesabu kiasi cha wiki kinachoiwezesha oveni kulipia gharama zake zisizobadilika."},"info":[{"id":"separate-costs","label":{"en":"Separate weekly fixed costs from cost per item","sw":"Tenganisha gharama zisizobadilika za wiki na gharama ya kila bidhaa"},"costHours":2,"costCash":0,"reveals":{"en":"Fixed costs do not move when one more item is made. The contribution from each item is what helps cover them. Break-even is the point where the contribution has covered the fixed costs.","sw":"Gharama zisizobadilika hazibadiliki unapotengeneza bidhaa moja zaidi. Mchango wa kila bidhaa ndio unaosaidia kuzilipa. Break-even ni mahali ambapo mchango umeshafunika gharama hizo."}}],"workout":true,"decision":{"type":"number","prompt":{"en":"Set the total weekly capacity you will prepare.","sw":"Panga uwezo wa jumla wa wiki utakaoandaa."},"predict":"number","input":{"field":"capacity","min":-150,"max":150,"step":50,"start":0,"valueAs":"count","unit":{"en":"items a week","sw":"vipande kwa wiki"},"hint":{"en":"Choose a change from the current bake plan. A negative change makes less; a positive change makes more.","sw":"Chagua mabadiliko kutoka mpango wa sasa wa uokaji. Mabadiliko hasi yanapunguza; chanya inaongeza."},"responses":[{"field":"ownerHoursUsed","perStep":50,"change":1}]},"bands":[{"outcome":{"en":"This volume leaves many customers without bread or mandazi. The oven's fixed costs are still there, so the week is exposed.","sw":"Kiasi hiki kinawaacha wateja wengi bila mikate au mandazi. Gharama zisizobadilika za oveni bado zipo, kwa hiyo wiki iko kwenye hatari."},"lesson":{"en":"Break-even is not the same as making the most possible. A volume below it cannot carry the fixed costs for long.","sw":"Break-even si sawa na kutengeneza kiasi kikubwa zaidi. Kiasi kilicho chini yake hakiwezi kubeba gharama zisizobadilika kwa muda mrefu."},"upTo":-50},{"outcome":{"en":"You are closer to covering the weekly fixed costs, but the margin for a bad sales day is small.","sw":"Uko karibu zaidi kufunika gharama zisizobadilika za wiki, lakini nafasi ya siku mbaya ya mauzo ni ndogo."},"lesson":{"en":"The useful question is how much volume covers the costs you must pay, not how much the oven can physically make.","sw":"Swali la maana ni kiasi gani kinaficha gharama unazopaswa kulipa, si kiasi ambacho oveni inaweza kutengeneza kimwili."},"upTo":0},{"outcome":{"en":"Most of the current demand can be served. You are near a practical break-even volume without preparing far more than customers ask for.","sw":"Mahitaji mengi ya sasa yanaweza kuhudumiwa. Uko karibu na break-even inayowezekana bila kuandaa zaidi sana kuliko wateja wanavyoomba."},"lesson":{"en":"A break-even calculation gives you a floor for planning. It does not promise that every prepared item will sell.","sw":"Hesabu ya break-even inakupa kiwango cha chini cha kupanga. Haihakikishi kwamba kila bidhaa iliyoandaliwa itauzwa."},"upTo":50},{"outcome":{"en":"The extra capacity is useful only if orders arrive. Otherwise the bakery pays for food and time that do not become sales.","sw":"Uwezo wa ziada unasaidia tu oda zikifika. Vinginevyo bakery inalipia chakula na muda ambao haugeuki kuwa mauzo."},"lesson":{"en":"Break-even is a warning against both under-producing and building capacity ahead of demand.","sw":"Break-even ni tahadhari dhidi ya kutengeneza kidogo sana na pia kujenga uwezo kabla ya mahitaji."}}]}},{"id":"t03","concept":"contribution-margin","conceptLabel":{"en":"Contribution margin by product","sw":"Mchango wa faida kwa kila bidhaa"},"scene":"market","unverified":true,"situation":{"en":"A shop asks which product you can supply more of next week. Bread sells in the largest number, but cakes leave more after their direct ingredients. You cannot push every line at once.","sw":"Duka linauliza ni bidhaa gani unaweza kuongeza wiki ijayo. Mikate inauzwa kwa idadi kubwa, lakini keki zinaacha zaidi baada ya malighafi zake za moja kwa moja. Huwezi kusukuma mistari yote kwa wakati mmoja."},"info":[{"id":"read-line-margin","label":{"en":"Read the margin for each line in the ledger","sw":"Soma margin ya kila mstari kwenye daftari"},"costHours":1,"costCash":0,"reveals":{"en":"Bread leaves 400 per loaf before fixed costs, about 33% of its sales price. Mandazi leave 200, about 40%. A cake order leaves 5,500, about 46%. The product with the most sales is not automatically the best use of the next hour.","sw":"Mkate unaacha 400 kwa kila mmoja kabla ya gharama zisizobadilika, takriban 33% ya bei yake ya mauzo. Andazi linaacha 200, takriban 40%. Oda ya keki inaacha 5,500, takriban 46%. Bidhaa yenye mauzo mengi si lazima iwe matumizi bora ya saa inayofuata."}}],"decision":{"prompt":{"en":"Which line gets the next useful hours?","sw":"Ni mstari gani upate masaa yenye matumizi zaidi?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"push-bread","label":{"en":"Push bread for the shop order","sw":"Sukuma mikate kwa oda ya duka"},"detail":{"en":"More bread only where a customer has asked for it.","sw":"Mikate zaidi pale tu ambapo mteja ameomba."},"effects":{"lines.bread.capacity":"+100","lines.bread.demand":"+100"},"predictAnswer":"up_lot","outcome":{"en":"The shop takes the extra bread. Each extra loaf leaves less than a cake, but the order is large enough to use the oven well.","sw":"Duka linachukua mikate ya ziada. Kila mkate wa ziada unaacha kidogo kuliko keki, lakini oda ni kubwa ya kutosha kutumia oveni vizuri."},"lesson":{"en":"Contribution margin is what one sale adds after its direct cost. Volume still matters when a lower-margin product has a real buyer.","sw":"Contribution margin ni kile ambacho mauzo moja huongeza baada ya gharama yake ya moja kwa moja. Wingi bado una maana wakati bidhaa yenye margin ndogo ina mnunuzi halisi."}},{"id":"push-cakes","label":{"en":"Reserve the next hours for cakes to order","sw":"Tenga masaa yanayofuata kwa keki za oda"},"detail":{"en":"Fewer units, but more contribution per unit.","sw":"Idadi ndogo, lakini mchango mkubwa kwa kila kimoja."},"effects":{"lines.cake.capacity":"+4","lines.cake.demand":"+4","lines.bread.capacity":"-20","lines.cake.price":"+1500"},"predictAnswer":"up_lot","outcome":{"en":"Four more cake orders fit into the plan, while some bread capacity moves aside. The higher contribution per cake almost makes up for the bread you give up.","sw":"Oda nne zaidi za keki zinaingia kwenye mpango, huku sehemu ya uwezo wa mikate ikiwekwa kando. Mchango mkubwa kwa keki karibu unafidia mikate uliyoacha."},"lesson":{"en":"The product with the best margin is not automatically the best product to push. Check the buyer and the capacity that must be moved.","sw":"Bidhaa yenye margin bora si lazima iwe bidhaa bora ya kusukuma. Angalia mnunuzi na uwezo ambao lazima uhamishwe."}},{"id":"keep-mix","label":{"en":"Keep the current mix until you have more orders","sw":"Weka mchanganyiko wa sasa hadi upate oda zaidi"},"detail":{"en":"Do not move capacity on a guess.","sw":"Usihamishe uwezo kwa kubahatisha."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes. Bread remains the largest line and cakes remain the strongest margin per unit.","sw":"Hakuna kinachobadilika. Mikate inabaki mstari mkubwa na keki zinabaki na margin kubwa kwa kila kimoja."},"lesson":{"en":"A margin is evidence, not an instruction to make unlimited high-margin stock. The next product needs both margin and a customer.","sw":"Margin ni ushahidi, si amri ya kutengeneza bidhaa nyingi zisizo na kikomo. Bidhaa inayofuata inahitaji margin na mteja."}}]}},{"id":"t04","concept":"product-mix","conceptLabel":{"en":"Product mix","sw":"Mchanganyiko wa bidhaa"},"scene":"kitchen","situation":{"en":"The oven has one working day left to plan. A cake customer will confirm a few orders, while bread is already moving steadily. Every cake uses time that could have made bread. Choose how much of the day's capacity goes to cakes.","sw":"Umebakiza siku moja ya kazi ya oveni kuipangia. Mteja wa keki atathibitisha oda chache, huku mikate ikiendelea kuuzwa. Kila keki inatumia muda ambao ungeweza kutengeneza mikate. Chagua ni kiasi gani cha uwezo wa siku kiende kwenye keki."},"info":[{"id":"compare-orders","label":{"en":"Compare confirmed cake orders with the bread queue","sw":"Linganisha oda za keki zilizothibitishwa na foleni ya mikate"},"costHours":1,"costCash":0,"reveals":{"en":"A cake made without an order can sit unsold. Bread has a wider daily market, but each loaf adds less contribution. The mix is a choice about both demand and margin.","sw":"Keki iliyotengenezwa bila oda inaweza kubaki bila kuuzwa. Mikate ina soko pana la kila siku, lakini kila mkate unaongeza mchango mdogo. Mchanganyiko ni uamuzi wa mahitaji na margin kwa pamoja."}}],"decision":{"type":"number","prompt":{"en":"How many cakes will you make capacity for this week?","sw":"Wiki hii utaweka uwezo wa kutengeneza keki ngapi?"},"predict":"number","input":{"field":"lines.cake.capacity","min":-10,"max":10,"step":5,"start":0,"valueAs":"count","unit":{"en":"cakes a week","sw":"keki kwa wiki"},"hint":{"en":"This is the change from your current cake plan. More cake capacity moves time away from bread.","sw":"Hili ni badiliko kutoka mpango wako wa sasa wa keki. Uwezo mkubwa wa keki unahamisha muda kutoka kwa mikate."},"responses":[{"field":"lines.cake.demand","perStep":5,"change":4},{"field":"lines.bread.capacity","perStep":5,"change":-5}]},"bands":[{"outcome":{"en":"You leave most capacity for bread. Cakes are limited, so some cake customers wait, but you avoid making many cakes without orders.","sw":"Unaacha uwezo mwingi kwa mikate. Keki ni chache, kwa hiyo baadhi ya wateja wa keki wanasubiri, lakini unaepuka kutengeneza keki nyingi bila oda."},"lesson":{"en":"A product mix can protect cash by matching high-margin work to confirmed demand.","sw":"Mchanganyiko wa bidhaa unaweza kulinda pesa kwa kulinganisha kazi yenye margin kubwa na mahitaji yaliyothibitishwa."},"upTo":-5},{"outcome":{"en":"You make a modest cake line and keep most of the bread capacity. The mix is close to the current orders.","sw":"Unatengeneza mstari wa keki wa kiasi na unaweka uwezo mwingi wa mikate. Mchanganyiko uko karibu na oda za sasa."},"lesson":{"en":"There is no permanent best mix. The useful mix changes when orders and capacity change.","sw":"Hakuna mchanganyiko bora wa kudumu. Mchanganyiko wenye maana hubadilika oda na uwezo vinapobadilika."},"upTo":0},{"outcome":{"en":"You give cakes more of the day. The extra confirmed orders help, but the bread line loses some room.","sw":"Unaipa keki sehemu kubwa ya siku. Oda za ziada zilizothibitishwa zinasaidia, lakini mstari wa mikate unapoteza nafasi."},"lesson":{"en":"A mix decision moves capacity from one product to another. Read the lost contribution as well as the new one.","sw":"Uamuzi wa mchanganyiko huhamisha uwezo kutoka bidhaa moja kwenda nyingine. Soma mchango uliopotea pamoja na mpya."},"upTo":5},{"outcome":{"en":"You prepare a large cake capacity. It works only if the confirmations become real orders; otherwise the unsold cakes consume the margin you expected.","sw":"Unaandaa uwezo mkubwa wa keki. Inafanya kazi tu uthibitisho ukigeuka kuwa oda halisi; vinginevyo keki zisizouzwa zinakula margin uliyotarajia."},"lesson":{"en":"High margin cannot rescue a product mix that makes more than its customers want.","sw":"Margin kubwa haiwezi kuokoa mchanganyiko unaotengeneza zaidi kuliko wateja wanavyotaka."}}]}},{"id":"t05","concept":"job-costing","conceptLabel":{"en":"Costing one job","sw":"Kuhesabu gharama ya oda moja"},"scene":"office","unverified":true,"situation":{"en":"A wedding customer asks for cakes to order, and wants a price before confirming. Cakes are made to order, so what you quote here becomes the price you quote everyone. Each cake uses the oven during a busy part of the week.","sw":"Mteja wa harusi anaomba keki za oda, na anataka bei kabla ya kuthibitisha. Keki hutengenezwa kwa oda, kwa hiyo bei unayotoa hapa ndiyo bei utakayowatajia wote. Kila keki inatumia oveni wakati wenye shughuli nyingi wiki hiyo."},"info":[{"id":"cost-the-job","label":{"en":"Write down every cost this order uses","sw":"Andika kila gharama ambayo oda hii inatumia"},"costHours":2,"costCash":0,"reveals":{"en":"The flour and other direct ingredients are only one part. Add the employee's time, the oven's wear, and a fair share of rent and other overhead. A price that covers ingredients alone can still lose money.","sw":"Unga na malighafi nyingine za moja kwa moja ni sehemu moja tu. Ongeza muda wa mfanyakazi, uchakavu wa oveni, na sehemu ya haki ya kodi na overhead nyingine. Bei inayofunika malighafi tu bado inaweza kuleta hasara."}}],"workout":true,"decision":{"type":"number","prompt":{"en":"Set the price for one cake to order.","sw":"Panga bei ya keki moja ya oda."},"predict":"number","_note":"The cake line, not bread. Costing a made-to-order job is what this concept is; bread is the standing counter line and repricing it here would have been a different decision. The price range is TZS 8,000–18,000, starting at TZS 12,000, and the response curve reduces demand by three cake orders for each TZS 2,000 step. Both ends remain meaningful without making the bakery impossible to recover.","input":{"field":"lines.cake.price","min":8000,"max":18000,"step":1000,"start":12000,"valueAs":"money","hint":{"en":"Include direct ingredients, labour and a share of the oven's weekly cost.","sw":"Jumuisha malighafi za moja kwa moja, kazi na sehemu ya gharama ya wiki ya oveni."},"responses":[{"field":"lines.cake.demand","perStep":2000,"change":-3}]},"bands":[{"outcome":{"en":"The quote is close to the direct cost. It may win the job, but it leaves little for labour, oven wear or the bakery's fixed costs.","sw":"Bei iko karibu na gharama ya moja kwa moja. Inaweza kushinda oda, lakini inaacha kidogo kwa kazi, uchakavu wa oveni au gharama zisizobadilika za bakery."},"lesson":{"en":"A job can be busy and still lose money when its price leaves out the costs around the product.","sw":"Oda inaweza kuwa na shughuli nyingi na bado ilete hasara wakati bei yake imeacha gharama zinazozunguka bidhaa."},"upTo":9000},{"outcome":{"en":"You cover the direct ingredients and some of the time. The job is useful only if the remaining amount also helps with overhead.","sw":"Unafanya malighafi za moja kwa moja na sehemu ya muda zilipwe. Oda ina maana tu kiasi kinachobaki kikisaidia pia overhead."},"lesson":{"en":"Job costing means asking what this particular order uses, not only what one ingredient costs.","sw":"Kuhesabu gharama ya oda kunamaanisha kuuliza oda hii inatumia nini, si gharama ya malighafi moja tu."},"upTo":12000},{"outcome":{"en":"The quote gives the bakery room for its time and overhead. The customer may ask questions, so show what the price includes.","sw":"Bei inaipa bakery nafasi kwa muda na overhead zake. Mteja anaweza kuuliza maswali, kwa hiyo onyesha bei inajumuisha nini."},"lesson":{"en":"A clear quote makes a trade-off visible: a lower price may win an order, while a fuller price protects the work needed to deliver it.","sw":"Bei iliyo wazi inaonyesha uamuzi: bei ndogo inaweza kushinda oda, huku bei kamili ikilinda kazi inayohitajika kuitekeleza."},"upTo":15000},{"outcome":{"en":"You protect the bakery's contribution on each cake, but the customer may order less or walk away. A price is also a demand decision.","sw":"Unalinda mchango wa bakery kwa kila keki, lakini mteja anaweza kuagiza kidogo au kuondoka. Bei pia ni uamuzi wa mahitaji."},"lesson":{"en":"A job price must cover the work and still fit what the customer can buy. Costing tells you the floor; the customer tells you the ceiling.","sw":"Bei ya oda lazima ifunike kazi na bado ilingane na kile mteja anaweza kununua. Costing inakuambia kiwango cha chini; mteja anakuambia cha juu."}}]}},{"id":"t06","concept":"trade-credit","conceptLabel":{"en":"Credit given to customers","sw":"Mkopo unaowapa wateja"},"scene":"office","unverified":true,"_note":"debtorWeeks is a whole-business average: the engine applies it to ALL revenue, not to the wholesale share. Thirty-day terms on roughly a fifth of sales is about 0.8 weeks blended, not 4. Authored as 4 first time round, which absorbed nearly four weeks of total revenue in one step and made every option here insolvent whatever the learner chose.","situation":{"en":"Two shops want bread every week. They ask to pay 30 days after delivery. The order would make your sales look better, but the money would arrive after the flour, wages and rent have already been paid.","sw":"Maduka mawili yanataka mikate kila wiki. Yanaomba kulipa siku 30 baada ya kupewa bidhaa. Oda itafanya mauzo yako yaonekane mazuri, lakini pesa itaingia baada ya unga, mishahara na kodi kuwa tayari imelipwa."},"info":[{"id":"ask-payment-history","label":{"en":"Ask how the shops have paid other suppliers","sw":"Uliza maduka yamekuwa yakilipa vipi wasambazaji wengine"},"costHours":2,"costCash":0,"reveals":{"en":"One shop usually pays late. The other pays on time but wants a large order. Neither has offered a deposit. Customer credit is money you have earned but cannot use yet.","sw":"Duka moja kwa kawaida hulipa kwa kuchelewa. Jingine hulipa kwa wakati lakini linataka oda kubwa. Hakuna lililotoa deposit. Mkopo wa mteja ni pesa uliyopata lakini huwezi kuitumia bado."}}],"decision":{"prompt":{"en":"Which terms do you offer the shops?","sw":"Unawapa maduka masharti gani?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"full-wholesale","label":{"en":"Take both shops' full order on 30-day terms","sw":"Chukua oda kamili ya maduka yote kwa masharti ya siku 30"},"detail":{"en":"More bread sold, but part of the bakery's sales is now owed to you.","sw":"Mikate zaidi inauzwa, lakini sehemu ya mauzo ya bakery sasa ni pesa unayodai."},"effects":{"debtorWeeks":0.8,"lines.bread.capacity":"+180","lines.bread.demand":"+180","concentrated":true},"predictAnswer":"up_lot","outcome":{"en":"The shops take the bread. Profit rises because you sold more, but part of the sales is now money owed to you rather than money in the bank.","sw":"Maduka yanachukua mikate. Faida inapanda kwa sababu umeuza zaidi, lakini sehemu ya mauzo sasa ni pesa unayodai badala ya pesa benki."},"lesson":{"en":"A sale on credit is still a sale in profit, but it is not cash today. Growth can consume cash when customers pay later.","sw":"Mauzo ya mkopo bado ni mauzo kwenye faida, lakini si pesa ya leo. Ukuaji unaweza kutumia pesa wakati wateja wanalipa baadaye."},"later":[{"inWeeks":3,"effects":{"lines.bread.capacity":"+60","lines.bread.demand":"+60"},"cause":{"en":"the full wholesale commitment that brought a repeat bread order","sw":"ahadi kamili ya wholesale iliyoleta oda nyingine ya mikate"}}]},{"id":"trial-wholesale","label":{"en":"Take one shop's smaller trial order on 30-day terms","sw":"Chukua oda ndogo ya majaribio ya duka moja kwa masharti ya siku 30"},"detail":{"en":"Less volume, and a higher price to carry the waiting risk.","sw":"Kiasi kidogo, na bei ya juu kubeba hatari ya kusubiri."},"effects":{"debtorWeeks":0.4,"lines.bread.capacity":"+80","lines.bread.demand":"+80","lines.bread.price":"+100"},"predictAnswer":"up_lot","outcome":{"en":"You test the relationship with a smaller order. The higher price gives each loaf more room, but the money still waits for the shop to pay.","sw":"Unajaribu uhusiano kwa oda ndogo. Bei ya juu inaipa kila mkate nafasi zaidi, lakini pesa bado inasubiri duka lilipie."},"lesson":{"en":"When you give credit, price and order size can share the risk. A trial can limit exposure, but it does not make delayed payment into cash.","sw":"Unapotoa mkopo, bei na ukubwa wa oda vinaweza kushirikiana kubeba hatari. Jaribio linaweza kupunguza hatari, lakini halifanyi malipo ya baadaye kuwa pesa ya leo."}},{"id":"limited-wholesale","label":{"en":"Take a very small weekly order, still on 30-day terms","sw":"Chukua oda ndogo sana ya wiki, bado kwa masharti ya siku 30"},"detail":{"en":"Learn the payment pattern before committing the oven.","sw":"Jifunze mwenendo wa malipo kabla ya kuifunga oveni kwenye oda kubwa."},"effects":{"debtorWeeks":0.15,"lines.bread.capacity":"+20","lines.bread.demand":"+20"},"predictAnswer":"up_bit","outcome":{"en":"The small order adds a little profit and leaves most of the oven available for counter sales. You still have money owed to you, so the bank balance needs watching.","sw":"Oda ndogo inaongeza faida kidogo na inaacha sehemu kubwa ya oveni kwa mauzo ya kaunta. Bado una pesa unazodai, kwa hiyo salio la benki linahitaji kuangaliwa."},"lesson":{"en":"A cautious trial is a defensible way to learn a customer's payment behaviour. The risk is smaller, not zero.","sw":"Jaribio la tahadhari ni njia inayokubalika ya kujifunza tabia ya malipo ya mteja. Hatari ni ndogo, si sifuri."}}]}},{"id":"t07","concept":"working-capital","conceptLabel":{"en":"Money tied up","sw":"Pesa iliyofungwa"},"scene":"office","situation":{"en":"The wholesale order has made the profit line higher. When you count the bank, the balance is lower than it was. Flour and labour have been paid, but the shops have not paid you yet. Read the cash lines before you decide what to do next.","sw":"Oda ya wholesale imefanya mstari wa faida uwe juu. Ukihesabu benki, salio ni dogo kuliko lilivyokuwa. Unga na kazi vimeshalipwa, lakini maduka bado hayajakupa pesa. Soma mistari ya pesa kabla ya kuamua hatua inayofuata."},"info":[{"id":"trace-cash","label":{"en":"Trace one loaf from flour to customer payment","sw":"Fuatilia mkate mmoja kutoka unga hadi malipo ya mteja"},"costHours":2,"costCash":0,"reveals":{"en":"The flour and wages leave before the shop pays. Working capital means money held in the trading cycle: stock, unpaid customer invoices and supplier timing. A longer debtor period uses more cash as sales grow.","sw":"Unga na mishahara vinatoka kabla duka halijalipa. Working capital ni pesa iliyoshikiliwa kwenye mzunguko wa biashara: stock, ankara za wateja ambazo hazijalipwa na muda wa msambazaji. Muda mrefu wa wadaiwa hutumia pesa zaidi mauzo yanapokua."}}],"diagnose":{"prompt":{"en":"Which ledger line explains why profit is up while cash is down?","sw":"Ni mstari gani wa daftari unaoeleza kwa nini faida imepanda huku pesa ikishuka?"},"answer":"cash.workingCapitalChange","options":["pnl.sales","pnl.costOfSales","pnl.rent","pnl.wages","cash.repayment","cash.workingCapitalChange"],"right":{"en":"Working capital is the line. The 30-day debtor balance grew, so more money is sitting with customers even though the sale is already in profit.","sw":"Working capital ndiyo mstari huo. Salio la wadaiwa la siku 30 limeongezeka, kwa hiyo pesa zaidi imekaa kwa wateja ingawa mauzo tayari yako kwenye faida."},"wrong":{"en":"The extra sales explain the higher profit, not the missing bank money. Look for cash tied up with customers or in stock.","sw":"Mauzo ya ziada yanaeleza faida kubwa, si pesa ya benki iliyokosekana. Tafuta pesa iliyofungwa kwa wateja au kwenye stock."}},"decision":{"prompt":{"en":"What do you change now?","sw":"Unabadilisha nini sasa?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"collect-deposit","label":{"en":"Ask for a deposit and shorten the next payment cycle","sw":"Omba deposit na ufupishe mzunguko wa malipo unaofuata"},"detail":{"en":"Less money stuck with customers. The price and product stay the same.","sw":"Pesa kidogo inabaki kwa wateja. Bei na bidhaa vinabaki vilevile."},"effects":{"debtorWeeks":0,"ownerHoursUsed":2},"predictAnswer":"same","outcome":{"en":"The shops agree to pay part before the next bake. Profit does not change, but less of it waits outside the bakery.","sw":"Maduka yanakubali kulipa sehemu kabla ya uokaji unaofuata. Faida haibadiliki, lakini kidogo zaidi inasubiri nje ya bakery."},"lesson":{"en":"Working capital is not a profit problem by itself. Shortening the time between paying for work and collecting for it can keep a profitable bakery solvent.","sw":"Working capital si tatizo la faida peke yake. Kufupisha muda kati ya kulipia kazi na kuikusanya kunaweza kuweka bakery yenye faida ikiwa na pesa."}},{"id":"keep-terms","label":{"en":"Keep the 30-day terms and watch the bank every week","sw":"Weka masharti ya siku 30 na uangalie benki kila wiki"},"detail":{"en":"The order is valuable, but the cash gap remains.","sw":"Oda ina thamani, lakini pengo la pesa linabaki."},"effects":{},"predictAnswer":"same","outcome":{"en":"The profit remains higher than before. The bank stays under pressure because the same customer balance is still owed to you.","sw":"Faida inabaki juu kuliko hapo awali. Benki inabaki chini ya shinikizo kwa sababu bado unadaiwa salio hilo la mteja."},"lesson":{"en":"A profitable order can still be too large for the cash you have. Growth needs a payment plan as well as a sales plan.","sw":"Oda yenye faida bado inaweza kuwa kubwa kuliko pesa uliyo nayo. Ukuaji unahitaji mpango wa malipo pamoja na mpango wa mauzo."}},{"id":"stop-credit","label":{"en":"Stop new credit sales and return capacity to counter customers","sw":"Acha mauzo mapya ya mkopo na urudishe uwezo kwa wateja wa kaunta"},"detail":{"en":"Less wholesale volume, but a shorter cash cycle.","sw":"Wholesale kidogo, lakini mzunguko mfupi wa pesa."},"effects":{"debtorWeeks":0,"lines.bread.capacity":"-100","lines.bread.demand":"-100"},"predictAnswer":"down","outcome":{"en":"You give up some wholesale volume. The bakery earns less from that line, but it stops adding new unpaid sales while you collect what is already owed.","sw":"Unaacha sehemu ya wholesale. Bakery inapata kidogo kutoka mstari huo, lakini inaacha kuongeza mauzo mapya yasiyolipwa wakati unakusanya unachodai."},"lesson":{"en":"Turning down growth can be the responsible choice when growth is using cash faster than it arrives. Smaller and solvent is a valid path.","sw":"Kukataa ukuaji kunaweza kuwa uamuzi wa kuwajibika ukuaji unapotumia pesa haraka kuliko inavyoingia. Ndogo na yenye pesa ni njia halali."}}]}},{"id":"t08","concept":"supplier-terms","conceptLabel":{"en":"Supplier terms","sw":"Masharti ya msambazaji"},"scene":"market","unverified":true,"situation":{"en":"Your flour supplier offers two ways to buy. Pay cash and the flour is cheaper. Take it on account and the flour costs more, but you can pay after you have sold some bread. Your customers are still paying on different schedules.","sw":"Msambazaji wako wa unga anakupa njia mbili za kununua. Lipa taslimu na unga uwe wa bei rahisi. Chukua kwa akaunti na unga uwe ghali zaidi, lakini unaweza kulipa baada ya kuuza mikate. Wateja wako bado wanalipa kwa nyakati tofauti."},"info":[{"id":"compare-supplier-terms","label":{"en":"Compare the saving with the cash you need this week","sw":"Linganisha punguzo na pesa unayohitaji wiki hii"},"costHours":1,"costCash":0,"reveals":{"en":"Cash purchase lowers the direct cost but releases less supplier credit. Account purchase protects cash today but leaves less contribution on each item. Creditor weeks are money you have received from sales before paying the supplier.","sw":"Ununuzi wa taslimu unapunguza gharama ya moja kwa moja lakini unaacha credit kidogo ya msambazaji. Ununuzi wa akaunti unalinda pesa leo lakini unaacha mchango mdogo kwa kila bidhaa. Creditor weeks ni pesa uliyopata kwenye mauzo kabla ya kumlipa msambazaji."}}],"decision":{"prompt":{"en":"Which supplier terms do you choose?","sw":"Unachagua masharti gani ya msambazaji?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"cash-flour","label":{"en":"Pay cash for the cheaper flour","sw":"Lipa taslimu kwa unga wa bei rahisi"},"detail":{"en":"Lower unit costs, less supplier credit and less cash in hand.","sw":"Gharama ndogo kwa kila bidhaa, credit ndogo ya msambazaji na pesa kidogo mkononi."},"effects":{"creditorWeeks":0,"lines.bread.unitCost":"-20","lines.mandazi.unitCost":"-10","lines.cake.unitCost":"-300"},"predictAnswer":"up_bit","outcome":{"en":"The direct cost falls on all three lines. Profit improves, but you give up one week of supplier credit while customer money is still delayed.","sw":"Gharama ya moja kwa moja inashuka kwenye mistari yote mitatu. Faida inaboreka, lakini unaacha wiki moja ya credit ya msambazaji wakati pesa za wateja bado zimechelewa."},"lesson":{"en":"A cheaper input can improve profit and still weaken cash. Supplier terms are part of the price of an input.","sw":"Malighafi ya bei rahisi inaweza kuboresha faida na bado kudhoofisha pesa. Masharti ya msambazaji ni sehemu ya bei ya malighafi."}},{"id":"account-flour","label":{"en":"Take the dearer flour on account","sw":"Chukua unga wa bei ya juu kwa akaunti"},"detail":{"en":"More cash room today, lower contribution on each sale.","sw":"Nafasi kubwa ya pesa leo, mchango mdogo kwa kila mauzo."},"effects":{"creditorWeeks":2,"lines.bread.unitCost":"+20","lines.mandazi.unitCost":"+10","lines.cake.unitCost":"+200"},"predictAnswer":"down","outcome":{"en":"The suppl
