/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}

h1 { font-size: 1.05rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0 0 0.7em; }
ul { margin: 0; padding-left: 1.1em; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 12px 40px;
}

/* ---------- shell ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 2px 8px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
}

.banner-unverified {
  margin: 0 0 10px;
  padding: 9px 12px;
  background: var(--surface-alt);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 0.83rem;
  color: var(--text-muted);
}

.progress {
  height: 5px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-bar {
  height: 100%;
  background: var(--accent-2);
  border-radius: 99px;
  transition: width 400ms ease;
}

.scene {
  margin-bottom: 12px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface-alt);
  line-height: 0;
}
.scene svg { display: block; width: 100%; height: auto; }

.foot {
  margin-top: 26px;
  text-align: center;
  font-size: 0.76rem;
  color: var(--text-muted);
}
.foot p { margin: 0; }

/* ---------- stats ---------- */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 6px;
  text-align: center;
  min-width: 0;
}
.stat-label {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-value {
  font-size: 0.98rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  overflow-wrap: anywhere;
}
.stat-warn { border-color: var(--danger); }
.negative { color: var(--danger); }

/* ---------- P&L ---------- */
.pnl-toggle { display: block; margin: 0 0 8px auto; }

.pnl {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 0.9rem;
}
.pnl-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 3px 0;
}
.pnl-row.total {
  border-top: 2px solid var(--border);
  margin-top: 6px;
  padding-top: 7px;
  font-weight: 700;
  font-size: 1rem;
}
.pnl-label { color: var(--text-muted); }
.pnl-row.total .pnl-label { color: var(--text); }
.pnl-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pnl-note {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-size: 0.83rem;
  color: var(--text-muted);
}

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px var(--shadow);
}
.card-title {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 9px;
}
.concept-tag {
  display: inline-block;
  background: var(--surface-alt);
  color: var(--text-muted);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 0.7rem;
  letter-spacing: 0.03em;
}
.situation {
  font-size: 1.02rem;
  line-height: 1.55;
  margin: 0;
}

/* ---------- information step ---------- */
.info-list { display: flex; flex-direction: column; gap: 8px; }

.info-item {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--tap);
  padding: 11px 13px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 0.93rem;
  cursor: pointer;
}
.info-item:active { transform: scale(0.99); }
.info-label { display: block; font-weight: 600; }
.info-cost {
  display: inline-block;
  margin-top: 3px;
  font-size: 0.78rem;
  color: var(--text-muted);
}
.info-item.used {
  background: var(--ok-bg);
  border-color: var(--accent-2);
  cursor: default;
  opacity: 1;
}
.info-item.used .info-label { font-weight: 600; }
.info-reveals {
  display: block;
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.45;
}

/* ---------- decision step ---------- */
.options { display: flex; flex-direction: column; gap: 9px; }

.option {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--tap);
  padding: 13px 14px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease;
}
.option:hover { border-color: var(--accent); }
.option:active { transform: scale(0.995); }
.option.selected {
  border-color: var(--accent);
  background: var(--surface-alt);
}
.option-label { display: block; font-weight: 650; font-size: 1rem; }
.option-detail {
  display: block;
  margin-top: 4px;
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* ---------- prediction step ---------- */
.predict { border-color: var(--accent); border-width: 2px; }
.predict-question {
  font-weight: 650;
  font-size: 1.02rem;
  margin: 10px 0 12px;
}
.predict-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.predict-choice {
  min-height: var(--tap);
  padding: 11px 8px;
  background: var(--surface-alt);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 140ms ease;
}
.predict-choice:hover:not(:disabled) { border-color: var(--accent); }
.predict-choice.selected {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}
.predict-choice:disabled:not(.selected) { opacity: 0.45; cursor: default; }

/* ---------- reveal step ---------- */
.reveal {
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 14px;
  background: var(--surface);
  box-shadow: 0 1px 3px var(--shadow);
}
.reveal.correct { border-color: var(--accent-2); background: var(--ok-bg); }
.reveal.wrong { border-color: var(--danger); background: var(--danger-bg); }

.reveal-verdict {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}
/* Glyph carries the meaning, not colour alone. */
.reveal-mark {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 1.05rem;
  font-weight: 700;
  background: var(--surface);
  border: 2px solid currentColor;
}
.reveal.correct .reveal-mark { color: var(--accent-2); }
.reveal.wrong .reveal-mark { color: var(--danger); }
.reveal-text { font-weight: 700; font-size: 1.02rem; }

.reveal-delta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 9px 11px;
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 11px;
}
.reveal-delta-label { font-size: 0.83rem; color: var(--text-muted); }
.reveal-delta-value {
  font-size: 1.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.outcome { font-size: 0.97rem; line-height: 1.55; }
.lesson {
  font-size: 0.94rem;
  line-height: 1.5;
  padding: 10px 12px;
  background: var(--surface);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 12px;
}

/* ---------- end profile ---------- */
.profile-head {
  text-align: center;
  padding: 14px 10px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.profile-tally {
  font-size: 2rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  color: var(--accent-2);
  line-height: 1.1;
}
.profile-tally-label {
  font-size: 0.84rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.profile-trend {
  margin-top: 8px;
  font-size: 0.9rem;
  font-weight: 600;
}
.profile-chart { margin-top: 14px; }
.profile-chart svg { display: block; width: 100%; height: auto; }

.indicator {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.indicator:last-of-type { border-bottom: 0; }
.indicator-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 3px;
}
.indicator-text { font-size: 0.97rem; line-height: 1.5; }
.indicator-evidence {
  margin-top: 4px;
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.45;
}

.limitations { background: var(--surface-alt); }
.limitations-list {
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text-muted);
}
.limitations-list li { margin-bottom: 6px; }

.end-actions {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 6px;
}

/* ---------- buttons ---------- */
.btn {
  min-height: var(--tap);
  padding: 12px 18px;
  border-radius: var(--radius);
  border: 2px solid transparent;
  font: inherit;
  font-weight: 650;
  font-size: 0.97rem;
  cursor: pointer;
  transition: filter 140ms ease;
}
.btn:active { transform: scale(0.99); }
.btn:disabled { opacity: 0.45; cursor: default; }

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); }

.btn-small {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.82rem;
  font-weight: 600;
}

/* ---------- animation ---------- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.fade-in { animation: fadeIn 240ms ease both; }
.slide-up { animation: slideUp 300ms cubic-bezier(0.22, 1, 0.36, 1) both; }

/* Never let motion gate reading or interaction. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- wider screens ---------- */
@media (min-width: 480px) {
  .predict-choices { grid-template-columns: repeat(4, 1fr); }
  .end-actions { flex-direction: row; }
  .end-actions .btn { flex: 1; }
}

/* ---------- SVG scenes ----------
   scene.js assigns classes and expects fills from here, so that scenes
   re-theme with light/dark without regenerating the SVG. */
.scene-svg { display: block; width: 100%; height: auto; background: var(--scene-sky); }

.scene-sun { fill: var(--scene-sun); }
.scene-moon { fill: var(--scene-moon); }
.scene-star { fill: var(--scene-star); }
.scene-cloud { fill: var(--scene-cloud); opacity: 0.9; }
.scene-road { fill: var(--scene-ground); }
.scene-road-dash { stroke: var(--scene-line); stroke-width: 2; stroke-dasharray: 8 8; opacity: 0.35; }

.scene-stall { fill: var(--scene-stall-wall); }
.scene-stall-wall { fill: var(--scene-stall-wall); }
.scene-stall-roof { fill: var(--scene-stall-roof); }
.scene-stall-counter { fill: var(--scene-stall-counter); }
.scene-stall-goods { fill: var(--scene-goods); }
.scene-stall-shutter { fill: var(--scene-stall-counter); opacity: 0.85; }

.scene-figure,
.scene-figure-body { fill: var(--scene-figure); }
.scene-figure-head { fill: var(--scene-figure-2); }
.scene-figure-apron { fill: var(--scene-awning-b); }
.scene-figure-cap { fill: var(--scene-staff-mark); }

.scene-pot,
.scene-stove { fill: var(--scene-stall-counter); }
.scene-steam { fill: none; stroke: var(--scene-steam); stroke-width: 2.5; stroke-linecap: round; opacity: 0.75; }
.scene-jar { fill: var(--scene-goods); opacity: 0.9; }
.scene-shelf,
.scene-table,
.scene-desk { fill: var(--scene-stall-counter); }
.scene-desk-front { fill: var(--scene-stall-counter); opacity: 0.8; }
.scene-kitchen-wall { fill: var(--scene-stall-wall); }
.scene-office-wall { fill: var(--scene-stall-wall); }

.scene-truck-cab { fill: var(--scene-awning-a); }
.scene-truck-bed,
.scene-truck { fill: var(--scene-stall-counter); }
.scene-truck-wheel { fill: var(--scene-figure); }

.scene-inspector { fill: var(--scene-staff-mark); }
.scene-clipboard { fill: var(--scene-awning-b); }
.scene-badge { fill: var(--scene-staff-mark); }
.scene-badge-check { stroke: var(--scene-awning-b); stroke-width: 2.5; fill: none; stroke-linecap: round; }
.scene-ledger-neat { stroke: var(--scene-line); stroke-width: 1.5; opacity: 0.6; }
.scene-ledger-scatter { stroke: var(--scene-line); stroke-width: 1.5; opacity: 0.3; }

.scene-coin { fill: var(--scene-goods); }
.scene-sparkle { fill: var(--scene-goods); }
.scene-lamp-glow { fill: var(--scene-sun); opacity: 0.22; }
.scene-grime { fill: var(--danger); opacity: 0.28; }
.scene-dim-overlay { fill: #000; }

/* ---------- chart ---------- */
.chart-svg { display: block; width: 100%; height: auto; }
.chart-baseline { stroke: var(--border); stroke-width: 1.5; }
.chart-bar-pos { fill: var(--accent-2); }
/* hatched, so profit and loss differ by texture as well as colour */
.chart-bar-neg { fill: url(#chartNegHatch); stroke: var(--danger); stroke-width: 1; }
.chart-hatch-bg { fill: var(--danger-bg); }
.chart-hatch-line { stroke: var(--danger); stroke-width: 2; }
.chart-cash-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart-cash-dot { fill: var(--accent); }
.chart-tick { fill: var(--text-muted); font-size: 9px; }
.chart-empty { fill: var(--text-muted); font-size: 11px; text-anchor: middle; }

@keyframes pulseOnce {
  0% { transform: scale(1); }
  45% { transform: scale(1.09); }
  100% { transform: scale(1); }
}
.is-pulsing { animation: pulseOnce 520ms ease; }

/* Set via ternaries in scene.js, so easy to miss when scanning for classes. */
.scene-sky { fill: var(--scene-sky); }
.scene-sky-night { fill: var(--scene-sky-night); }
.scene-ground { fill: var(--scene-ground); }

const NS_format = (function () {

// Number and currency formatting.
//
// Amounts are stored locale-neutral (plain integers) and formatted only at render
// time — AGENTS.md section 6. Never author a currency symbol into content.

let currency = 'TZS';
let locale = 'en';

function setLocale(nextLocale, nextCurrency) {
  locale = nextLocale || locale;
  currency = nextCurrency || currency;
}

// Grouped integer, no decimals. Small-business amounts are whole shillings.
function money(amount) {
  const n = Math.round(Number(amount) || 0);
  const sign = n < 0 ? '-' : '';
  const grouped = Math.abs(n).toLocaleString(locale, { maximumFractionDigits: 0 });
  return `${sign}${currency} ${grouped}`;
}

// Compact form for tight spaces (stat tiles, chart axes).
function moneyShort(amount) {
  const n = Math.round(Number(amount) || 0);
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1000000) return `${sign}${(abs / 1000000).toFixed(1)}M`;
  if (abs >= 1000) return `${sign}${Math.round(abs / 1000)}k`;
  return `${sign}${abs}`;
}

function count(n) {
  return Math.round(Number(n) || 0).toLocaleString(locale);
}

// Proportions read more reliably than percentages for this audience —
// docs/localization.md. Used for prediction accuracy.
function proportion(part, whole) {
  const p = Math.round(Number(part) || 0);
  const w = Math.round(Number(whole) || 0);
  if (w <= 0) return '—';
  return `${p} of ${w}`;
}

function percent(fraction) {
  return `${Math.round((Number(fraction) || 0) * 100)}%`;
}

  return { setLocale, money, moneyShort, count, proportion, percent };
})();

    const forcedAdditive = typeof raw === 'string' && /^[+-]/.test(raw);
    const value = Number(raw);

    if (Number.isNaN(value)) {
      next.flags[key] = raw;
      continue;
    }

    if (!(key in next)) {
      next.flags[key] = value;
      continue;
    }

    if (forcedAdditive || ADDITIVE.has(key)) {
      next[key] = (Number(next[key]) || 0) + value;
    } else if (ABSOLUTE.has(key)) {
      next[key] = value;
    } else {
      next[key] = value;
    }
  }

  for (const [key, [lo, hi]] of Object.entries(CLAMPED)) {
    if (typeof next[key] === 'number') {
      next[key] = Math.max(lo, Math.min(hi, next[key]));
    }
  }

  next.capacity = Math.max(0, Math.round(next.capacity));
  next.demand = Math.max(0, Math.round(next.demand));
  next.staff = Math.max(0, Math.round(next.staff));

  return next;
}

/**
 * Advance one week: bank the profit, apply slow drift.
 *
 * Reputation and hygiene drift because neglect has a cost — a business does not hold
 * still. Demand follows reputation with a lag, so the consequence of a hygiene
 * failure arrives after the decision that caused it, not alongside it
 * (docs/game-design.md: consequences arrive on a realistic lag).
 */
function advanceWeek(state) {
  const pnl = weeklyPnl(state);
  const next = { ...state, flags: { ...state.flags } };

  next.cash = state.cash + pnl.profit;
  next.week = state.week + 1;

  if (state.hygiene < 40) next.reputation = Math.max(0, state.reputation - 4);
  else if (state.hygiene > 75) next.reputation = Math.min(100, state.reputation + 1);

  const repPull = Math.round((next.reputation - 50) * 0.6);
  next.demand = Math.max(0, state.demand + repPull);

  next.hygiene = Math.max(0, state.hygiene - 1);

  return { state: next, pnl };
}

/** Owner time is a scarce resource — this is what makes delegation visible. */
function ownerLoad(state) {
  const used = state.ownerHoursUsed;
  const total = state.ownerHours || 1;
  return { used, total, fraction: Math.min(1.5, used / total), overloaded: used > total };
}

/**
 * Is this state failing? Used for the setback chapter, not for a game over —
 * failure is a chapter boundary here (docs/game-design.md).
 */
function healthCheck(state) {
  const pnl = weeklyPnl(state);
  const problems = [];
  if (state.cash < 0) problems.push('cash-negative');
  if (pnl.profit < 0) problems.push('loss-making');
  if (state.hygiene < 35) problems.push('hygiene-risk');
  if (pnl.spoilage > pnl.grossProfit * 0.3 && pnl.spoilage > 0) problems.push('spoilage-high');
  if (ownerLoad(state).overloaded) problems.push('owner-overloaded');
  return problems;
}

  return { createState, weeklyPnl, applyEffects, advanceWeek, ownerLoad, healthCheck, DEFAULT_STATE };
})();

/* ---- record ---- */
const NS_record = (function () {

// The behavioural record.
//
// Governed by docs/assessment.md. Three layers, and the separation is deliberate:
//
//   1. Observations  — raw, factual, durable. Never interpreted at write time.
//   2. Indicators    — derived patterns, each of which MUST cite its evidence.
//   3. Profile       — human-readable, hedged, anchored to observations.
//
// Two rules that are easy to break and expensive to fix:
//
//   * Scoring is never baked into storage. Observations outlive every change to how
//     we interpret them, so interpretation happens at read time only.
//   * No composite score. No rank. No percentile. A single number invites the
//     mechanical filtering that makes business-plan scores harmful, and hides which
//     behaviours produced it.

const SCHEMA_VERSION = 1;

function createRecord(scenarioId) {
  return {
    schemaVersion: SCHEMA_VERSION,
    scenarioId,
    startedAt: new Date().toISOString(),
    observations: [],
  };
}

/** Layer 1. Append-only. Called at every decision point. */
function observe(record, entry) {
  record.observations.push({
    at: new Date().toISOString(),
    ...entry,
  });
  return record;
}

function observeInfoSought(record, turnId, infoId, label) {
  return observe(record, { kind: 'info-sought', turnId, infoId, label });
}

function observePrediction(record, turnId, predicted, actual, correct, metric) {
  return observe(record, { kind: 'prediction', turnId, predicted, actual, correct, metric });
}

function observeDecision(record, turnId, concept, optionId, optionLabel, infoSoughtCount, pnlBefore, pnlAfter) {
  return observe(record, {
    kind: 'decision',
    turnId,
    concept,
    optionId,
    optionLabel,
    infoSoughtCount,
    profitBefore: pnlBefore,
    profitAfter: pnlAfter,
  });
}

function observeConstraint(record, turnId, text) {
  return observe(record, { kind: 'constraint-named', turnId, text });
}

// ---------------------------------------------------------------------------
// Layer 2 — indicators. Each returns { id, label, summary, evidence: [] }.
// An indicator that cannot point at its evidence is an opinion and does not ship.
// ---------------------------------------------------------------------------

function predictions(record) {
  return record.observations.filter((o) => o.kind === 'prediction');
}

function decisions(record) {
  return record.observations.filter((o) => o.kind === 'decision');
}

/**
 * Calibration — does the learner correctly anticipate the consequence of their own
 * choice? The strongest indicator available, because becoming well-calibrated about a
 * system requires understanding it. Hard to fake by performing for an assessor.
 */
function calibration(record) {
  const preds = predictions(record);
  const correct = preds.filter((p) => p.correct);

  // Split early vs late to see whether calibration IMPROVED — learning, rather than
  // arriving already knowing.
  const half = Math.floor(preds.length / 2);
  const early = preds.slice(0, half);
  const late = preds.slice(half);
  const rate = (arr) => (arr.length ? arr.filter((p) => p.correct).length / arr.length : null);

  const earlyRate = rate(early);
  const lateRate = rate(late);
  let trend = null;
  if (earlyRate !== null && lateRate !== null && preds.length >= 6) {
    if (lateRate - earlyRate > 0.15) trend = 'improved';
    else if (earlyRate - lateRate > 0.15) trend = 'declined';
    else trend = 'steady';
  }

  return {
    id: 'calibration',
    label: 'Anticipating consequences',
    total: preds.length,
    correct: correct.length,
    earlyRate,
    lateRate,
    trend,
    evidence: preds.map((p) => ({
      turnId: p.turnId,
      predicted: p.predicted,
      actual: p.actual,
      correct: p.correct,
    })),
  };
}

/** Does the learner buy information before committing, or decide blind? */
function informationSeeking(record) {
  const decs = decisions(record);
  const withInfo = decs.filter((d) => (d.infoSoughtCount || 0) > 0);
  return {
    id: 'information-seeking',
    label: 'Checking before deciding',
    total: decs.length,
    withInfo: withInfo.length,
    evidence: decs.map((d) => ({
      turnId: d.turnId,
      concept: d.concept,
      infoSought: d.infoSoughtCount || 0,
      choice: d.optionLabel,
    })),
  };
}

/** What did they do immediately after a decision that lost money? */
function recovery(record) {
  const decs = decisions(record);
  const events = [];
  for (let i = 0; i < decs.length - 1; i += 1) {
    const d = decs[i];
    if (typeof d.profitAfter === 'number' && typeof d.profitBefore === 'number' && d.profitAfter < d.profitBefore) {
      events.push({
        setbackTurn: d.turnId,
        drop: d.profitBefore - d.profitAfter,
        nextChoice: decs[i + 1].optionLabel,
        nextTurn: decs[i + 1].turnId,
      });
    }
  }
  return {
    id: 'recovery',
    label: 'After a setback',
    total: events.length,
    evidence: events,
  };
}

/** Breadth — which concepts did they actually engage with? */
function conceptCoverage(record) {
  const seen = new Map();
  for (const d of decisions(record)) {
    if (!d.concept) continue;
    seen.set(d.concept, (seen.get(d.concept) || 0) + 1);
  }
  return {
    id: 'concept-coverage',
    label: 'Concepts encountered',
    total: seen.size,
    evidence: [...seen.entries()].map(([concept, times]) => ({ concept, times })),
  };
}

function allIndicators(record) {
  return [
    calibration(record),
    informationSeeking(record),
    recovery(record),
    conceptCoverage(record),
  ];
}

// ---------------------------------------------------------------------------
// Layer 3 — profile. Human-readable, hedged, observation-anchored.
// ---------------------------------------------------------------------------

/**
 * Statements are written so that deleting "in the simulation" would make them false.
 * That is the test from docs/assessment.md for whether we are overclaiming.
 */
function buildProfile(record) {
  const cal = calibration(record);
  const info = informationSeeking(record);
  const rec = recovery(record);
  const cov = conceptCoverage(record);

  const statements = [];

  if (cal.total > 0) {
    statements.push({
      indicator: cal.label,
      text: `Correctly anticipated the effect of their own decision in ${cal.correct} of ${cal.total} predictions.`,
      detail: cal.trend === 'improved'
        ? 'Accuracy was higher in the second half of the playthrough than the first.'
        : cal.trend === 'declined'
          ? 'Accuracy was lower in the second half than the first.'
          : cal.trend === 'steady'
            ? 'Accuracy was broadly steady across the playthrough.'
            : null,
    });
  }

  if (info.total > 0) {
    statements.push({
      indicator: info.label,
      text: `Sought information before deciding in ${info.withInfo} of ${info.total} decisions.`,
      detail: null,
    });
  }

  if (rec.total > 0) {
    statements.push({
      indicator: rec.label,
      text: `Faced ${rec.total} decision${rec.total === 1 ? '' : 's'} that reduced weekly profit, and continued afterwards.`,
      detail: 'What they chose next is listed in the evidence below.',
    });
  }

  statements.push({
    indicator: cov.label,
    text: `Made decisions across ${cov.total} business concept${cov.total === 1 ? '' : 's'}.`,
    detail: null,
  });

  return {
    scenarioId: record.scenarioId,
    startedAt: record.startedAt,
    generatedAt: new Date().toISOString(),
    statements,
    indicators: allIndicators(record),

    // Carried INSIDE the artefact, not as a footnote. This will be read out of
    // context, so the caveat has to travel with it. docs/assessment.md, item 3.
    limitations: [
      'This describes what happened inside a simulation. It is not a measure of how this person runs a real business.',
      'It has not been validated against real business outcomes. No such study exists yet.',
      'It should not be used as an automatic cut-off, or to rank one person against another.',
      'Figures in the simulation are illustrative placeholders, not researched local data.',
    ],
  };
}

/**
 * Deliberately NOT a score.
 *
 * Prediction accuracy is reported as a proportion because it is the one signal the
 * project owner wants to gate a funnel on. Presenting it as a bare percentage would
 * make it trivially sortable, which is the failure mode assessment.md exists to
 * prevent — so callers get the raw counts and must show the evidence alongside.
 */
function predictionTally(record) {
  const cal = calibration(record);
  return { correct: cal.correct, total: cal.total, trend: cal.trend };
}

  return { createRecord, observe, observeInfoSought, observePrediction, observeDecision, observeConstraint, calibration, informationSeeking, recovery, conceptCoverage, allIndicators, buildProfile, predictionTally };
})();

/* ---- storage ---- */
const NS_storage = (function () {

// Local-first persistence.
//
// The learner holds their own record (SECURITY.md). Nothing is transmitted anywhere —
// there is no network code in this application at all, by design.
//
// Save continuously and assume the app is killed mid-decision, because on the target
// devices it will be (docs/localization.md).

const KEY = 'business-simulator:v1';

function save(session) {
  try {
    localStorage.setItem(KEY, JSON.stringify(session));
    return true;
  } catch (err) {
    // Private browsing or a full quota. Play continues in memory rather than dying.
    console.warn('Could not save progress:', err);
    return false;
  }
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    return parsed;
  } catch (err) {
    console.warn('Could not load saved progress:', err);
    return null;
  }
}

function clear() {
  try {
    localStorage.removeItem(KEY);
    return true;
  } catch {
    return false;
  }
}

function hasSave() {
  return load() !== null;
}

/** Export the learner's own record so they can keep or share it deliberately. */
function exportJson(session) {
  return JSON.stringify(session, null, 2);
}

  return { save, load, clear, hasSave, exportJson };
})();

/* ---- scene ---- */
const NS_scene = (function () {

// scene.js — generated SVG illustrations and small animation helpers.
// No dependencies. No network. No innerHTML with user data.
// All drawing is document.createElementNS so nothing here needs a build step.

const NS = 'http://www.w3.org/2000/svg';
const REDUCE = typeof matchMedia === 'function'
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : { matches: false };

function svg(name, attrs) {
  const node = document.createElementNS(NS, name);
  if (attrs) {
    for (const key in attrs) node.setAttribute(key, attrs[key]);
  }
  return node;
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

// ---- shared scene primitives --------------------------------------------

const VB_W = 320;
const VB_H = 160;
const GROUND_Y = 132;

function baseSvg(extraClass) {
  const root = svg('svg', {
    viewBox: `0 0 ${VB_W} ${VB_H}`,
    class: 'scene-svg' + (extraClass ? ' ' + extraClass : ''),
    role: 'img',
    'aria-hidden': 'true',
    preserveAspectRatio: 'xMidYMax meet',
  });
  return root;
}

function skyGround(root, night) {
  root.appendChild(svg('rect', {
    x: 0, y: 0, width: VB_W, height: GROUND_Y,
    class: night ? 'scene-sky scene-sky-night' : 'scene-sky',
  }));
  root.appendChild(svg('rect', {
    x: 0, y: GROUND_Y, width: VB_W, height: VB_H - GROUND_Y,
    class: night ? 'scene-ground scene-ground-night' : 'scene-ground',
  }));
}

function sun(root, cx, cy, r) {
  root.appendChild(svg('circle', { cx, cy, r, class: 'scene-sun' }));
}

function moonAndStars(root, count) {
  root.appendChild(svg('circle', { cx: 262, cy: 30, r: 16, class: 'scene-moon' }));
  const positions = [
    [24, 20], [60, 42], [110, 18], [150, 34], [190, 16],
    [220, 46], [30, 58], [130, 52], [95, 34], [200, 62],
  ];
  const n = clamp(count, 3, positions.length);
  for (let i = 0; i < n; i++) {
    const [x, y] = positions[i];
    root.appendChild(svg('circle', { cx: x, cy: y, r: 1.4, class: 'scene-star' }));
  }
}

function cloud(root, x, y, scale) {
  const g = svg('g', { class: 'scene-cloud', transform: `translate(${x} ${y}) scale(${scale})` });
  g.appendChild(svg('ellipse', { cx: 0, cy: 0, rx: 14, ry: 8 }));
  g.appendChild(svg('ellipse', { cx: 12, cy: -3, rx: 10, ry: 7 }));
  g.appendChild(svg('ellipse', { cx: -12, cy: 2, rx: 9, ry: 6 }));
  root.appendChild(g);
}

// A simple flat figure: head + body, feet at (x, groundY).
function figure(root, x, groundY, opts) {
  opts = opts || {};
  const scale = opts.scale || 1;
  const cls = 'scene-figure' + (opts.staff ? ' scene-figure-staff' : ' scene-figure-customer');
  const g = svg('g', { class: cls, transform: `translate(${x} ${groundY})` });
  const bodyH = 20 * scale;
  const bodyW = 11 * scale;
  g.appendChild(svg('rect', {
    x: -bodyW / 2, y: -bodyH, width: bodyW, height: bodyH, rx: bodyW / 2.2,
    class: 'scene-figure-body',
  }));
  g.appendChild(svg('circle', { cx: 0, cy: -bodyH - 5 * scale, r: 5 * scale, class: 'scene-figure-head' }));
  if (opts.staff) {
    // small apron / cap mark so staff read as distinct without relying on colour alone
    g.appendChild(svg('rect', {
      x: -bodyW / 2, y: -bodyH * 0.55, width: bodyW, height: bodyH * 0.45,
      class: 'scene-figure-apron',
    }));
    g.appendChild(svg('rect', {
      x: -4 * scale, y: -bodyH - 9 * scale, width: 8 * scale, height: 3 * scale,
      class: 'scene-figure-cap',
    }));
  }
  if (opts.idle) g.setAttribute('class', g.getAttribute('class') + ' scene-figure-idle');
  root.appendChild(g);
  return g;
}

function customerRow(root, count, groundY, spanX) {
  count = clamp(count, 0, 8);
  if (count === 0) return;
  const startX = (VB_W - spanX) / 2 + 10;
  const step = count > 1 ? spanX / (count - 1 || 1) : 0;
  for (let i = 0; i < count; i++) {
    const x = count === 1 ? VB_W / 2 : startX + step * i;
    figure(root, x, groundY, { scale: 0.8 + (i % 2) * 0.06, idle: i % 3 === 0 });
  }
}

function staffRow(root, count, groundY, cx) {
  count = clamp(count, 0, 4);
  const spacing = 16;
  const start = cx - ((count - 1) * spacing) / 2;
  for (let i = 0; i < count; i++) {
    figure(root, start + i * spacing, groundY, { scale: 0.85, staff: true });
  }
}

// A stall / kiosk whose footprint grows with capacity.
function stall(root, cx, baseY, scale, opts) {
  opts = opts || {};
  const w = 76 * scale;
  const h = 46 * scale;
  const g = svg('g', { class: 'scene-stall', transform: `translate(${cx} ${baseY})` });

  // roof
  g.appendChild(svg('polygon', {
    points: `${-w / 2 - 8},${-h} ${w / 2 + 8},${-h} ${w / 2 - 2},${-h - 16} ${-w / 2 + 2},${-h - 16}`,
    class: 'scene-stall-roof',
  }));
  // awning stripes (shape-based, not colour-only)
  const stripeCount = 5;
  const stripeW = (w + 16) / stripeCount;
  for (let i = 0; i < stripeCount; i++) {
    g.appendChild(svg('rect', {
      x: -w / 2 - 8 + i * stripeW, y: -h - 16, width: stripeW, height: 5,
      class: i % 2 === 0 ? 'scene-stall-awning-a' : 'scene-stall-awning-b',
    }));
  }
  // wall
  g.appendChild(svg('rect', { x: -w / 2, y: -h, width: w, height: h, class: 'scene-stall-wall' }));
  // counter
  g.appendChild(svg('rect', {
    x: -w / 2 - 4, y: -h * 0.42, width: w + 8, height: h * 0.42,
    class: 'scene-stall-counter',
  }));
  // goods on counter — count nods to capacity
  const goods = clamp(Math.round(scale * 4), 1, 7);
  for (let i = 0; i < goods; i++) {
    g.appendChild(svg('circle', {
      cx: -w / 2 + 8 + i * ((w - 16) / Math.max(1, goods - 1 || 1)),
      cy: -h * 0.42 - 3, r: 3, class: 'scene-stall-goods',
    }));
  }
  if (opts.pot) {
    const potX = 0, potY = -h - 4;
    g.appendChild(svg('ellipse', { cx: potX, cy: potY, rx: 9, ry: 5, class: 'scene-pot' }));
    const steam = svg('path', {
      d: `M ${potX - 3} ${potY - 4} q 3 -8 0 -14 q -3 6 0 -12`,
      class: 'scene-steam',
    });
    g.appendChild(steam);
  }
  if (opts.closed) {
    g.appendChild(svg('rect', {
      x: -w / 2, y: -h * 0.42, width: w, height: h * 0.42, class: 'scene-stall-shutter',
    }));
  }
  root.appendChild(g);
  return { w, h };
}

function dimOverlay(root, amount) {
  if (amount <= 0) return;
  root.appendChild(svg('rect', {
    x: 0, y: 0, width: VB_W, height: VB_H,
    class: 'scene-dim-overlay', 'fill-opacity': clamp(amount, 0, 0.55),
  }));
}

function grimeOrSparkle(root, hygiene, cx, cy) {
  if (hygiene < 40) {
    const specks = [[-14, 4], [10, 8], [2, -4], [-6, 10]];
    specks.forEach(([dx, dy]) => {
      root.appendChild(svg('circle', {
        cx: cx + dx, cy: cy + dy, r: 1.6, class: 'scene-grime',
      }));
    });
  } else if (hygiene >= 70) {
    const sparks = [[-16, -2], [14, 2], [0, -10]];
    sparks.forEach(([dx, dy]) => {
      const s = svg('path', {
        d: `M ${cx + dx} ${cy + dy - 4} L ${cx + dx} ${cy + dy + 4} M ${cx + dx - 4} ${cy + dy} L ${cx + dx + 4} ${cy + dy}`,
        class: 'scene-sparkle',
      });
      root.appendChild(s);
    });
  }
}

function formalityBadges(root, level, x, y) {
  const n = clamp(level, 0, 3);
  for (let i = 0; i < 3; i++) {
    const cx = x + i * 16;
    root.appendChild(svg('circle', {
      cx, cy: y, r: 6,
      class: 'scene-badge' + (i < n ? ' scene-badge-earned' : ' scene-badge-empty'),
    }));
    if (i < n) {
      root.appendChild(svg('path', {
        d: `M ${cx - 3} ${y} l 2 2.5 l 4 -5`,
        class: 'scene-badge-check',
      }));
    }
  }
}

function cashStack(root, cx, baseY, cash) {
  const coins = clamp(Math.round((cash || 0) / 60000), 1, 6);
  for (let i = 0; i < coins; i++) {
    root.appendChild(svg('ellipse', {
      cx, cy: baseY - i * 4, rx: 10, ry: 3.4, class: 'scene-coin',
    }));
  }
}

// ---- scene builders --------------------------------------------------

function deriveCustomerCount(state) {
  const demand = state.demand == null ? 100 : state.demand;
  return clamp(Math.round(demand / 40), 0, 7);
}

function deriveScale(state) {
  const capacity = state.capacity == null ? 180 : state.capacity;
  return clamp(capacity / 180, 0.65, 1.7);
}

function buildStallScene(root, state, mode) {
  const day = mode !== 'night';
  skyGround(root, false);
  cloud(root, 60, 26, 1);
  cloud(root, 230, 20, 0.7);
  sun(root, 40, 26, 15);

  const scale = deriveScale(state);
  let count = deriveCustomerCount(state);
  if (mode === 'empty') count = Math.min(count, 1);
  if (mode === 'busy') count = Math.max(count, 4);

  const { h } = stall(root, VB_W / 2, GROUND_Y, scale, { pot: true, closed: mode === 'empty' && (state.reputation ?? 50) < 20 });
  customerRow(root, count, GROUND_Y, 220);
  staffRow(root, state.staff || 0, GROUND_Y, VB_W / 2 - 40);
  grimeOrSparkle(root, state.hygiene == null ? 60 : state.hygiene, VB_W / 2, GROUND_Y - h - 20);

  const reputation = state.reputation == null ? 50 : state.reputation;
  if (reputation < 35) dimOverlay(root, (35 - reputation) / 60);
}

function buildKitchenScene(root, state) {
  skyGround(root, false);
  // back wall + shelf
  root.appendChild(svg('rect', { x: 0, y: 20, width: VB_W, height: GROUND_Y - 20, class: 'scene-kitchen-wall' }));
  root.appendChild(svg('rect', { x: 20, y: 34, width: 90, height: 8, class: 'scene-shelf' }));
  const jars = clamp(Math.round(deriveScale(state) * 4), 1, 6);
  for (let i = 0; i < jars; i++) {
    root.appendChild(svg('rect', {
      x: 26 + i * 14, y: 20, width: 9, height: 13, rx: 2, class: 'scene-jar',
    }));
  }
  // stove + pot
  const scale = deriveScale(state);
  root.appendChild(svg('rect', {
    x: VB_W / 2 - 22 * scale, y: GROUND_Y - 20, width: 44 * scale, height: 20, class: 'scene-stove',
  }));
  root.appendChild(svg('ellipse', {
    cx: VB_W / 2, cy: GROUND_Y - 22, rx: 20 * scale, ry: 8, class: 'scene-pot',

/**

 * @param {HTMLElement} el
 * @param {string} sceneName
 * @param {object} state
 */
function drawScene(el, sceneName, state) {

// ---- chart -------------------------------------------------------------

/**
 * Draw a small profit-over-time chart. history: [{week, profit, cash}]
 * @param {HTMLElement} el
 * @param {Array<{week:number, profit:number, cash:number}>} history
 */
function drawChart(el, history) {
  if (!el) return;
  clear(el);
  const data = Array.isArray(history) ? history.slice(-12) : [];
  const w = 300, h = 120, padL = 8, padR = 8, padT = 10, padB = 18;
  const root = svg('svg', {
    viewBox: `0 0 ${w} ${h}`, class: 'chart-svg', role: 'img', 'aria-hidden': 'true',
  });

  if (data.length === 0) {
    root.appendChild(svg('text', { x: w / 2, y: h / 2, class: 'chart-empty' }));
    el.appendChild(root);
    return;
  }

  const profits = data.map((d) => d.profit || 0);
  const maxAbs = Math.max(1, ...profits.map(Math.abs));
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const zeroY = padT + plotH / 2;
  const barW = Math.min(20, plotW / data.length - 4);
  const step = plotW / data.length;

  // pattern for negative bars so the meaning isn't colour-only
  const defs = svg('defs', {});
  const pattern = svg('pattern', {
    id: 'chartNegHatch', width: 4, height: 4, patternTransform: 'rotate(45)', patternUnits: 'userSpaceOnUse',
  });
  pattern.appendChild(svg('rect', { width: 4, height: 4, class: 'chart-hatch-bg' }));
  pattern.appendChild(svg('line', { x1: 0, y1: 0, x2: 0, y2: 4, class: 'chart-hatch-line' }));
  defs.appendChild(pattern);
  root.appendChild(defs);

  root.appendChild(svg('line', {
    x1: padL, y1: zeroY, x2: w - padR, y2: zeroY, class: 'chart-baseline',
  }));

  data.forEach((d, i) => {
    const profit = d.profit || 0;
    const barH = (Math.abs(profit) / maxAbs) * (plotH / 2);
    const x = padL + step * i + (step - barW) / 2;
    const y = profit >= 0 ? zeroY - barH : zeroY;
    const bar = svg('rect', {
      x, y, width: barW, height: Math.max(1, barH),
      class: profit >= 0 ? 'chart-bar chart-bar-pos' : 'chart-bar chart-bar-neg',
    });
    bar.appendChild(svg('title', {})).textContent = String(d.week != null ? d.week : i + 1);
    root.appendChild(bar);
    root.appendChild(svg('text', {
      x: x + barW / 2, y: h - 4, class: 'chart-tick',
    })).textContent = String(d.week != null ? d.week : i + 1);
  });

  // cash trend as a line so it reads as a distinct series by shape, not colour
  const cashVals = data.map((d) => d.cash || 0);
  const cMin = Math.min(...cashVals), cMax = Math.max(...cashVals, cMin + 1);
  const points = data.map((d, i) => {
    const x = padL + step * i + step / 2;
    const norm = (((d.cash || 0) - cMin) / (cMax - cMin || 1));
    const y = padT + (1 - norm) * plotH;
    return `${x},${y}`;
  }).join(' ');
  root.appendChild(svg('polyline', { points, class: 'chart-cash-line' }));
  data.forEach((d, i) => {
    const x = padL + step * i + step / 2;
    const norm = (((d.cash || 0) - cMin) / (cMax - cMin || 1));
    const y = padT + (1 - norm) * plotH;
    root.appendChild(svg('circle', { cx: x, cy: y, r: 2, class: 'chart-cash-dot' }));
  });

  el.appendChild(root);
}

// ---- number animation ---------------------------------------------------

/**
 * Animate the text content of `el` from `from` to `to`.
 * @param {HTMLElement} el
 * @param {number} from
 * @param {number} to
 * @param {{duration?:number, format?:(n:number)=>string}} [opts]
 */
function animateNumber(el, from, to, opts) {
  if (!el) return;
  const options = opts || {};
  const format = typeof options.format === 'function' ? options.format : (n) => String(Math.round(n));
  const duration = REDUCE.matches ? 0 : Math.max(0, options.duration == null ? 500 : options.duration);

  if (duration === 0 || from === to) {
    el.textContent = format(to);
    return;
  }

  const start = performance.now();
  const startVal = Number(from) || 0;
  const endVal = Number(to) || 0;

  function tick(now) {
    const t = clamp((now - start) / duration, 0, 1);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out
    const value = startVal + (endVal - startVal) * eased;
    el.textContent = format(value);
    if (t < 1) {
      requestAnimationFrame(tick);
    } else {
      el.textContent = format(endVal);
    }
  }
  requestAnimationFrame(tick);
}

// ---- pulse ---------------------------------------------------------------

/**
 * Give `el` a brief attention animation (e.g. after a value changes).
 * @param {HTMLElement} el
 */
function pulse(el) {
  if (!el) return;
  el.classList.remove('is-pulsing');
  // force reflow so the animation can restart if already applied
  // eslint-disable-next-line no-unused-expressions
  el.offsetWidth;
  el.classList.add('is-pulsing');
  const done = () => {
    el.classList.remove('is-pulsing');
    el.removeEventListener('animationend', done);
  };
  el.addEventListener('animationend', done);
  // fallback in case the animation is disabled (reduced motion) and never fires
  setTimeout(done, 700);
}

  return { drawScene, drawChart, animateNumber, pulse };
})();

// Rendering. One decision per screen (docs/game-design.md, "Interface constraints").
//
// All text goes in via textContent, never innerHTML — scenario content is data and
// must never become markup.




function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

// --- top bar -------------------------------------------------------------

function renderStats(container, state, prevState) {
  clear(container);
  const pnl = weeklyPnl(state);
  const load = ownerLoad(state);

  const tiles = [
    { label: 'Week', value: count(state.week), raw: state.week, fmt: count },
    { label: 'Cash', value: moneyShort(state.cash), raw: state.cash, fmt: moneyShort },
    { label: 'Profit', value: moneyShort(pnl.profit), raw: pnl.profit, fmt: moneyShort, negative: pnl.profit < 0 },
    { label: 'Sold', value: count(pnl.unitsSold), raw: pnl.unitsSold, fmt: count },
  ];

  for (const t of tiles) {
    const tile = el('div', 'stat');
    tile.appendChild(el('div', 'stat-label', t.label));
    const value = el('div', `stat-value${t.negative ? ' negative' : ''}`, t.value);
    tile.appendChild(value);
    container.appendChild(tile);

    // Animate only when a number actually moved, so movement means something.
    if (prevState) {
      const before = t.label === 'Profit' ? weeklyPnl(prevState).profit
        : t.label === 'Cash' ? prevState.cash
          : t.label === 'Week' ? prevState.week
            : weeklyPnl(prevState).unitsSold;
      if (before !== t.raw) {
        animateNumber(value, before, t.raw, { duration: 600, format: t.fmt });
      }
    }
  }

  if (load.overloaded) {
    const warn = el('div', 'stat stat-warn');
    warn.appendChild(el('div', 'stat-label', 'Your time'));
    warn.appendChild(el('div', 'stat-value negative', 'Too much'));
    container.appendChild(warn);
  }
}

function renderPnl(container, state, opts = {}) {
  clear(container);
  const pnl = weeklyPnl(state);

  const rows = [
    ['Sales', pnl.revenue],
    ['Cost of what you sold', -pnl.variableCost],
    ['Rent', -pnl.rent],
  ];
  if (pnl.wages > 0) rows.push(['Wages', -pnl.wages]);
  if (pnl.licenceFees > 0) rows.push(['Fees', -pnl.licenceFees]);
  if (pnl.spoilage > 0) rows.push(['Food thrown away', -pnl.spoilage]);

  for (const [label, value] of rows) {
    const row = el('div', 'pnl-row');
    row.appendChild(el('div', 'pnl-label', label));
    row.appendChild(el('div', `pnl-value${value < 0 ? ' negative' : ''}`, money(value)));
    container.appendChild(row);
  }

  const total = el('div', 'pnl-row total');
  total.appendChild(el('div', 'pnl-label', 'Profit this week'));
  total.appendChild(el('div', `pnl-value${pnl.profit < 0 ? ' negative' : ''}`, money(pnl.profit)));
  container.appendChild(total);

  if (pnl.unmetDemand > 0) {
    container.appendChild(el('div', 'pnl-note', `${count(pnl.unmetDemand)} customers wanted to buy and you had nothing left.`));
  }
  if (opts.showMargin && pnl.revenue > 0) {
    const perUnit = state.price - state.unitCost;
    container.appendChild(el('div', 'pnl-note', `You keep ${money(perUnit)} from each one you sell, before rent and wages.`));
  }
}

function renderSituation(container, turn) {
  clear(container);
  const card = el('div', 'card fade-in');
  const head = el('div', 'card-title');
  head.appendChild(el('span', 'concept-tag', turn.conceptLabel || turn.concept || ''));
  card.appendChild(head);
  card.appendChild(el('p', 'situation', turn.situation));
  container.appendChild(card);
  return card;
}

function renderInfo(container, turn, state, onSeek, sought) {
  clear(container);
  if (!turn.info || turn.info.length === 0) return;

  const card = el('div', 'card fade-in');
  card.appendChild(el('div', 'card-title', 'Before you decide'));
  const list = el('div', 'info-list');

  for (const item of turn.info) {
    const used = sought.has(item.id);
    const btn = el('button', `info-item${used ? ' used' : ''}`);
    btn.type = 'button';
    btn.appendChild(el('span', 'info-label', item.label));

    const cost = [];
    if (item.costHours) cost.push(`${item.costHours}h`);
    if (item.costCash) cost.push(money(item.costCash));
    if (cost.length && !used) btn.appendChild(el('span', 'info-cost', cost.join(' · ')));

    if (used) {
      btn.appendChild(el('span', 'info-reveals', item.reveals));
      btn.disabled = true;
    } else {
      btn.addEventListener('click', () => onSeek(item));
    }
    list.appendChild(btn);
  }

  card.appendChild(list);
  container.appendChild(card);
}

function renderOptions(container, turn, onChoose) {
  clear(container);
  const card = el('div', 'card fade-in');
  card.appendChild(el('div', 'card-title', turn.decision.prompt || 'What do you do?'));
  const list = el('div', 'options');

  for (const opt of turn.decision.options) {
    const btn = el('button', 'option');
    btn.type = 'button';
    btn.appendChild(el('span', 'option-label', opt.label));
    if (opt.detail) btn.appendChild(el('span', 'option-detail', opt.detail));
    btn.addEventListener('click', () => {
      [...list.children].forEach((c) => c.classList.remove('selected'));
      btn.classList.add('selected');
      onChoose(opt);
    });
    list.appendChild(btn);
  }

  card.appendChild(list);
  container.appendChild(card);
}

/**
 * Predict-then-reveal. The learner commits to an expectation BEFORE seeing the
 * result. This is simultaneously the engagement mechanic and the measurement —
 * see memory/sessions/2026-08-02-002 and docs/assessment.md.
 */
function renderPredict(container, turn, chosenOption, onPredict) {
  clear(container);
  const card = el('div', 'card predict slide-up');
  card.appendChild(el('div', 'card-title', 'Your call'));
  card.appendChild(el('p', 'situation', `You chose: ${chosenOption.label}`));
  card.appendChild(el('p', 'predict-question',
    turn.decision.predictQuestion || 'What happens to your weekly profit?'));

  const list = el('div', 'predict-choices');
  const choices = turn.decision.predictChoices || [
    { id: 'up_lot', label: 'Goes up a lot' },
    { id: 'up_bit', label: 'Goes up a little' },
    { id: 'same', label: 'Stays about the same' },
    { id: 'down', label: 'Goes down' },
  ];

  for (const choice of choices) {
    const btn = el('button', 'predict-choice');
    btn.type = 'button';
    btn.textContent = choice.label;
    btn.addEventListener('click', () => {
      [...list.children].forEach((c) => { c.classList.remove('selected'); c.disabled = true; });
      btn.classList.add('selected');
      onPredict(choice);
    });
    list.appendChild(btn);
  }

  card.appendChild(list);
  container.appendChild(card);
  pulse(card);
}

function renderReveal(container, turn, option, predicted, correct, pnlBefore, pnlAfter, onNext) {
  clear(container);
  const card = el('div', `reveal ${correct ? 'correct' : 'wrong'} slide-up`);

  const verdict = el('div', 'reveal-verdict');
  // Never colour alone — docs/localization.md.
  verdict.appendChild(el('span', 'reveal-mark', correct ? '✓' : '✗'));
  verdict.appendChild(el('span', 'reveal-text',
    correct ? 'You called it right.' : 'Not what you expected.'));
  card.appendChild(verdict);

  const delta = pnlAfter - pnlBefore;
  const deltaRow = el('div', 'reveal-delta');
  deltaRow.appendChild(el('span', 'reveal-delta-label', 'Weekly profit'));
  const deltaVal = el('span', `reveal-delta-value${delta < 0 ? ' negative' : ''}`,
    `${delta >= 0 ? '+' : ''}${money(delta)}`);
  deltaRow.appendChild(deltaVal);
  card.appendChild(deltaRow);

  card.appendChild(el('p', 'outcome', option.outcome));
  if (option.lesson) card.appendChild(el('p', 'lesson', option.lesson));

  const next = el('button', 'btn btn-primary', 'Continue');
  next.type = 'button';
  next.addEventListener('click', onNext);
  card.appendChild(next);

  container.appendChild(card);
  animateNumber(deltaVal, 0, delta, {
    duration: 700,
    format: (v) => `${v >= 0 ? '+' : ''}${money(v)}`,
  });
}

function renderScene(container, sceneName, state) {

function renderChart(container, history) {

function renderProgress(container, done, total) {

  container.setAttribute('role', 'progressbar');
  container.setAttribute('aria-valuenow', String(done));
  container.setAttribute('aria-valuemax', String(total));
  container.setAttribute('aria-label', `Question ${done} of ${total}`);

function renderProfile(container, profile, tally, state, history) {

  card.appendChild(head);

  for (const s of profile.statements) {

    item.appendChild(el('div', 'indicator-text', s.text));

    card.appendChild(item);
  }

  const chartWrap = el('div', 'profile-chart');

  if (history && history.length > 1) drawChart(chartWrap, history);

  const limits = el('div', 'card limitations');

  for (const line of profile.limitations) {

  }
  limits.appendChild(ul);
  container.appendChild(limits);

    const record = NS_record, store = NS_storage, ui = NS_ui;
    const { createState, applyEffects, weeklyPnl, advanceWeek } = NS_engine;
    const { setLocale } = NS_format;
  
// Application bootstrap and turn state machine.
//
// Flow per turn:
//   situation -> (optional information) -> decision -> prediction -> reveal
//
// The prediction step sits between the decision and its consequence deliberately.
// The learner commits to an expectation before learning whether they were right,
// which is what makes the answer worth recording.






const SCENARIO_URL = './content/scenario-mama-asha.json';

const dom = {};
let scenario = null;
let session = null;

function q(id) { return document.getElementById(id); }

function cacheDom() {
  dom.stats = q('stats');
  dom.scene = q('scene');
  dom.progress = q('progress');
  dom.situation = q('situation');
  dom.info = q('info');
  dom.decision = q('decision');
  dom.pnl = q('pnl');
  dom.banner = q('banner');
  dom.title = q('title');
  dom.reset = q('reset');
  dom.pnlToggle = q('pnl-toggle');
  dom.pnlWrap = q('pnl-wrap');
}

function newSession() {
  return {
    scenarioId: scenario.id,
    turnIndex: 0,
    phase: 'situation',
    state: createState(scenario.startState || {}),
    history: [],
    sought: [],
    chosenOptionId: null,
    predictedId: null,
    record: record.createRecord(scenario.id),
  };
}

function persist() {
  session.soughtArr = undefined;
  store.save(session);
}

function currentTurn() {
  return scenario.turns[session.turnIndex];
}

function scrollToDecision() {
  // Keep the active step in view without yanking the page around.
  requestAnimationFrame(() => {
    dom.decision.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

// --- rendering -----------------------------------------------------------

function renderAll(prevState) {
  const turn = currentTurn();

  if (!turn) { renderEnd(); return; }

  // Restore the P&L panel, which renderEnd hides.
  dom.pnlToggle.hidden = false;
  if (dom.pnlToggle.getAttribute('aria-expanded') === 'true') dom.pnlWrap.removeAttribute('hidden');

  ui.renderStats(dom.stats, session.state, prevState);
  ui.renderScene(dom.scene, turn.scene, session.state);
  ui.renderProgress(dom.progress, session.turnIndex, scenario.turns.length);
  ui.renderSituation(dom.situation, turn);
  ui.renderPnl(dom.pnl, session.state, { showMargin: session.turnIndex < 4 });

  const sought = new Set(session.sought);
  ui.renderInfo(dom.info, turn, session.state, onSeekInfo, sought);

  if (session.phase === 'situation') {
    ui.renderOptions(dom.decision, turn, onChooseOption);
  } else if (session.phase === 'predict') {
    const opt = turn.decision.options.find((o) => o.id === session.chosenOptionId);
    ui.renderPredict(dom.decision, turn, opt, onPredict);
    scrollToDecision();
  } else if (session.phase === 'reveal') {
    renderRevealPhase();
    scrollToDecision();
  }
}

function renderRevealPhase() {
  const turn = currentTurn();
  const opt = turn.decision.options.find((o) => o.id === session.chosenOptionId);
  const correct = session.predictedId === opt.predictAnswer;

  ui.renderReveal(
    dom.decision, turn, opt, session.predictedId, correct,
    session.pnlBefore, session.pnlAfter, onNext,
  );
}

// --- handlers ------------------------------------------------------------

function onSeekInfo(item) {
  if (session.sought.includes(item.id)) return;
  session.sought.push(item.id);

  const next = { ...session.state };
  if (item.costHours) next.ownerHoursUsed += item.costHours;
  if (item.costCash) next.cash -= item.costCash;
  session.state = next;

  record.observeInfoSought(session.record, currentTurn().id, item.id, item.label);
  persist();
  renderAll();
}

function onChooseOption(option) {
  session.chosenOptionId = option.id;
  session.phase = 'predict';
  persist();
  renderAll();
}

function onPredict(choice) {
  const turn = currentTurn();
  const opt = turn.decision.options.find((o) => o.id === session.chosenOptionId);

  const before = weeklyPnl(session.state).profit;
  const after = weeklyPnl(applyEffects(session.state, opt.effects || {})).profit;

  session.predictedId = choice.id;
  session.pnlBefore = before;
  session.pnlAfter = after;

  const correct = choice.id === opt.predictAnswer;
  record.observePrediction(session.record, turn.id, choice.id, opt.predictAnswer, correct, 'profit');

  session.phase = 'reveal';
  persist();
  renderAll();
}

function onNext() {
  const turn = currentTurn();
  const opt = turn.decision.options.find((o) => o.id === session.chosenOptionId);
  const prevState = session.state;

  record.observeDecision(
    session.record, turn.id, turn.concept, opt.id, opt.label,
    session.sought.length, session.pnlBefore, session.pnlAfter,
  );

  // Apply the choice, then let a week pass so consequences arrive with a lag.
  let next = applyEffects(session.state, opt.effects || {});
  const advanced = advanceWeek(next);
  next = advanced.state;

  session.history.push({
    week: prevState.week,
    profit: advanced.pnl.profit,
    cash: next.cash,
  });

  session.state = next;
  session.turnIndex += 1;
  session.phase = 'situation';
  session.sought = [];
  session.chosenOptionId = null;
  session.predictedId = null;

  persist();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderAll(prevState);
}

function renderEnd() {
  ui.renderStats(dom.stats, session.state);
  ui.renderScene(dom.scene, 'stall-busy', session.state);
  ui.renderProgress(dom.progress, scenario.turns.length, scenario.turns.length);
  ui.clear(dom.situation);
  ui.clear(dom.info);
  ui.clear(dom.pnl);
  // The weekly P&L box is meaningless once the run is over — hide it and its toggle
  // rather than leaving an empty bordered card on the results screen.
  dom.pnlWrap.setAttribute('hidden', '');
  dom.pnlToggle.hidden = true;

  const profile = record.buildProfile(session.record);
  const tally = record.predictionTally(session.record);
  ui.renderProfile(dom.decision, profile, tally, session.state, session.history);

  const actions = ui.el('div', 'end-actions');

  const again = ui.el('button', 'btn btn-primary', 'Play again');
  again.type = 'button';
  again.addEventListener('click', () => { store.clear(); start(true); });
  actions.appendChild(again);

  const download = ui.el('button', 'btn btn-ghost', 'Save my record');
  download.type = 'button';
  download.addEventListener('click', () => downloadRecord(profile));
  actions.appendChild(download);

  dom.decision.appendChild(actions);
}

/** The learner holds their own record — SECURITY.md. Nothing is transmitted. */
function downloadRecord(profile) {
  const blob = new Blob([store.exportJson({ profile, observations: session.record.observations })],
    { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `business-simulator-record-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// --- startup -------------------------------------------------------------

async function start(forceNew) {
  const saved = forceNew ? null : store.load();
  if (saved && saved.scenarioId === scenario.id && Array.isArray(saved.history)) {
    session = saved;
    session.sought = session.sought || [];
  } else {
    session = newSession();
  }
  renderAll();
}

async function init() {
  cacheDom();

    scenario = EMBEDDED_SCENARIO;

  setLocale('en', scenario.currency || 'TZS');
  dom.title.textContent = scenario.title || 'Business Simulator';

  // Placeholder figures must be visibly labelled as placeholders until reviewed by
  // someone with local ground truth. AGENTS.md section 6.
  if (scenario.unverified) {
    dom.banner.textContent = 'Practice figures — the money amounts here are made up for teaching, not real local prices.';
    dom.banner.hidden = false;
  }

  dom.reset.addEventListener('click', () => {
    store.clear();
    start(true);
    window.scrollTo({ top: 0 });
  });

  dom.pnlToggle.addEventListener('click', () => {
    const open = dom.pnlWrap.hasAttribute('hidden');
    if (open) dom.pnlWrap.removeAttribute('hidden');
    else dom.pnlWrap.setAttribute('hidden', '');
    dom.pnlToggle.setAttribute('aria-expanded', String(open));
    dom.pnlToggle.textContent = open ? 'Hide the numbers' : 'Show the numbers';
  });

  await start(false);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  return {  };
})();
})();
</script>
