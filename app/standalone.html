nje utakayojitolea kwa kiasi cha kontena."},"predict":"number","input":{"field":"lines.export.capacity","min":-400,"max":800,"step":100,"start":0,"valueAs":"count","unit":{"en":"units a week","sw":"vipande kwa wiki"},"hint":{"en":"A full container is 6,000 units at 150 each; you ship about 1,200 a week at 180. Committing volume moves your rate toward 150 — and your unsold capacity up.","sw":"Kontena zima ni vipande 6,000 kwa 150 kila kimoja; wewe unasafirisha takribani 1,200 kwa wiki kwa 180. Kujitolea kiasi kunaisogeza bei yako kuelekea 150 — na uwezo usiouza unaongezeka."},"responses":[{"field":"freightPerUnit","perStep":100,"change":-5}]},"bands":[{"outcome":{"en":"Pulling back this far shrinks the export line and pushes the part-load rate the other way — up to 200 a unit at the deepest cut. There is less to sell, and each unit costs more to ship.","sw":"Kupunguza hivi kunapunguza mstari wa nje na kusukuma kiwango cha sehemu za kontena upande mwingine — hadi 200 kwa kitengo kwa kupunguza kupindukia. Kuna kidogo cha kuuza, na kila kitengo kinagharimu zaidi kusafirishwa."},"lesson":{"en":"Shrinking the export line reduces the container problem by reducing the export business along with it. That is a real trade-off, not a fix.","sw":"Kupunguza mstari wa nje kunapunguza tatizo la kontena kwa kupunguza biashara ya nje pamoja nayo. Huo ni mabadilishano halisi, si suluhisho."},"upTo":-100},{"outcome":{"en":"This is close to the current commitment. The part-container inefficiency is roughly what it has been.","sw":"Hii iko karibu na ahadi ya sasa. Ukosefu wa ufanisi wa kontena lisilojaa ni takribani kile ilivyokuwa."},"lesson":{"en":"Staying where you are avoids a decision, but it does not avoid paying for a container you are not filling.","sw":"Kubaki ulipo kunaepuka uamuzi, lakini hakuepuki kulipia kontena usilolijaza."},"upTo":200},{"outcome":{"en":"Export capacity now fills more of a container. Freight per unit falls, but only if demand actually grows to use the new capacity.","sw":"Uwezo wa nje sasa unajaza sehemu kubwa zaidi ya kontena. Usafirishaji kwa kila kitengo unashuka, lakini tu kama mahitaji yataongezeka kutumia uwezo mpya."},"lesson":{"en":"A fuller container lowers the freight cost per unit. Committing to that volume without a buyer for it just moves the risk from freight to unsold capacity.","sw":"Kontena lililojaa zaidi linapunguza gharama ya usafirishaji kwa kila kitengo. Kujitolea kwa kiasi hicho bila mnunuzi wake kunahamisha tu hatari kutoka usafirishaji kwenda uwezo usiotumika."},"upTo":500},{"outcome":{"en":"This commits close to a full extra container's worth of capacity. Freight per unit falls the most, and so does the room for error if demand does not follow.","sw":"Hii inajitolea karibu na uwezo wa kontena zima la ziada. Usafirishaji kwa kila kitengo unashuka zaidi, na hivyo hivyo nafasi ya kukosea kama mahitaji hayatafuata."},"lesson":{"en":"The economics of a full container are real. So is the capacity sitting idle if the volume behind it was a hope, not an order.","sw":"Uchumi wa kontena zima ni halisi. Hivyo hivyo uwezo unaokaa bure kama kiasi kilichokuwa nyuma yake kilikuwa tumaini, si oda."}}]}},{"id":"t14","concept":"duties-preferential-access","conceptLabel":{"en":"Duties and preferential access","sw":"Ushuru na upendeleo wa kufikia soko"},"scene":"truck","unverified":true,"situation":{"en":"Your customs broker mentions that goods qualifying for regional or preferential trade arrangements can clear at a lower duty rate than the standard schedule. Qualifying takes paperwork proving where your inputs actually came from.","sw":"Wakala wako wa forodha anataja kwamba bidhaa zinazokidhi masharti ya kikanda au ya upendeleo wa kibiashara zinaweza kupita kwa kiwango cha ushuru cha chini kuliko ratiba ya kawaida. Kukidhi masharti kunahitaji nyaraka zinazothibitisha malighafi yako ilitoka wapi hasa."},"info":[{"id":"check-origin-rules","label":{"en":"Ask what proof the preferential rate actually requires","sw":"Uliza kiwango cha upendeleo kinahitaji ushahidi gani hasa"},"costHours":1,"costCash":0,"reveals":{"en":"A lower duty rate is not automatic. It requires documented proof of origin that can be checked, and the saving only applies to shipments that actually qualify.","sw":"Kiwango cha chini cha ushuru si cha moja kwa moja. Kinahitaji ushahidi wa chanzo ulioandikwa unaoweza kukaguliwa, na akiba inatumika tu kwa shehena zinazokidhi kweli."}}],"decision":{"prompt":{"en":"Do you pursue the preferential duty rate?","sw":"Unafuatilia kiwango cha ushuru cha upendeleo?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"apply-preferential-certificate","label":{"en":"Prepare the certificate of origin and apply for the preferential rate","sw":"Andaa certificate of origin na uombe kiwango cha upendeleo"},"detail":{"en":"Ongoing paperwork to maintain, and a lower duty on qualifying shipments.","sw":"Nyaraka zinazoendelea kudumishwa, na ushuru wa chini kwa shehena zinazokidhi masharti."},"effects":{"dutyRate":"-0.045","licenceFees":7000},"predictAnswer":"up_bit","outcome":{"en":"The certificate is approved and qualifying shipments clear at the lower rate. Maintaining the proof of origin is a small, steady cost against a larger, steady saving.","sw":"Cheti kinaidhinishwa na shehena zinazokidhi masharti zinapita kwa kiwango cha chini. Kudumisha ushahidi wa chanzo ni gharama ndogo, thabiti dhidi ya akiba kubwa, thabiti."},"lesson":{"en":"Preferential access is not automatic goodwill; it is a rule with paperwork behind it. Meeting the rule can be worth far more than the paperwork costs.","sw":"Upendeleo wa kufikia soko si nia njema ya moja kwa moja; ni kanuni yenye nyaraka nyuma yake. Kukidhi kanuni hiyo kunaweza kufaa zaidi kuliko gharama ya nyaraka."}},{"id":"pay-standard-duty","label":{"en":"Keep paying the standard duty rate for now","sw":"Endelea kulipa kiwango cha kawaida cha ushuru kwa sasa"},"detail":{"en":"No new paperwork. No new saving either.","sw":"Hakuna nyaraka mpya. Hakuna akiba mpya pia."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes. Shipments keep clearing at the standard duty rate, as they always have.","sw":"Hakuna kinachobadilika. Shehena zinaendelea kupita kwa kiwango cha kawaida cha ushuru, kama zilivyokuwa daima."},"lesson":{"en":"Paying the standard rate is not a mistake. It is a cost that a specific piece of paperwork could have lowered, left uncollected.","sw":"Kulipa kiwango cha kawaida si kosa. Ni gharama ambayo kipande maalum cha nyaraka kingeliweza kupunguza, kikiachwa bila kukusanywa."}},{"id":"route-through-consolidator","label":{"en":"Route shipments through a consolidator instead","sw":"Pitisha shehena kupitia consolidator badala yake"},"detail":{"en":"Less admin for you. Their handling charge replaces the saving you might have claimed.","sw":"Usimamizi mdogo kwako. Gharama yao ya kushughulikia inachukua nafasi ya akiba ambayo ungeweza kudai."},"effects":{"dutyRate":"+0.03","ownerHoursUsed":-3},"predictAnswer":"down","outcome":{"en":"The consolidator handles customs entirely, for a fee folded into a higher effective duty on every shipment. It is less work for you and a worse rate on everything you send.","sw":"Consolidator anashughulikia forodha kikamilifu, kwa ada iliyoingizwa kwenye ushuru wa juu zaidi halisi kwa kila shehena. Ni kazi kidogo kwako na kiwango kibaya zaidi kwa kila unachotuma."},"lesson":{"en":"Convenience has a price. Handing off customs work entirely can cost more than the preferential rate you left unclaimed.","sw":"Urahisi una bei. Kuachia kazi ya forodha kabisa kunaweza kugharimu zaidi kuliko kiwango cha upendeleo ulichoacha bila kudai."}}]}},{"id":"t15","concept":"capital-allocation","conceptLabel":{"en":"Capital allocation","sw":"Ugawaji wa mtaji"},"scene":"office","workout":true,"situation":{"en":"The plant has cash it does not need this week. Domestic, regional and export each have a case for more of it, the household has a case, and a reserve has a case too. Nothing forces you to put it all in one place — and what leaves the plant now is not there for the five weeks after it.","sw":"Kiwanda kina pesa ambayo hakiihitaji wiki hii. Soko la ndani, la kikanda na la nje kila moja lina hoja ya kupata zaidi yake, kaya ina hoja, na akiba nayo ina hoja. Hakuna kinachokulazimisha kuweka yote mahali pamoja — na kinachotoka kiwandani sasa hakitakuwepo kwa wiki tano zinazofuata."},"info":[{"id":"compare-uses","label":{"en":"Compare what a shilling earns in each market","sw":"Linganisha shilingi moja inapata nini kwenye kila soko"},"costHours":1,"costCash":0,"reveals":{"en":"Domestic sells reliably at a thin margin. Regional sells well at a wider one. Export earns the most per unit and carries the most risk — the currency, the cycle, and one buyer's decisions.","sw":"Soko la ndani linauza kwa uhakika kwa margin nyembamba. La kikanda linauza vizuri kwa margin pana zaidi. La nje linapata zaidi kwa kila kitengo na linabeba hatari zaidi — fedha za kigeni, mzunguko, na maamuzi ya mnunuzi mmoja."}}],"decision":{"type":"allocate","prompt":{"en":"How will you split the available capital?","sw":"Utagawanya vipi mtaji uliopo?"},"predict":"number","allocate":{"amountFrom":"cash","fraction":0.05,"step":100000,"buckets":[{"id":"domestic","label":{"en":"Grow domestic capacity","sw":"Kuza uwezo wa soko la ndani"},"perStep":{"lines.domestic.capacity":30,"lines.domestic.demand":25}},{"id":"regional","label":{"en":"Grow regional capacity","sw":"Kuza uwezo wa soko la kikanda"},"perStep":{"lines.regional.capacity":20,"lines.regional.demand":15}},{"id":"export","label":{"en":"Grow export capacity","sw":"Kuza uwezo wa soko la nje"},"perStep":{"lines.export.capacity":10,"lines.export.demand":8}},{"id":"home","label":{"en":"Take some home","sw":"Peleka sehemu nyumbani"},"perStep":{}},{"id":"reserve","label":{"en":"Keep it as a reserve","sw":"Weka kama akiba"},"perStep":{},"keepsCash":true}]},"bands":[{"outcome":{"en":"Most of the available cash stays as a reserve. The business changes little this week, and the next shock has more room to be absorbed.","sw":"Pesa nyingi zilizopo zinabaki kama akiba. Biashara inabadilika kidogo wiki hii, na mshtuko unaofuata una nafasi zaidi ya kufyonzwa."},"lesson":{"en":"A reserve does not grow anything today. In a business with a long export cash cycle, it can be what survives the next slow payment.","sw":"Akiba haikuzi chochote leo. Katika biashara yenye mzunguko mrefu wa pesa wa nje, inaweza kuwa kinachosalia wakati wa malipo ya polepole yajayo."},"upTo":0.2},{"outcome":{"en":"The capital is split across markets and a reserve. No single line gets everything, and the plant grows a little on several fronts at once.","sw":"Mtaji umegawanywa kwenye masoko na akiba. Hakuna mstari mmoja unaopata yote, na kiwanda linakua kidogo kwenye pande kadhaa kwa wakati mmoja."},"lesson":{"en":"Spreading capital across markets with different risk is itself a form of protection, even when no single choice looks the boldest.","sw":"Kueneza mtaji kwenye masoko yenye hatari tofauti wenyewe ni aina ya kinga, hata wakati hakuna uamuzi mmoja unaoonekana wa ujasiri zaidi."},"upTo":0.6},{"outcome":{"en":"Most of the capital goes into the higher-margin regional and export lines. Growth is real, and so is the exposure that comes with it.","sw":"Mtaji mwingi unaingia kwenye mistari ya margin kubwa zaidi ya kikanda na nje. Ukuaji ni halisi, na hivyo hivyo hatari inayokuja nayo."},"lesson":{"en":"Chasing the widest margin with most of your capital can be the right call. It leaves less behind if the export cycle or a buyer turns against you.","sw":"Kufukuzia margin pana zaidi kwa mtaji wako mwingi kunaweza kuwa uamuzi sahihi. Kunaacha kidogo nyuma ikiwa mzunguko wa nje au mnunuzi atageuka dhidi yako."}}]}},{"id":"t16","concept":"choosing-buyer","conceptLabel":{"en":"Choosing a buyer","sw":"Kuchagua mnunuzi"},"scene":"market","situation":{"en":"The Gulf distributor offers a bigger standing order in exchange for exclusivity — no other distributor in their territory. It is real volume, from one buyer who could change their mind, their prices, or their business.","sw":"Msambazaji wa Ghuba anatoa oda kubwa ya kudumu badala ya upendeleo wa kipekee — hakuna msambazaji mwingine katika eneo lao. Ni kiasi halisi, kutoka kwa mnunuzi mmoja anayeweza kubadilisha nia yake, bei zake, au biashara yake."},"info":[{"id":"weigh-exclusivity","label":{"en":"Weigh the volume against the dependency","sw":"Linganisha kiasi dhidi ya utegemezi"},"costHours":1,"costCash":0,"reveals":{"en":"Exclusivity trades flexibility for volume. It can be the right trade — and it also means one buyer's decision can now move a large share of your business at once.","sw":"Upendeleo wa kipekee unabadilisha unyumbufu kwa kiasi. Unaweza kuwa mabadilishano sahihi — na pia unamaanisha uamuzi wa mnunuzi mmoja sasa unaweza kuhamisha sehemu kubwa ya biashara yako kwa mkupuo."}}],"decision":{"prompt":{"en":"How do you respond to the exclusivity offer?","sw":"Unajibu vipi ofa ya upendeleo wa kipekee?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"grant-exclusivity","label":{"en":"Grant exclusivity for the larger standing order","sw":"Toa upendeleo wa kipekee kwa oda kubwa ya kudumu"},"detail":{"en":"The biggest volume on offer. Nearly all export eggs in one basket.","sw":"Kiasi kikubwa zaidi kwenye ofa. Karibu mayai yote ya nje kwenye kikapu kimoja."},"effects":{"lines.export.demand":"300","lines.export.capacity":"300","reputation":2,"concentrated":true},"predictAnswer":"up_lot","outcome":{"en":"The order is signed and volume grows at once. The export line now runs almost entirely through one buyer's decisions.","sw":"Oda inasainiwa na kiasi kinakua mara moja. Mstari wa nje sasa unaendeshwa karibu kabisa na maamuzi ya mnunuzi mmoja."},"lesson":{"en":"A single large buyer can grow a business fast. It also means that buyer's next decision, good or bad, now belongs to your ledger too.","sw":"Mnunuzi mmoja mkubwa anaweza kukuza biashara haraka. Pia inamaanisha uamuzi ujao wa mnunuzi huyo, mzuri au mbaya, sasa ni sehemu ya daftari lako pia."}},{"id":"keep-multiple-buyers","label":{"en":"Decline exclusivity and keep courting smaller buyers too","sw":"Kataa upendeleo wa kipekee na uendelee kuwatafuta wanunuzi wadogo pia"},"detail":{"en":"Slower growth with this buyer. No single buyer holds the export line.","sw":"Ukuaji wa polepole zaidi na mnunuzi huyu. Hakuna mnunuzi mmoja anayeshikilia mstari wa nje."},"effects":{"lines.export.demand":"55","lines.export.capacity":"55"},"predictAnswer":"up_bit","outcome":{"en":"The distributor accepts a smaller non-exclusive order. Growth is slower, and the export line is not resting on one relationship.","sw":"Msambazaji anakubali oda ndogo isiyo ya kipekee. Ukuaji ni wa polepole, na mstari wa nje hautegemei uhusiano mmoja."},"lesson":{"en":"Spreading buyers is slower and it is also a form of protection. No single decision elsewhere can take down the whole export line.","sw":"Kueneza wanunuzi ni polepole na pia ni aina ya kinga. Hakuna uamuzi mmoja mahali pengine unaoweza kuangusha mstari mzima wa nje."}},{"id":"decline-new-commitment","label":{"en":"Decline for now and keep the current order as it stands","sw":"Kataa kwa sasa na uendelee na oda ya sasa kama ilivyo"},"detail":{"en":"No change either way this week.","sw":"Hakuna mabadiliko upande wowote wiki hii."},"effects":{},"predictAnswer":"same","outcome":{"en":"You tell the distributor you need more time. The current order continues unchanged.","sw":"Unamwambia msambazaji unahitaji muda zaidi. Oda ya sasa inaendelea bila kubadilika."},"lesson":{"en":"An exclusivity offer does not expire the moment it is made. Taking time to weigh a large commitment is not the same as refusing it.","sw":"Ofa ya upendeleo wa kipekee haiishi muda huo huo inapotolewa. Kuchukua muda kupima ahadi kubwa si sawa na kuikataa."}}]}},{"id":"t17","concept":"minimum-order-quantity","conceptLabel":{"en":"Minimum order quantity","sw":"Kiasi cha chini cha oda"},"scene":"kitchen","situation":{"en":"A second regional distributor is interested, but only above a minimum order quantity larger than anything you currently run. Meeting it means freeing up capacity that domestic and regional customers already use.","sw":"Msambazaji wa pili wa kikanda ana maslahi, lakini tu juu ya kiasi cha chini cha oda kikubwa kuliko chochote unachoendesha sasa. Kukikidhi kunamaanisha kuachia uwezo ambao wateja wa ndani na wa kikanda tayari wanautumia."},"info":[{"id":"check-moq-fit","label":{"en":"Check what the MOQ costs elsewhere in the plant","sw":"Angalia MOQ inagharimu nini sehemu nyingine ya kiwanda"},"costHours":1,"costCash":0,"reveals":{"en":"A minimum order quantity is not extra output; it is a floor you must clear every time, usually by taking capacity from somewhere that was already selling.","sw":"Kiasi cha chini cha oda si uzalishaji wa ziada; ni kiwango cha chini lazima ukivuke kila mara, kwa kawaida kwa kuchukua uwezo kutoka mahali ambapo tayari palikuwa panauzwa."}}],"decision":{"prompt":{"en":"Do you commit to the minimum order quantity?","sw":"Unajitolea kwa kiasi cha chini cha oda?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"shift-domestic-capacity","label":{"en":"Meet the MOQ by shifting capacity away from domestic","sw":"Kidhi MOQ kwa kuhamisha uwezo kutoka soko la ndani"},"detail":{"en":"Frees capacity for the new order and gives up domestic sales that were already happening.","sw":"Inaachia uwezo kwa oda mpya na kuacha mauzo ya ndani ambayo tayari yalikuwa yakifanyika."},"effects":{"lines.domestic.capacity":"-300","lines.domestic.demand":"-300"},"predictAnswer":"down","outcome":{"en":"Domestic sales fall right away because capacity moved out from under them. The line takes a fortnight to change over, so the export capacity it frees arrives later — and the distributor's first order has still not been confirmed.","sw":"Mauzo ya ndani yanashuka mara moja kwa sababu uwezo umehamishwa chini yao. Mstari unachukua wiki mbili kubadilishwa, hivyo uwezo wa nje unaoachiliwa unafika baadaye — na oda ya kwanza ya msambazaji bado haijathibitishwa."},"lesson":{"en":"Meeting an MOQ by taking from a market that already pays is a real cost today for a promise of sales tomorrow. The cost lands first; the volume, if it comes at all, comes later.","sw":"Kukidhi MOQ kwa kuchukua kutoka soko ambalo tayari linalipa ni gharama halisi leo kwa ahadi ya mauzo kesho. Gharama inafika kwanza; kiasi, kama kitakuja kabisa, kinakuja baadaye."},"later":[{"inWeeks":2,"effects":{"lines.export.capacity":"400"},"cause":{"en":"the changeover that moved capacity from the domestic line to the export line for the minimum order quantity","sw":"mabadiliko yaliyohamisha uwezo kutoka mstari wa ndani kwenda mstari wa nje kwa ajili ya kiasi cha chini cha oda"}}]},{"id":"add-temporary-capacity","label":{"en":"Add capacity for the MOQ without touching domestic","sw":"Ongeza uwezo kwa MOQ bila kugusa soko la ndani"},"detail":{"en":"A small equipment cost, and domestic customers are not affected.","sw":"Gharama ndogo ya kifaa, na wateja wa ndani hawaguswi."},"effects":{"assetValue":1500000},"predictAnswer":"same","outcome":{"en":"You order the extra equipment and it starts wearing down its value from the day you pay for it. Domestic and regional lines run exactly as before. The machine is installed a fortnight from now, and even then it earns nothing until an order fills it.","sw":"Unaagiza vifaa vya ziada na vinaanza kupoteza thamani tangu siku unayolipia. Mistari ya ndani na kikanda inaendesha kama awali. Mashine inasimikwa baada ya wiki mbili, na hata hivyo haitapata chochote hadi oda itakapoijaza."},"lesson":{"en":"Capacity built without touching what already sells still costs money before it earns anything, and it does not arrive the day you decide on it. It is a bet on the order actually landing.","sw":"Uwezo uliojengwa bila kugusa kinachouzwa tayari bado unagharimu pesa kabla haujapata chochote, na haufiki siku unayoamua. Ni dau kwamba oda itafika kweli."},"later":[{"inWeeks":2,"effects":{"lines.export.capacity":"400"},"cause":{"en":"the extra equipment ordered to meet the minimum order quantity, now installed","sw":"vifaa vya ziada vilivyoagizwa kukidhi kiasi cha chini cha oda, sasa vimesimikwa"}}]},{"id":"decline-moq","label":{"en":"Decline the MOQ and stay flexible","sw":"Kataa MOQ na ubaki na unyumbufu"},"detail":{"en":"No new capacity, no new commitment.","sw":"Hakuna uwezo mpya, hakuna ahadi mpya."},"effects":{},"predictAnswer":"same","outcome":{"en":"You tell the second distributor the volume is not a fit yet. The plant continues exactly as it was.","sw":"Unamwambia msambazaji wa pili kiasi hicho bado hakikubaliani. Kiwanda kinaendelea kama kilivyokuwa."},"lesson":{"en":"A minimum order quantity you cannot meet without damage elsewhere is a real signal, not an opportunity you failed to grasp.","sw":"Kiasi cha chini cha oda usichoweza kukidhi bila madhara mahali pengine ni ishara halisi, si fursa uliyoshindwa kuikamata."}}]}},{"id":"t18","concept":"quality-failure-abroad","conceptLabel":{"en":"Quality failure abroad","sw":"Kushindwa kwa ubora nje ya nchi"},"scene":"inspection","situation":{"en":"A container is flagged at the destination port over a documentation and residue check. It is held, not yet released, and the buyer is asking what happened and what you will do about it.","sw":"Kontena linazuiwa bandarini kwa ukaguzi wa nyaraka na masalia. Limezuiwa, bado halijatolewa, na mnunuzi anauliza nini kilitokea na utafanya nini kuhusu hilo."},"info":[{"id":"trace-rejection-cost","label":{"en":"Trace what a held container costs beyond the goods themselves","sw":"Fuatilia kontena lililozuiwa linagharimu nini zaidi ya bidhaa zenyewe"},"costHours":1,"costCash":0,"reveals":{"en":"A held shipment costs the goods, the buyer's confidence, and often the next order while trust is rebuilt. How you respond changes which of those costs is largest.","sw":"Shehena iliyozuiwa inagharimu bidhaa, imani ya mnunuzi, na mara nyingi oda inayofuata wakati imani inajengwa upya. Jinsi unavyojibu inabadilisha ni gharama gani kati ya hizo ndiyo kubwa zaidi."}}],"decision":{"prompt":{"en":"How do you respond to the rejected container?","sw":"Unajibu vipi kontena lililozuiwa?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"absorb-and-fix-process","label":{"en":"Absorb the loss and fix the process that caused it","sw":"Bebea hasara na urekebishe mchakato uliosababisha"},"detail":{"en":"The container is a loss. The buyer sees you take it seriously.","sw":"Kontena ni hasara. Mnunuzi anaona unaichukulia kwa uzito."},"effects":{"hygiene":8,"licenceFees":10000,"reputation":-5,"lines.export.demand":"-150","lines.export.capacity":"-150"},"predictAnswer":"down","outcome":{"en":"The container is written off and an extra check is added to the process. The buyer trims the next order while they watch to see if it happens again.","sw":"Kontena linafutwa na ukaguzi wa ziada unaongezwa kwenye mchakato. Mnunuzi anapunguza oda inayofuata wakati akiangalia kama itatokea tena."},"lesson":{"en":"A rejected container costs the goods and some trust, whatever you do next. Fixing the cause is what stops it from costing the relationship too.","sw":"Kontena lililozuiwa linagharimu bidhaa na imani kiasi, chochote utakachofanya baadaye. Kurekebisha chanzo ndicho kinachozuia kisigharimu uhusiano pia."}},{"id":"dispute-the-rejection","label":{"en":"Dispute the rejection and insist the goods were fine","sw":"Pinga uzuiaji na sisitiza bidhaa zilikuwa sawa"},"detail":{"en":"No process change. The buyer hears you deny a problem they experienced directly.","sw":"Hakuna mabadiliko ya mchakato. Mnunuzi anasikia ukikataa tatizo alilolipitia moja kwa moja."},"effects":{"reputation":-14,"lines.export.demand":"-250","lines.export.capacity":"-250"},"predictAnswer":"down","outcome":{"en":"The port's decision stands regardless. The buyer is now dealing with both a held container and a supplier who would not acknowledge it.","sw":"Uamuzi wa bandari unabaki hata hivyo. Mnunuzi sasa anashughulikia kontena lililozuiwa na msambazaji ambaye hakukubali hilo."},"lesson":{"en":"Disputing a fact the buyer already experienced does not undo it. It adds a second problem — trust — to the first one.","sw":"Kupinga ukweli ambao mnunuzi tayari ameupitia hakuufuti. Kunaongeza tatizo la pili — imani — kwa la kwanza."},"later":[{"inWeeks":3,"effects":{"lines.export.demand":"-100"},"cause":{"en":"the disputed rejection, which the buyer's head office had heard about directly","sw":"uzuiaji uliopingwa, ambao ofisi kuu ya mnunuzi ilikuwa imesikia moja kwa moja"}}]},{"id":"recall-and-recertify","label":{"en":"Proactively recall the batch and recertify before the next shipment","sw":"Rejesha kundi hilo kwa hiari na uthibitishe upya kabla ya shehena inayofuata"},"detail":{"en":"The most costly response today, and the clearest signal to the buyer.","sw":"Jibu la gharama kubwa zaidi leo, na ishara wazi zaidi kwa mnunuzi."},"effects":{"hygiene":12,"licenceFees":12000,"reputation":4},"predictAnswer":"same","outcome":{"en":"You recall the batch and pay for an independent recheck before the next shipment goes out. It costs more this week than the other responses, and the buyer notices.","sw":"Unarejesha kundi hilo na kulipia ukaguzi huru kabla shehena inayofuata haijasafirishwa. Kunagharimu zaidi wiki hii kuliko majibu mengine, na mnunuzi anaona."},"lesson":{"en":"The most expensive response to a failure is sometimes the one that actually protects the relationship it threatened.","sw":"Jibu la gharama kubwa zaidi kwa kushindwa wakati mwingine ndilo linalolinda kweli uhusiano ulioutishia."},"later":[{"inWeeks":4,"effects":{"reputation":6,"lines.export.demand":"100"},"cause":{"en":"the proactive recall and recertification that rebuilt the buyer's confidence","sw":"kurejesha kwa hiari na kuthibitisha upya kulikorejesha imani ya mnunuzi"}}]}]}},{"id":"t19","concept":"brand-or-private-label","conceptLabel":{"en":"Brand or private label","sw":"Chapa yako au chapa yao"},"scene":"kitchen","situation":{"en":"The Gulf distributor offers a much larger order on the condition that it ships under their own brand, with no mention of your plant on the packaging. Your name and reputation stay a domestic and regional matter.","sw":"Msambazaji wa Ghuba anatoa oda kubwa zaidi kwa sharti kwamba isafirishwe chini ya chapa yao wenyewe, bila kutajwa kwa kiwanda chako kwenye ufungashaji. Jina lako na sifa yako vinabaki suala la ndani na kikanda."},"info":[{"id":"weigh-brand-tradeoff","label":{"en":"Weigh the order size against what carries your name","sw":"Linganisha ukubwa wa oda dhidi ya kile kinachobeba jina lako"},"costHours":1,"costCash":0,"reveals":{"en":"A private-label order is usually larger because the buyer is taking on the marketing and the risk of a brand no one abroad knows yet. It also means the reputation you build there is theirs, not yours.","sw":"Oda ya chapa ya mtu mwingine kwa kawaida ni kubwa zaidi kwa sababu mnunuzi anachukua uuzaji na hatari ya chapa ambayo hakuna anayeijua nje bado. Pia inamaanisha sifa unayojenga huko ni yao, si yako."}}],"decision":{"prompt":{"en":"Do you accept the private-label order?","sw":"Unakubali oda ya chapa ya mtu mwingine?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"keep-your-brand","label":{"en":"Keep your own brand and take the smaller order","sw":"Weka chapa yako mwenyewe na uchukue oda ndogo"},"detail":{"en":"Slower growth abroad. Your name is what builds a reputation there.","sw":"Ukuaji wa polepole nje. Jina lako ndilo linalojenga sifa huko."},"effects":{"lines.export.demand":"55","lines.export.capacity":"55","reputation":3},"predictAnswer":"up_bit","outcome":{"en":"The distributor agrees to the smaller order, under your name. It grows slower, and whatever reputation it earns abroad belongs to the plant.","sw":"Msambazaji anakubali oda ndogo, chini ya jina lako. Inakua polepole, na sifa yoyote inayopatikana nje ni ya kiwanda."},"lesson":{"en":"Keeping your own name abroad is slower and it compounds. Reputation earned under your brand stays yours the next time you sell it.","sw":"Kuweka jina lako nje ni polepole na linakua taratibu. Sifa iliyopatikana chini ya chapa yako inabaki yako mara nyingine unapouza."}},{"id":"accept-private-label","label":{"en":"Accept the larger private-label order","sw":"Kubali oda kubwa ya chapa ya mtu mwingine"},"detail":{"en":"The bigger volume, with no mention of the plant on the box.","sw":"Kiasi kikubwa zaidi, bila kutajwa kwa kiwanda kwenye boksi."},"effects":{"lines.export.demand":"350","lines.export.capacity":"350","reputation":-2},"predictAnswer":"up_lot","outcome":{"en":"The larger order is confirmed under the distributor's own brand. Volume grows sharply, and none of the credit for it reaches your name abroad.","sw":"Oda kubwa zaidi inathibitishwa chini ya chapa ya msambazaji mwenyewe. Kiasi kinakua sana, na hakuna sifa yake inayofikia jina lako nje."},"lesson":{"en":"Private label can be the faster path to volume. It trades a brand you own for a customer you serve, and both are legitimate ways to grow.","sw":"Chapa ya mtu mwingine inaweza kuwa njia ya haraka zaidi kwa kiasi. Inabadilisha chapa unayomiliki kwa mteja unayemhudumia, na zote ni njia halali za kukua."}},{"id":"decline-both","label":{"en":"Decline both and continue with the current order as it stands","sw":"Kataa zote mbili na uendelee na oda ya sasa kama ilivyo"},"detail":{"en":"No new commitment either way this week.","sw":"Hakuna ahadi mpya upande wowote wiki hii."},"effects":{},"predictAnswer":"same","outcome":{"en":"You tell the distributor you need more time to consider it. The current order continues as before.","sw":"Unamwambia msambazaji unahitaji muda zaidi kufikiria. Oda ya sasa inaendelea kama awali."},"lesson":{"en":"Brand or private label is not a decision that has to be made the moment it is offered. Both paths stay open a little longer.","sw":"Chapa yako au ya mtu mwingine si uamuzi unaopaswa kufanywa muda huo huo unapotolewa. Njia zote mbili zinabaki wazi kidogo zaidi."}}]}},{"id":"t20","concept":"setback","conceptLabel":{"en":"Record sales, worse cash","sw":"Mauzo ya rekodi, pesa mbaya zaidi"},"scene":"night","situation":{"en":"Export orders are at record levels. The profit line looks better than it ever has. When you count the bank, the cash is tighter than it has been all year. Read the ledger before you decide what to do.","sw":"Oda za nje ziko kwenye kiwango cha rekodi. Mstari wa faida unaonekana bora kuliko ulivyowahi kuwa. Ukihesabu benki, pesa ni ngumu zaidi kuliko ilivyokuwa mwaka mzima. Soma daftari kabla ya kuamua hatua."},"info":[{"id":"trace-record-sales","label":{"en":"Trace one export sale from shipping to being paid","sw":"Fuatilia mauzo moja ya nje kutoka kusafirisha hadi kulipwa"},"costHours":2,"costCash":0,"reveals":{"en":"Wages, freight and duty are paid before the buyer settles the invoice. The longer the credit terms behind the record sales, the more of that profit is sitting with buyers rather than in the bank.","sw":"Mishahara, usafirishaji na ushuru vinalipwa kabla mnunuzi hajalipia ankara. Masharti marefu zaidi ya mkopo nyuma ya mauzo ya rekodi, ndivyo faida hiyo inavyokaa zaidi kwa wanunuzi badala ya benki."}}],"diagnose":{"prompt":{"en":"Which ledger line explains why profit is up while cash is worse than ever?","sw":"Ni mstari gani wa daftari unaoeleza kwa nini faida imepanda huku pesa ikiwa mbaya zaidi kuliko wakati wowote?"},"answer":"cash.workingCapitalChange","options":["pnl.sales","pnl.costOfSales","pnl.freight","pnl.duty","cash.repayment","cash.workingCapitalChange"],"right":{"en":"Working capital is the line. The credit terms behind the record export orders mean more money than ever is sitting with buyers who have not paid yet, even as the sales themselves are already counted as profit.","sw":"Working capital ndiyo mstari huo. Masharti ya mkopo nyuma ya oda za rekodi za nje yanamaanisha pesa zaidi kuliko wakati wowote inakaa kwa wanunuzi ambao bado hawajalipa, hata mauzo yenyewe tayari yamehesabiwa kama faida."},"wrong":{"en":"That line explains part of the profit picture, not the missing bank money. Look for cash that is earned but not yet collected.","sw":"Mstari huo unaeleza sehemu ya picha ya faida, si pesa ya benki iliyokosekana. Tafuta pesa iliyopatikana lakini bado haijakusanywa."}},"decision":{"prompt":{"en":"What do you change now?","sw":"Unabadilisha nini sasa?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"shorten-the-cycle","label":{"en":"Renegotiate credit terms shorter across the export book","sw":"Jadili upya masharti ya mkopo yawe mafupi kwenye kitabu chote cha nje"},"detail":{"en":"Less money sitting with buyers. The sales themselves do not change.","sw":"Pesa kidogo inakaa kwa wanunuzi. Mauzo yenyewe hayabadiliki."},"effects":{"debtorWeeks":3},"predictAnswer":"same","outcome":{"en":"Buyers agree, some more readily than others, to shorter terms going forward. Profit does not move, and less of it will sit outside the plant.","sw":"Wanunuzi wanakubali, wengine kwa urahisi zaidi kuliko wengine, masharti mafupi zaidi kuendelea mbele. Faida haibadiliki, na kidogo zaidi yake itakaa nje ya kiwanda."},"lesson":{"en":"A record week on the profit line is not the same as a healthy bank balance. Shortening the cycle behind it is how the two come back together.","sw":"Wiki ya rekodi kwenye mstari wa faida si sawa na salio zuri la benki. Kufupisha mzunguko nyuma yake ndiko kunakoleta hivyo viwili pamoja tena."}},{"id":"chase-more-sales","label":{"en":"Chase more export sales on the same terms","sw":"Fukuzia mauzo zaidi ya nje kwa masharti yaleyale"},"detail":{"en":"The order book is valuable. The cash gap behind it stays exactly as it is.","sw":"Kitabu cha oda kina thamani. Pengo la pesa nyuma yake linabaki kama lilivyo hasa."},"effects":{"lines.export.demand":"150","lines.export.capacity":"150"},"predictAnswer":"up_lot","outcome":{"en":"More orders are confirmed on the same credit terms. Profit rises sharply, and an even larger share of it is now sitting with buyers who have not paid.","sw":"Oda zaidi zinathibitishwa kwa masharti yaleyale ya mkopo. Faida inapanda sana, na sehemu kubwa zaidi yake sasa inakaa kwa wanunuzi ambao hawajalipa."},"lesson":{"en":"A record profit built on the same long cycle grows the exact problem it is celebrating. More sales are not automatically more cash.","sw":"Faida ya rekodi iliyojengwa kwenye mzunguko mrefu uleule inakuza tatizo lenyewe linalosherehekewa. Mauzo zaidi si pesa zaidi kiotomatiki."}},{"id":"pause-and-collect","label":{"en":"Pause new export orders and focus on collecting what is owed","sw":"Sitisha oda mpya za nje na uzingatie kukusanya kinachodaiwa"},"detail":{"en":"Less growth this week, and the plant collects on what it has already earned.","sw":"Ukuaji mdogo wiki hii, na kiwanda kinakusanya kile ambacho tayari kimekipata."},"effects":{"lines.export.demand":"-150","lines.export.capacity":"-150"},"predictAnswer":"down","outcome":{"en":"New export volume is turned away for now. This week's sales are smaller, and the collections effort has nothing new competing with it for attention.","sw":"Kiasi kipya cha nje kinakataliwa kwa sasa. Mauzo ya wiki hii ni madogo, na jitihada za kukusanya hazina kitu kipya kinachoshindana nazo kwa umakini."},"lesson":{"en":"Pausing growth to collect what is already earned is a real cost today, in exchange for a cash position that matches the profit line again.","sw":"Kusitisha ukuaji ili kukusanya kile ambacho tayari kimepatikana ni gharama halisi leo, badala ya hali ya pesa inayolingana na mstari wa faida tena."}}]}}]}};

    if (!('capacity' in overrides)) state.capacity = total('capacity');
  }

  // Derive the opening week's load from the opening state, unless content pins it.
  // Otherwise week 1 shows a default that does not match the business on screen.
  if (!('ownerHoursUsed' in overrides)) state.ownerHoursUsed = baseOwnerHours(state);
  if (!('baseDemand' in overrides)) state.baseDemand = state.demand;
  if (!('openingDemand' in overrides)) state.openingDemand = state.demand;
  if (!('openingRent' in overrides)) state.openingRent = state.rent;

  // Settle the opening working-capital balance, so a chapter that starts with credit
  // terms already in place is not charged on its first week for a position it began
  // with. Only changes from here on cost or release cash.
  if (!('wcHeld' in overrides)) state.wcHeld = workingCapital(state);

  return state;
}

/**
 * Weekly profit and loss, derived entirely from state.
 *
 * Spoilage only applies to unsold *made* stock. A learner who builds capacity
 * ahead of demand pays for it — that is the lesson, so it must be real.
 */
function weeklyPnl(state) {
  // Per line, so contribution margin can differ by product. With no `lines` authored
  // this loop runs exactly once over the flat fields and the arithmetic below is
  // identical to what it was before product mix existed.
  const lines = linesOf(state);
  const perLine = lines.map((line) => {
    const sold = Math.max(0, Math.min(Number(line.demand) || 0, Number(line.capacity) || 0));
    const lineRevenue = sold * (Number(line.price) || 0);
    const lineVariable = sold * (Number(line.unitCost) || 0);
    const unsold = Math.max(0, (Number(line.capacity) || 0) - (Number(line.demand) || 0));
    return {
      id: line.id,
      unitsSold: sold,
      unmetDemand: Math.max(0, (Number(line.demand) || 0) - (Number(line.capacity) || 0)),
      revenue: lineRevenue,
      variableCost: lineVariable,
      contribution: lineRevenue - lineVariable,
      // Reported per line because "which product actually earns" is the lesson, and a
      // blended margin is exactly what hides it.
      margin: lineRevenue > 0 ? (lineRevenue - lineVariable) / lineRevenue : 0,
      spoilage: Math.round(unsold * (Number(line.unitCost) || 0) * (state.spoilRate || 0)),
    };
  });

  const sum = (key) => perLine.reduce((total, line) => total + line[key], 0);
  const unitsSold = sum('unitsSold');
  const revenue = sum('revenue');
  const variableCost = sum('variableCost');
  const spoilage = sum('spoilage');

  // Currency movement lands on the share of revenue that was priced abroad. At the
  // default (`fxShare` 0, rate equal to base) this is exactly zero.
  const fxShare = state.fxShare || 0;
  const fxBase = state.fxBase || 1;
  const fxEffect = fxBase > 0
    ? Math.round(revenue * fxShare * (((state.fxRate || 1) / fxBase) - 1))
    : 0;

  // Landed cost applies only to what is actually exported.
  const exportUnits = Math.round(unitsSold * (state.exportShare || 0));
  const freight = Math.round(exportUnits * (state.freightPerUnit || 0));
  const duty = Math.round(revenue * (state.exportShare || 0) * (state.dutyRate || 0));

  const grossProfit = revenue + fxEffect - variableCost - freight - duty;

  const wages = Math.round(state.staff * state.wagePerStaff * (1 + (state.payrollOnCost || 0)));
  const depreciation = state.assetLifeWeeks > 0
    ? Math.round((state.assetValue || 0) / state.assetLifeWeeks)
    : 0;
  const interest = Math.round(((state.debt || 0) * (state.interestRate || 0)) / 52);

  const fixedCost = state.rent + wages + (state.licenceFees || 0) + depreciation + interest;

  const profit = grossProfit - fixedCost - spoilage;

  return {
    unitsSold,
    unmetDemand: sum('unmetDemand'),
    revenue,
    variableCost,
    grossProfit,
    // Blended contribution margin, kept for every existing caller. `perLine` is what
    // a mix decision should actually be read against.
    margin: revenue > 0 ? grossProfit / revenue : 0,
    wages,
    rent: state.rent,
    licenceFees: state.licenceFees || 0,
    fixedCost,
    spoilage,
    profit,

    // Chapters 2-4. All zero under chapter 1's state.
    perLine,
    fxEffect,
    freight,
    duty,
    depreciation,
    interest,
  };
}

/**
 * Cash tied up in the trading cycle: money customers owe you, plus stock on the
 * shelf, minus money you have not yet paid your suppliers.
 *
 * Expressed in weeks of the flow each applies to, so it moves when the business
 * moves. That is the point — at a standstill it is constant and costs nothing, and
 * growth makes it consume cash faster than the growth earns it.
 */
function workingCapital(state) {
  const pnl = weeklyPnl(state);
  return Math.round(
    (pnl.revenue * (state.debtorWeeks || 0))
    + (pnl.variableCost * (state.inventoryWeeks || 0))
    - (pnl.variableCost * (state.creditorWeeks || 0)),
  );
}

/**
 * What the business is worth: what it owns, less what it owes.
 *
 * Every figure this game showed a learner before this existed was a FLOW — a week's
 * profit, a week's cash, twelve weeks of profit on a chart. Nothing showed a STOCK, so
 * nothing a learner did could be seen to accumulate, and three things an owner of a real
 * firm lives by could not be taught at all: what the business is worth, how much of it
 * the lender has a claim on, and what their own drawings did to both (D-030).
 *
 * What it counts, and the limits of that:
 *
 *   + cash                what is in the box and the bank
 *   + assetValue          equipment, at what it is worth NOW — it falls with depreciation
 *   + working capital     stock on the shelf and money customers owe, less money owed
 *                         to suppliers. Held in state, so it carries the learner's own
 *                         swings and not a fresh derivation (see workingCapital)
 *   − debt                what is owed to the lender
 *
 * It does NOT count anything content did not record. Capacity bought without an
 * `assetValue` is, to this function, cash that left and nothing that arrived — which is
 * why buying a fryer had to start recording the fryer (D-031). That is a content rule
 * with a warning in validate-scenario.mjs, not something this can defend itself against.
 */
function netWorth(state) {
  const wc = state.wcHeld ?? workingCapital(state);
  return Math.round(
    (Number(state.cash) || 0)
    + (Number(state.assetValue) || 0)
    + wc
    - (Number(state.debt) || 0),
  );
}

/**
 * How much of the business the lender has a claim on, against how much the owner does.
 *
 * Returned as a share of the owner's stake — `1` means the lender is owed exactly what
 * the owner holds — plus the two figures it came from, so a caller can say it in words
 * rather than as a ratio. `docs/localization.md` asks for a concrete comparison over an
 * abstract ratio, and "for every 100 that is yours, 80 is owed" is one.
 *
 * `owned` is what is left after the debt, which is the same equity `netWorth` reports.
 * When that is zero or less the ratio is meaningless rather than infinite, and the
 * honest thing to say is that the business owes more than it owns — so `share` is null
 * and the caller must handle it.
 */
function gearing(state) {
  const owed = Number(state.debt) || 0;
  const owned = netWorth(state);
  return {
    owed,
    owned,
    share: owned > 0 ? owed / owned : null,
    // More is owed than the owner holds. Not a failure — a highly geared business is a
    // normal thing — but it is the point at which a bad quarter stops being survivable
    // on the owner's own account.
    outweighed: owed > 0 && owed > owned,
  };
}

/**
 * What actually reaches the bank this week, as opposed to what the business earned.
 *
 * `profit` and `cashFlow` are equal by construction whenever the chapter-2-4 fields
 * are at their defaults — no assets, no debt, no working-capital terms — which is why
 * chapter 1 is untouched by any of this (D-017).
 *
 * `wcChange` is supplied by advanceWeek, which knows the position at both ends of the
 * week. On its own this function reports the movement excluding working capital.
 */
function weeklyCashFlow(state, wcChange = 0) {
  const pnl = weeklyPnl(state);
  const repayment = Math.min(Number(state.repayPerWeek) || 0, Number(state.debt) || 0);
  return {
    profit: pnl.profit,
    // Depreciation was charged as a cost and no money left the building.
    depreciation: pnl.depreciation,
    repayment,
    workingCapitalChange: wcChange,
    cashFlow: pnl.profit + pnl.depreciation - repayment - wcChange,
  };
}

/**
 * Apply a content-authored `effects` object to state.
 *
 * String values prefixed "+" or "-" force additive behaviour, so content can nudge
 * an otherwise-absolute field. Unknown keys land in `flags` rather than silently
 * corrupting state.
 */
function applyEffects(state, effects = {}) {
  // `pending` must be cloned, not shared. Without this, projecting a trajectory would
  // drain the real playthrough's scheduled consequences.
  const next = { ...state, flags: { ...state.flags }, pending: [...(state.pending || [])] };

  // Product lines are cloned before anything can touch them, so a projection cannot
  // write through into the real playthrough — the same trap `pending` was already
  // guarded against above.
  if (Array.isArray(next.lines)) next.lines = next.lines.map((line) => ({ ...line }));
  let touchedLines = false;

  for (const [key, raw] of Object.entries(effects)) {
    // `lines.<id>.<field>` addresses one product. Demand and capacity add; price and
    // unit cost replace — the same split as the flat fields they mirror.
    const lineMatch = LINE_EFFECT.exec(key);
    if (lineMatch && Array.isArray(next.lines)) {
      const [, lineId, field] = lineMatch;
      const line = next.lines.find((candidate) => candidate.id === lineId);
      const amount = Number(raw);
      if (line && Number.isFinite(amount)) {
        line[field] = LINE_ADDITIVE.has(field) || /^[+-]/.test(String(raw))
          ? (Number(line[field]) || 0) + amount
          : amount;
        if (LINE_ADDITIVE.has(field)) line[field] = Math.max(0, Math.round(line[field]));
        else line[field] = Math.max(0, line[field]);
        touchedLines = true;
      }
      continue;
    }

    if (typeof raw === 'boolean') {
      if (key in next && typeof next[key] === 'boolean') next[key] = raw;
      else next.flags[key] = raw;
      continue;
    }

    const forcedAdditive = typeof raw === 'string' && /^[+-]/.test(raw);
    const value = Number(raw);

    if (Number.isNaN(value)) {
      next.flags[key] = raw;
      continue;
    }

    if (!(key in next)) {
      next.flags[key] = value;
      continue;
    }

    if (forcedAdditive || ADDITIVE.has(key)) {
      next[key] = (Number(next[key]) || 0) + value;
    } else if (ABSOLUTE.has(key)) {
      next[key] = value;
    } else {
      next[key] = value;
    }
  }

  for (const [key, [lo, hi]] of Object.entries(CLAMPED)) {
    if (typeof next[key] === 'number') {
      next[key] = Math.max(lo, Math.min(hi, next[key]));
    }
  }

  next.capacity = Math.max(0, Math.round(next.capacity));
  next.demand = Math.max(0, Math.round(next.demand));
  next.staff = Math.max(0, Math.round(next.staff));

  // Costs floor at zero. Content reduces these additively — the recovery chapter cuts
  // rent, for instance — and enough reductions in a row would otherwise take them
  // negative, at which point the business is being paid to exist and the whole ledger
  // stops meaning anything.
  next.rent = Math.max(0, next.rent);
  next.licenceFees = Math.max(0, next.licenceFees || 0);
  next.wagePerStaff = Math.max(0, next.wagePerStaff);
  next.unitCost = Math.max(0, next.unitCost);
  next.price = Math.max(0, next.price);
  next.debt = Math.max(0, next.debt || 0);
  next.assetValue = Math.max(0, next.assetValue || 0);
  next.repayPerWeek = Math.max(0, next.repayPerWeek || 0);
  next.freightPerUnit = Math.max(0, next.freightPerUnit || 0);
  next.fxRate = Math.max(0, next.fxRate ?? 1);

  // A demand change authored in content is structural — a customer won or lost, not a
  // mood swing — so it moves the baseline the weekly reputation drift pulls towards.
  // Without this, winning the hotel contract would be undone over the following weeks.
  //
  // The floor matters: several authored penalties in a row would otherwise take the
  // baseline to nothing and the business could never recover, which is not how a stall
  // by a bus stand behaves however badly it is run. Being reduced to passing trade is
  // the lesson; being erased is just an unwinnable game.
  // Keep the flat totals and the product lines describing the same business.
  //
  // Content addresses one or the other, never both in one effects block. A `lines.*`
  // effect is authoritative and the totals follow it; a flat `demand` or `capacity`
  // effect means "the whole business moved" and is spread across the lines in
  // proportion. Without this the stats panel and the ledger drift apart, each
  // internally consistent and describing different businesses.
  if (Array.isArray(next.lines)) {
    const totalOf = (key) => next.lines.reduce((sum, line) => sum + (Number(line[key]) || 0), 0);

    if (touchedLines) {
      next.demand = totalOf('demand');
      next.capacity = totalOf('capacity');
    } else {
      for (const key of ['demand', 'capacity']) {
        if (next[key] === state[key]) continue;
        const before = totalOf(key);
        if (before <= 0) continue;
        const ratio = next[key] / before;
        next.lines = next.lines.map((line) => ({
          ...line,
          [key]: Math.max(0, Math.round((Number(line[key]) || 0) * ratio)),
        }));
      }
      next.demand = totalOf('demand');
      next.capacity = totalOf('capacity');
    }
  }

  if (next.demand !== state.demand) {
    const baseline = next.baseDemand ?? state.demand;
    const floor = Math.round((next.openingDemand ?? baseline) * 0.25);
    next.baseDemand = Math.max(floor, baseline + (next.demand - state.demand));
  }

  return next;
}

/**
 * Schedule a consequence to arrive some weeks from now.
 *
 * The whole point is attribution: when it fires, the learner is told which earlier
 * decision caused it. A consequence the learner cannot trace back to a choice teaches
 * nothing except that the world is arbitrary.
 */
function scheduleLater(state, later = [], cause = '') {
  if (!later || later.length === 0) return state;
  const next = { ...state, flags: { ...state.flags }, pending: [...(state.pending || [])] };

  for (const item of later) {
    next.pending.push({
      dueWeek: state.week + (item.inWeeks || 1),
      effects: item.effects || {},
      cause: item.cause || cause,
      causeWeek: state.week,
    });
  }
  return next;
}

/**
 * Advance one week: bank the profit, fire anything now due, apply slow drift.
 *
 * Reputation and hygiene drift because neglect has a cost — a business does not hold
 * still. Demand follows reputation with a lag, so the consequence of a hygiene
 * failure arrives after the decision that caused it, not alongside it
 * (docs/game-design.md: consequences arrive on a realistic lag).
 *
 * Returns `fired` so the UI can show what arrived and why.
 */
function advanceWeek(state) {
  const pnl = weeklyPnl(state);

  // What was already tied up in the trading cycle, carried in state rather than
  // recomputed from `state` here.
  //
  // This matters more than it looks. A decision — agreeing 30-day terms, taking on a
  // wholesale customer — is applied by the caller BEFORE any week passes, so measuring
  // the change from the start of this function would miss exactly the swings the
  // learner caused and catch only the drift. Holding the balance means the
  // reconciliation below picks up every movement since it was last settled, whoever
  // caused it.
  const wcBefore = state.wcHeld ?? workingCapital(state);

  let next = { ...state, flags: { ...state.flags }, pending: [...(state.pending || [])] };
  next.week = state.week + 1;

  // 1. Fire consequences that have come due, before drift, so their effects then drift
  //    like anything else.
  const fired = [];
  const stillPending = [];
  for (const item of next.pending) {
    if (item.dueWeek <= next.week) fired.push(item);
    else stillPending.push(item);
  }
  next.pending = stillPending;
  for (const item of fired) next = applyEffects(next, item.effects);

  // 2. Running past your own hours is not free. You cut corners: the cleaning slips
  //    and service gets worse. This is what makes hiring and delegation matter rather
  //    than just costing money (AGENTS.md section 2 — model delegation).
  const load = ownerLoad(next);
  if (load.overloaded) {
    const over = Math.min(1, (load.used - load.total) / Math.max(1, load.total));
    next.hygiene -= 1 + Math.round(over * 4);
    next.reputation -= Math.round(over * 3);
  }

  // 3. Hygiene feeds reputation.
  if (next.hygiene < 40) next.reputation -= 4;
  else if (next.hygiene > 75) next.reputation += 1;

  next.reputation = Math.max(0, Math.min(100, next.reputation));

  // 4. Reputation pulls demand towards the level it justifies, on a lag.
  //
  // This USED to add (reputation - 50) * 0.6 to demand every week, which compounds:
  // a middling reputation subtracted customers indefinitely and a long run drove
  // demand to zero and stayed there, killing the business with no way back. Moving a
  // fraction of the way towards a reputation-implied target keeps the lag — the point
  // of the mechanic — while giving it a floor and a ceiling. A stall by a bus stand
  // always has some passing trade.
  const base = Math.max(0, next.baseDemand ?? next.demand);
  const target = base * (0.4 + 0.012 * next.reputation);
  const driftedDemand = Math.max(
    Math.round(base * 0.15),
    Math.round(next.demand + (target - next.demand) * 0.25),
  );

  // With product lines, drift has to reach the lines or it never reaches the ledger:
  // the P&L reads per-line demand and would sit perfectly still while the headline
  // number moved. Reputation is a property of the business, not of one product, so
  // every line moves by the same proportion.
  if (Array.isArray(next.lines) && next.demand > 0) {
    const ratio = driftedDemand / next.demand;
    next.lines = next.lines.map((line) => ({
      ...line,
      demand: Math.max(0, Math.round((Number(line.demand) || 0) * ratio)),
    }));
    next.demand = next.lines.reduce((sum, line) => sum + line.demand, 0);
  } else {
    next.demand = driftedDemand;
  }

  // 5. Baseline decay — standards slip unless maintained. It stops at the level you
  //    hold without trying; going below that takes active neglect, which is what the
  //    overload penalty above represents.
  if (next.hygiene > HYGIENE_FLOOR) next.hygiene -= 1;
  next.hygiene = Math.max(0, Math.min(100, next.hygiene));

  // 5b. Bank the week — and note that what reaches the bank is not what was earned.
  //
  // This line used to read `cash += pnl.profit`, and for chapter 1 it still does: with
  // no assets, no debt and no working-capital terms, `cashFlow` is `profit` exactly
  // (D-017). Everything chapters 2-4 teach about solvency lives in the gap between
  // them, and it is computed here rather than narrated in content.
  //
  // The exchange rate is not drifted here on purpose. A currency move is authored as a
  // scheduled consequence so that when it arrives the learner is told what caused it,
  // like every other delayed effect in this engine.
  const wcAfter = workingCapital(next);
  const flow = weeklyCashFlow(state, wcAfter - wcBefore);

  next.cash = state.cash + flow.cashFlow;
  next.wcHeld = wcAfter;
  next.debt = Math.max(0, (next.debt || 0) - flow.repayment);
  // The asset wears down by exactly what was charged for it, so depreciation stops
  // when the machine is written off instead of running forever.
  next.assetValue = Math.max(0, (next.assetValue || 0) - pnl.depreciation);
  if (next.assetValue === 0) next.assetLifeWeeks = 0;

  // 6. Insolvency sheds what you can no longer pay for.
  //
  // Without this, weekly costs compound forever: a learner who buys everything on
  // credit keeps paying rent on a fryer that would have been repossessed months ago,
  // and cash runs to figures that make the ledger read as broken rather than as a
  // business in trouble. Losing what you cannot fund is both what actually happens and
  // what bounds the spiral — fixed costs fall as the business shrinks, so the hole stops
  // deepening. It shrinks towards a stall, never to nothing (docs/game-design.md:
  // failure is a chapter boundary, not an ending).
  if (next.cash < 0) {
    const openingRent = next.openingRent ?? state.rent;
    if (next.rent > openingRent) next.rent = Math.max(openingRent, Math.round(next.rent * 0.85));
    if (next.staff > 0 && -next.cash > next.wagePerStaff * 4) next.staff -= 1;
    if (next.licenceFees > 0) next.licenceFees = Math.round(next.licenceFees * 0.85);

    const capacityFloor = Math.max(60, Math.round((next.openingDemand ?? 180) * 0.5));
    if (next.capacity > capacityFloor) {
      const shrunk = Math.max(capacityFloor, Math.round(next.capacity * 0.9));
      // One ratio, applied everywhere. The floor used to be applied to the total while
      // the lines were shrunk by a flat 0.9 and the total was never recomputed from
      // them — so in any chapter with a product mix the lines kept shrinking past the
      // floor week after week and the business could be driven to a state it could
      // never leave, which is exactly what D-014 exists to prevent.
      const ratio = next.capacity > 0 ? shrunk / next.capacity : 1;
      // Equipment goes with the capacity it provided, so the depreciation charge falls
      // alongside it rather than being paid on a machine that is no longer there.
      if (next.assetValue > 0) next.assetValue = Math.round(next.assetValue * ratio);
      if (Array.isArray(next.lines)) {
        next.lines = next.lines.map((line) => ({
          ...line,
          capacity: Math.max(0, Math.round((Number(line.capacity) || 0) * ratio)),
        }));
        next.capacity = next.lines.reduce((sum, line) => sum + line.capacity, 0);
      } else {
        next.capacity = shrunk;
      }
    }

    // A business that cannot pay does not keep servicing a loan on the original terms.
    // Without this, `repayPerWeek` drains cash for the rest of the run at a rate
    // nothing can reduce — the same unbounded-cost failure D-014 was written for,
    // arriving through the financing fields instead of the operating ones.
    if (next.repayPerWeek > 0 && -next.cash > next.repayPerWeek * 4) {
      next.repayPerWeek = Math.round(next.repayPerWeek * 0.85);
    }

    // Chasing your debtors is the first thing anyone does when the money runs out, and
    // it releases cash. It also bounds the working-capital drain.
    if (next.debtorWeeks > 0) next.debtorWeeks = Math.max(0, next.debtorWeeks - 0.25);
  }

  // 7. Reset the owner's week. Hours spent researching THIS week are spent; next week
  //    starts from whatever running the business now takes. Without this reset, hours
  //    accumulate for the whole playthrough and checking your facts — the behaviour the
  //    information-seeking indicator exists to reward — would slowly destroy you.
  next.ownerHoursUsed = baseOwnerHours(next);

  return { state: next, pnl, fired, flow };
}

/**
 * Advance several weeks at once, so a decision can be authored to play out over a
 * month rather than a week (`advanceWeeks` on a turn). Drift compounds across the
 * span, which is what makes slow effects visible instead of theoretical.
 *
 * `pnl` is the FIRST week's — that is the week the reveal is about. `weekly` carries
 * the whole series for the chart.
 */
function advanceWeeks(state, weeks = 1) {
  const n = Math.max(1, Math.round(weeks));
  let current = state;
  let firstPnl = null;
  const fired = [];
  const weekly = [];

  for (let i = 0; i < n; i += 1) {
    const step = advanceWeek(current);
    if (i === 0) firstPnl = step.pnl;
    fired.push(...step.fired);
    weekly.push({ week: current.week, profit: step.pnl.profit, cash: step.state.cash });
    current = step.state;
  }

  return { state: current, pnl: firstPnl, fired, weekly };
}

/**
 * Where this business is heading if the learner changes nothing.
 *
 * A plain mechanical extrapolation, not a forecast of anything real — it runs the same
 * drift the engine already applies. It exists because the slow variables (hygiene,
 * reputation, owner hours) move too gradually to notice one turn at a time, which is
 * exactly the lesson: small neglect compounds.
 */
function project(state, weeks = 12) {
  const run = advanceWeeks(state, weeks);
  return {
    weeks,
    cash: run.state.cash,
    cashNow: state.cash,
    profitThen: weeklyPnl(run.state).profit,
    profitNow: weeklyPnl(state).profit,
    weekly: run.weekly,
    endState: run.state,
  };
}

/**
 * The hours running the business takes the owner in a normal week.
 *
 * Rises with output and falls with staff. This is the mechanism behind the founder
 * who cannot build beyond themselves: growing capacity without delegating walks you
 * into an overload you cannot work your way out of.
 */
function baseOwnerHours(state) {
  // The rate was fixed at one hour per six units, which is right for a stall and
  // absurd at factory volumes — 15,000 loaves would demand 2,500 hours a week. It is
  // authored per chapter now, because the whole point of scale is that the hours per
  // unit fall. Both defaults reproduce the original numbers exactly, so chapter 1 is
  // untouched.
  const perUnit = Number.isFinite(state.hoursPerCapacity) ? state.hoursPerCapacity : 1 / 6;
  const perStaff = Number.isFinite(state.hoursPerStaff) ? state.hoursPerStaff : 12;

  const fromOutput = Math.round(state.capacity * perUnit);
  const relievedByStaff = (state.staff || 0) * perStaff;
  return Math.max(8, (state.ownerHoursFixed ?? 15) + fromOutput - relievedByStaff);
}

/** Owner time is a scarce resource — this is what makes delegation visible. */
function ownerLoad(state) {
  const used = state.ownerHoursUsed;
  const total = state.ownerHours || 1;

    return migrate(parsed);
  } catch (err) {
    console.warn('Could not load saved progress:', err);
    return null;
  }
}

function clear() {
  try {
    localStorage.removeItem(KEY);
    return true;
  } catch {
    return false;
  }
}

function hasSave() {
  return load() !== null;
}

// --- chapters (ADR-0007) ---------------------------------------------------
//
// Two things persist beyond a single chapter: which chapters have been finished, and
// the six carried flags. Both are small, both are the learner's own, and both stay on
// the device like everything else here.

const CARRY_KEY = 'business-simulator:carry:v1';

function loadCarry() {
  try {
    const raw = localStorage.getItem(CARRY_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    if (!parsed || typeof parsed !== 'object') return { flags: {}, completed: [] };
    return { flags: parsed.flags || {}, completed: parsed.completed || [] };
  } catch (err) {
    console.warn('Could not load chapter progress:', err);
    return { flags: {}, completed: [] };

}

function saveCarry(carry) {

      flags: carry.flags || {},

    }));

    return false;
  }
}

function clearCarry() {

    localStorage.removeItem(CARRY_KEY);
    return true;
  } catch {
    return false;
  }
}

/** Export the learner's own record so they can keep or share it deliberately. */
function exportJson(session) {

}

  return { save, load, clear, hasSave, loadCarry, saveCarry, clearCarry, exportJson };

/* ---- scene ---- */
const NS_scene = (function () {

// scene.js — generated SVG illustrations and small animation helpers.
// No dependencies. No network. No innerHTML with user data.
// All drawing is document.createElementNS so nothing here needs a build step.

const NS = 'http://www.w3.org/2000/svg';
const REDUCE = typeof matchMedia === 'function'
  ? matchMedia('(prefers-reduced-motion: reduce)')
  : { matches: false };

function svg(name, attrs) {
  const node = document.createElementNS(NS, name);
  if (attrs) {
    for (const key in attrs) node.setAttribute(key, attrs[key]);
  }
  return node;
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

// ---- shared scene primitives --------------------------------------------

const VB_W = 320;
const VB_H = 160;
const GROUND_Y = 132;

function baseSvg(extraClass) {
  const root = svg('svg', {
    viewBox: `0 0 ${VB_W} ${VB_H}`,

    role: 'img',
    'aria-hidden': 'true',

  });

}

function skyGround(root, night) {
  root.appendChild(svg('rect', {
    x: 0, y: 0, width: VB_W, height: GROUND_Y,
    class: night ? 'scene-sky scene-sky-night' : 'scene-sky',
  }));
  root.appendChild(svg('rect', {
    x: 0, y: GROUND_Y, width: VB_W, height: VB_H - GROUND_Y,
    class: night ? 'scene-ground scene-ground-night' : 'scene-ground',
  }));
}

function sun(root, cx, cy, r) {
  root.appendChild(svg('circle', { cx, cy, r, class: 'scene-sun' }));
}

function moonAndStars(root, count) {
  root.appendChild(svg('circle', { cx: 262, cy: 30, r: 16, class: 'scene-moon' }));
  const positions = [
    [24, 20], [60, 42], [110, 18], [150, 34], [190, 16],
    [220, 46], [30, 58], [130, 52], [95, 34], [200, 62],
  ];
  const n = clamp(count, 3, positions.length);
  for (let i = 0; i < n; i++) {

function cloud(root, x, y, scale) {

  g.appendChild(svg('ellipse', { cx: 0, cy: 0, rx: 14, ry: 8 }));
  g.appendChild(svg('ellipse', { cx: 12, cy: -3, rx: 10, ry: 7 }));
  g.appendChild(svg('ellipse', { cx: -12, cy: 2, rx: 9, ry: 6 }));
  root.appendChild(g);
}

// A simple flat figure: head + body, feet at (x, groundY).
function figure(root, x, groundY, opts) {
  opts = opts || {};
  const scale = opts.scale || 1;
  const cls = 'scene-figure' + (opts.staff ? ' scene-figure-staff' : ' scene-figure-customer');
  const g = svg('g', { class: cls, transform: `translate(${x} ${groundY})` });
  const bodyH = 20 * scale;
  const bodyW = 11 * scale;
  g.appendChild(svg('rect', {
    x: -bodyW / 2, y: -bodyH, width: bodyW, height: bodyH, rx: bodyW / 2.2,
    class: 'scene-figure-body',
  }));
  g.appendChild(svg('circle', { cx: 0, cy: -bodyH - 5 * scale, r: 5 * scale, class: 'scene-figure-head' }));
  if (opts.staff) {
    // small apron / cap mark so staff read as distinct without relying on colour alone
    g.appendChild(svg('rect', {
      x: -bodyW / 2, y: -bodyH * 0.55, width: bodyW, height: bodyH * 0.45,
      class: 'scene-figure-apron',
    }));
    g.appendChild(svg('rect', {
      x: -4 * scale, y: -bodyH - 9 * scale, width: 8 * scale, height: 3 * scale,
      class: 'scene-figure-cap',
    }));
  }
  if (opts.idle) g.setAttribute('class', g.getAttribute('class') + ' scene-figure-idle');

}

function customerRow(root, count, groundY, spanX) {
  count = clamp(count, 0, 8);
  if (count === 0) return;
  const startX = (VB_W - spanX) / 2 + 10;
  const step = count > 1 ? spanX / (count - 1 || 1) : 0;
  for (let i = 0; i < count; i++) {
    const x = count === 1 ? VB_W / 2 : startX + step * i;
    figure(root, x, groundY, { scale: 0.8 + (i % 2) * 0.06, idle: i % 3 === 0 });
  }

function staffRow(root, count, groundY, cx) {
  count = clamp(count, 0, 4);
  const spacing = 16;
  const start = cx - ((count - 1) * spacing) / 2;
  for (let i = 0; i < count; i++) {
    figure(root, start + i * spacing, groundY, { scale: 0.85, staff: true });
  }
}

// A stall / kiosk whose footprint grows with capacity.
function stall(root, cx, baseY, scale, opts) {
  opts = opts || {};
  const w = 76 * scale;
  const h = 46 * scale;
  const g = svg('g', { class: 'scene-stall', transform: `translate(${cx} ${baseY})` });

  // roof
  g.appendChild(svg('polygon', {
    points: `${-w / 2 - 8},${-h} ${w / 2 + 8},${-h} ${w / 2 - 2},${-h - 16} ${-w / 2 + 2},${-h - 16}`,
    class: 'scene-stall-roof',
  }));
  // awning stripes (shape-based, not colour-only)
  const stripeCount = 5;
  const stripeW = (w + 16) / stripeCount;
  for (let i = 0; i < stripeCount; i++) {
    g.appendChild(svg('rect', {
      x: -w / 2 - 8 + i * stripeW, y: -h - 16, width: stripeW, height: 5,
      class: i % 2 === 0 ? 'scene-stall-awning-a' : 'scene-stall-awning-b',
    }));
  }
  // wall
  g.appendChild(svg('rect', { x: -w / 2, y: -h, width: w, height: h, class: 'scene-stall-wall' }));
  // counter
  g.appendChild(svg('rect', {
    x: -w / 2 - 4, y: -h * 0.42, width: w + 8, height: h * 0.42,
    class: 'scene-stall-counter',
  }));
  // goods on counter — count nods to capacity
  const goods = clamp(Math.round(scale * 4), 1, 7);
  for (let i = 0; i < goods; i++) {
    g.appendChild(svg('circle', {
      cx: -w / 2 + 8 + i * ((w - 16) / Math.max(1, goods - 1 || 1)),
      cy: -h * 0.42 - 3, r: 3, class: 'scene-stall-goods',
    }));
  }
  if (opts.pot) {
    const potX = 0, potY = -h - 4;
    g.appendChild(svg('ellipse', { cx: potX, cy: potY, rx: 9, ry: 5, class: 'scene-pot' }));
    const steam = svg('path', {
      d: `M ${potX - 3} ${potY - 4} q 3 -8 0 -14 q -3 6 0 -12`,
      class: 'scene-steam',
    });

  }
  if (opts.closed) {
    g.appendChild(svg('rect', {
      x: -w / 2, y: -h * 0.42, width: w, height: h * 0.42, class: 'scene-stall-shutter',

function dimOverlay(root, amount) {

function formalityBadges(root, level, x, y) {

// ---- scene builders --------------------------------------------------

function deriveCustomerCount(state) {
  const demand = state.demand == null ? 100 : state.demand;
  return clamp(Math.round(demand / 40), 0, 7);
}

function deriveScale(state) {
  const capacity = state.capacity == null ? 180 : state.capacity;
  return clamp(capacity / 180, 0.65, 1.7);
}

function buildStallScene(root, state, mode) {
  const day = mode !== 'night';
  skyGround(root, false);
  cloud(root, 60, 26, 1);
  cloud(root, 230, 20, 0.7);
  sun(root, 40, 26, 15);

  const scale = deriveScale(state);
  let count = deriveCustomerCount(state);
  if (mode === 'empty') count = Math.min(count, 1);
  if (mode === 'busy') count = Math.max(count, 4);

  const { h } = stall(root, VB_W / 2, GROUND_Y, scale, { pot: true, closed: mode === 'empty' && (state.reputation ?? 50) < 20 });
  customerRow(root, count, GROUND_Y, 220);
  staffRow(root, state.staff || 0, GROUND_Y, VB_W / 2 - 40);
  grimeOrSparkle(root, state.hygiene == null ? 60 : state.hygiene, VB_W / 2, GROUND_Y - h - 20);

  const reputation = state.reputation == null ? 50 : state.reputation;
  if (reputation < 35) dimOverlay(root, (35 - reputation) / 60);
}

function buildKitchenScene(root, state) {
  skyGround(root, false);
  // back wall + shelf
  root.appendChild(svg('rect', { x: 0, y: 20, width: VB_W, height: GROUND_Y - 20, class: 'scene-kitchen-wall' }));
  root.appendChild(svg('rect', { x: 20, y: 34, width: 90, height: 8, class: 'scene-shelf' }));
  const jars = clamp(Math.round(deriveScale(state) * 4), 1, 6);
  for (let i = 0; i < jars; i++) {

      x: 26 + i * 14, y: 20, width: 9, height: 13, rx: 2, class: 'scene-jar',
    }));
  }
  // stove + pot
  const scale = deriveScale(state);
  root.appendChild(svg('rect', {
    x: VB_W / 2 - 22 * scale, y: GROUND_Y - 20, width: 44 * scale, height: 20, class: 'scene-stove',
  }));
  root.appendChild(svg('ellipse', {
    cx: VB_W / 2, cy: GROUND_Y - 22, rx: 20 * scale, ry: 8, class: 'scene-pot',
  }));
  root.appendChild(svg('path', {
    d: `M ${VB_W / 2 - 4} ${GROUND_Y - 30} q 4 -10 0 -18 q -4 6 0 -14`,
    class: 'scene-steam',
  }));
  // prep table
  root.appendChild(svg('rect', { x: 210, y: GROUND_Y - 14, width: 70, height: 8, class: 'scene-table' }));

  staffRow(root, Math.max(state.staff || 0, 1), GROUND_Y, VB_W / 2 - 8);
  grimeOrSparkle(root, state.hygiene == null ? 60 : state.hygiene, 60, 60);
  const reputation = state.reputation == null ? 50 : state.reputation;
  if (reputation < 35) dimOverlay(root, (35 - reputation) / 60);
}

function buildMarketScene(root, state) {
  skyGround(root, false);
  sun(root, 292, 20, 12);
  const scale = deriveScale(state) * 0.7;
  // two generic competitor stalls, smaller and duller, then the learner's own stall
  stall(root, 66, GROUND_Y, 0.6, {});
  stall(root, 254, GROUND_Y, 0.6, {});
  stall(root, VB_W / 2, GROUND_Y, clamp(scale + 0.3, 0.6, 1.4), { pot: true });

  customerRow(root, count, GROUND_Y, 260);
  staffRow(root, state.staff || 0, GROUND_Y, VB_W / 2);
}

function buildOfficeScene(root, state) {
  skyGround(root, false);
  root.appendChild(svg('rect', { x: 0, y: 10, width: VB_W, height: GROUND_Y - 10, class: 'scene-office-wall' }));
  root.appendChild(svg('rect', { x: 30, y: GROUND_Y - 46, width: 200, height: 30, class: 'scene-desk' }));
  root.appendChild(svg('rect', { x: 30, y: GROUND_Y - 16, width: 200, height: 16, class: 'scene-desk-front' }));

  const neat = !!state.keepsRecords;
  if (neat) {
    for (let i = 0; i < 3; i++) {
      root.appendChild(svg('rect', {

    const scatter = [[70, -50, -8], [90, -46, 10], [110, -52, -4]];
    scatter.forEach(([x, y, r]) => {

        transform: `rotate(${r} ${x + 6} ${GROUND_Y + y + 8})`,

      }));

  formalityBadges(root, state.formality || 0, 150, GROUND_Y - 60);
  figure(root, 180, GROUND_Y, { scale: 0.9 });

}

function buildTruckScene(root, state) {
  skyGround(root, false);
  sun(root, 40, 24, 14);
  root.appendChild(svg('rect', { x: 0, y: GROUND_Y - 2, width: VB_W, height: 4, class: 'scene-road' }));
  const dashes = 6;
  for (let i = 0; i < dashes; i++) {
    root.appendChild(svg('rect', {
      x: i * 56, y: GROUND_Y - 1, width: 24, height: 2, class: 'scene-road-dash',
    }));
  }
  const scale = deriveScale(state);
  const g = svg('g', { class: 'scene-truck', transform: `translate(120 ${GROUND_Y - 4})` });
  g.appendChild(svg('rect', { x: 0, y: -30 * scale, width: 70 * scale, height: 30 * scale, class: 'scene-truck-bed' }));
  g.appendChild(svg('rect', { x: 70 * scale, y: -20 * scale, width: 26 * scale, height: 20 * scale, class: 'scene-truck-cab' }));
  g.appendChild(svg('circle', { cx: 14 * scale, cy: 0, r: 6 * scale, class: 'scene-truck-wheel' }));
  g.appendChild(svg('circle', { cx: 84 * scale, cy: 0, r: 6 * scale, class: 'scene-truck-wheel' }));

  const capacity = state.capacity == null ? 180 : state.capacity;
  const demand = state.demand == null ? 100 : state.demand;
  const surplus = capacity > demand;
  const boxCount = clamp(Math.round(capacity / 40), 1, 6);
  for (let i = 0; i < boxCount; i++) {
    g.appendChild(svg('rect', {
      x: 6 * scale + (i % 3) * 20 * scale,
      y: -30 * scale - Math.floor(i / 3) * 16 * scale,
      width: 16 * scale, height: 14 * scale,
      class: surplus ? 'scene-box scene-box-surplus' : 'scene-box',
    }));
  }
  root.appendChild(g);
  figure(root, 220, GROUND_Y, { scale: 0.9, staff: (state.staff || 0) > 0 });
}

function buildInspectionScene(root, state) {
  skyGround(root, false);
  const scale = deriveScale(state);
  stall(root, VB_W / 2 - 40, GROUND_Y, scale, {});
  const hygiene = state.hygiene == null ? 60 : state.hygiene;
  grimeOrSparkle(root, hygiene, VB_W / 2 - 40, GROUND_Y - 60);

  // inspector figure with a clipboard
  const g = svg('g', { class: 'scene-figure scene-inspector', transform: `translate(220 ${GROUND_Y})` });
  g.appendChild(svg('rect', { x: -5.5, y: -20, width: 11, height: 20, rx: 5, class: 'scene-figure-body' }));
  g.appendChild(svg('circle', { cx: 0, cy: -25, r: 5, class: 'scene-figure-head' }));
  g.appendChild(svg('rect', { x: 6, y: -18, width: 9, height: 12, class: 'scene-clipboard' }));
  root.appendChild(g);

  const pass = hygiene >= 50;
  const badgeX = 262, badgeY = GROUND_Y - 40;
  root.appendChild(svg('circle', {
    cx: badgeX, cy: badgeY, r: 12,
