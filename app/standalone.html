/* styles.css — Business Simulator
   No web fonts, no build step. System font stack only.
   Mobile-first, 360px baseline, outdoor-readable contrast, large touch targets.
   Themeable via prefers-color-scheme and :root[data-theme]. */

/* ---------- tokens ---------- */
:root {
  --bg: #faf6f0;
  --surface: #ffffff;
  --surface-alt: #f2e9dc;
  --text: #201a13;
  --text-muted: #5b5148;
  --accent: #c04c14;
  --accent-ink: #ffffff;
  --accent-2: #1f6b4c;
  --danger: #ab2b1f;
  --danger-bg: #fbe6e2;
  --ok-bg: #e3f1e7;
  --border: #ddceb8;
  --focus: #10486b;
  --shadow: rgba(32, 26, 19, 0.14);

  --scene-sky: #cfe6ee;
  --scene-sky-night: #10182b;
  --scene-ground: #cdb98d;
  --scene-ground-night: #1c2436;
  --scene-sun: #f2a53a;
  --scene-moon: #e9e6d8;
  --scene-star: #e9e6d8;
  --scene-cloud: #ffffff;
  --scene-stall-roof: #a53a1c;
  --scene-stall-wall: #e7d3ad;
  --scene-stall-counter: #8a5a2b;
  --scene-awning-a: #c04c14;
  --scene-awning-b: #f4ead9;
  --scene-goods: #e0a83a;
  --scene-figure: #3a3128;
  --scene-figure-2: #6b5a45;
  --scene-staff-mark: #1f6b4c;
  --scene-steam: #e9e6d8;
  --scene-line: #3a3128;

  --radius: 10px;
  --radius-lg: 16px;
  --tap: 48px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16120d;
    --surface: #221b13;
    --surface-alt: #2b2116;
    --text: #f6efe2;
    --text-muted: #c7b8a3;
    --accent: #ff8a4c;
    --accent-ink: #16120d;
    --accent-2: #4fcf9a;
    --danger: #ff8177;
    --danger-bg: #3a1a16;
    --ok-bg: #17301f;
    --border: #453626;
    --focus: #7cc7ff;
    --shadow: rgba(0, 0, 0, 0.45);

    --scene-sky: #0e1730;
    --scene-ground: #241c30;
    --scene-sun: #ffb15c;
    --scene-cloud: #2c3a55;
    --scene-stall-roof: #ff8a4c;
    --scene-stall-wall: #4a3a26;
    --scene-stall-counter: #3a2c1c;
    --scene-awning-a: #ff8a4c;
    --scene-awning-b: #4a3a26;
    --scene-goods: #ffcf6b;
    --scene-figure: #f6efe2;
    --scene-figure-2: #c7b8a3;
    --scene-staff-mark: #4fcf9a;
    --scene-steam: #8592b8;
    --scene-line: #f6efe2;
  }
}

/* explicit theme toggle always wins, regardless of OS setting */
:root[data-theme="dark"] {
  --bg: #16120d;
  --surface: #221b13;
  --surface-alt: #2b2116;
  --text: #f6efe2;
  --text-muted: #c7b8a3;
  --accent: #ff8a4c;
  --accent-ink: #16120d;
  --accent-2: #4fcf9a;
  --danger: #ff8177;
  --danger-bg: #3a1a16;
  --ok-bg: #17301f;
  --border: #453626;
  --focus: #7cc7ff;
  --shadow: rgba(0, 0, 0, 0.45);

  --scene-sky: #0e1730;
  --scene-ground: #241c30;
  --scene-sun: #ffb15c;
  --scene-cloud: #2c3a55;
  --scene-stall-roof: #ff8a4c;
  --scene-stall-wall: #4a3a26;
  --scene-stall-counter: #3a2c1c;
  --scene-awning-a: #ff8a4c;
  --scene-awning-b: #4a3a26;
  --scene-goods: #ffcf6b;
  --scene-figure: #f6efe2;
  --scene-figure-2: #c7b8a3;
  --scene-staff-mark: #4fcf9a;
  --scene-steam: #8592b8;
  --scene-line: #f6efe2;
}

:root[data-theme="light"] {
  --bg: #faf6f0;
  --surface: #ffffff;
  --surface-alt: #f2e9dc;
  --text: #201a13;
  --text-muted: #5b5148;
  --accent: #c04c14;
  --accent-ink: #ffffff;
  --accent-2: #1f6b4c;
  --danger: #ab2b1f;
  --danger-bg: #fbe6e2;
  --ok-bg: #e3f1e7;
  --border: #ddceb8;
  --focus: #10486b;
  --shadow: rgba(32, 26, 19, 0.14);

  --scene-sky: #cfe6ee;
  --scene-ground: #cdb98d;
  --scene-sun: #f2a53a;
  --scene-cloud: #ffffff;
  --scene-stall-roof: #a53a1c;
  --scene-stall-wall: #e7d3ad;
  --scene-stall-counter: #8a5a2b;
  --scene-awning-a: #c04c14;
  --scene-awning-b: #f4ead9;
  --scene-goods: #e0a83a;
  --scene-figure: #3a3128;
  --scene-figure-2: #6b5a45;
  --scene-staff-mark: #1f6b4c;
  --scene-steam: #e9e6d8;
  --scene-line: #3a3128;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  overflow-x: hidden;
}

h1 { font-size: 1.05rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0 0 0.7em; }
ul { margin: 0; padding-left: 1.1em; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 12px 40px;
}

/* ---------- shell ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 2px 8px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 5;
}

.banner-unverified {
  margin: 0 0 10px;
  padding: 9px 12px;
  background: var(--surface-alt);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 0.83rem;
  color: var(--text-muted);
}

.progress {
  height: 5px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-bar {
  height: 100%;
  background: var(--accent-2);
  border-radius: 99px;
  transition: width 400ms ease;
}

.scene {
  margin-bottom: 12px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface-alt);
  line-height: 0;
}
.scene svg { display: block; width: 100%; height: auto; }

.foot {
  margin-top: 26px;
  text-align: center;
  font-size: 0.76rem;
  color: var(--text-muted);
}
.foot p { margin: 0; }

/* ---------- stats ---------- */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 7px 6px;
  text-align: center;
  min-width: 0;
}
.stat-label {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-value {
  font-size: 0.98rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
  overflow-wrap: anywhere;
}
.negative { color: var(--danger); }

/* ---------- P&L ---------- */
.pnl-toggle { display: block; margin: 0 0 8px auto; }

.pnl {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 14px;
  font-size: 0.9rem;
}
.pnl-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 3px 0;
}
.pnl-row.total {
  border-top: 2px solid var(--border);
  margin-top: 6px;
  padding-top: 7px;
  font-weight: 700;
  font-size: 1rem;
}
.pnl-label { color: var(--text-muted); }
.pnl-row.total .pnl-label { color: var(--text); }
.pnl-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pnl-note {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
  font-size: 0.83rem;
  color: var(--text-muted);
}

/* A ledger line the learner has not met before, introducing itself. Accented rather
   than muted like the notes above it: this is the one thing on the panel that is new,
   and it is on screen for a single turn. */
.pnl-new {
  margin-top: 10px;
  padding: 10px 12px;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: var(--surface-alt);
}
.pnl-new-title {
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 4px;
}
.pnl-new-line {
  margin: 4px 0 0;
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px var(--shadow);
}
.card-title {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 9px;
}
.concept-tag {
  display: inline-block;
  background: var(--surface-alt);
  color: var(--text-muted);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 0.7rem;
  letter-spacing: 0.03em;
}
.situation {
  font-size: 1.02rem;
  line-height: 1.55;
  margin: 0;
}

/* ---------- information step ---------- */
.info-list { display: flex; flex-direction: column; gap: 8px; }

.info-item {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--tap);
  padding: 11px 13px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 0.93rem;
  cursor: pointer;
}
.info-item:active { transform: scale(0.98); }
.info-label { display: block; font-weight: 600; }
.info-cost {
  display: inline-block;
  margin-top: 3px;
  font-size: 0.78rem;
  color: var(--text-muted);
}
.info-item.used {
  background: var(--ok-bg);
  border-color: var(--accent-2);
  cursor: default;
  opacity: 1;
}
.info-item.used .info-label { font-weight: 600; }
.info-reveals {
  display: block;
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.45;
}

/* ---------- decision step ---------- */
.options { display: flex; flex-direction: column; gap: 9px; }

.option {
  display: block;
  width: 100%;
  text-align: left;
  min-height: var(--tap);
  padding: 13px 14px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition: border-color 140ms ease, background 140ms ease;
}
.option:hover { border-color: var(--accent); }
.option:active { transform: scale(0.98); }
/* Buttons carry the whole interaction, so a press has to feel like one on a cheap
   touchscreen where there is no cursor and no hover. */
.option, .info-item, .predict-choice, .btn, .lang-btn {
  transition: transform 90ms ease, border-color 140ms ease, background 140ms ease, opacity 140ms ease;
}
.option:disabled:not(.selected) { opacity: 0.45; }
.option.selected {
  border-color: var(--accent);
  background: var(--surface-alt);
}
.option-label { display: block; font-weight: 650; font-size: 1rem; }
.option-detail {
  display: block;
  margin-top: 4px;
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* ---------- free-input decisions ---------- */
.number-decision,
.allocation-decision,
.diagnose { border-width: 2px; border-color: var(--accent); }
.number-decision .predict-question,
.allocation-decision .predict-question,
.diagnose .predict-question { margin-top: 4px; }
.number-hint {
  margin: 0 0 12px;
  color: var(--text-muted);
  font-size: 0.9rem;
  line-height: 1.45;
}
.stepper {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 8px;
  margin: 8px 0 12px;
}
.stepper-controls {
  display: grid;
  grid-template-columns: repeat(4, minmax(48px, 1fr));
  gap: 6px;
  min-width: 0;
}
.stepper-button {
  min-width: var(--tap);
  min-height: var(--tap);
  padding: 7px 5px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font: inherit;
  font-size: 1.15rem;
  font-weight: 750;
  line-height: 1;
  cursor: pointer;
}
.stepper-button:hover { border-color: var(--accent); }
.stepper-button:active { transform: scale(0.95); }
/* At the end of the range. Faded and unpressable beats a live-looking button that
   does nothing, which reads as a broken control. */
.stepper-button:disabled {
  border-color: var(--border);
  opacity: 0.35;
  cursor: default;
}
.stepper-button:disabled:hover { border-color: var(--border); }
.stepper-button:disabled:active { transform: none; }
.stepper-value-wrap {
  min-width: 0;
  padding: 8px 12px;
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  background: var(--surface);
  text-align: center;
}
.stepper-label {
  color: var(--text-muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.stepper-value {
  overflow-wrap: anywhere;
  color: var(--text);
  font-size: clamp(1.45rem, 7vw, 2rem);
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  line-height: 1.2;
}
.number-feedback {
  margin: 4px 0 12px;
  padding: 9px 12px;
  border-left: 4px solid var(--accent-2);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--surface-alt);
}
.number-feedback-line {
  margin: 0;
  font-size: 0.9rem;
  line-height: 1.45;
}
.number-feedback-line + .number-feedback-line { margin-top: 5px; }
.number-feedback-line.keep { font-weight: 750; }

/* ---------- allocation ---------- */
.allocation-amount,
.allocation-remaining,
.allocation-cash {
  margin: 0 0 8px;
  font-size: 0.9rem;
  line-height: 1.45;
}
.allocation-remaining {
  padding: 8px 10px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-weight: 650;
}
.allocation-buckets { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
.allocation-bucket {
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
}
.allocation-bucket-label {
  margin-bottom: 7px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.allocation-stepper { margin: 0; }
.allocation-stepper .stepper-value-wrap { background: var(--surface); }
.allocation-cash { color: var(--text-muted); }

/* ---------- diagnosis ---------- */
.diagnose-options { display: flex; flex-direction: column; gap: 8px; }
.diagnose-option {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-alt);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.diagnose-option:hover { border-color: var(--accent); }
.diagnose-option:active { transform: scale(0.98); }
.diagnose-option.selected { border-color: var(--accent); background: var(--surface); }
.diagnose-label { overflow-wrap: anywhere; font-weight: 650; }
.diagnose-value { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
/* Evidence with no money figure — a step of a process, a cost driver. It sits where the
   amount would, so the options still read as one column of labels and one of evidence. */
.diagnose-detail {
  white-space: nowrap;
  font-size: 0.83rem;
  color: var(--text-muted);
}

/* ---------- goal context ---------- */
.goal-panel {
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-left: 4px solid var(--focus);
  border-radius: 0 var(--radius) var(--radius) 0;
  background: var(--surface-alt);
}
.goal-title {
  margin-bottom: 3px;
  color: var(--text);
  font-size: 0.9rem;
  font-weight: 800;
}
.goal-description { margin: 0 0 8px; color: var(--text-muted); font-size: 0.84rem; line-height: 1.45; }
.goal-conditions { display: flex; flex-direction: column; gap: 8px; }
.goal-condition {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(auto, 45%);
  column-gap: 8px;
  align-items: baseline;
  padding-top: 7px;
  border-top: 1px solid var(--border);
}
.goal-status { display: flex; align-items: center; gap: 4px; grid-column: 1 / -1; }
.goal-status-mark {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border: 2px solid currentColor;
  border-radius: 50%;
  font-size: 0.78rem;
  font-weight: 800;
}
.goal-condition[data-met="true"] .goal-status { color: var(--accent-2); }
.goal-condition[data-met="false"] .goal-status { color: var(--text-muted); }
.goal-status-word { font-size: 0.75rem; font-weight: 750; text-transform: uppercase; letter-spacing: 0.04em; }
.goal-condition-label { min-width: 0; font-size: 0.88rem; font-weight: 650; overflow-wrap: anywhere; }
.goal-condition-value { min-width: 0; color: var(--text-muted); font-size: 0.82rem; text-align: right; overflow-wrap: anywhere; }

/* ---------- prediction step ---------- */
.predict { border-color: var(--accent); border-width: 2px; }
.predict-question {
  font-weight: 650;
  font-size: 1.02rem;
  margin: 10px 0 12px;
}
.predict-choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.predict-choice {
  min-height: var(--tap);
  padding: 11px 8px;
  background: var(--surface-alt);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 140ms ease;
}
.predict-choice:hover:not(:disabled) { border-color: var(--accent); }
.predict-choice:active:not(:disabled) { transform: scale(0.97); }
.predict-choice.selected {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
}
.predict-choice:disabled:not(.selected) { opacity: 0.45; cursor: default; }

/* ---------- reveal step ---------- */
.reveal {
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 14px;
  margin-bottom: 14px;
  background: var(--surface);
  box-shadow: 0 1px 3px var(--shadow);
}
.reveal.correct { border-color: var(--accent-2); background: var(--ok-bg); }
.reveal.near { border-color: var(--accent); background: var(--surface-alt); }
.reveal.wrong { border-color: var(--danger); background: var(--danger-bg); }

.reveal-verdict {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}
/* Glyph carries the meaning, not colour alone. */
.reveal-mark {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-size: 1.05rem;
  font-weight: 700;
  background: var(--surface);
  border: 2px solid currentColor;
}
.reveal.correct .reveal-mark { color: var(--accent-2); }
.reveal.near .reveal-mark { color: var(--accent); }
.reveal.wrong .reveal-mark { color: var(--danger); }
.reveal-text { font-weight: 700; font-size: 1.02rem; }

.reveal-delta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 9px 11px;
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 11px;
}
.reveal-delta-label { font-size: 0.83rem; color: var(--text-muted); }
.reveal-delta-value {
  font-size: 1.2rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.outcome { font-size: 0.97rem; line-height: 1.55; }
.lesson {
  font-size: 0.94rem;
  line-height: 1.5;
  padding: 10px 12px;
  background: var(--surface);
  border-left: 4px solid var(--accent);
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 12px;
}

/* ---------- end profile ---------- */
.profile-head {
  text-align: center;
  padding: 14px 10px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.profile-tally {
  font-size: 2rem;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
  color: var(--accent-2);
  line-height: 1.1;
}
.profile-tally-label {
  font-size: 0.84rem;
  color: var(--text-muted);
  margin-top: 2px;
}
.profile-trend {
  margin-top: 8px;
  font-size: 0.9rem;
  font-weight: 600;
}
.profile-chart { margin-top: 14px; }
.profile-chart svg { display: block; width: 100%; height: auto; }

.indicator {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.indicator:last-of-type { border-bottom: 0; }
.indicator-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 3px;
}
.indicator-text { font-size: 0.97rem; line-height: 1.5; }
.indicator-evidence {
  margin-top: 4px;
  font-size: 0.87rem;
  color: var(--text-muted);
  line-height: 1.45;
}

/* The end-of-chapter concept recap. Twenty rows on a small screen, so the concept
   carries the weight and the decision sits under it in muted text — a two-column
   layout would wrap badly at 320px, which is the width that matters (AGENTS.md 3). */
.recap-intro {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin: 0 0 10px;
}
.recap-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.recap-item {
  padding: 7px 0;
  border-top: 1px solid var(--border);
}
.recap-item:first-child { border-top: none; }
.recap-concept {
  display: block;
  font-weight: 600;
  font-size: 0.94rem;
}
.recap-choice {
  display: block;
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-top: 2px;
}

.limitations { background: var(--surface-alt); }
.limitations-list {
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text-muted);
}
.limitations-list li { margin-bottom: 6px; }

.end-actions {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-top: 6px;
}

/* ---------- printable record ----------
   Populated on demand from the end-of-chapter screen (main.js printRecord). Hidden
   on screen; the @media print block below swaps the running app for it. Print to
   PDF is how a record leaves a phone with no connection and no share sheet, and it
   needs no network, no backend and no permission. */
.print-record { display: none; }

@media print {
  body { background: #fff; }
  .app { display: none !important; }
  .print-record {
    display: block;
    color: #000;
    font-size: 11pt;
    line-height: 1.45;
  }
  .print-record h1 { font-size: 15pt; margin: 0 0 2pt; }
  .print-record .print-meta { color: #444; font-size: 9.5pt; margin: 0 0 10pt; }
  .print-record h2 {
    font-size: 11.5pt;
    margin: 12pt 0 4pt;
    border-bottom: 1px solid #999;
    padding-bottom: 2pt;
  }
  .print-record .print-statement { margin: 0 0 7pt; }
  .print-record .print-indicator { font-weight: 700; }
  .print-record ul { margin: 4pt 0 0 14pt; padding: 0; }
  .print-record li { margin-bottom: 3pt; }
}

/* ---------- buttons ---------- */
.btn {
  min-height: var(--tap);
  padding: 12px 18px;
  border-radius: var(--radius);
  border: 2px solid transparent;
  font: inherit;
  font-weight: 650;
  font-size: 0.97rem;
  cursor: pointer;
  transition: filter 140ms ease;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; }

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: var(--accent-ink);
}
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }

.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--border);
}
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); }

.btn-small {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 0.82rem;
  font-weight: 600;
}

/* ---------- language toggle ---------- */
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.lang-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 99px;
  overflow: hidden;
  background: var(--surface);
}
.lang-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 7px 11px;
  min-height: 34px;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}
.lang-btn.selected { background: var(--accent); color: var(--accent-ink); }
.lang-btn:not(.selected):hover { color: var(--text); }

.banner-draft { border-left-color: var(--accent-2); }

/* ---------- owner time ---------- */
.time-bar {
  margin: 8px 0 12px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.time-bar.over { border-color: var(--danger); background: var(--danger-bg); }
.time-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}
.time-label { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.time-value { font-size: 0.84rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.time-bar.over .time-value { color: var(--danger); }
.time-track {
  height: 8px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.time-fill {
  height: 100%;
  width: 0;
  background: var(--accent-2);
  border-radius: 99px;
  transition: width 500ms cubic-bezier(0.22, 1, 0.36, 1);
}
.time-bar.over .time-fill { background: var(--danger); }

/* ---------- the ledger ----------
   Magnitude has to be visible, not just readable — docs/localization.md, "Numbers". */
.ledger {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.ledger-group-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin: 8px 0 4px;
}
.ledger-group-title:first-child { margin-top: 0; }

.ledger-row {
  display: grid;
  grid-template-columns: 1fr 64px auto;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 0.9rem;
}
.ledger-label { color: var(--text-muted); }
.ledger-bar {
  height: 7px;
  background: var(--border);
  border-radius: 99px;
  overflow: hidden;
}
.ledger-fill {
  height: 100%;
  width: 0;
  border-radius: 99px;
  transition: width 520ms cubic-bezier(0.22, 1, 0.36, 1);
}
.ledger-fill.in { background: var(--accent-2); }
.ledger-fill.out { background: var(--accent); }
.ledger-value { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }

.ledger-row.total {
  border-top: 2px solid var(--border);
  margin-top: 8px;
  padding-top: 9px;
  font-size: 1rem;
}
.ledger-row.total .ledger-label { color: var(--text); font-weight: 700; }
.ledger-row.total .ledger-value { font-weight: 800; }

.pnl-note.warn { color: var(--danger); }

/* ---------- what the business is worth ----------
   The only figure in the game that accumulates, so it is given its own card under the
   week rather than another row inside it. */
.worth {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.worth-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}
.worth-label { color: var(--text-muted); font-size: 0.9rem; }
.worth-value {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  font-weight: 800;
  font-size: 1.05rem;
}
.worth-value.negative, .worth-change.negative { color: var(--danger); }
.worth-change {
  margin-top: 4px;
  font-size: 0.83rem;
  color: var(--accent-2);
  font-weight: 600;
}
.worth-note {
  margin-top: 6px;
  font-size: 0.83rem;
  color: var(--text-muted);
}
.worth-note.warn { color: var(--danger); }

/* ---------- trajectory ---------- */
.trajectory {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--surface-alt);
  border-radius: var(--radius);
}
.trajectory-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 4px;
}
.trajectory-cash { font-size: 0.92rem; line-height: 1.45; }
.trajectory-note { font-size: 0.83rem; margin-top: 3px; font-weight: 600; }
.trajectory-note.falling { color: var(--danger); }
.trajectory-note.rising { color: var(--accent-2); }
.trajectory-note.flat { color: var(--text-muted); }
.trajectory-chart { margin-top: 8px; }
.trajectory-chart svg { display: block; width: 100%; height: auto; }

/* ---------- what a choice touches ---------- */
.option-touches { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 9px; }
.option-touches-label {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-weight: 600;
  margin-right: 1px;
}
.chip {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 99px;
  background: var(--surface-alt);
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.chip-cash { border-color: var(--accent); color: var(--accent); }
.chip-time { border-color: var(--focus); color: var(--focus); }
.chip-quality, .chip-reputation { border-color: var(--accent-2); color: var(--accent-2); }

/* ---------- work it out ---------- */
.workout { border-color: var(--accent-2); border-width: 2px; }
.workout-intro { font-size: 0.88rem; color: var(--text-muted); margin: 0 0 10px; }
.workout-lines { display: flex; flex-direction: column; }
.workout-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 0.92rem;
}
.workout-label { color: var(--text-muted); }
.workout-value { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.workout-row.total {
  border-bottom: 0;
  border-top: 2px solid var(--border);
  margin-top: 4px;
  padding-top: 10px;
}
.workout-row.total .workout-label { color: var(--text); font-weight: 700; }
.workout-row.total .workout-value { font-weight: 800; font-size: 1.15rem; }
.workout-ready { font-size: 0.9rem; font-weight: 600; margin: 12px 0; }

/* ---------- prediction bands ---------- */
.predict-choice-label { display: block; font-weight: 650; }
.predict-choice-band {
  display: block;
  margin-top: 3px;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.predict-choice.selected .predict-choice-band { color: inherit; opacity: 0.85; }

/* ---------- before and after ---------- */
.compare {
  margin: 12px 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
}
.compare-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: baseline;
  padding: 5px 0;
  font-size: 0.87rem;
}
.compare-row.head {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  font-weight: 700;
  border-bottom: 1px solid var(--border);
}
.compare-label { color: var(--text-muted); }
.compare-value {
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
  min-width: 82px;
}
/* The line that moved is the whole point of showing both columns. */
.compare-row.changed { background: var(--surface-alt); border-radius: 6px; }
.compare-row.changed .compare-label { color: var(--text); font-weight: 650; }
.compare-row.changed .compare-value:last-child { font-weight: 800; }
.compare-row.total {
  border-top: 2px solid var(--border);
  margin-top: 6px;
  padding-top: 8px;
  font-size: 0.96rem;
}
.compare-row.total .compare-label { color: var(--text); font-weight: 700; }
.compare-row.total .compare-value { font-weight: 800; }

.reveal-said { font-size: 0.9rem; margin: 4px 0 10px; }

.second-look {
  margin: 10px 0;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--focus);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.second-look-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 4px;
}
.second-look p { margin: 0; font-size: 0.92rem; line-height: 1.5; }

/* ---------- time passing ---------- */
.weeks-passed {
  margin-bottom: 10px;
  padding: 7px 12px;
  background: var(--surface-alt);
  border-radius: 99px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
  letter-spacing: 0.02em;
}

/* ---------- a consequence arriving from an earlier week ---------- */
.consequence {
  border-left: 4px solid var(--focus);
  background: var(--surface-alt);
}
.consequence .card-title { color: var(--focus); }
.consequence-text { margin: 0; font-size: 0.95rem; line-height: 1.5; }

/* ---------- finished ---------- */
.finished { border-color: var(--accent-2); border-width: 2px; }
.finished .card-title { color: var(--accent-2); font-size: 1.1rem; }
.finished-body { margin: 0; font-size: 0.95rem; line-height: 1.55; }

/* ---------- animation ---------- */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}
.fade-in { animation: fadeIn 240ms ease both; }
.slide-up { animation: slideUp 300ms cubic-bezier(0.22, 1, 0.36, 1) both; }

/* Never let motion gate reading or interaction. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- wider screens ---------- */
@media (min-width: 480px) {
  .predict-choices { grid-template-columns: repeat(4, 1fr); }
  .end-actions { flex-direction: row; }
  .end-actions .btn { flex: 1; }
}

/* ---------- SVG scenes ----------
   scene.js assigns classes and expects fills from here, so that scenes

.scene-svg { display: block; width: 100%; height: auto; background: var(--scene-sky); }

.scene-sun { fill: var(--scene-sun); }

.scene-shelf,
.scene-table,
.scene-desk { fill: var(--scene-stall-counter); }
.scene-desk-front { fill: var(--scene-stall-counter); opacity: 0.8; }
.scene-kitchen-wall { fill: var(--scene-stall-wall); }
.scene-office-wall { fill: var(--scene-stall-wall); }

.scene-truck-cab { fill: var(--scene-awning-a); }
.scene-truck-bed,
.scene-truck { fill: var(--scene-stall-counter); }

.scene-inspector { fill: var(--scene-staff-mark); }

.scene-coin { fill: var(--scene-goods); }
.scene-sparkle { fill: var(--scene-goods); }
.scene-lamp-glow { fill: var(--scene-sun); opacity: 0.22; }
.scene-grime { fill: var(--danger); opacity: 0.28; }
.scene-dim-overlay { fill: #000; }

/* ---------- chart ---------- */
.chart-svg { display: block; width: 100%; height: auto; }
.chart-baseline { stroke: var(--border); stroke-width: 1.5; }
.chart-bar-pos { fill: var(--accent-2); }

/* The overload warning is a fifth tile on a four-column grid — give it room
   so the word does not break mid-way. */

.chapter-title { font-size: 1.05rem; font-weight: 700; }

  const EMBEDDED_SCENARIOS = {"scenario-mama-asha.json":{"id":"mama-asha","version":2,"unverified":true,"title":{"en":"Mama Asha's Food Stall","sw":"Kibanda cha Chakula cha Mama Asha"},"blurb":{"en":"You sell mandazi and chai near a busy bus stand. Grow it without losing it.","sw":"Unauza mandazi na chai karibu na stendi ya mabasi yenye shughuli nyingi. Ikuze bila kuipoteza."},"currency":"TZS","startState":{"week":1,"cash":150000,"price":500,"unitCost":300,"demand":200,"capacity":180,"reputation":50,"hygiene":60,"formality":0,"staff":0,"ownerHours":60,"ownerHoursUsed":45,"rent":20000,"wagePerStaff":30000,"spoilRate":0.5,"inventoryWeeks":0.2},"goal":{"title":{"en":"Three things to keep in view","sw":"Mambo matatu ya kuyaangalia"},"description":{"en":"This goal gives your run a direction. It is not a pass mark. You can finish without every condition; the record reports what was true at the end.","sw":"Lengo hili linakupa mwelekeo katika safari yako. Si alama ya kufaulu. Unaweza kumaliza bila kutimiza kila sharti; kumbukumbu itaonyesha hali ya mwisho."},"conditions":[{"id":"registered","label":{"en":"Your business is registered, so a hotel can buy from you.","sw":"Biashara yako imesajiliwa, ili hoteli iweze kununua kwako."},"field":"formality","min":1},{"id":"hotel-capacity","label":{"en":"You can make at least 230 a week, enough for the hotel order.","sw":"Unaweza kutengeneza angalau 230 kwa wiki, ya kutosha kwa oda ya hoteli."},"field":"capacity","min":230},{"id":"cash-reserve","label":{"en":"You have at least 50,000 put by for a bad week.","sw":"Una angalau 50,000 uliyoweka kando kwa wiki mbaya."},"field":"cash","min":50000}]},"recovery":{"id":"recovery","concept":"recovery","conceptLabel":{"en":"When cash runs out","sw":"Pesa ikiisha"},"scene":"stall-empty","situation":{"en":"Your cash has gone below zero. The business is still open, but the next payment is due before enough money comes in. This is a hard chapter, not the end of the business.","sw":"Pesa yako imeshuka chini ya sifuri. Biashara bado iko wazi, lakini malipo yanayofuata yanatakiwa kabla pesa ya kutosha haijaingia. Hii ni sura ngumu, si mwisho wa biashara."},"info":[{"id":"map-cash-gap","label":{"en":"List what must be paid this week","sw":"Andika kinachopaswa kulipwa wiki hii"},"costHours":1,"costCash":0,"reveals":{"en":"You can see the gap now. A loan buys time but adds a cost. Cutting back hurts output. Selling equipment brings cash but leaves less to make.","sw":"Sasa unaona pengo. Mkopo unanunua muda lakini unaongeza gharama. Kupunguza kunapunguza uzalishaji. Kuuza vifaa kunaleta pesa lakini kunaacha uwezo mdogo wa kutengeneza."}}],"decision":{"prompt":{"en":"Which way out do you choose?","sw":"Unachagua njia gani ya kutoka?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"borrow","label":{"en":"Borrow enough to cover the gap","sw":"Kopa kiasi cha kuziba pengo"},"detail":{"en":"You pay for the time with a weekly cost.","sw":"Unalipia muda huo kwa gharama ya kila wiki."},"effects":{"cash":120000,"rent":12000},"predictAnswer":"down","outcome":{"en":"The cash gap is covered today. The weekly repayment makes the business tighter from now on.","sw":"Pengo la pesa limezibwa leo. Marejesho ya wiki yanaifanya biashara iwe na nafasi ndogo kuanzia sasa."},"lesson":{"en":"Borrowing can keep a business open, but the cost must fit the profit that remains each week.","sw":"Kukopa kunaweza kuweka biashara wazi, lakini gharama lazima ilingane na faida inayobaki kila wiki."}},{"id":"cut-back","label":{"en":"Cut output and reduce the weekly burden","sw":"Punguza uzalishaji na gharama ya wiki"},"detail":{"en":"Make less for now. Keep more cash in the business.","sw":"Tengeneza kidogo kwa sasa. Baki na pesa zaidi kwenye biashara."},"effects":{"capacity":"-60","demand":"-35","rent":"-10000"},"predictAnswer":"up_bit","outcome":{"en":"You make less, but the lower weekly burden gives the cash a chance to recover. You can build output again later.","sw":"Unatengeneza kidogo, lakini gharama ndogo ya wiki inapa pesa nafasi ya kurudi. Unaweza kuongeza uzalishaji tena baadaye."},"lesson":{"en":"Cutting back is not giving up. It buys time by matching the size of the business to the cash it has.","sw":"Kupunguza si kukata tamaa. Kunanunua muda kwa kulinganisha ukubwa wa biashara na pesa iliyo nayo."}},{"id":"sell-equipment","label":{"en":"Sell one piece of equipment","sw":"Uza kifaa kimoja"},"detail":{"en":"Cash now, less capacity later.","sw":"Pesa sasa, uwezo mdogo baadaye."},"effects":{"cash":80000,"assetValue":"-80000","capacity":"-80","demand":"-20"},"predictAnswer":"same","outcome":{"en":"You bring cash in today by selling equipment. The stall can make less, but it stays open while you repair the cash position.","sw":"Unapata pesa leo kwa kuuza kifaa. Kibanda kinaweza kutengeneza kidogo, lakini kinaendelea wazi huku ukirekebisha hali ya pesa."},"lesson":{"en":"Selling an asset can prevent a cash failure. It solves today's gap by giving up part of tomorrow's capacity.","sw":"Kuuza mali kunaweza kuzuia kushindwa kwa pesa. Kunatatua pengo la leo kwa kuacha sehemu ya uwezo wa kesho."}}]}},"turns":[{"id":"t01","concept":"unit-economics","conceptLabel":{"en":"Unit economics","sw":"Hesabu ya kila kimoja"},"scene":"stall-small","situation":{"en":"You fry mandazi every morning and sell them by the bus stand. Most weeks you run out before midday. About twenty people walk away because you have nothing left. You have never worked out what one mandazi really costs you to make.","sw":"Unakaanga mandazi kila asubuhi na kuyauza kando ya stendi ya mabasi. Wiki nyingi yanaisha kabla ya adhuhuri. Takriban watu ishirini wanaondoka bila kupata kwa sababu huna kilichobaki. Hujawahi kuhesabu gharama halisi ya kutengeneza andazi moja."},"info":[{"id":"count-cost","label":{"en":"Sit down and add up your costs","sw":"Kaa chini na ujumlishe gharama zako"},"costHours":2,"costCash":0,"reveals":{"en":"Flour, oil, sugar and charcoal come to about 300 for each mandazi. You sell at 500. So each one leaves you 200 before rent.","sw":"Unga, mafuta, sukari na mkaa vinafika takriban 300 kwa kila andazi. Unauza kwa 500. Kwa hiyo kila moja linakuachia 200 kabla ya kodi."}},{"id":"count-turnaways","label":{"en":"Count the people who leave empty handed","sw":"Hesabu watu wanaoondoka mikono mitupu"},"costHours":1,"costCash":0,"reveals":{"en":"You count 21 in one morning. They wanted to buy. You simply had none left.","sw":"Unahesabu 21 asubuhi moja. Walitaka kununua. Ila hukuwa na kitu kilichobaki."}}],"decision":{"type":"number","prompt":{"en":"Set the price for one mandazi.","sw":"Panga bei ya andazi moja."},"predict":"number","input":{"field":"price","min":500,"max":650,"step":25,"start":"current","valueAs":"money","hint":{"en":"You pay {cost} to make each one. You sell at {current} today.","sw":"Unalipa {cost} kutengeneza kila moja. Leo unauza kwa {current}."},"responses":[{"field":"demand","perStep":25,"change":-9}]},"bands":[{"outcome":{"en":"You leave the price where it is. You already sell out before midday, so this price is not winning you extra sales — every mandazi simply leaves you less.","sw":"Unaacha bei ilipo. Tayari unauza yote kabla ya adhuhuri, kwa hiyo bei hii haikuletei mauzo ya ziada — kila andazi linakuachia kidogo tu."},"lesson":{"en":"A low price only wins sales if you have something left to sell. Look at what you can make before you look at what you charge.","sw":"Bei ya chini inaleta mauzo tu kama una kilichobaki cha kuuza. Angalia unachoweza kutengeneza kabla ya kuangalia unachotoza."},"upTo":500},{"outcome":{"en":"At this price, your margin is small. You sell more, but each mandazi leaves less.","sw":"Kwa bei hii, margin yako ni ndogo. Unauza zaidi, lakini kila andazi linakuachia kidogo."},"lesson":{"en":"Price is not only about customers. See what remains after the cost of one mandazi.","sw":"Bei si kuhusu wateja tu. Angalia kinachobaki baada ya gharama ya andazi moja."},"upTo":600},{"outcome":{"en":"You keep more on each mandazi and still have customers. Margin and volume are in the same decision.","sw":"Unabaki na zaidi kwa kila andazi na bado una wateja. Margin na wingi viko katika uamuzi mmoja."},"lesson":{"en":"A good price balances what one sale leaves and how many sales remain.","sw":"Bei nzuri inalinganisha kinachobaki kwa mauzo moja na idadi ya mauzo yanayobaki."},"upTo":625},{"outcome":{"en":"The higher price leaves more on each sale, but fewer people buy. The extra kept per mandazi is close to the sales you lose.","sw":"Bei ya juu inakuachia zaidi kwa kila mauzo, lakini watu wachache wananunua. Kile cha ziada kwa andazi kinakaribia mauzo unayopoteza."},"lesson":{"en":"A higher margin can stop helping when volume falls. Move in small steps and look at both numbers.","sw":"Margin kubwa inaweza kuacha kusaidia wingi unaposhuka. Songa kwa hatua ndogo na angalia namba zote mbili."}}]}},{"id":"t02","concept":"pricing","conceptLabel":{"en":"Pricing","sw":"Upangaji wa bei"},"scene":"stall-busy","situation":{"en":"A new woman has started selling mandazi thirty metres from you. Hers are smaller and cheaper. Some of your regulars have tried her. A few came back and said yours taste better.","sw":"Mwanamke mpya ameanza kuuza mandazi mita thelathini kutoka kwako. Yake ni madogo na ya bei rahisi. Baadhi ya wateja wako wa kawaida wamemjaribu. Wachache walirudi wakisema yako yana ladha nzuri zaidi."},"info":[{"id":"check-competitor","label":{"en":"Go and buy one of hers","sw":"Nenda ununue moja lake"},"costHours":1,"costCash":400,"reveals":{"en":"Hers is smaller and drier. She sells at 400. Yours is bigger and people say it is better.","sw":"Lake ni dogo na kavu. Anauza kwa 400. Lako ni kubwa na watu wanasema ni bora."}}],"decision":{"type":"number","prompt":{"en":"Set your price while the competitor charges 400.","sw":"Panga bei yako wakati mshindani anauza kwa 400."},"predict":"number","input":{"field":"price","min":500,"max":650,"step":25,"start":"current","valueAs":"money","hint":{"en":"Her mandazi are smaller. Yours are bigger and better known. You sell at {current} today.","sw":"Mandazi yake ni madogo. Yako ni makubwa na yanajulikana zaidi. Leo unauza kwa {current}."},"responses":[{"field":"demand","perStep":25,"change":-8}]},"bands":[{"outcome":{"en":"Your price is close to hers. More people may try you, but each sale leaves less after your higher cost.","sw":"Bei yako iko karibu na yake. Watu zaidi wanaweza kukujaribu, lakini kila mauzo yanakuachia kidogo baada ya gharama yako kubwa."},"lesson":{"en":"Matching a cheaper seller can win volume and still weaken the business. Count what remains.","sw":"Kulingana na muuzaji wa bei rahisi kunaweza kuleta wingi na bado kudhoofisha biashara. Hesabu kinachobaki."},"upTo":600},{"outcome":{"en":"You charge more than the cheaper stall, but not so much that every customer leaves. Margin and volume must balance.","sw":"Unauza zaidi ya kibanda cha bei rahisi, lakini si sana kiasi cha kila mteja kuondoka. Margin na wingi lazima vilingane."},"lesson":{"en":"A cheaper competitor does not set your price for you. Test what customers will pay for better mandazi.","sw":"Mshindani wa bei rahisi hapangi bei yako. Jaribu kuona wateja watalipa nini kwa mandazi bora."},"upTo":625},{"outcome":{"en":"You ask customers to pay much more than the nearby stall. The higher margin is now fighting the lost volume.","sw":"Unaomba wateja walipe zaidi sana kuliko kibanda cha karibu. Margin kubwa sasa inapambana na wingi uliopotea."},"lesson":{"en":"Quality gives you room above the competitor, not permission to ignore demand. Raise the price in steps.","sw":"Ubora unakupa nafasi juu ya mshindani, si ruhusa ya kupuuza mahitaji. Panda bei kwa hatua."}}]}},{"id":"t03","concept":"cash-vs-profit","conceptLabel":{"en":"Cash and profit","sw":"Pesa na faida"},"scene":"kitchen","situation":{"en":"Your flour supplier offers you a deal. Buy a month of flour at once and pay ten percent less for it. But you must pay the whole amount today, in cash.","sw":"Msambazaji wako wa unga anakupa ofa. Nunua unga wa mwezi mzima kwa mara moja ulipe asilimia kumi pungufu. Lakini lazima ulipe kiasi chote leo, taslimu."},"info":[{"id":"check-cash","label":{"en":"Count what you actually have","sw":"Hesabu ulicho nacho hasa"},"costHours":1,"costCash":0,"reveals":{"en":"You have enough to take the deal. But it would leave you very little for anything unexpected this month.","sw":"Una cha kutosha kuchukua ofa. Lakini kutakuacha na kidogo sana kwa jambo lolote lisilotarajiwa mwezi huu."}},{"id":"count-the-store","label":{"en":"Look at what is already stacked in the store","sw":"Angalia kilichokwisha pangwa ghalani"},"costHours":1,"costCash":0,"reveals":{"en":"A day or two of flour, oil, sugar and charcoal is stacked in the corner. You paid for all of it and none of it has been sold yet. That is your own money, sitting on the floor instead of in the box — and the more you sell each week, the more of it has to sit there.","sw":"Unga, mafuta, sukari na mkaa wa siku moja au mbili umepangwa pembeni. Ulivilipia vyote na bado hakuna kilichouzwa. Hiyo ni pesa yako mwenyewe, imekaa chini badala ya kuwa sandukuni — na kadiri unavyouza zaidi kila wiki, ndivyo pesa zaidi inavyolazimika kukaa hapo."}}],"decision":{"prompt":{"en":"Do you take the deal?","sw":"Je, unachukua ofa?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"take-deal","label":{"en":"Take the bulk deal","sw":"Chukua ofa yote"},"detail":{"en":"A large payment today, cheaper flour all month.","sw":"Malipo makubwa leo, unga wa bei rahisi mwezi mzima."},"effects":{"unitCost":"-30","cash":-90000},"predictAnswer":"up_bit","outcome":{"en":"Each mandazi now costs you 30 less to make. Your profit rises. But your cash box is nearly empty, and it will stay that way for weeks.","sw":"Sasa kila andazi linakugharimu 30 pungufu kutengeneza. Faida yako inapanda. Lakini sanduku lako la pesa liko karibu tupu, na litabaki hivyo kwa wiki kadhaa."},"lesson":{"en":"Profit went up and cash went down, at the same time, from the same decision. These are two different things and a business can die of one while the other looks healthy.","sw":"Faida imepanda na pesa taslimu imeshuka, wakati mmoja, kutokana na uamuzi mmoja. Haya ni mambo mawili tofauti na biashara inaweza kufa kwa moja huku lingine likionekana zima."}},{"id":"half-deal","label":{"en":"Take half the deal","sw":"Chukua nusu ya ofa"},"detail":{"en":"Two weeks of flour instead of a month.","sw":"Unga wa wiki mbili badala ya mwezi."},"effects":{"unitCost":"-15","cash":-45000},"predictAnswer":"up_bit","outcome":{"en":"You get part of the saving and keep some cash back. Less gain, less risk.","sw":"Unapata sehemu ya punguzo na unabakiza pesa kidogo. Faida ndogo, hatari ndogo."},"lesson":{"en":"You do not always have to choose between all and nothing. Taking part of a deal is often the right size of risk.","sw":"Si lazima kila mara uchague kati ya yote au bila kitu. Kuchukua sehemu ya ofa mara nyingi ndiyo kiwango sahihi cha hatari."}},{"id":"refuse","label":{"en":"Say no and keep your cash","sw":"Sema hapana na ubakize pesa yako"},"detail":{"en":"You would rather be able to handle a surprise.","sw":"Ungependelea kuweza kukabiliana na jambo la ghafla."},"effects":{},"predictAnswer":"same","outcome":{"en":"You pay the usual price. Your cash box stays comfortable.","sw":"Unalipa bei ya kawaida. Sanduku lako la pesa linabaki vizuri."},"lesson":{"en":"Keeping cash for surprises has a real cost — the saving you turned down. That can still be the right choice.","sw":"Kubakiza pesa kwa ajili ya dharura kuna gharama halisi — punguzo ulilolikataa. Bado hiyo inaweza kuwa chaguo sahihi."}}]}},{"id":"t04","concept":"customer-relations","conceptLabel":{"en":"Customers","sw":"Wateja"},"scene":"stall-busy","situation":{"en":"The same twelve people buy from you almost every morning. Drivers, conductors, two teachers. One of them asks whether you could keep six aside for him each day, because he often arrives after you have sold out.","sw":"Watu walewale kumi na wawili wananunua kwako karibu kila asubuhi. Madereva, makondakta, walimu wawili. Mmoja wao anauliza kama unaweza kumwekea sita kila siku, kwa sababu mara nyingi anafika baada ya kuuza vyote."},"info":[{"id":"ask-regulars","label":{"en":"Ask your regulars what they want","sw":"Waulize wateja wako wa kawaida wanachotaka"},"costHours":2,"costCash":0,"reveals":{"en":"Four of them say the same thing. They would pay in advance for the week if it meant they were sure of getting some.","sw":"Wanne kati yao wanasema jambo lilelile. Wangelipa mapema kwa wiki nzima kama ingemaanisha wana uhakika wa kupata."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"reserve-paid","label":{"en":"Offer a weekly arrangement, paid in advance","sw":"Toa mpango wa wiki, malipo mapema"},"detail":{"en":"They pay on Monday for the whole week.","sw":"Wanalipa Jumatatu kwa wiki nzima."},"effects":{"cash":20000,"reputation":10},"predictAnswer":"same","outcome":{"en":"Five people sign up and pay on Monday for the whole week. Your weekly profit does not move at all — but the money is now in your hand at the start of the week instead of the end.","sw":"Watu watano wanajiandikisha na kulipa Jumatatu kwa wiki nzima. Faida yako ya wiki haibadiliki kabisa — lakini pesa sasa iko mkononi mwako mwanzoni mwa wiki badala ya mwishoni."},"lesson":{"en":"Being paid earlier does not make you more profit. It makes you safer, because you are no longer lending your customers money without knowing it.","sw":"Kulipwa mapema hakukuongezei faida. Kunakufanya uwe salama zaidi, kwa sababu huwakopeshi tena wateja wako bila kujua."}},{"id":"reserve-free","label":{"en":"Keep some aside for him as a favour","sw":"Mwekee kando kama upendeleo"},"detail":{"en":"No arrangement, no payment. Just goodwill.","sw":"Hakuna mpango, hakuna malipo. Ni wema tu."},"effects":{"reputation":5},"predictAnswer":"same","outcome":{"en":"He is grateful. Some mornings he does not come, and the six you held back go unsold until later.","sw":"Anashukuru. Asubuhi nyingine haji, na sita ulizoziweka kando zinabaki bila kuuzwa hadi baadaye."},"lesson":{"en":"Goodwill is real but it does not pay rent. An informal favour puts the risk on you and the benefit on them.","sw":"Wema ni kitu halisi lakini haulipi kodi. Upendeleo usio rasmi unaweka hatari kwako na faida kwao."}},{"id":"first-come","label":{"en":"Tell him it is first come, first served","sw":"Mwambie ni yeyote anayefika kwanza"},"detail":{"en":"Simple and fair to everyone.","sw":"Rahisi na haki kwa kila mtu."},"effects":{"demand":-40,"reputation":-5},"predictAnswer":"down","outcome":{"en":"He shrugs and starts buying elsewhere on the days he is late. Two others do the same. You lose them quietly, without an argument.","sw":"Anainua mabega na kuanza kununua kwingine siku anazochelewa. Wengine wawili wanafanya vivyo hivyo. Unawapoteza kimyakimya, bila ugomvi."},"lesson":{"en":"Treating your best customers exactly like everyone else is a decision to let some of them go — and they rarely tell you they are going.","sw":"Kuwatendea wateja wako bora sawasawa na kila mtu ni uamuzi wa kuwaacha baadhi yao waende — na mara chache wanakwambia kwamba wanaondoka."}}]}},{"id":"t05","concept":"market-sizing","conceptLabel":{"en":"How big is your market","sw":"Soko lako ni kubwa kiasi gani"},"scene":"market","situation":{"en":"You are thinking about a second spot, outside the secondary school two streets away. You do not know how many people would buy there. You have never counted.","sw":"Unafikiria eneo la pili, nje ya shule ya sekondari mitaa miwili kutoka hapa. Hujui ni watu wangapi wangenunua pale. Hujawahi kuhesabu."},"info":[{"id":"count-school","label":{"en":"Stand outside the school for two mornings and count","sw":"Simama nje ya shule asubuhi mbili uhesabu"},"costHours":4,"costCash":0,"reveals":{"en":"About 340 people pass between seven and eight. Most are students with very little money. Perhaps 40 could buy something at your price.","sw":"Takriban watu 340 wanapita kati ya saa moja na saa mbili. Wengi ni wanafunzi wenye pesa kidogo sana. Labda 40 wangeweza kununua kitu kwa bei yako."}},{"id":"ask-vendor","label":{"en":"Ask the woman selling peanuts there","sw":"Muulize mama anayeuza karanga pale"},"costHours":1,"costCash":0,"reveals":{"en":"She says mornings are busy but the students spend almost nothing. Her good money comes from teachers and parents.","sw":"Anasema asubuhi kuna shughuli nyingi lakini wanafunzi hawatumii chochote. Pesa yake nzuri inatoka kwa walimu na wazazi."}}],"decision":{"prompt":{"en":"What do you do about the school spot?","sw":"Unafanya nini kuhusu eneo la shule?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"open-second","label":{"en":"Rent the second spot and split your stock","sw":"Kodisha eneo la pili ugawe bidhaa zako"},"detail":{"en":"More rent, and your mandazi spread across two places.","sw":"Kodi zaidi, na mandazi yako yamegawanyika sehemu mbili."},"effects":{"rent":15000,"demand":25,"ownerHoursUsed":8},"predictAnswer":"down","outcome":{"en":"You pay rent in two places. The school crowd is large but buys little. You spend your morning running between the two and sell out at neither.","sw":"Unalipa kodi sehemu mbili. Umati wa shule ni mkubwa lakini wananunua kidogo. Unatumia asubuhi yako kukimbia kati ya mbili na huuzi vyote sehemu yoyote."},"lesson":{"en":"A crowd is not a market. Three hundred people who cannot afford your price are worth less than forty who can.","sw":"Umati si soko. Watu mia tatu wasioweza kumudu bei yako wana thamani ndogo kuliko arobaini wanaoweza."}},{"id":"test-small","label":{"en":"Try it for two mornings with a small batch","sw":"Jaribu asubuhi mbili kwa kiasi kidogo"},"detail":{"en":"No rent. Just carry a basket and see.","sw":"Hakuna kodi. Beba kikapu tu uone."},"effects":{"demand":2,"ownerHoursUsed":3},"predictAnswer":"same","outcome":{"en":"You sell a little. Enough to learn that the teachers buy and the students mostly look. Cheap knowledge.","sw":"Unauza kidogo. Ya kutosha kujifunza kwamba walimu wananunua na wanafunzi wanaangalia tu. Maarifa ya bei rahisi."},"lesson":{"en":"Testing something small before committing costs almost nothing and tells you what counting alone cannot.","sw":"Kujaribu kitu kidogo kabla ya kujitoa kunagharimu karibu bure na kunakuambia kile kuhesabu peke yake hakuwezi."}},{"id":"stay-put","label":{"en":"Stay where you are","sw":"Baki ulipo"},"detail":{"en":"The bus stand works.","sw":"Stendi ya mabasi inaenda vizuri."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes. You still wonder about the school.","sw":"Hakuna kinachobadilika. Bado unajiuliza kuhusu shule."},"lesson":{"en":"Not expanding is safe, but you are guessing about the school instead of knowing.","sw":"Kutopanuka ni salama, lakini unabahatisha kuhusu shule badala ya kujua."}}]}},{"id":"t06","concept":"record-keeping","conceptLabel":{"en":"Keeping records","sw":"Kutunza kumbukumbu"},"scene":"kitchen","situation":{"en":"You now sell mandazi, chai and a few samosas. Someone asks you which one makes you the most money. You realise you have no idea. It is all one pile of cash at the end of the day.","sw":"Sasa unauza mandazi, chai na sambusa chache. Mtu anakuuliza ni kipi kinakuletea pesa nyingi zaidi. Unagundua hujui. Ni rundo moja la pesa mwisho wa siku."},"info":[{"id":"try-remember","label":{"en":"Try to work it out from memory","sw":"Jaribu kuihesabu kichwani"},"costHours":2,"costCash":0,"reveals":{"en":"You cannot. You know roughly what comes in altogether, but not which item it came from, and not what each one cost you.","sw":"Huwezi. Unajua takriban kinachoingia kwa jumla, lakini si kimetoka kwa bidhaa gani, wala kila kimoja kilikugharimu kiasi gani."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"start-book","label":{"en":"Keep a simple book — what you sold, what you spent","sw":"Tunza daftari rahisi — ulichouza, ulichotumia"},"detail":{"en":"Twenty minutes every evening. It is time you do not have.","sw":"Dakika ishirini kila jioni. Ni muda usio nao."},"effects":{"keepsRecords":true,"ownerHoursUsed":3},"predictAnswer":"same","outcome":{"en":"It costs you time and changes nothing this week. But after three weeks you can see that the samosas take the most work and bring the least back.","sw":"Inakugharimu muda na haibadilishi kitu wiki hii. Lakini baada ya wiki tatu unaweza kuona kwamba sambusa zinachukua kazi nyingi zaidi na kuleta kidogo zaidi."},"lesson":{"en":"Records do not make money by themselves. They let you see which parts of your business are carrying the others — and you cannot fix what you cannot see.","sw":"Kumbukumbu hazitengenezi pesa zenyewe. Zinakuwezesha kuona ni sehemu zipi za biashara yako zinabeba nyingine — na huwezi kurekebisha usichokiona."}},{"id":"drop-samosa","label":{"en":"Guess it is the samosas and stop making them","sw":"Bahatisha ni sambusa na uache kuzitengeneza"},"detail":{"en":"They feel like the most trouble.","sw":"Zinaonekana ndizo shida kubwa zaidi."},"effects":{"demand":-80,"ownerHoursUsed":-4},"predictAnswer":"down","outcome":{"en":"You free up time. You also lose the customers who came for samosas and bought chai as well. You still do not know whether you were right.","sw":"Unapata muda. Pia unapoteza wateja waliokuja kwa ajili ya sambusa na wakanunua chai pia. Bado hujui kama ulikuwa sahihi."},"lesson":{"en":"Acting on a guess can be worse than doing nothing, because now you have changed something and still cannot tell if it helped.","sw":"Kutenda kwa kubahatisha kunaweza kuwa vibaya kuliko kutofanya kitu, kwa sababu sasa umebadilisha kitu na bado huwezi kujua kama kilisaidia."}},{"id":"no-book","label":{"en":"Carry on as you are","sw":"Endelea kama ulivyo"},"detail":{"en":"The money comes in. That is enough.","sw":"Pesa inaingia. Hiyo inatosha."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes. The question stays unanswered.","sw":"Hakuna kinachobadilika. Swali linabaki bila jibu."},"lesson":{"en":"This works while the business is small enough to hold in your head. It stops working shortly after that.","sw":"Hii inafanya kazi wakati biashara ni ndogo ya kutosha kuiweka kichwani. Inaacha kufanya kazi muda mfupi baada ya hapo."}}]}},{"id":"t07","concept":"operations","conceptLabel":{"en":"Capacity","sw":"Uwezo wa kutengeneza"},"scene":"kitchen","unverified":true,"situation":{"en":"You are frying on one small charcoal stove. It takes you four hours every morning and your arm aches. A second-hand deep fryer is for sale in town. It would double how much you can make in the same time.","sw":"Unakaanga kwenye jiko dogo moja la mkaa. Inakuchukua masaa manne kila asubuhi na mkono wako unauma. Mashine ya kukaanga ya mtumba inauzwa mjini. Ingeongeza mara mbili kiasi unachoweza kutengeneza kwa muda uleule."},"info":[{"id":"inspect-fryer","label":{"en":"Go and look at the fryer before buying","sw":"Nenda uangalie mashine kabla ya kununua"},"costHours":3,"costCash":2000,"reveals":{"en":"It works, but the thermostat is broken. It will need a repair soon. The seller knows this and drops the price.","sw":"Inafanya kazi, lakini kidhibiti joto kimeharibika. Itahitaji matengenezo hivi karibuni. Muuzaji anajua hivyo na anapunguza bei."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"buy-fryer","label":{"en":"Buy the fryer","sw":"Nunua mashine"},"detail":{"en":"A deposit now, then a repayment every week. Much more capacity.","sw":"Malipo ya awali sasa, kisha marejesho kila wiki. Uwezo mkubwa zaidi."},"effects":{"capacity":90,"cash":-120000,"assetValue":120000,"rent":12000,"ownerHoursUsed":-6},"predictAnswer":"down","outcome":{"en":"You can make far more now. But your customers have not grown, so much of it goes unsold, and the repayment leaves whether you sell it or not.","sw":"Sasa unaweza kutengeneza zaidi sana. Lakini wateja wako hawajaongezeka, kwa hiyo mengi yanabaki bila kuuzwa, na marejesho yanatoka ukiuza au usiuze."},"lesson":{"en":"Being able to make more does not mean you can sell more. Buying on credit turns a one-off purchase into a cost that arrives every week, in good weeks and bad.","sw":"Kuweza kutengeneza zaidi hakumaanishi unaweza kuuza zaidi. Kununua kwa mkopo kunageuza manunuzi ya mara moja kuwa gharama inayokuja kila wiki, wiki njema na mbaya."},"later":[{"inWeeks":4,"effects":{"cash":-30000},"cause":{"en":"the broken thermostat on the fryer you bought","sw":"kidhibiti joto kilichoharibika kwenye mashine uliyonunua"}}]},{"id":"buy-and-push","label":{"en":"Buy the fryer and start selling to the guesthouse nearby","sw":"Nunua mashine na uanze kuuza gesti ya jirani"},"detail":{"en":"The same deposit and weekly repayment — but with a customer lined up first.","sw":"Malipo yaleyale ya awali na marejesho ya wiki — lakini na mteja aliyepangwa kwanza."},"effects":{"capacity":220,"demand":220,"cash":-120000,"assetValue":120000,"rent":12000,"ownerHoursUsed":-3},"predictAnswer":"up_lot","outcome":{"en":"The guesthouse takes a standing order every morning. The new capacity is filled almost immediately, and your arm stops aching.","sw":"Gesti inachukua oda ya kudumu kila asubuhi. Uwezo mpya unajazwa karibu mara moja, na mkono wako unaacha kuuma."},"lesson":{"en":"Find the customer before you build the capacity, not after. The machine only pays when there is demand waiting for it.","sw":"Tafuta mteja kabla ya kujenga uwezo, si baada. Mashine inalipa tu pale kuna mahitaji yanayoisubiri."},"later":[{"inWeeks":4,"effects":{"cash":-30000},"cause":{"en":"the broken thermostat on the fryer you bought","sw":"kidhibiti joto kilichoharibika kwenye mashine uliyonunua"}}]},{"id":"keep-stove","label":{"en":"Keep the charcoal stove","sw":"Baki na jiko la mkaa"},"detail":{"en":"It is slow but it is paid for.","sw":"Ni la polepole lakini limeshalipiwa."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes. You keep frying by hand, four hours a morning.","sw":"Hakuna kinachobadilika. Unaendelea kukaanga kwa mkono, masaa manne kila asubuhi."},"lesson":{"en":"Your own labour feels free because no money leaves your hand. It is not free — it is the time you cannot spend on anything else.","sw":"Kazi yako mwenyewe inaonekana bure kwa sababu hakuna pesa inayotoka mkononi mwako. Si bure — ni muda usioweza kuutumia kwa jambo lingine."}},{"id":"buy-flour-not-fryer","label":{"en":"Buy no machine. Put the money into flour instead","sw":"Usinunue mashine. Badala yake weka pesa kwenye unga"},"detail":{"en":"You take a smaller order from the guesthouse and fry a second batch by hand. No deposit, no weekly repayment — but more of your money stays in the store as stock.","sw":"Unachukua oda ndogo kutoka gesti na kukaanga donge la pili kwa mkono. Hakuna malipo ya awali wala marejesho ya wiki — lakini pesa yako zaidi inabaki ghalani kama bidhaa."},"effects":{"capacity":150,"demand":150,"inventoryWeeks":"+0.25","ownerHoursUsed":6},"predictAnswer":"up_lot","outcome":{"en":"The guesthouse takes the smaller order and you fill it from the stove you already own. You signed nothing and no repayment starts — and yet money still leaves the cash box, because the flour for a bigger order has to be bought before any of it is sold.","sw":"Gesti inachukua oda ndogo na unaitimiza kwa jiko ulilo nalo. Hukusaini chochote na hakuna marejesho yanayoanza — na bado pesa inatoka sandukuni, kwa sababu unga wa oda kubwa lazima ununuliwe kabla hakuna kilichouzwa."},"lesson":{"en":"Money put into stock is spent as surely as money put into a machine, and nobody hands you a receipt for it. The difference is that stock comes back to you when you sell it, and a machine has to be paid for every week whether you sell or not.","sw":"Pesa iliyowekwa kwenye bidhaa imetumika kama pesa iliyowekwa kwenye mashine, na hakuna anayekupa risiti. Tofauti ni kwamba bidhaa zinakurudia ukiziuza, na mashine lazima ilipiwe kila wiki ukiuza au usiuze."}}]}},{"id":"t08","concept":"supplier-quality","conceptLabel":{"en":"What you buy","sw":"Unachonunua"},"scene":"market","situation":{"en":"Your flour supplier has raised his price. Another trader offers flour that is twenty percent cheaper. It looks slightly greyer, and he cannot tell you which mill it came from.","sw":"Msambazaji wako wa unga amepandisha bei. Mfanyabiashara mwingine anakupa unga wa bei rahisi kwa asilimia ishirini. Unaonekana wa kijivu kidogo, na hawezi kukwambia ulitoka kinu gani."},"info":[{"id":"test-flour","label":{"en":"Fry one batch with the cheap flour and taste it","sw":"Kaanga kundi moja kwa unga wa bei rahisi uonje"},"costHours":2,"costCash":2000,"reveals":{"en":"The mandazi are heavier and darker. On the first day most customers would probably not notice. By the second week they would.","sw":"Mandazi ni mazito na meusi zaidi. Siku ya kwanza wateja wengi pengine hawatatambua. Ifikapo wiki ya pili watatambua."}}],"decision":{"prompt":{"en":"What do you buy?","sw":"Unanunua nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"cheap-flour","label":{"en":"Switch to the cheaper flour","sw":"Hamia kwenye unga wa bei rahisi"},"detail":{"en":"Your costs drop today.","sw":"Gharama zako zinashuka leo."},"effects":{"unitCost":"-30"},"later":[{"inWeeks":3,"effects":{"hygiene":-16,"reputation":-9,"demand":-25},"cause":{"en":"you switched to the cheaper flour without knowing where it came from","sw":"ulihamia kwenye unga wa bei rahisi bila kujua ulikotoka"}}],"predictAnswer":"up_bit","outcome":{"en":"Every mandazi costs you forty less to make and this week looks better than the last one. Nobody complains yet.","sw":"Kila andazi linakugharimu arobaini pungufu kutengeneza na wiki hii inaonekana bora kuliko iliyopita. Bado hakuna anayelalamika."},"lesson":{"en":"A cheaper input improves this week for certain. Whether it costs you later depends on something you chose not to find out.","sw":"Malighafi ya bei rahisi inaboresha wiki hii kwa uhakika. Kama itakugharimu baadaye inategemea kitu ulichochagua kutokijua."}},{"id":"stay-supplier","label":{"en":"Stay with your supplier at the higher price","sw":"Baki na msambazaji wako kwa bei ya juu"},"detail":{"en":"You know exactly what you are getting.","sw":"Unajua hasa unachopata."},"effects":{},"predictAnswer":"same","outcome":{"en":"Nothing changes this week. Your flour costs what it cost last week and your mandazi taste the same.","sw":"Hakuna kinachobadilika wiki hii. Unga wako unagharimu kama wiki iliyopita na mandazi yako yana ladha ileile."},"lesson":{"en":"Paying a known supplier more is buying something real — you are paying for consistency you can plan around.","sw":"Kumlipa msambazaji unayemjua zaidi ni kununua kitu halisi — unalipia uthabiti unaoweza kuupangia."}},{"id":"test-first","label":{"en":"Buy a small amount of the cheap flour and test it properly","sw":"Nunua kiasi kidogo cha unga wa bei rahisi ukijaribu vizuri"},"detail":{"en":"Costs you a little, tells you a lot.","sw":"Inakugharimu kidogo, inakuambia mengi."},"effects":{"cash":-4000,"ownerHoursUsed":3},"predictAnswer":"same","outcome":{"en":"You spend a little and two mornings. The cheap flour absorbs more oil and goes stale faster. You go back to your supplier knowing why.","sw":"Unatumia kidogo na asubuhi mbili. Unga wa bei rahisi unanyonya mafuta zaidi na unaharibika haraka. Unarudi kwa msambazaji wako ukijua sababu."},"lesson":{"en":"The cost of testing an input is almost always smaller than the cost of finding out from your customers.","sw":"Gharama ya kujaribu malighafi karibu kila mara ni ndogo kuliko gharama ya kujua kutoka kwa wateja wako."}}]}},{"id":"t09","concept":"logistics","conceptLabel":{"en":"Getting things there","sw":"Kufikisha bidhaa"},"scene":"truck","situation":{"en":"The guesthouse wants delivery by six in the morning, before their guests come down. You have been carrying everything yourself on foot, and twice you have been late.","sw":"Gesti inataka bidhaa zifike saa kumi na mbili asubuhi, kabla wageni wao hawajashuka. Umekuwa ukibeba kila kitu mwenyewe kwa miguu, na mara mbili umechelewa."},"info":[{"id":"ask-guesthouse","label":{"en":"Ask the guesthouse what happens if you are late","sw":"Uulize gesti nini kitatokea ukichelewa"},"costHours":1,"costCash":0,"reveals":{"en":"The manager says one more late delivery and they will find someone else. He is not angry. He is just telling you.","sw":"Meneja anasema ukichelewa mara moja zaidi watatafuta mtu mwingine. Hana hasira. Anakuambia tu."}}],"decision":{"prompt":{"en":"How do you get there on time?","sw":"Unafikaje kwa wakati?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"hire-boda","label":{"en":"Pay a boda rider to deliver every morning","sw":"Lipa dereva wa bodaboda apeleke kila asubuhi"},"detail":{"en":"A weekly cost, but you stop being the one carrying baskets.","sw":"Gharama ya wiki, lakini unaacha kuwa unayebeba vikapu."},"effects":{"rent":12000,"reputation":8,"ownerHoursUsed":-5},"predictAnswer":"down","outcome":{"en":"Deliveries are on time every day. It costs you money every week, and it buys back five hours and a customer you were about to lose.","sw":"Bidhaa zinafika kwa wakati kila siku. Inakugharimu pesa kila wiki, na inakununulia masaa matano na mteja uliyekuwa karibu kumpoteza."},"lesson":{"en":"Paying for reliability looks like pure cost on paper. What it actually buys is the customer you would otherwise lose.","sw":"Kulipia uhakika kunaonekana kama gharama tupu kwenye karatasi. Kinachonunuliwa hasa ni mteja ambaye vinginevyo ungempoteza."}},{"id":"wake-earlier","label":{"en":"Wake up an hour earlier and carry it yourself","sw":"Amka saa moja mapema uubebe mwenyewe"},"detail":{"en":"Costs nothing in money.","sw":"Haigharimu pesa yoyote."},"effects":{"ownerHoursUsed":6},"predictAnswer":"same","outcome":{"en":"You are on time. You are also exhausted by nine in the morning, and you still have the whole day ahead of you.","sw":"Unafika kwa wakati. Pia umechoka sana ifikapo saa tatu asubuhi, na bado una siku nzima mbele yako."},"lesson":{"en":"Solving a problem with your own hours is not free. You have a fixed number of them and you are already using most of them.","sw":"Kutatua tatizo kwa masaa yako mwenyewe si bure. Una idadi maalum yao na tayari unatumia mengi."}},{"id":"ask-later","label":{"en":"Ask the guesthouse to accept a later delivery","sw":"Iombe gesti ikubali kupokea baadaye"},"detail":{"en":"It costs nothing to ask.","sw":"Haigharimu kitu kuuliza."},"effects":{"demand":-40,"reputation":-6},"predictAnswer":"down","outcome":{"en":"They say no. Their guests come down at six thirty. They thank you and start buying from someone else.","sw":"Wanasema hapana. Wageni wao wanashuka saa kumi na mbili na nusu. Wanakushukuru na kuanza kununua kwa mtu mwingine."},"lesson":{"en":"A big customer's requirements are usually not negotiable, because they have their own customers to serve.","sw":"Mahitaji ya mteja mkubwa mara nyingi hayajadiliki, kwa sababu wana wateja wao wenyewe wa kuwahudumia."}}]}},{"id":"t10","concept":"food-safety","conceptLabel":{"en":"Food safety","sw":"Usalama wa chakula"},"scene":"kitchen","situation":{"en":"You have been reusing your frying oil for longer than you used to, because oil is expensive. Two customers have mentioned that the mandazi taste different. One said her stomach was upset, though she was not sure it was yours.","sw":"Umekuwa ukitumia mafuta yako ya kukaanga kwa muda mrefu kuliko ulivyokuwa, kwa sababu mafuta ni ghali. Wateja wawili wametaja kwamba mandazi yana ladha tofauti. Mmoja alisema tumbo lake liliumwa, ingawa hakuwa na uhakika ni yako."},"info":[{"id":"taste-test","label":{"en":"Taste yesterday's batch yourself","sw":"Onja mwenyewe kundi la jana"},"costHours":1,"costCash":0,"reveals":{"en":"There is a bitter edge you had stopped noticing. Your customers noticed before you did.","sw":"Kuna uchungu kidogo uliokuwa umeacha kuutambua. Wateja wako waliutambua kabla yako."}}],"decision":{"prompt":{"en":"What do you do?","sw":"Utafanya nini?"},"predictQuestion":{"en":"What happens to your weekly profit?","sw":"Faida yako ya wiki itakuwaje?"},"predictChoices":[{"id":"up_lot","label":{"en":"Up a lot","sw":"Inapanda sana"}},{"id":"up_bit","label":{"en":"Up a little","sw":"Inapanda kidogo"}},{"id":"same","label":{"en":"About the same","sw":"Inabaki vilevile"}},{"id":"down","label":{"en":"Goes down","sw":"Inashuka"}}],"options":[{"id":"change-oil","label":{"en":"Change the oil more often and cover the food properly","sw":"Badilisha mafuta mara kwa mara na funika chakula vizuri"},"detail":{"en":"Your costs go up. Nothing else visibly changes this week.","sw":"Gharama zako zinapanda. Hakuna kingine kinachoonekana kubadilika wiki hii."},"effects":{"unitCost":"+25","hygiene":30,"reputation":6},"predictAnswer":"down","outcome":{"en":"Each mandazi costs a little more to make. The taste comes back. Nobody thanks you, because customers rarely notice a problem that stopped happening.","sw":"Kila andazi linagharimu kidogo zaidi kutengeneza. Ladha inarudi. Hakuna anayekushukuru, kwa sababu wateja mara chache wanatambua tatizo lililoacha kutokea."},"lesson":{"en":"Food safety costs money now and pays you back by preventing something that never happens. That makes it very easy to keep putting off.","sw":"Usalama wa chakula unagharimu pesa sasa na unakulipa kwa kuzuia kitu ambacho hakitokei kamwe. Hilo linafanya iwe rahisi sana kuendelea kuahirisha."}},{"id":"keep-oil","label":{"en":"Carry on. Oil is expensive and nobody has proved anything","sw":"Endelea. Mafuta ni ghali na hakuna aliyethibitisha kitu"},"detail":{"en":"Save the money.","sw":"Okoa pesa."},"effects":{"hygiene":-25,"reputation":-8},"predictAnswer":"same","outcome":{"en":"Your costs stay low this week. Word about the taste spreads slowly, the way word always does.","sw":"Gharama zako zinabaki chini wiki hii. Habari kuhusu ladha zinaenea polepole, kama habari zinavyoenea daima."},"lesson":{"en":"A food safety problem does not arrive as a bill. It arrives later, as customers who quietly stop coming.","sw":"Tatizo la usalama wa chakula halifiki kama bili. Linafika baadaye, kama wateja wanaoacha kuja kimyakimya."},"later":[{"inWeeks":4,"effects":{"reputation":-14,"demand":-45},"cause":{"en":"the frying oil you kept reusing","sw":"mafuta ya kukaanga uliyoendelea kuyatumia"}}]},{"id":"dilute","label":{"en":"Mix a little fresh oil into the old","sw":"Changanya mafuta kidogo mapya na ya zamani"},"detail":{"en":"A compromise that costs less.","sw":"Njia ya kati inayogharimu kidogo."},"effects":{"unitCost":"+20","hygiene":8},"predictAnswer":"down","outcome":{"en":"The taste improves slightly. The underlying problem is still there, just slower.","sw":"Ladha inaboreka kidogo. Tatizo la msingi bado lipo, ni la polepole tu."},"lesson":{"en":"Half-solving a safety problem often costs you most of the money and buys you little of the protection.","sw":"Kutatua nusu tatizo la usalama mara nyingi kunakugharimu pesa nyingi na kunakununulia ulinzi kidogo."},"later":[{"inWeeks":5,
