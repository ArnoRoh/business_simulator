<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Run Asha's mandazi stall — a 5-day game about running a real business.">
<title>Asha's Stall — Business Game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff7a18'/%3E%3Ccircle cx='32' cy='20' r='8' fill='%23fff' opacity='.9'/%3E%3Crect x='16' y='34' width='32' height='18' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/entry.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#ff7a18">
</head>
<body>
<div class="phone">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◉</span>
      <span id="brand-name" class="brand-name">Asha's Stall</span>
      <span id="brand-sub" class="brand-sub">5 days • play anywhere</span>
    </div>
    <div class="topbar-right">
      <button id="lang-btn" class="lang-btn" type="button">SW</button>
    </div>
  </header>

  <div id="progress" class="progress"></div>

  <div id="scene-wrap" class="scene-wrap">
    <div id="scene" class="scene" aria-hidden="true"></div>
    <div id="hud" class="hud"></div>
  </div>

  <main id="main" class="main">
    <div id="card" class="card" tabindex="-1"><p>Opening the game… / Mchezo unafunguka…</p></div>
    <div id="mini" class="mini"></div>
  </main>
  <footer class="foot">
    <p id="sample"></p>
    <p id="save-status" role="status"></p>
    <button id="retry" class="ghost" hidden></button>
    <p id="offline-status" role="status"></p>
    <button id="old-download" class="ghost" hidden></button>
    <button id="download" class="ghost"></button>
    <a id="offline-file" class="ghost" href="./intro-standalone.html" download="MV-BS-INTRO-game.html"></a>
    <a id="practice" class="ghost" href="./practice.html"></a>
  </footer>
</div>
<script type="module" src="./js/entry.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
