<style>
/* Short introduction: native controls, local assets and reduced motion. */
:root{
  --bg:#fff6ea;
  --surface:#ffffff;
  --ink:#1a140e;
  --muted:#655846;
  --line:#f0ddbd;
  --accent:#aa4200;
  --accent-2:#0f766e;
  --accent-3:#facc15;
  --danger:#e11d48;
  --ok:#0f766e;
  --radius:18px;
  --radius-lg:24px;
  --tap:52px;
  --shadow:0 8px 32px rgba(26,20,14,.12), 0 2px 8px rgba(26,20,14,.08);
  --font-display:system-ui, sans-serif;
  --font-body:system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:1.0rem; line-height:1.45;
  min-height:100dvh; display:flex; justify-content:center;
}
.phone{
  overflow-wrap:anywhere;
  width:100%; max-width:440px; min-height:100dvh;
  background:var(--bg); display:flex; flex-direction:column;
  position:relative;
}
/* topbar */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px 10px; background:var(--bg);

}
.brand{display:flex; flex-direction:column}
.brand-mark{font-size:1.125rem; color:var(--accent); line-height:1}
.brand-name{font-family:var(--font-display); font-weight:900; font-size:1.0625rem; letter-spacing:-.02em; margin-top:1px}
.brand-sub{font-size:0.6875rem; color:var(--muted); font-weight:600; letter-spacing:.02em}
.topbar-right{flex-shrink:0;display:flex; gap:8px; align-items:center}
.lang-btn{
  min-width:48px; min-height:48px; padding:8px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--surface); font-weight:800; font-size:0.8125rem; cursor:pointer;
}
/* progress — 5 days dots */
.progress{
  display:flex; gap:8px; align-items:center; padding:8px 16px;
}
.dot{
  flex:1; height:6px; border-radius:99px; background:var(--line); overflow:hidden; position:relative;
}
.dot-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.dot-label{font-size:0.625rem; font-weight:700; color:var(--muted); margin-top:4px; text-align:center; letter-spacing:.04em}
/* scene */
.scene-wrap{position:relative; margin:0 12px; border-radius:var(--radius-lg); overflow:hidden; background:#fde9c7; box-shadow:var(--shadow); min-height:0}
.scene{width:100%; aspect-ratio: 4/2.1; max-height:200px; display:block; line-height:0}
.scene svg{width:100%; height:100%; display:block}
.hud{
  position:relative; padding:10px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none;
}
.hud-pill{
  background:rgba(255,255,255,.96); border:1.5px solid rgba(26,20,14,.1); border-radius:999px;
  padding:6px 10px; font-weight:800; font-size:0.8125rem; display:flex; align-items:center; gap:6px;
  box-shadow:0 2px 10px rgba(0,0,0,.08)
}
.hud-pill.cash{background:var(--ink); color:#fff; border-color:var(--ink)}
/* card */
.main{flex:1; padding:14px 12px 18px; display:flex; flex-direction:column; gap:12px}
.card{
  background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow);
}
.kicker{font-size:0.6875rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:6px}
.title{font-family:var(--font-display); font-size:1.3125rem; font-weight:900; line-height:1.15; letter-spacing:-.02em; margin:0 0 8px}
.body{font-size:0.9375rem; color:#2a231c; line-height:1.5; margin:0 0 14px}
.choices{display:flex; flex-direction:column; gap:10px}
.choice{
  width:100%; text-align:left; padding:14px 14px; border-radius:16px; border:2px solid var(--line);
  background:var(--surface); font:inherit; cursor:pointer; transition:transform .12s, border-color .12s, background .12s;
  display:flex; gap:12px; align-items:center;
}
.choice:active{transform:scale(.98)}
.primary{
  width:100%; padding:14px 16px; border-radius:999px; border:0; background:var(--accent); color:#fff;
  font-family:var(--font-display); font-weight:900; font-size:1.0625rem; letter-spacing:-.01em; cursor:pointer; box-shadow:0 6px 18px rgba(255,122,24,.35);
  transition:transform .12s;
}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.45; cursor:default; transform:none; box-shadow:none}
.ghost{
  width:100%; padding:12px; border-radius:999px; border:1.5px solid var(--line); background:var(--surface); font-weight:700; cursor:pointer
}
.pulse{animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.foot{padding:14px 12px; text-align:center; font-size:0.6875rem; color:var(--muted); letter-spacing:.02em}

button, a, summary { touch-action: manipulation; min-height:48px; }
button, input, textarea { font:inherit; }
:focus-visible { outline:3px solid var(--accent-2); outline-offset:3px; }
a.ghost { color:var(--accent-2); }
.brand { min-width:0; padding-right:8px; }
.cash-warning { border-left:4px solid var(--accent); padding:8px; }
a.primary, a.ghost { display:block; text-decoration:none; text-align:center; }
.ghost, .primary, .accounts { margin-top:12px; }
.progress-day { flex:1; }
.money-row { display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 12px; padding:6px 0; border-bottom:1px solid var(--line); }
dt { flex:1; min-width:120px; } dd { margin:0; font-weight:700; }
summary { display:flex; align-items:center; cursor:pointer; font-weight:700; }
textarea { width:100%; margin:8px 0; padding:12px; border:2px solid var(--line); border-radius:12px; resize:vertical; }
.cash-change { color:var(--accent-2); font-size:1.25rem; font-weight:800; }
#card { scroll-margin-top:12px; }
button:disabled { opacity:.6; cursor:not-allowed; }
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
[hidden] { display:none !important; }

</style>

// Number and currency formatting.

// Amounts are stored locale-neutral (plain integers) and formatted only at render
// time — AGENTS.md section 6. Never author a currency symbol into content.


let currency = 'TZS';

function setCurrency(nextCurrency) {
  currency = nextCurrency || currency;
}

/** Digit grouping follows the interface language. */
function localeTag() {
  return getLanguage() === 'sw' ? 'sw-TZ' : 'en-GB';
}

// Grouped integer, no decimals. Small-business amounts are whole shillings.
//
// The currency stays the ISO code in both languages. "TSh" and the local "1,500/="
// notation are both plausible for Tanzania, but inventing regulatory or commercial
// detail is exactly what AGENTS.md section 6 forbids — it is logged for local review
// instead.
function money(amount) {
  const n = Math.round(Number(amount) || 0);
  const sign = n < 0 ? '-' : '';
  const grouped = Math.abs(n).toLocaleString(localeTag(), { maximumFractionDigits: 0 });
  return `${sign}${currency} ${grouped}`;
}

// Compact form for tight spaces (stat tiles, chart axes). Carries the currency, because
// a bare "150k" sitting next to a unit count is ambiguous.
function moneyShort(amount) {
  const n = Math.round(Number(amount) || 0);
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1000000) return `${sign}${currency} ${(abs / 1000000).toFixed(1)}M`;
  if (abs >= 1000) return `${sign}${currency} ${Math.round(abs / 1000)}k`;
  return `${sign}${currency} ${abs}`;
}

// Without the currency — for axes and anywhere the unit is already established.
function compact(amount) {
  const n = Math.round(Number(amount) || 0);
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1000000) return `${sign}${(abs / 1000000).toFixed(1)}M`;
  if (abs >= 1000) return `${sign}${Math.round(abs / 1000)}k`;
  return `${sign}${abs}`;
}

/** Always signed, for deltas where the direction is the point. */
function moneySigned(amount) {
  const n = Math.round(Number(amount) || 0);
  return n >= 0 ? `+${money(n)}` : money(n);
}

function count(n) {
  return Math.round(Number(n) || 0).toLocaleString(localeTag());
}

// Proportions read more reliably than percentages for this audience —
// docs/localization.md. Used for prediction accuracy.
//
// Built from a template rather than concatenated: "3 of 16" and "3 kati ya 16" do not
// share a word order, and docs/localization.md rule 2 forbids assembling sentences
// from fragments.
function proportion(part, whole) {
  const p = Math.round(Number(part) || 0);
  const w = Math.round(Number(whole) || 0);
  if (w <= 0) return '—';
  return t('profile.tally', { part: count(p), whole: count(w) });
}

function percent(fraction) {
  return `${Math.round((Number(fraction) || 0) * 100)}%`;
}

/** Long-form date for the printed record — "21 August 2026" / "21 Agosti 2026". */
function dateLong(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString(localeTag(), { year: 'numeric', month: 'long', day: 'numeric' });
}

  return { setCurrency, money, moneyShort, compact, moneySigned, count, proportion, percent, dateLong };
})();

/* ---- entrymodel ---- */
const NS_entrymodel = (function () {

// A separate, versioned introduction. Never label its observations as full-game evidence.
const RECORD_VERSION = 1;
const OPENING = { cash: 15000, stock: 0, debt: 0, receivable: 0, withdrawn: 0, trained: false };
function startRun(game) {
  return { schemaVersion: RECORD_VERSION, gameId: game.id, contentVersion: game.version,
    id: crypto.randomUUID(), startedAt: new Date().toISOString(), scenario: structuredClone(game),
    step: 0, phase: 'choice', state: { ...OPENING }, observations: [], note: '', trajectory: '' };
}
function steps(run) {
  return run.scenario.days.flatMap((day, dayIndex) => day.beats.map(beat => ({ ...beat, dayIndex })));
}
function currentBeat(run) {
  const beat = steps(run)[run.step];
  const state = run.phase === 'result' ? run.observations.at(-1).before : run.state;
  return beat?.creditVariant && state.receivable > 0 ? { ...beat, ...beat.creditVariant } : beat;
}
function transaction(state, option) {
  let { receipts = 0, payments = 0, stock = 0, debt = 0, receivable = 0, withdrawn = 0 } = option;
  if (option.dynamic === 'repay') { payments = state.debt; debt = -state.debt; }
  if (option.dynamic === 'handover') receipts = state.trained ? 4000 : 2400;
  const next = { ...state, cash: state.cash + receipts - payments,
    stock: state.stock + stock, debt: state.debt + debt,
    receivable: state.receivable + receivable, withdrawn: state.withdrawn + withdrawn };
  if (typeof option.trained === 'boolean') next.trained = option.trained;
  for (const key of ['cash', 'stock', 'debt', 'receivable', 'withdrawn']) {
    if (!Number.isSafeInteger(next[key]) || next[key] < 0) throw new Error('Invalid transaction: ' + key);
  }
  return { state: next, receipts, payments };
}
function choose(run, optionId) {
  if (run.phase !== 'choice') throw new Error('Decision already recorded');
  const beat = currentBeat(run);
  const option = beat.options?.find(o => o.id === optionId);
  if (!option) throw new Error('Unknown choice');
  const result = transaction(run.state, option);
  const observation = { kind: 'decision', beatId: beat.id, optionId, at: new Date().toISOString(),
    before: { ...run.state }, after: result.state, receipts: result.receipts, payments: result.payments,
    outcome: option.outcome };
  return { ...run, phase: 'result', state: result.state,
    trajectory: beat.id === 'path' ? optionId : run.trajectory,
    observations: [...run.observations, observation] };
}
function advance(run) {
  if (run.phase !== 'result') throw new Error('No result to advance');
  return { ...run, step: run.step + 1, phase: 'choice' };
}
function finish(run) {
  if (run.phase !== 'choice' || currentBeat(run)?.kind !== 'note') throw new Error('Incomplete attempt');
  return { ...run, phase: 'complete', completedAt: new Date().toISOString(),
    observations: [...run.observations, { kind: 'optional-plan', beatId: currentBeat(run).id,
      text: run.note, at: new Date().toISOString(), verification: 'not-verified' }] };
}
function validRun(run) {
  try {
    if (run.schemaVersion !== RECORD_VERSION || run.gameId !== 'asha-intro' || run.contentVersion !== 3 ||
      typeof run.id !== 'string' || typeof run.note !== 'string' || run.note.length > 1000 ||
      !['choice', 'result', 'complete'].includes(run.phase) || !Number.isInteger(run.step) ||
      run.step < 0 || run.step >= steps(run).length || !Array.isArray(run.observations)) return false;
    // Replay with the pinned content. Reject inconsistent saved balances or repeated decisions.
    let replay = { ...run, state: { ...OPENING }, step: 0, phase: 'choice', observations: [], trajectory: '' };
    for (const observation of run.observations) {
      if (observation.kind === 'optional-plan') {
        if (replay.phase === 'result') replay = advance(replay);
        if (observation.text !== run.note || observation.verification !== 'not-verified') return false;
        replay = finish(replay);
      } else {
        if (replay.phase === 'result') replay = advance(replay);
        if (currentBeat(replay)?.id !== observation.beatId) return false;
        replay = choose(replay, observation.optionId);
        const expected = replay.observations.at(-1);
        if (observation.receipts !== expected.receipts || observation.payments !== expected.payments ||
          !Object.keys(OPENING).every(key => observation.before?.[key] === expected.before[key] && observation.after?.[key] === expected.after[key])) return false;
      }
    }
    if (run.phase === 'choice' && replay.phase === 'result') replay = advance(replay);
    return replay.step === run.step && replay.phase === run.phase && replay.trajectory === run.trajectory &&
      Object.keys(OPENING).every(key => replay.state[key] === run.state[key]);
  } catch { return false; }
}

  return { startRun, steps, currentBeat, transaction, choose, advance, finish, validRun, RECORD_VERSION, OPENING };
})();

/* ---- entry ---- */
const NS_entry = (function () {
const { startRun, currentBeat, steps, transaction, choose, advance, finish, validRun } = NS_entrymodel;
const { loadStrings, setLanguage, localised, t, getLanguage } = NS_i18n;
const { setCurrency, money } = NS_format;



const KEY = 'business-simulator:asha-intro:v3';
const $ = id => document.getElementById(id);
let game, run, saved = true, blocked = false, rawSave = '', offline = false, conflict = false;
const practiceURL = location.protocol === 'file:' ? 'https://arnoroh.github.io/business_simulator/practice.html' : './practice.html';
const node = (tag, className, text) => {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
};
const text = value => localised(value).replace(/\{(\d+)\}/g, (_, n) => money(Number(n)));
function button(label, action, className = 'primary') {
  const el = node('button', className, label); el.type = 'button'; el.onclick = action; return el;
}
function download(value, name = 'MV-BS-INTRO-record.json') {
  const url = URL.createObjectURL(new Blob([typeof value === 'string' ? value : JSON.stringify(value, null, 2)], { type: 'application/json' }));
  const a = node('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function save() {
  if (blocked) return;
  try {
    if ((localStorage.getItem(KEY) || '') !== rawSave) { conflict = true; saved = false; status(); return; }
    const next = JSON.stringify(run);
    localStorage.setItem(KEY, next); rawSave = next; saved = true;
  }
  catch { saved = false; }
  status();
}
function status() {
  $('save-status').textContent = t(conflict ? 'conflict' : saved ? 'saved' : 'failed');
  $('retry').hidden = saved || blocked || conflict; $('retry').textContent = t('retry');
  $('offline-status').textContent = t(offline ? 'offline' : 'online');
}
function commit(option) {
  run = choose(run, option.id); save(); render(true);
}
function restart() {
  if (!confirm(t('confirm'))) return;
  // Preserve old bytes even when replacing a save we cannot understand.
  if (blocked) {
    try { localStorage.setItem(KEY + ':unreadable', rawSave); }
    catch { download(rawSave, 'MV-BS-INTRO-unreadable.json'); return; }
  }
  blocked = false; conflict = false; run = startRun(game); save(); render(true);
}
function row(list, label, amount) {
  const line = node('div', 'money-row'); line.append(node('dt', '', label), node('dd', '', money(amount))); list.append(line);
}
function accounts(parent, observation) {
  const details = node('details', 'accounts'); details.append(node('summary', '', t('accounts')));
  const list = node('dl');
  if (observation) {
    row(list, t('in'), observation.receipts); row(list, t('out'), observation.payments);
  }
  for (const key of ['cash', 'stock', 'receivable', 'debt']) row(list, t(key), run.state[key]);
  row(list, t('net'), run.state.cash + run.state.stock + run.state.receivable - run.state.debt);
  details.append(list); parent.append(details);
  if (run.state.cash < run.scenario.nextBatchCost) parent.append(node('p', 'body cash-warning', text(run.scenario.ui.cashWarning)));
}
function chrome() {
  document.title = text(game.title);
  $('brand-name').textContent = text(game.title); $('brand-sub').textContent = t('subtitle');
  $('sample').textContent = t('sample'); $('practice').textContent = t(location.protocol === 'file:' ? 'fullOnline' : 'practice');
  $('practice').href = practiceURL;
  $('offline-file').textContent = t('offlineFile');
  $('offline-file').hidden = location.protocol === 'file:';
  $('old-download').textContent = t('raw');
  $('download').textContent = t('download'); $('lang-btn').textContent = getLanguage() === 'en' ? 'Kiswahili' : 'English';
  $('lang-btn').lang = getLanguage() === 'en' ? 'sw' : 'en';
  const day = currentBeat(run)?.dayIndex ?? 4;
  $('progress').replaceChildren();
  run.scenario.days.forEach((d, i) => {
    const item = node('div', 'progress-day'); const dot = node('div', 'dot');
    const fill = node('div', 'dot-fill');
    const daySteps = steps(run).filter(b => b.dayIndex === i);
    const done = run.observations.filter(o => daySteps.some(b => b.id === o.beatId)).length;
    fill.style.width = `${done / daySteps.length * 100}%`; dot.append(fill);
    item.append(dot, node('span', 'dot-label', String(i + 1)));
    if (day === i) item.setAttribute('aria-current', 'step');
    $('progress').append(item);
  });
  $('progress').setAttribute('aria-label', t('day', { n: day + 1 }));
  renderScene(day);
  const hud = $('hud'); hud.replaceChildren();
  hud.append(node('div', 'hud-pill cash', `${t('cash')}: ${money(run.state.cash)}`));
  if (run.state.debt) hud.append(node('div', 'hud-pill', `${t('debt')}: ${money(run.state.debt)}`));
  status();
}
function render(focus = false) {
  chrome();
  const card = $('card'); card.replaceChildren(); $('mini').replaceChildren();
  if (blocked) {
    card.append(node('p', 'body', t('invalid')), button(t('raw'), () => download(rawSave)), button(t('replay'), restart, 'ghost'));
    $('save-status').textContent = t('invalid'); return;
  }
  if (run.phase === 'complete') {
    card.append(node('h1', 'title', t('done')), node('p', 'body', t('limit')));
    if (run.note) card.append(node('h2', 'mini-title', t('endnote')), node('p', 'body', run.note));
    card.append(node('p', 'body', t(run.trajectory === 'organisation' ? 'learn' : 'steady')));
    const link = node('a', 'primary', t(location.protocol === 'file:' ? 'fullOnline' : 'practice')); link.href = practiceURL; card.append(link);
    accounts(card); card.append(button(t('replay'), restart, 'ghost'));
  } else {
    const beat = currentBeat(run);
    card.append(node('p', 'kicker', `${t('day', { n: beat.dayIndex + 1 })} · ${text(run.scenario.days[beat.dayIndex].label)}`));
    if (run.phase === 'result') {
      const observation = run.observations.at(-1);
      const option = beat.options.find(o => o.id === observation.optionId);
      // Keep the explanation that was shown when the learner made the choice.
      card.append(node('h1', 'title', text(option?.label || beat.title)), node('p', 'body', text(observation.outcome)));
      const delta = observation.after.cash - observation.before.cash;
      card.append(node('p', 'cash-change pulse', `${t('change')}: ${delta > 0 ? '+' : ''}${money(delta)}`));
      const ledger = node('dl'); row(ledger, t('in'), observation.receipts); row(ledger, t('out'), observation.payments); card.append(ledger);
      card.append(button(t('next'), () => { run = advance(run); save(); render(true); }));
      accounts(card, observation);
    } else {
      card.append(node('h1', 'title', text(beat.title)), node('p', 'body', text(beat.body)));
      if (beat.kind === 'note') {
        const label = node('label', '', t('note')); label.htmlFor = 'note';
        const input = node('textarea'); input.id = 'note'; input.rows = 3; input.maxLength = 1000; input.value = run.note;
        input.oninput = () => { run.note = input.value; save(); };
        card.append(label, input, button(t('finish'), () => { run = finish(run); save(); render(true); }));
      } else {
        const choices = node('div', 'choices');
        for (const option of beat.options) {
          const choice = button(text(option.label), () => commit(option), 'choice');
          choice.dataset.option = option.id;
          try { transaction(run.state, option); }
          catch { choice.disabled = true; choice.append(node('span', '', t('unavailable'))); }
          choices.append(choice);
        }
        card.append(choices);
      }
      accounts(card);
    }
  }
  if (focus) { card.focus({ preventScroll: true }); card.scrollIntoView({ block: 'start', behavior: 'instant' }); }
}

function renderScene(dayIdx){
  const day = dayIdx+1;
  const time = ['dawn','morning','noon','afternoon','sunset'][Math.min(4,dayIdx)];
  const colors = {dawn:'#ffe9c2', morning:'#fff6ea', noon:'#fff', afternoon:'#fff6ea', sunset:'#ffd9a0'};
  const sky = colors[time];
  const stallColor = day>3 ? '#ff7a18' : '#0f766e';
  const crowd = 3;
  const svg = `
  <svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img">
    <rect width="400" height="260" rx="22" fill="${sky}"/>
    <circle cx="340" cy="40" r="18" fill="#facc15" opacity=".9"/>
    <g opacity=".15">
      <ellipse cx="70" cy="48" rx="30" ry="12" fill="#fff"/>
      <ellipse cx="120" cy="38" rx="24" ry="9" fill="#fff"/>
    </g>
    <!-- stall -->
    <rect x="90" y="120" width="220" height="90" rx="14" fill="#fff" stroke="#f0ddbd" stroke-width="2"/>
    <rect x="80" y="110" width="240" height="22" rx="8" fill="${stallColor}"/>
    <rect x="90" y="132" width="220" height="6" rx="3" fill="#1a140e" opacity=".08"/>
    <!-- mandazi stacks -->
    <g>
      <ellipse cx="150" cy="175" rx="28" ry="10" fill="#fde9c7"/>
      <circle cx="140" cy="168" r="10" fill="#facc15" stroke="#e6a20a" stroke-width="1.5"/>
      <circle cx="158" cy="165" r="11" fill="#fdba74" stroke="#d97706" stroke-width="1.5"/>
      <circle cx="150" cy="154" r="9" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
    </g>
    <g>
      <ellipse cx="250" cy="175" rx="28" ry="10" fill="#fde9c7"/>
      <circle cx="240" cy="168" r="10" fill="#facc15" stroke="#e6a20a" stroke-width="1.5"/>
      <circle cx="260" cy="165" r="11" fill="#fdba74" stroke="#d97706" stroke-width="1.5"/>
    </g>
    <!-- Asha -->
    <g>
      <circle cx="200" cy="108" r="16" fill="#a67c52"/>
      <path d="M186 122 Q200 132 214 122 L210 105 L190 105 Z" fill="${stallColor}"/>
      <circle cx="194" cy="107" r="1.5" fill="#1a140e"/><circle cx="206" cy="107" r="1.5" fill="#1a140e"/>
      <path d="M196 114 Q200 118 204 114" stroke="#1a140e" fill="none" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <!-- customers -->
    <g>
      ${Array.from({length:crowd},(_,i)=>{
        const x = 30 + i*52 + (i%2?6:0);
        const y = 210 - (i%3?0:8);
        return `<g>
          <circle cx="${x}" cy="${y-12}" r="9" fill="#c9a88a"/>
          <rect x="${x-10}" y="${y}" width="20" height="14" rx="6" fill="#fff6ea" stroke="#f0ddbd"/>
          <circle cx="${x-2}" cy="${y-14}" r="1.2" fill="#1a140e"/><circle cx="${x+4}" cy="${y-14}" r="1.2" fill="#1a140e"/>
        </g>`;
      }).join('')}
    </g>
    <!-- cash tin -->
    <g>
      <rect x="310" y="160" width="36" height="28" rx="6" fill="#1a140e"/>
      <rect x="314" y="164" width="28" height="4" rx="2" fill="#facc15" opacity=".9"/>

    </g>
  </svg>`;
  $('scene').innerHTML = svg;
}

async function init() {
  const response = await fetch('./content/game.json');
  if (!response.ok) throw new Error('Content unavailable');
  game = await response.json();
  loadStrings(game.ui);
  try { setLanguage(localStorage.getItem('asha-language') || 'en'); } catch { setLanguage('en'); }
  run = startRun(game);
  let previous = '';
  try {
    rawSave = localStorage.getItem(KEY) || '';
    if (rawSave) {
      const parsed = JSON.parse(rawSave);
      if (validRun(parsed)) run = parsed;
      else blocked = true;
    }
    previous = localStorage.getItem('asha-stall-v2') || '';
  } catch { if (rawSave) blocked = true; else saved = false; }
  setCurrency(run.scenario.currency);
  loadStrings(run.scenario.ui);
  $('lang-btn').onclick = () => {
    setLanguage(getLanguage() === 'en' ? 'sw' : 'en');
    try { localStorage.setItem('asha-language', getLanguage()); } catch { /* Language still works without storage. */ }
    render();
  };
  $('download').onclick = () => download(blocked ? rawSave : run);
  $('retry').onclick = save;
  const isNew = !rawSave;
  if (!blocked) save();
  render();
  if (previous) {
    $('old-download').hidden = false;
    $('old-download').onclick = () => download(previous, 'MV-BS-INTRO-previous.json');
    if (isNew) $('mini').append(node('p', 'body', t('previous')));
  }
  if (location.protocol === 'file:') { offline = true; status(); }
  else if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(async () => {
      // The old worker can remain active during an update. Check the cached entry assets.
      const cacheNames = await caches.keys();
      offline = (await Promise.all(cacheNames.map(async name => {
        const cache = await caches.open(name);
        return Boolean(await cache.match('./js/entry.js') && await cache.match('./content/game.json'));
      }))).some(Boolean);
      status();
    }).catch(() => { offline = false; status(); });
  }
}
init().catch(() => {
  $('card').replaceChildren(node('p', 'body', 'Could not open the game. Reconnect and reload. / Mchezo haujafunguka. Unganisha intaneti na ujaribu tena.'),
    button('Reload / Fungua tena', () => location.reload()));
});

  return {  };
})();
})();
