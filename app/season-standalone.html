<title>Business Simulator</title>
<script>
(function () {
  if (!document.querySelector('meta[name="viewport"]')) {
    var m = document.createElement('meta');
    m.name = 'viewport';
    m.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
    document.head.appendChild(m);
  }
})();
</script>
<style>
/* The mandazi stall: one warm, chunky game style. Panels are cream with a dark outline
   and a solid shadow; buttons press down; the street scene carries the colour. */
:root {
  --ink: #2b1a0e; --muted: #6b5443; --paper: #fdf0d8; --card: #fffaf0; --line: #ecd3ab; --ol: #3b2415;
  --teal: #0f766e; --teal-dark: #115e59; --green: #059669; --green-dark: #065f46; --orange: #ea580c;
  --gold: #fbbf24; --red: #c81e1e; --sky: #7dd3fc;
  font: 600 17px/1.4 ui-rounded, "Nunito", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: var(--paper) radial-gradient(circle at 1px 1px, #f3dcb4 1.5px, transparent 0) 0 0 / 22px 22px;
}
* { box-sizing: border-box; }
body { margin: 0; }
.app { max-width: 560px; margin: 0 auto; padding: 0 0 104px; }
h1, h2, h3, h4 { line-height: 1.2; margin: .2em 0 .4em; font-weight: 900; }
h1 { font-size: 1.15rem; } h2 { font-size: 1.12rem; } h3 { font-size: 1.02rem; } h4 { font-size: .95rem; margin-top: .8em; }
p { margin: .35em 0; }
.small { font-size: .86rem; color: var(--muted); font-weight: 600; }
.warn { color: var(--red); font-weight: 800; }
[hidden] { display: none !important; }

/* Header: a slim bar above the street. */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 8px; padding: 8px 12px; background: var(--teal-dark); color: #fff; }
.top > div:first-child { flex: 1 1 140px; }
.top { padding: 6px 10px; }
.top h1 { margin: 0; letter-spacing: .01em; }
.top p { margin: 0; font-size: .78rem; font-weight: 600; opacity: .85; }
.top-controls { display: flex; gap: 6px; }
.top-controls #guide-open { width: 40px; padding: 0; border-radius: 50%; font-size: 1.1rem; background: var(--gold); color: var(--ink); border: 2px solid var(--ol); text-decoration: none; }
.top-controls button { min-height: 40px; font-size: .8rem; padding: 4px 10px; border-width: 2px; box-shadow: 0 3px 0 rgb(0 0 0 / .25); }
.top .link { color: #fff; }

/* The street scene, with the money counters floating over the sky. */
.stage { position: relative; }
.scene-wrap { position: relative; }
.scene { background: var(--sky); border-bottom: 3px solid var(--ol); overflow: hidden; contain: paint; }
.scene svg { display: block; width: 100%; height: auto; overflow: hidden; }
.strip { position: absolute; top: 6px; left: 6px; right: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; pointer-events: none; }
.pill { display: flex; align-items: center; gap: 5px; min-width: 0; padding: 3px 8px 3px 4px; background: #fffaf0f0; border: 2px solid var(--ol); border-radius: 14px; box-shadow: 0 3px 0 rgb(59 36 21 / .35); }
.pill > span { min-width: 0; }
.pill-icon { flex: 0 0 22px; width: 22px; height: 22px; padding: 3px; border-radius: 50%; background: var(--teal); fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.pill.cash .pill-icon { background: var(--gold); stroke: #7c4a03; }
.strip .label { display: block; font-size: .64rem; font-weight: 800; color: var(--muted); line-height: 1.1; }
.strip strong { display: block; white-space: nowrap; font-size: .98rem; font-weight: 900; line-height: 1.15; overflow-wrap: anywhere; }
.pill.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.12); } }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 6px 10px 0; font-size: .72rem; font-weight: 800; }
.meta span:not(:empty) { background: #fff; border: 2px solid var(--ol); border-radius: 10px; padding: 1px 8px; }
.meta #due:not(:empty) { background: #fee2e2; color: var(--red); }
.tall-summary .strip { position: static; padding: 6px; background: var(--teal-dark); grid-template-columns: minmax(0, 1fr); }
.strip .label { overflow-wrap: anywhere; }
.skip { position: absolute; right: 8px; bottom: 8px; min-height: 40px; padding: 4px 16px; border-radius: 20px; border: 2px solid #fff; background: rgb(43 26 14 / .85); color: #fff; font: inherit; font-weight: 800; }

/* The round stall buttons: the menu for the five management panels. */
.spots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; margin: -12px 6px 0; position: relative; z-index: 1; }
.scene.playing ~ .spots, .stage:has(.scene.playing) .spots { visibility: hidden; }
.spot { min-height: 0; padding: 0; border: 0; background: none; display: grid; justify-items: center; gap: 1px; color: var(--ink); cursor: pointer; }
.spot .badge { position: relative; width: 48px; height: 48px; border-radius: 50%; background: #fff; border: 3px solid var(--ol); display: grid; place-items: center; box-shadow: 0 4px 0 var(--ol); transition: transform .1s; }
.spot:active .badge { transform: translateY(3px); box-shadow: 0 1px 0 var(--ol); }
.spot .badge svg { width: 26px; height: 26px; fill: none; stroke: var(--teal-dark); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.spot .count { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--red); color: #fff; font-size: .72rem; line-height: 20px; border: 2px solid #fff; }
.spot-label { font-size: .7rem; font-weight: 900; line-height: 1.1; text-align: center; overflow-wrap: anywhere; max-width: 100%; }
.spot.limit .badge { border-color: var(--orange); background: #ffedd5; animation: pulse 1.2s ease-in-out 4; }
.spot:focus-visible { outline: none; } .spot:focus-visible .badge { outline: 3px solid var(--orange); outline-offset: 3px; }
@keyframes pulse { 50% { transform: scale(1.14); } }

/* Cards are game panels. */
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 14px 10px 0; }
.card { background: var(--card); border: 3px solid var(--ol); border-radius: 18px; padding: 12px 14px; box-shadow: 0 5px 0 rgb(59 36 21 / .3); }
.card:focus { outline: 3px solid var(--orange); outline-offset: 2px; }
.result, .outcome, .event, .why { animation: rise .35s cubic-bezier(.2, 1.4, .5, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.kicker { text-transform: uppercase; letter-spacing: .05em; font-size: .72rem; font-weight: 900; color: var(--orange); margin: 0; }
.goal-line { margin: 0; font-weight: 900; color: var(--teal-dark); }
.limit-note { border-color: var(--orange); background: #fff7ed; }
.limit-note p { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.debtor { border-top: 2px dashed var(--line); padding-top: 6px; margin-top: 6px; }
.chip { justify-self: start; min-height: 40px; padding: 4px 14px; border-radius: 20px; font-size: .88rem; }

/* Buttons press down like game keys. */
button, .links a { font: inherit; min-height: 48px; border-radius: 14px; padding: 8px 14px; cursor: pointer; transition: transform .08s; }
button:active:not(:disabled) { transform: translateY(3px); }
.primary { background: linear-gradient(#10b981, var(--green)); color: #fff; border: 3px solid var(--ol); font-weight: 900; width: 100%; box-shadow: 0 4px 0 var(--green-dark); text-shadow: 0 1px 0 rgb(0 0 0 / .3); }
.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--green-dark); }
.secondary { background: #fff; color: var(--teal-dark); border: 3px solid var(--ol); font-weight: 800; box-shadow: 0 4px 0 rgb(59 36 21 / .35); }
.secondary:active:not(:disabled) { box-shadow: 0 1px 0 rgb(59 36 21 / .35); }
.danger { background: var(--red); color: #fff; border: 3px solid var(--ol); box-shadow: 0 4px 0 #7f1d1d; }
.link { background: none; border: 0; color: var(--teal-dark); text-decoration: underline; padding-left: 0; box-shadow: none; }
.choice { text-align: left; background: #fff; border: 3px solid var(--ol); color: var(--ink); font-weight: 800; display: grid; gap: 2px; box-shadow: 0 4px 0 var(--teal); }
.choice:hover:not(:disabled) { background: #f0fdfa; }
.choice small { color: var(--red); font-weight: 700; }
button:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
button:focus-visible, a:focus-visible, input:focus-visible + span, summary:focus-visible, select:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.options, .goals { display: grid; gap: 10px; margin-top: 10px; }
.goal { text-align: left; background: #fff; border: 3px solid var(--line); color: var(--ink); display: grid; gap: 2px; }
.goal.chosen { border-color: var(--teal); background: #f0fdfa; box-shadow: 0 4px 0 var(--teal); }
.goal em { color: var(--teal-dark); font-style: normal; font-weight: 900; }

/* The fixed game bar: the one main action. */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; gap: 8px; max-width: 560px; margin: 0 auto; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--paper) 30%); }
.bar:empty { display: none; }
.bar .go { flex: 1; min-height: 58px; font-size: 1.12rem; border-radius: 18px; }
.bar .fast { flex: 0 0 58px; min-height: 58px; padding: 0; border-radius: 18px; display: grid; place-items: center; }
.bar .fast svg { width: 26px; height: 26px; fill: var(--teal-dark); }
.tall-summary .bar { position: static; background: none; }

/* Daily plan: batch and price. */
.daily-plan h2 { margin-top: 0; }
.stepper { margin: 6px 0; }
.stepper label { display: block; font-weight: 900; }
.stepper > div { display: flex; gap: 8px; align-items: stretch; }
.stepper button { flex-shrink: 0; min-width: 52px; font-size: 1.5rem; line-height: 1; border-radius: 50%; width: 52px; height: 52px; padding: 0; }
.stepper input { min-width: 0; flex: 1; min-height: 52px; font: inherit; font-size: 1.35rem; font-weight: 900; text-align: center; border: 3px solid var(--ol); border-radius: 14px; background: #fff; color: var(--ink); }
.seg { min-width: 0; border: 0; padding: 0; margin: 10px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.seg legend { max-width: 100%; overflow-wrap: anywhere; font-weight: 900; margin-bottom: 4px; padding: 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.seg span { display: flex; align-items: center; min-height: 48px; padding: 6px 12px; border: 3px solid var(--line); border-radius: 14px; background: #fff; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.seg input:checked + span { border-color: var(--ol); background: var(--gold); color: var(--ink); font-weight: 900; box-shadow: 0 3px 0 var(--ol); }
.daily-plan .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.daily-plan .seg legend { grid-column: 1 / -1; }
.daily-plan .seg span { justify-content: center; padding: 6px 2px; font-size: .95rem; }
.run { display: grid; gap: 6px; }
.plan-summary { font-weight: 800; }

.rows { margin: 6px 0; }
.rows div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; border-bottom: 2px dotted var(--line); padding: 4px 0; }
.rows dt { color: var(--muted); font-weight: 700; } .rows dd { margin: 0; font-weight: 900; text-align: right; }
.rows dt, .rows dd { overflow-wrap: anywhere; max-width: 100%; }
details { margin: 6px 0; }
summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 900; color: var(--teal-dark); }
button, summary, .links a { overflow-wrap: anywhere; max-width: 100%; }

/* Events: the character speaks. */
.event { border-color: var(--orange); box-shadow: 0 5px 0 #c2410c80; }
.event-head { display: flex; gap: 10px; align-items: flex-end; margin-top: 6px; }
.portrait { flex: 0 0 76px; }
.portrait svg { display: block; width: 76px; height: 80px; border-radius: 16px; background: linear-gradient(#bae6fd, #fef3c7); border: 3px solid var(--ol); }
.bubble { position: relative; flex: 1; min-width: 0; background: #fff; border: 3px solid var(--ol); border-radius: 16px 16px 16px 4px; padding: 8px 12px; }
.bubble::before { content: ""; position: absolute; left: -12px; bottom: 8px; border: 7px solid transparent; border-right: 9px solid var(--ol); }
.bubble h2 { font-size: 1.02rem; margin: 0 0 .2em; }
.bubble p { margin: 0; font-weight: 600; font-size: .95rem; }
.needs { background: #fff7ed; border: 2px dashed #fdba74; border-radius: 12px; padding: 8px 10px; margin: 10px 0; }
.needs ul { margin: 0; padding-left: 1.1em; }
.outcome { border-color: var(--teal); }

/* Week result: ribbon, three big tiles, then the money. */
.ribbon { position: relative; margin: -2px -4px 10px; padding: 6px 12px; background: var(--orange); color: #fff; border: 3px solid var(--ol); border-radius: 12px; text-align: center; text-shadow: 0 2px 0 rgb(0 0 0 / .25); box-shadow: 0 4px 0 #9a3412; }
.tiles { list-style: none; padding: 0; margin: 0 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 4.5em), 1fr)); gap: 8px; }
.tiles li { display: grid; justify-items: center; gap: 0; padding: 8px 4px; background: #fff; border: 3px solid var(--ol); border-radius: 14px; text-align: center; animation: pop .45s cubic-bezier(.2, 1.6, .5, 1) both; }
.tiles li:nth-child(2) { animation-delay: .1s; } .tiles li:nth-child(3) { animation-delay: .2s; }
.tiles strong { overflow-wrap: anywhere; font-size: 1.5rem; font-weight: 900; line-height: 1.1; }
.tiles span:last-child { font-size: .7rem; font-weight: 800; color: var(--muted); line-height: 1.15; overflow-wrap: break-word; hyphens: auto; }
.tiles .coin { background: #ecfdf5; } .tiles .bin { background: #fef3c7; } .tiles .leave { background: #fee2e2; }
.tiles .icon svg { width: 26px; height: 26px; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } }
.receipt { margin: 10px 0; overflow-wrap: anywhere; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 0 10px; }
.receipt > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; padding: 8px 0; }
.receipt dd { display: contents; } .receipt dd .small { grid-column: 1 / -1; margin: 0; }
.receipt > div + div { border-top: 2px dotted var(--line); }
.receipt dt { display: flex; gap: 6px; align-items: flex-start; font-weight: 900; }
.receipt strong { font-size: 1.1rem; font-weight: 900; text-align: right; }
.receipt .small { font-size: .8rem; }
.result .tin { font-size: 1.1rem; font-weight: 900; }
.result .compare { font-weight: 800; color: var(--teal-dark); }
.recap .compare { font-size: .95rem; }
.recap details .result { padding: 0; border: 0; box-shadow: none; background: none; }
.recap > button { width: 100%; margin-top: 12px; }
.notes, .weeks { padding-left: 1.1em; margin: .4em 0; font-weight: 600; }
.notes li.pic { list-style: none; display: flex; gap: 8px; align-items: flex-start; margin: 6px 0 6px -1.1em; }
.icon svg { display: block; width: 22px; height: 22px; fill: none; stroke: var(--teal-dark); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.notes .icon { flex: 0 0 22px; }
.receipt dt .icon svg { width: 20px; height: 20px; }
.trading-picture { margin: 10px 0; }
.split-bar { display: flex; height: 14px; overflow: hidden; border-radius: 7px; background: #eee; margin: 4px 0; border: 2px solid var(--ol); }
.split-bar .sold, .split-bar .paid { background: var(--green); }
.split-bar .waste { background: #92400e; }
.split-bar .rejected { background: var(--red); }
.split-bar .credit { background: repeating-linear-gradient(135deg, #b45309 0 4px, #fcd34d 4px 8px); }
.bar-key { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: .8rem; }
.bar-key .sold, .bar-key .paid { color: var(--green-dark); }
.bar-key .waste, .bar-key .credit { color: #92400e; }
.bar-key .rejected { color: var(--red); }

/* Why: a question, then the reasons from the saved week as a short conversation. */
.why { border-top: 3px dashed var(--line); margin-top: 12px; padding-top: 10px; }
.why:focus { outline: 3px solid var(--orange); }
.why h3 { font-size: 1rem; }
.why .answer, .why .pick { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.why .pick { color: var(--red); } .why .pick.matched { color: var(--green-dark); }
.why .pick .icon svg { stroke: currentColor; }
.chain { list-style: none; padding: 0; margin: 6px 0; display: grid; gap: 8px; counter-reset: step; }
.chain li { position: relative; background: #fff; border: 2px solid var(--ol); border-radius: 14px 14px 14px 4px; padding: 6px 10px 6px 34px; font-size: .92rem; font-weight: 600; counter-increment: step; animation: pop .35s ease both; }
.chain li:nth-child(2) { animation-delay: .15s; } .chain li:nth-child(3) { animation-delay: .3s; }
.chain li::before { content: counter(step); position: absolute; left: 7px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--orange); color: #fff; font-size: .75rem; font-weight: 900; text-align: center; line-height: 20px; }

/* Review. */
.review { border-color: var(--teal); }

/* Footer. */
.foot { margin: 22px 10px 0; border-top: 3px dashed var(--line); padding-top: 10px; display: grid; gap: 6px; }
.foot h2 { font-size: 1rem; margin-top: 8px; }
#saved.ok { color: var(--teal-dark); } #saved.warn { color: var(--red); font-weight: 900; }
.runs { list-style: none; padding: 0; display: grid; gap: 6px; }
.runs li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { display: inline-flex; align-items: center; border: 3px solid var(--ol); color: var(--teal-dark); background: #fff; text-decoration: none; font-weight: 800; }
.links a[hidden] { display: none; }
.history-open { width: 100%; margin-top: 6px; font-size: .9rem; }
.calendar { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(1.25rem, 1fr)); gap: 3px; padding: 0; margin: 8px 0; }
.calendar li { position: relative; height: 24px; border-radius: 6px; background: #efe2cf; font-size: .62rem; text-align: center; line-height: 24px; color: var(--muted); }
.calendar li.past { background: #bbf7d0; }
.calendar li.now { background: var(--teal); color: #fff; font-weight: 900; }
.calendar li.close { border-bottom: 3px solid var(--muted); }
.calendar li.pay::after, .calendar li.away::after, .calendar li.invoice::after { content: ""; position: absolute; top: -3px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; }
.calendar li.pay::after { background: var(--red); } .calendar li.away::after { background: #7c3aed; }
.calendar li.invoice::after { background: var(--gold); border: 1px solid #a16207; }

/* Dialogs: guide, panels and history share the panel look. */
dialog { width: min(560px, calc(100% - 16px)); max-width: calc(100% - 16px); max-height: calc(100% - 24px); padding: 12px 14px; border: 3px solid var(--ol); border-radius: 20px; color: var(--ink); background: var(--card); overflow-wrap: anywhere; box-shadow: 0 6px 0 rgb(59 36 21 / .35); }
dialog::backdrop { background: rgb(43 26 14 / .6); }
.history-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; position: sticky; top: -12px; background: var(--card); padding: 8px 0; z-index: 1; }
.history-head h2 { flex: 1 1 130px; }
.history-head button { font-size: .88rem; }
.sheet { margin: auto auto 0; width: min(560px, 100%); max-width: 100%; border-radius: 22px 22px 0 0; border-bottom: 0; animation: sheet .3s cubic-bezier(.2, 1.3, .5, 1); }
.sheet::backdrop { background: rgb(43 26 14 / .25); }
#sheet-title { display: flex; align-items: center; gap: 8px; }
#sheet-title .icon svg { width: 30px; height: 30px; padding: 4px; border-radius: 50%; border: 2px solid var(--ol); background: #fff; }
@keyframes sheet { from { transform: translateY(50%); opacity: 0; } }
.guide-steps { padding-left: 1.5rem; }
.guide-steps li { margin: .65rem 0; padding-left: .25rem; }
.guide-steps li::marker { color: var(--orange); font-weight: 900; }
.guide-steps p { font-size: .9rem; font-weight: 600; }
#guide-close { width: 100%; margin-top: 12px; position: sticky; bottom: 0; }
.history-chart { margin: 12px 0; }
.history-chart svg { display: block; width: 100%; }
.history-chart polyline { fill: none; stroke-width: 2.5; }
.history-chart circle { fill: var(--paper); stroke-width: 2; }
.history-chart .sales { stroke: #b45309; }
.history-chart .profit { stroke: #7c3aed; stroke-dasharray: 2 3; }
.history-chart .cashEnd { stroke: var(--teal); stroke-dasharray: 8 3; }
.history-chart .zero, .history-chart .selected-week { stroke: #9a8977; }
.history-chart .selected-week { stroke-dasharray: 2 3; }
.chart-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; }
.chart-key span::before { content: ''; display: inline-block; width: 20px; border-top: 3px solid; margin-right: 4px; vertical-align: middle; }
.chart-key .sales { color: #b45309; } .chart-key .profit { color: #7c3aed; } .chart-key .profit::before { border-top-style: dotted; }
.chart-key .cashEnd { color: var(--teal-dark); } .chart-key .cashEnd::before { border-top-style: dashed; }
.history-controls { display: flex; align-items: end; gap: 8px; }
.history-controls > div { flex: 1; min-width: 0; }
.history-controls label { display: block; }
.history-controls select { width: 100%; min-height: 48px; font: inherit; border: 3px solid var(--ol); border-radius: 12px; color: var(--ink); background: white; }
.history-controls button { flex: 0 0 48px; padding: 8px 2px; }
#next-step { scroll-margin-top: 12px; scroll-margin-bottom: 100px; }

/* ---- Scene art and motion ---------------------------------------------------- */
.scene .brand { fill: #fde68a; font: 900 12px ui-rounded, system-ui, sans-serif; letter-spacing: .12em; text-anchor: middle; }
.scene .price text { fill: #fff; font: 900 9px ui-rounded, system-ui, sans-serif; text-anchor: middle; }
.scene .tag rect { fill: var(--red); stroke: var(--ol); } .scene .tag text { fill: #fff; font: 900 8px system-ui; text-anchor: middle; }

@keyframes fall { from { transform: translateY(-20px); opacity: 0; } 30% { opacity: .8; } to { transform: translateY(60px); opacity: 0; } }

.scene .mz.new { animation-delay: calc(var(--n, 0) * .05s); }

.playing #fx .give { animation-name: give; animation-delay: calc(var(--d) * 1.1s + var(--i, 0) * .14s); animation-duration: .6s; }
.playing #fx .invoice { animation-name: invoice; animation-delay: calc(var(--d) * 1.1s + .4s); animation-duration: .7s; }
.playing #fx .leave { animation-name: leave; animation-delay: calc(var(--d) * 1.1s + .5s); animation-duration: .6s; }
.playing #fx .soldout { animation-name: stamp; animation-delay: calc(var(--d) * 1.1s + .45s); animation-duration: .65s; }
.playing #fx .waste { animation-name: waste; animation-delay: calc(var(--d) * 1.1s + .7s); animation-duration: .4s; }
.playing #fx .daypill { animation-name: daypill; }
.playing #fx .arrive { animation-name: arrive; animation-duration: .7s; }

// Nothing here touches the DOM, storage or the clock, so Node tests run it directly.
//
//   createSeason({ seed }) -> state          week 1, ready plan, nothing to set up
//   step(state, action) -> { state, result }  the only transition; throws Error(code) if not allowed
//   replay(seed, actions) -> state            re-applies a recorded action list
//   can(state, action) -> boolean
//   quiet(state) -> boolean                   next week is routine: no event, close or shortage
//   needs(state, pieces) -> order card        cooking, cash and hours an order needs, from this state
//   capacity(state) -> trays per day and what limits them
//   limit(result) -> the stage that limited a finished week, or ''
//   balance(state) -> accounting identity (assets - liabilities === opening + profit - drawings)
//   facts(state) -> season facts; never a score or a rank
//
// Actions: { type: 'plan', patch: { trays, price, pay, buyWeeks, household, check } }
//   { type: 'run' } { type: 'answer', option } { type: 'buyPot' } { type: 'sellPot' }
//   { type: 'trainHelper' } { type: 'endHelper' }
//   { type: 'borrow' } { type: 'repay' } { type: 'chase', who } { type: 'credit', who, on }
//   { type: 'notebook', on } { type: 'help' } { type: 'goal', goal } { type: 'review' } { type: 'close' }
// Phases: 'plan' (board), 'event' (state.pending names it), 'review' (month close), 'closed'.
//
// Accounting rules: cash and credit sales are revenue when delivered; collection moves a
// receivable into cash and is never new profit. Packs are stock (an asset, first in first
// out) until cooked. Borrowing adds equal cash and debt; interest is a cost, principal is
// not. Household money and dated household payments are drawings, not costs. Equipment
// is an asset depreciated weekly. Nothing is bought with cash the tin does not hold; an
// unpaid wage, fee or instalment becomes a dated debt instead.
//
// All figures are SAMPLES for review, not verified local prices (AGENTS.md section 6).
const CALC_VERSION = 1;
const WEEKS = 24;
const SAMPLE = {
  cash: 15000, household: 1500, pack: 300, bulkOff: 15, rise: 75, pieces: 10, smallPieces: 12,
  price: { low: 40, normal: 50, high: 60 }, demand: { low: 125, normal: 100, high: 75 }, stallDemand: 55,
  fee: 1200, days: 6, ownerHours: 72, stallHours: 30, trayHours: 3, notebookHours: 2,
  checkHours: { none: 0, batch: 2, every: 6 }, rejects: { none: 10, batch: 2, every: 0 },
  pot: { cost: 6000, trays: 5, dep: 250, resale: 3000, max: 3 }, flask: { cost: 5000, dep: 200 },
  office: { hours: 6, trialCost: 1000, chai: 60, chaiCost: 25, pieces: 2, invited: 20 },
  school: { full: 60, small: 30, price: 45, better: 50, term: 4, hours: 12, inspection: 3000, pay: 85 },
  kiosk: { pieces: 30, price: 42, hours: 3, pay: 90 },
  neighbours: { neema: 85, baraka: 55, zawadi: 75 }, neighbourPieces: 5,
  supplier: { limit: 6000, term: 2 }, wage: 3000, helperHours: 48, training: 1000, helperTrial: 500,
  loan: { amount: 10000, principal: 1000, interest: 100 }, payments: [[8, 9000], [20, 9000]], lateFee: 500,
  awayWeek: 17, riseWeek: 18,
};
const P = SAMPLE;
const STEPS = ['low', 'normal', 'high'];
const PLAN_LIMITS = { trays: [0, 15], household: [0, 10000] };

// Seeded stream per (seed, keys): call order elsewhere cannot change an outcome.
function rng(seed, ...keys) {
  let h = (seed ^ 0x9e3779b9) >>> 0;
  for (const c of keys.join('|')) h = Math.imul(h ^ c.charCodeAt(0), 2654435761) >>> 0;
  return () => {
    h = (h + 0x6d2b79f5) >>> 0;
    let t = Math.imul(h ^ (h >>> 15), h | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const between = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
const pct = (n, p) => Math.floor(n * p / 100);
const sum = list => list.reduce((a, b) => a + b, 0);
const fail = code => { throw new Error(code); };

function createSeason({ seed = 1 } = {}) {
  seed = seed >>> 0;
  const r = rng(seed, 'setup');
  const s = {
    calc: CALC_VERSION, seed, week: 1, phase: 'plan', pending: null, done: {},
    plan: { trays: 4, price: 'normal', pay: 'cash', buyWeeks: 1, household: P.household, check: 'none' },
    cash: P.cash, packs: [], pots: 1, flask: false, equipment: [], payables: [], receivables: [],
    customers: {}, office: null, trial: null, school: null, kiosk: null, loan: null, helper: null,
    notebook: false, notebookFrom: 0, blocked: false, small: false, competitor: false, investigated: '',
    payments: P.payments.map(([week, amount]) => ({ week, due: week, amount, status: 'due' })),
    goal: '', goals: [], help: [], threads: [], history: [],
    // Hidden, bounded interest: the paid trial shows it once; later weeks vary around it.
    officeBase: between(r, 4, 9), rainWeek: between(r, 19, 23), helperSkill: between(r, 55, 80),
    flow: {}, pnl: {}, hours: 0, chased: [],
    totals: { revenue: 0, profit: 0, drawings: 0 }, opening: P.cash,
    household: { paid: 0, short: 0, streak: 0 }, away: '', seq: 0,
  };
  return s;
}

const packCost = s => (s.week >= P.riseWeek ? P.pack + P.rise : P.pack) - (s.plan.buyWeeks === 2 ? P.bulkOff : 0);
const stock = s => sum(s.packs.map(l => l.qty));
const stockValue = s => sum(s.packs.map(l => l.qty * l.cost));
const owedToYou = s => sum(s.receivables.map(x => x.amount));
const owedByYou = s => sum(s.payables.map(x => x.amount)) + (s.loan?.balance || 0);
const book = s => sum(s.equipment.map(e => e.book));
const add = (bag, key, n) => { if (n) bag[key] = (bag[key] || 0) + n; };
const price = s => P.price[s.plan.price];
const thread = (s, key, params = {}) => s.threads.push({ week: s.week, key, ...params });
const schoolPrice = s => s.school?.better ? P.school.better : P.school.price;
const effort = h => h ? (h.trained ? Math.min(95, h.skill + 25) : h.skill) : 0;

function balance(s) {
  const assets = s.cash + stockValue(s) + owedToYou(s) + book(s);
  const liabilities = owedByYou(s);
  return { assets, liabilities, equity: assets - liabilities, expected: s.opening + s.totals.profit - s.totals.drawings };
}

function awayMode(s) {
  if (s.week !== P.awayWeek) return '';
  const choice = s.done.away2 || s.done.away;
  return choice === 'cover' && s.helper ? 'cover' : choice === 'close' ? 'close' : 'uncovered';
}

function capacity(s) {
  const away = awayMode(s);
  let fixed = away ? 0 : P.stallHours + (s.office ? P.office.hours : 0) + (s.school ? P.school.hours : 0) +
    (s.kiosk ? P.kiosk.hours : 0) + (s.notebook ? P.notebookHours : 0) + (s.helper ? P.checkHours[s.plan.check] : 0) + s.hours;
  if (s.trial?.week === s.week) fixed += P.office.hours;
  const owner = away ? 0 : Math.max(0, Math.floor((P.ownerHours - fixed) / P.trayHours));
  let helper = s.helper && !s.helper.training ? Math.floor(P.helperHours / P.trayHours * effort(s.helper) / 100) : 0;
  if (away === 'cover') helper = Math.floor(helper / 2); // Juma also serves the stall.
  const pots = s.pots * P.pot.trays;
  const trays = Math.min(pots, owner + helper);
  return { trays, pots, owner, helper, fixed: away ? 0 : fixed, by: trays === pots && owner + helper > pots ? 'pots' : 'hours' };
}
// Owner hours a week for a batch: fixed work plus the trays the helper does not cook.
const hours = (cap, trays) => cap.fixed + Math.max(0, Math.min(trays, cap.owner + cap.helper) - cap.helper) * P.trayHours;

// Pieces per day that committed customers take before walk-in customers.
function orders(s) {
  return (s.school ? s.school.pieces : 0) + (s.trial?.school === s.week ? P.school.small : 0) +
    (s.kiosk ? P.kiosk.pieces : 0) + (s.office || s.trial?.week === s.week ? (s.history.findLast(r => r.trial)?.trial.paid ?? (s.office ? Math.round(sum((s.history.at(-1)?.days || []).map(d => d.buyers || 0)) / P.days) : 0)) * P.office.pieces : 0) +
    Object.values(s.customers).filter(c => c.credit).length * P.neighbourPieces;
}

const committed = s => Math.ceil(orders(s) / pieces_(s));
function needs(s, pieces) {
  const extra = Math.ceil(pieces / pieces_(s));
  const trays = s.plan.trays + extra;
  const cap = capacity({ ...s, school: { pieces } });
  const short = Math.max(0, trays - cap.trays);
  const weekInputs = extra * P.days * packCost(s);
  return { trays, capacity: cap.trays, short, by: cap.by, weekInputs, term: P.school.term,
    cash: (weekInputs + (short && !s.helper ? P.wage : 0)) * P.school.term,
    inspection: P.school.inspection, hours: P.school.hours, available: s.cash };
}
const pieces_ = s => s.small ? P.smallPieces : P.pieces;

// ---- events -----------------------------------------------------------------

const payment = s => s.payments.find(p => p.status === 'due' && p.due === s.week);
const EVENTS = [
  ['payment', s => payment(s)],
  ['pot', s => s.week === 2 && s.pots < 2],
  ['neema', s => s.week === 2],
  ['notebook', s => s.week === 3 && !s.notebook],
  ['office', s => s.week === 4 && !s.office],
  ['office2', s => s.week === 6 && s.done.office === 'later' && !s.office],
  ['officeResult', s => s.trial && s.trial.week === s.week - 1 && !s.office],
  ['neighbours', s => s.week === 6 && s.customers.neema?.credit],
  ['school', s => s.week === 10 && s.office],
  ['competitor', s => s.week === 10 && !s.office],
  ['schoolTrial', s => s.week === 11 && s.done.school === 'trial'],
  ['schoolCounter', s => s.counter === s.week],
  ['kiosk', s => s.week === 12],
  ['helper', s => s.week === 13 && !s.helper],
  ['helperHire', s => s.week === 14 && s.done.helper === 'trial'],
  ['discrepancy', s => s.week === 15 && s.helper && (s.history.at(-1)?.rejected || 0) > 0],
  ['away', s => s.week === 15],
  ['away2', s => s.week === 16 && s.done.away === 'later'],
  ['flour', s => s.week === P.riseWeek],
];
const OPTIONS = {
  payment: ['pay', 'borrow', 'defer', 'short'], pot: ['buy', 'later'], neema: ['yes', 'no'],
  notebook: ['start', 'later'], office: ['flask', 'trial', 'later'], office2: ['flask', 'trial', 'no'],
  officeResult: ['flask', 'no'], neighbours: ['yes', 'no'], school: ['full', 'small', 'trial', 'decline'],
  competitor: ['lower', 'hold'], schoolTrial: ['full', 'small', 'decline'], schoolCounter: ['full', 'decline'],
  kiosk: ['yes', 'no'], helper: ['trial', 'hire', 'train', 'later'], helperHire: ['hire', 'train', 'no'],
  discrepancy: ['records', 'count', 'leave'], away: ['cover', 'close', 'later'], away2: ['cover', 'close', 'nothing'],
  flour: ['price', 'smaller', 'renegotiate', 'keep'],
};
const eventOptions = id => OPTIONS[id] || [];

function arrive(s) {
  s.phase = 'plan'; s.pending = null;
  const ev = EVENTS.find(([id, when]) => !s.done[`${id}@${s.week}`] && when(s));
  if (ev) { s.phase = 'event'; s.pending = ev[0]; }
}

function spend(s, amount, flowKey) {
  if (amount > s.cash) fail('cash');
  s.cash -= amount; add(s.flow, flowKey, -amount);
}
function cost(s, amount, line, flowKey = 'costs') { spend(s, amount, flowKey); add(s.pnl, line, amount); s.totals.profit -= amount; }
function draw(s, amount) { spend(s, amount, 'household'); s.totals.drawings += amount; }
function buyEquipment(s, kind) {
  const item = P[kind]; spend(s, item.cost, 'equipment');
  s.equipment.push({ kind, cost: item.cost, book: item.cost, dep: item.dep, week: s.week });
  if (kind === 'pot') s.pots++; else s.flask = true;
}
const canBorrow = s => !s.loan && !s.payables.some(x => x.who === 'lender');
function borrow(s) {
  if (!canBorrow(s)) fail('loan');
  s.loan = { balance: P.loan.amount, from: s.week };
  s.cash += P.loan.amount; add(s.flow, 'borrowed', P.loan.amount);
  thread(s, 'borrowed', { amount: P.loan.amount });
}
function startOffice(s) { buyEquipment(s, 'flask'); s.office = { from: s.week }; }

function answer(s, option) {
  const id = s.pending;
  if (s.phase !== 'event' || !OPTIONS[id].includes(option)) fail('option');
  const due = payment(s);
  const allowed = {
    payment: { pay: s.cash >= due?.amount, borrow: canBorrow(s), defer: !due?.deferred, short: s.cash < due?.amount },
    pot: { buy: s.cash >= P.pot.cost && s.pots < P.pot.max }, office: { flask: s.cash >= P.flask.cost, trial: s.cash >= P.office.trialCost },
    office2: { flask: s.cash >= P.flask.cost, trial: s.cash >= P.office.trialCost }, officeResult: { flask: s.cash >= P.flask.cost },
    school: { full: s.cash >= P.school.inspection, small: s.cash >= P.school.inspection },
    schoolTrial: { full: s.cash >= P.school.inspection, small: s.cash >= P.school.inspection },
    schoolCounter: { full: s.cash >= P.school.inspection },
    helper: { trial: s.cash >= P.helperTrial, train: s.cash >= P.training }, helperHire: { train: s.cash >= P.training },
    away: { cover: !!s.helper }, away2: { cover: !!s.helper }, flour: { renegotiate: !!s.school, price: s.plan.price !== 'high' },
  }[id]?.[option];
  if (allowed === false) fail('option');
  const r = rng(s.seed, 'answer', id, s.week);
  const out = { event: id, option };
  switch (id) {
    case 'payment':
      if (option === 'borrow') borrow(s);
      if (option === 'pay' || option === 'borrow') {
        draw(s, due.amount); due.status = 'paid'; due.paid = s.week;
        thread(s, due.due === due.week ? 'paymentPaid' : 'paymentLate', { amount: due.amount, from: due.week });
      } else if (option === 'defer') {
        draw(s, P.lateFee); due.deferred = true; due.due = s.week + 2; out.due = due.due;
      } else {
        const part = s.cash; draw(s, part); due.status = 'missed'; due.paidPart = part; out.part = part;
        thread(s, 'paymentMissed', { amount: due.amount - part, from: due.week });
      }
      break;
    case 'pot': if (option === 'buy') buyEquipment(s, 'pot'); break;
    case 'neema': if (option === 'yes') s.customers.neema = { credit: true, from: s.week }; break;
    case 'notebook': if (option === 'start') { s.notebook = true; s.notebookFrom = s.week; } break;
    case 'office': case 'office2': case 'officeResult':
      if (option === 'flask') startOffice(s);
      if (option === 'trial') { cost(s, P.office.trialCost, 'other'); s.trial = { week: s.week }; }
      break;
    case 'neighbours':
      if (option === 'yes') for (const who of ['baraka', 'zawadi']) s.customers[who] = { credit: true, from: s.week };
      break;
    case 'school': case 'schoolTrial': case 'schoolCounter':
      if (option === 'trial') { s.trial = { ...s.trial, school: s.week }; break; }
      if (option === 'decline') break;
      if (option === 'small' && r() * 100 >= 70) { s.counter = s.week; out.refused = true; break; }
      cost(s, P.school.inspection, 'other');
      s.school = { pieces: option === 'full' ? P.school.full : P.school.small, from: s.week, strikes: 0, late: 0 };
      thread(s, 'schoolStart', { pieces: s.school.pieces });
      break;
    case 'competitor': s.competitor = true; if (option === 'lower') s.plan.price = 'low'; break;
    case 'kiosk': if (option === 'yes') s.kiosk = { from: s.week, late: 0 }; break;
    case 'helper': case 'helperHire':
      if (option === 'trial') { cost(s, P.helperTrial, 'other'); out.skill = s.helperSkill; s.helperKnown = true; }
      if (option === 'hire' || option === 'train') {
        s.helper = { skill: s.helperSkill, trained: option === 'train', training: option === 'train', from: s.week, known: !!s.helperKnown };
        if (option === 'train') cost(s, P.training, 'other');
      }
      break;
    case 'discrepancy': {
      const last = s.history.at(-1);
      if (option === 'records' && last.noted) { s.investigated = 'found'; out.found = last.rejected; out.sent = sum(last.days.map(d => d.school)); }
      else if (option === 'records') { s.hours += 3; s.investigated = 'unclear'; }
      if (option === 'count') s.plan.check = 'batch';
      break;
    }
    case 'away': case 'away2': s.away = option; break;
    case 'flour':
      if (option === 'price') s.plan.price = STEPS[STEPS.indexOf(s.plan.price) + 1];
      if (option === 'smaller') s.small = true;
      if (option === 'renegotiate') { out.accepted = r() * 100 < 60; if (out.accepted) s.school.better = true; }
      break;
  }
  s.done[`${id}@${s.week}`] = option; s.done[id] = option;
  arrive(s);
  return out;
}

// ---- trading week -------------------------------------------------------------

function settleReceivables(s, res) {
  for (const x of [...s.receivables]) {
    if (x.due > s.week) continue;
    const chance = (x.who === 'school' ? P.school.pay : x.who === 'kiosk' ? P.kiosk.pay : P.neighbours[x.who]) + 10 * x.late;
    if (rng(s.seed, 'collect', x.id, s.week)() * 100 < chance) collect(s, x, res);
    else { x.late++; x.due = s.week + 1; res.late.push(x.who); }
  }
}
function collect(s, x, res) {
  s.receivables = s.receivables.filter(y => y !== x);
  s.cash += x.amount; add(s.flow, 'collected', x.amount);
  res && res.collected.push({ who: x.who, amount: x.amount, from: x.week });
  thread(s, 'collected', { who: x.who, amount: x.amount, from: x.week });
}

function payDue(s, res) {
  for (const x of [...s.payables].sort((a, b) => a.due - b.due)) {
    if (x.due > s.week) continue;
    if (s.cash >= x.amount) {
      s.cash -= x.amount; add(s.flow, x.who === 'bakari' ? 'supplier' : 'arrears', -x.amount);
      s.payables = s.payables.filter(y => y !== x);
      if (x.who === 'bakari' && s.blocked && !s.payables.some(y => y.who === 'bakari' && y.due < s.week)) s.blocked = false;
    } else if (x.who === 'bakari' && !s.blocked) {
      s.blocked = true; res.notes.push('blocked'); thread(s, 'supplierBlocked', { amount: x.amount, from: x.week });
    }
  }
}

// Pay a weekly cost; what the tin cannot pay becomes a debt due next week.
function obligation(s, amount, line, who) {
  if (!amount) return;
  const paid = Math.min(amount, s.cash);
  s.cash -= paid; add(s.flow, 'costs', -paid);
  if (line) { add(s.pnl, line, amount); s.totals.profit -= amount; }
  if (amount > paid) s.payables.push({ id: ++s.seq, who, amount: amount - paid, due: s.week + 1, week: s.week });
}

function buy(s, trays, res) {
  const unit = packCost(s);
  const want = Math.max(0, trays * P.days * s.plan.buyWeeks - stock(s));
  let credit = 0;
  if (s.plan.pay === 'credit' && !s.blocked) {
    const room = P.supplier.limit - sum(s.payables.filter(x => x.who === 'bakari').map(x => x.amount));
    credit = Math.min(want, Math.max(0, Math.floor(room / unit)));
  }
  const cash = Math.min(want - credit, Math.floor(s.cash / unit));
  if (cash) { s.cash -= cash * unit; add(s.flow, 'supplies', -cash * unit); }
  if (credit) s.payables.push({ id: ++s.seq, who: 'bakari', amount: credit * unit, due: s.week + P.supplier.term, week: s.week });
  if (cash + credit) s.packs.push({ qty: cash + credit, cost: unit });
  Object.assign(res, { bought: cash + credit, boughtCash: cash, boughtCredit: credit, unit, wanted: want, short: want - cash - credit });
}
function use(s, trays) {
  let left = trays, value = 0;
  for (const layer of s.packs) {
    const take = Math.min(left, layer.qty);
    layer.qty -= take; left -= take; value += take * layer.cost;
  }
  s.packs = s.packs.filter(l => l.qty > 0);
  return { trays: trays - left, value };
}

function trade(s) {
  const startCash = s.lastCash ?? P.cash;
  const res = { week: s.week, days: [], collected: [], late: [], notes: [], invoices: [], rejected: 0, waste: 0 };
  const away = awayMode(s);
  const open = away !== 'close' && away !== 'uncovered';
  const officeOn = open && (s.office || s.trial?.week === s.week);
  res.away = away;
  settleReceivables(s, res);
  payDue(s, res);
  const cap = capacity(s);
  const trays = open ? Math.min(s.plan.trays, cap.trays) : 0;
  Object.assign(res, { planned: s.plan.trays, capacity: cap, trays });
  buy(s, trays, res);
  const pp = pieces_(s), unit = price(s), r = rng(s.seed, 'week', s.week);
  const quality = s.helper ? (s.helper.trained ? pct(P.rejects[s.plan.check], 50) : P.rejects[s.plan.check]) * Math.min(trays, cap.helper) / Math.max(1, trays) : 0;
  const rev = { stall: 0, office: 0, neighbours: 0, school: 0, kiosk: 0 };
  const credit = { school: 0, kiosk: 0 }, owe = {};
  let materials = 0, chai = 0, soldOut = 0;
  for (let d = 0; d < P.days; d++) {
    const made = open ? use(s, trays) : { trays: 0, value: 0 };
    materials += made.value;
    let avail = made.trays * pp;
    const day = { made: made.trays, pieces: avail, school: 0, kiosk: 0, office: 0, neighbours: 0, stall: 0, demand: 0, waste: 0, rain: false };
    const take = n => { const got = Math.min(n, avail); avail -= got; return got; };
    const school = open && s.school ? s.school.pieces : s.trial?.school === s.week && open ? P.school.small : 0;
    if (school) {
      day.school = take(school);
      const bad = Math.floor(day.school * quality / 100);
      res.rejected += bad; day.rejected = bad;
      const value = (day.school - bad) * schoolPrice(s);
      rev.school += value; if (s.school) credit.school += value;
      res.schoolShort = (res.schoolShort || 0) + (school - day.school);
    }
    if (open && s.kiosk) {
      day.kiosk = take(P.kiosk.pieces); rev.kiosk += day.kiosk * P.kiosk.price; credit.kiosk += day.kiosk * P.kiosk.price;
      res.kioskShort = (res.kioskShort || 0) + P.kiosk.pieces - day.kiosk;
    }
    if (officeOn) {
      const buyers = Math.max(0, s.officeBase + between(r, -2, 2));
      const served = Math.min(buyers, Math.floor(avail / P.office.pieces));
      day.office = take(served * P.office.pieces); day.buyers = served;
      rev.office += day.office * unit + served * P.office.chai; chai += served * P.office.chaiCost;
      if (s.trial?.week === s.week) res.trialPaid = (res.trialPaid || 0) + served;
    }
    if (open) for (const [who, c] of Object.entries(s.customers)) {
      if (!c.credit) continue;
      const got = take(P.neighbourPieces); day.neighbours += got;
      owe[who] = (owe[who] || 0) + got * unit; rev.neighbours += got * unit;
    }
    if (open) {
      let demand = pct(pct(P.stallDemand, P.demand[s.plan.price]), between(r, 80, 120));
      if (s.competitor && s.week <= 15) demand = pct(demand, 80);
      if (s.small) demand = pct(demand, 90);
      if (s.week === s.rainWeek && d % 2 === 0) { demand = pct(demand, 60); day.rain = true; }
      day.demand = demand; day.stall = take(demand); rev.stall += day.stall * unit;
      if (demand > day.stall) soldOut++;
    }
    day.waste = avail; res.waste += avail;
    res.days.push(day);
  }
  // Cash sales go into the tin as the week runs; deliveries on credit become invoices.
  const cashSales = rev.stall + rev.office + (s.trial?.school === s.week ? rev.school : 0);
  s.cash += cashSales; add(s.flow, 'sales', cashSales);
  const invoice = (who, amount, term) => {
    if (!amount) return;
    s.receivables.push({ id: ++s.seq, who, amount, week: s.week, due: s.week + term, late: 0, noted: s.notebook });
    res.invoices.push({ who, amount, due: s.week + term });
  };
  invoice('school', credit.school, P.school.term);
  invoice('kiosk', credit.kiosk, 1);
  for (const [who, amount] of Object.entries(owe)) invoice(who, amount, 1);
  const revenue = sum(Object.values(rev));
  add(s.pnl, 'revenue', revenue); add(s.pnl, 'materials', materials); add(s.pnl, 'chai', chai);
  s.cash -= chai; add(s.flow, 'costs', -chai);
  s.totals.revenue += revenue; s.totals.profit += revenue - materials - chai;
  obligation(s, open ? P.fee : 0, 'fee', 'fee');
  if (s.helper) { obligation(s, P.wage, 'wages', 'juma'); s.helper.training = false; }
  if (s.loan) {
    obligation(s, P.loan.interest, 'interest', 'lender');
    const principal = Math.min(P.loan.principal, s.loan.balance);
    const paid = Math.min(principal, s.cash);
    s.cash -= paid; add(s.flow, 'principal', -paid); s.loan.balance -= principal;
    if (principal > paid) s.payables.push({ id: ++s.seq, who: 'lender', amount: principal - paid, due: s.week + 1, week: s.week });
    if (s.loan.balance === 0) { s.loan = null; if (principal === paid && !s.payables.some(x => x.who === 'lender')) thread(s, 'loanRepaid'); }
  }
  let dep = 0;
  for (const e of s.equipment) { const n = Math.min(e.dep, e.book); e.book -= n; dep += n; }
  add(s.pnl, 'depreciation', dep); s.totals.profit -= dep;
  // School and kiosk respond to missed deliveries; declined orders never reach here.
  if (s.school && (res.schoolShort > pct(s.school.pieces * P.days, 20) || away === 'uncovered')) {
    s.school.strikes++; res.notes.push('schoolShort');
    if (s.school.strikes >= 2) { s.school = null; res.notes.push('schoolLost'); thread(s, 'schoolLost'); }
  }
  if (s.kiosk && (res.kioskShort > pct(P.kiosk.pieces * P.days, 20) || away === 'uncovered')) {
    s.kiosk.strikes = (s.kiosk.strikes || 0) + 1; res.notes.push('kioskShort');
    if (s.kiosk.strikes >= 2 || away === 'uncovered') { s.kiosk = null; res.notes.push('kioskLost'); thread(s, 'kioskLost'); }
  }
  if (away === 'cover' && revenue > 0) {
    // Scope: sales happened without the owner while the notebook and a check were in
    // place. The model does not compare a real count with the tin, so claim no more.
    s.awayTraded = (s.awayTraded || 0) + 1;
    s.awayKept = s.notebook && s.plan.check !== 'none';
    thread(s, 'awayCovered');
  } else if (away) thread(s, away === 'close' ? 'awayClosed' : 'awayMissed');
  // Household money last, from what remains.
  const home = Math.min(s.plan.household, s.cash);
  s.cash -= home; add(s.flow, 'household', -home); s.totals.drawings += home;
  if (s.plan.household > 0 && home === s.plan.household) { s.household.paid++; s.household.streak++; }
  else if (s.plan.household > 0) {
    s.household.short++; s.household.streak = 0; s.household.unmet = (s.household.unmet || 0) + s.plan.household - home;
    res.notes.push('householdShort'); res.householdShort = s.plan.household - home;
  }
  if (s.trial?.week === s.week && res.trialPaid !== undefined) {
    res.trial = { paid: Math.round(res.trialPaid / P.days), invited: P.office.invited };
    thread(s, 'trial', res.trial);
  }
  if (s.trial?.school === s.week) thread(s, 'schoolTrialDone', { amount: rev.school });
  // Result: every tin movement since the last week card, and the profit lines.
  const pnl = s.pnl, profit = (pnl.revenue || 0) - sum(Object.entries(pnl).filter(([k]) => k !== 'revenue').map(([, v]) => v));
  Object.assign(res, {
    revenue: rev, sales: revenue, cashSales, creditSales: revenue - cashSales, profit, pnl: { ...pnl }, flow: { ...s.flow },
    cashStart: startCash, cashEnd: s.cash, soldOutDays: soldOut, household: home,
    hours: Math.ceil(hours(cap, sum(res.days.map(d => d.made)) / P.days)), noted: s.notebook, stock: stock(s), owedToYou: owedToYou(s), owedByYou: owedByYou(s),
  });
  res.limit = limit(res);
  s.history.push(res);
  s.lastCash = s.cash; s.flow = {}; s.pnl = {}; s.hours = 0; s.chased = [];
  s.week++;
  if ((s.week - 1) % 4 === 0) { s.phase = 'review'; s.pending = null; } else arrive(s);
  return res;
}

// Which stage limited the week, from the result alone.
function limit(res) {
  if (!res || !res.trays && !res.planned) return '';
  if (res.short > 0) return 'buy';
  if (res.soldOutDays >= 3) return res.planned > res.capacity.trays ? (res.capacity.by === 'pots' ? 'pots' : 'hours') : 'plan';
  if (res.waste > res.trays * P.days * P.pieces * 15 / 100) return 'demand';
  if (res.owedToYou > res.cashEnd && res.owedToYou > 0) return 'collect';
  return '';
}

// ---- why things happened ------------------------------------------------------
// A week can raise two questions: what held trading back, and why the tin moved
// differently from profit. Each answer comes from the saved week. A topic is explained
// outright the first two times it appears; after that the learner is asked first and
// the answer is recorded (D-067). A topic repeated from the week before is not raised.
const HELD = { buy: 'buy', pots: 'cook', hours: 'cook', plan: 'plan', demand: 'demand', collect: 'collect' };
const WHY = { held: ['buy', 'cook', 'plan', 'demand', 'collect'], gap: ['credit', 'household', 'stock', 'other'] };
function gapParts(r) {
  const f = k => r.flow[k] || 0;
  const credit = r.creditSales - f('collected'), household = -f('household');
  const stock = -f('supplies') - f('supplier') - (r.pnl.materials || 0);
  return { credit, household, stock, other: r.profit - (r.cashEnd - r.cashStart) - credit - household - stock };
}
function topic(r, kind) {
  if (kind === 'held') return HELD[r.limit] || '';
  if (Math.abs(r.profit - (r.cashEnd - r.cashStart)) < Math.max(1000, r.sales / 5)) return '';
  return Object.entries(gapParts(r)).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0][0];
}
function causes(history) {
  const r = history.at(-1);
  if (!r) return [];
  return Object.keys(WHY).flatMap(kind => {
    const key = topic(r, kind);
    if (!key || (history.length > 1 && topic(history.at(-2), kind) === key)) return [];
    const starts = history.slice(0, -1).filter((x, i) => topic(x, kind) === key && (i === 0 || topic(history[i - 1], kind) !== key)).length;
    return [{ kind, key, week: r.week, ask: starts >= 2 }];
  });
}

// ---- dispatcher -------------------------------------------------------------

function step(state, action) {
  const s = structuredClone(state);
  const need = phase => { if (s.phase !== phase && !(phase === 'plan' && s.phase === 'event' && action.type !== 'run')) fail('phase'); };
  let result = {};
  switch (action?.type) {
    case 'plan': {
      need('plan');
      const next = { ...s.plan, ...action.patch };
      for (const [k, [lo, hi]] of Object.entries(PLAN_LIMITS)) if (!Number.isSafeInteger(next[k]) || next[k] < lo || next[k] > hi) fail('plan');
      if (next.household % 100 || !STEPS.includes(next.price) || !['cash', 'credit'].includes(next.pay) ||
        ![1, 2].includes(next.buyWeeks) || !(next.check in P.checkHours)) fail('plan');
      s.plan = next; result = { plan: next };
      break;
    }
    case 'run': need('plan'); result = trade(s); break;
    case 'answer': result = answer(s, action.option); break;
    case 'buyPot': need('plan'); if (s.pots >= P.pot.max || s.cash < P.pot.cost) fail('pot'); buyEquipment(s, 'pot'); break;
    case 'sellPot': {
      need('plan');
      const i = s.equipment.findLastIndex(e => e.kind === 'pot');
      if (i < 0) fail('pot');
      const [pot] = s.equipment.splice(i, 1); s.pots--;
      s.cash += P.pot.resale; add(s.flow, 'equipmentSold', P.pot.resale);
      const loss = pot.book - P.pot.resale; add(s.pnl, 'other', loss); s.totals.profit -= loss;
      result = { loss };
      break;
    }
    case 'borrow': need('plan'); borrow(s); break;
    case 'trainHelper': need('plan'); if (!s.helper || s.helper.trained) fail('helper'); cost(s, P.training, 'other'); s.helper.trained = true; s.helper.training = true; break;
    case 'endHelper': need('plan'); if (!s.helper) fail('helper'); s.helper = null; break;
    case 'repay': need('plan'); if (!s.loan || s.cash < s.loan.balance) fail('repay'); spend(s, s.loan.balance, 'principal'); s.loan = null; if (!s.payables.some(x => x.who === 'lender')) thread(s, 'loanRepaid'); break;
    case 'chase': {
      need('plan');
      // Only invoices already due: asking early does not shorten agreed payment terms.
      const mine = s.receivables.filter(x => x.who === action.who && x.due <= s.week);
      if (!mine.length || s.chased.includes(action.who)) fail('chase');
      s.chased.push(action.who); s.hours += 1;
      const base = action.who === 'school' ? P.school.pay : action.who === 'kiosk' ? P.kiosk.pay : P.neighbours[action.who];
      const paid = rng(s.seed, 'chase', action.who, s.week)() * 100 < base - 20 + 10 * Math.max(...mine.map(x => x.late));
      if (paid) for (const x of mine) collect(s, x, null);
      result = { who: action.who, paid, amount: paid ? sum(mine.map(x => x.amount)) : 0 };
      break;
    }
    case 'credit': need('plan'); if (!s.customers[action.who]) fail('who'); s.customers[action.who].credit = !!action.on; break;
    case 'notebook': need('plan'); s.notebook = !!action.on; if (s.notebook) s.notebookFrom = s.week; break;
    case 'why': {
      const c = causes(s.history).find(x => x.kind === action.kind);
      if (s.phase === 'closed' || !c?.ask || s.whys?.some(w => w.week === c.week && w.kind === c.kind) || ![...WHY[c.kind], 'unsure'].includes(action.pick)) fail('why');
      result = { week: c.week, kind: c.kind, key: c.key, pick: action.pick, matched: action.pick === c.key };
      (s.whys ||= []).push(result); // Absent from older records, so they still replay exactly.
      break;
    }
    case 'help': result = { limit: limit(s.history.at(-1)), week: s.week }; s.help.push(s.week); break;
    case 'goal': if (!['income', 'customers', 'away'].includes(action.goal) || s.week < 5) fail('goal'); s.goal = action.goal; s.goals.push({ week: s.week, goal: action.goal }); break;
    case 'review': need('review'); if (s.week > WEEKS && !s.finished) { s.finished = true; } arrive(s); break;
    case 'close': if (s.phase === 'closed') fail('phase'); s.phase = 'closed'; s.pending = null; break;
    default: fail('action');
  }
  return { state: s, result };
}

function can(state, action) {
  try { step(state, action); return true; } catch { return false; }
}

function replay(seed, actions) {
  let s = createSeason({ seed });
  for (const a of actions) s = step(s, a).state;
  return s;
}

// A routine week: no event or month close waiting, the away week is not next, and the
// tin covers the planned batch and household money. Events and closes stop the loop.
function quiet(s) {
  if (s.phase !== 'plan') return false;
  const trays = Math.min(s.plan.trays, capacity(s).trays);
  const cost = Math.max(0, trays * P.days - stock(s)) * packCost(s);
  return s.cash >= cost + s.plan.household && s.week !== P.awayWeek;
}

function facts(s) {
  const last = s.history.slice(-4);
  const business = ['office', 'school', 'kiosk'].filter(k => s[k] && last.some(r => r.revenue[k] > 0)).length;
  return {
    weeks: s.history.length, householdPaid: s.household.paid, householdShort: s.household.short, streak: s.household.streak,
    householdUnmet: s.household.unmet || 0, paymentsUnmet: sum(s.payments.map(p => p.status === 'missed' ? p.amount - p.paidPart : 0)),
    buffer: s.plan.household ? Math.floor(s.cash / s.plan.household) : 0,
    hours: last.length ? Math.round(sum(last.map(r => r.hours)) / last.length) : 0,
    business, awayTraded: s.awayTraded || 0, awayKept: !!s.awayKept,
    owedToYou: owedToYou(s), owedByYou: owedByYou(s), people: s.helper ? 1 : 0,
    sales: s.totals.revenue, profit: s.totals.profit, drawings: s.totals.drawings, cash: s.cash,
    stock: stock(s), stockValue: stockValue(s), equipment: book(s),
    payments: s.payments.map(p => ({ week: p.week, amount: p.amount, status: p.status })),
  };
}

// Goal progress as facts against the prototype targets; reaching one is not ranked.
function goalProgress(s) {
  const f = facts(s);
  const onTime = ['school', 'kiosk'].every(k => !s[k] || !s.receivables.some(x => x.who === k && x.late));
  return {
    income: { now: [Math.min(f.streak, 8), Math.min(f.buffer, 4)], of: [8, 4], reached: f.streak >= 8 && f.buffer >= 4 },
    customers: { now: [f.business], of: [3], reached: f.business >= 3 && onTime },
    away: { now: [f.awayTraded && f.awayKept ? 1 : 0], of: [1], reached: !!f.awayTraded && f.awayKept },
  };
}

  return { createSeason, balance, capacity, needs, limit, gapParts, causes, step, can, replay, quiet, facts, goalProgress, CALC_VERSION, WEEKS, SAMPLE, stock, hours, committed, eventOptions, WHY };
})();

/* ---- seasonstore ---- */
const NS_seasonstore = (function () {

// Season records: a separate IndexedDB database. Legacy saves ('business-simulator'
// IndexedDB and the intro's localStorage keys) are never read for writing or changed.
//
// One record per run: { schema, version, id, run, seed, calc, content, startedAt,
// updatedAt, rev, log: [{ n, at, week, action }], state }. Each committed action and its
// resulting state are one put, so a reload shows the result and never repeats it.
// `rev` guards against a second tab: a write whose expected rev is stale is refused.
const DB = 'mv-bs-season';
const SCHEMA = 'mv-bs-season-record';
const VERSION = 1;
let db = null;

async function open() {
  db?.close();
  db = null;
  const opened = await new Promise((resolve, reject) => {
    const request = indexedDB.open(DB, 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore('runs', { keyPath: 'id' });
      request.result.createObjectStore('meta');
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('blocked'));
  });
  db = opened;
  opened.onversionchange = () => { opened.close(); if (db === opened) db = null; };
}

const tx = (stores, mode, body) => new Promise((resolve, reject) => {
  if (!db) { reject(new Error('unavailable')); return; }
  const t = db.transaction(stores, mode);
  let out;
  t.oncomplete = () => resolve(out);
  t.onabort = t.onerror = () => reject(t.error || new Error(out?.error || 'aborted'));
  out = body(t);
});


async function list() {
  return tx(['runs'], 'readonly', t => {
    const out = [];
    t.objectStore('runs').openCursor().onsuccess = e => {
      const c = e.target.result;
      if (c) { const v = c.value; out.push({ id: v.id, run: v.run, week: v.state?.week, updatedAt: v.updatedAt, phase: v.state?.phase }); c.continue(); }
    };
    return out;
  });
}

async function active() {
  const id = await tx(['meta'], 'readonly', t => { const r = t.objectStore('meta').get('active'); return r; }).then(r => r.result);
  return id ? tx(['runs'], 'readonly', t => t.objectStore('runs').get(id)).then(r => r.result || null) : null;
}

// Compare-and-put. Resolves the new rev; rejects Error('conflict') on a stale tab.
async function save(record, expected) {
  const next = { ...record, rev: expected + 1, updatedAt: new Date().toISOString() };
  let conflict = false;
  await tx(['runs', 'meta'], 'readwrite', t => {
    const runs = t.objectStore('runs');
    const r = runs.get(record.id);
    r.onsuccess = () => {
      const stored = r.result?.rev ?? 0;
      if (stored !== expected) { conflict = true; t.abort(); return; }
      runs.put(next);
      t.objectStore('meta').put(record.id, 'active');
    };
  }).catch(error => { throw conflict ? new Error('conflict') : error; });
  return next.rev;
}

async function activate(id) {
  await tx(['meta'], 'readwrite', t => { t.objectStore('meta').put(id, 'active'); });
}
async function read(id) {
  return tx(['runs'], 'readonly', t => t.objectStore('runs').get(id)).then(r => r.result || null);
}
async function remove(id) {
  await tx(['runs'], 'readwrite', t => { t.objectStore('runs').delete(id); });
}

// Detect earlier games without opening them for writing.
async function legacy() {
  const keys = ['business-simulator:asha-intro:v3', 'asha-stall-v2', 'business-simulator:v1'];
  let found = false;
  try { found = keys.some(k => localStorage.getItem(k)); } catch { /* storage blocked */ }
  try { found ||= (await indexedDB.databases?.() || []).some(d => d.name === 'business-simulator'); } catch { /* unsupported */ }
  return found;
}

  return { open, list, active, save, activate, read, remove, legacy, DB, SCHEMA, VERSION };
})();

// One finished week, day by day (1.1 s each). A day pill names the day; customers are
// served: mandazi go to the queue and coins pop into the tin (papers to the clipboard
// for credit). On sold-out days a stamp shows and a cross customer walks away;
// leftovers go to the bin. The tin moves from its start to its end amount.
const DAY_MS = 1100;
function animateWeek(host, result, labels) {
  const fx = host.querySelector('#fx');
  if (!fx) return 0;
  const parts = [];
  if (result.bought) parts.push(`<g class="fx arrive" style="--d:0"><path d="M268 238 q-3 -14 3 -16 l2 -3 l2 3 q6 2 3 16 z" fill="#f5f0e6" stroke="${OL}" stroke-width="1.2"/></g>`);
  if (result.flow.collected > 0) parts.push(coin(320, 180, 'collected', '--d:0'));
  const schoolCredit = result.invoices.some(x => x.who === 'school');
  result.days.forEach((day, d) => {
    const at = `--d:${d}`;
    parts.push(`<g class="fx daypill" style="${at}"><rect x="142" y="36" width="76" height="22" rx="11"/><text class="daylabel" x="180" y="51.5">${labels.day(d + 1)}</text></g>`);
    const cashPieces = day.stall + day.office + (schoolCredit ? 0 : day.school);
    for (let i = 0; i < cap(Math.ceil(cashPieces / 15), 4); i++) {
      parts.push(`<g class="fx give" style="${at};--i:${i}">${mandazi(186, 150)}</g>`);
      parts.push(coin(300 - i * 4, 186, 'coin', `${at};--i:${i}`));
    }
    if ((schoolCredit ? day.school : 0) + day.kiosk + day.neighbours) parts.push(`<rect class="fx invoice" x="316" y="176" width="12" height="15" rx="1" fill="#fff" stroke="#64748b" style="${at}"/>`);
    if (day.demand > day.stall) parts.push(`<g class="fx leave" style="${at}">${person(334, 226, { s: .78, mood: 'cross', cloth: '#64748b' })}<g transform="translate(346 176)"><circle r="8" fill="#fff" stroke="${OL}" stroke-width="1.2"/><text class="bang" y="4">!</text></g></g>`,
      `<g class="fx soldout" style="${at}"><rect x="146" y="128" width="78" height="20" rx="4" transform="rotate(-8 185 138)"/><text x="185" y="142.5" transform="rotate(-8 185 138)">${labels.soldOut}</text></g>`);
    if (day.waste) parts.push(`<g class="fx waste" style="${at}">${mandazi(186, 150)}</g>`);
    if (day.rain) parts.push(`<g class="fx drops" style="${at}"><path d="M40 70 v14 M100 60 v14 M160 74 v14 M220 60 v14 M280 74 v14 M330 60 v14"/></g>`);
  });
  fx.innerHTML = parts.join('');
  const fill = host.querySelector('.tin .fill');
  const set = cash => { fill.style.transform = `scaleY(${level(cash)})`; };
  set(result.cashStart);
  host.classList.remove('done'); host.classList.add('playing');
  requestAnimationFrame(() => requestAnimationFrame(() => set(result.cashEnd)));
  return result.days.length * DAY_MS + 500;
}

// ---- record lifecycle ---------------------------------------------------------

function newRecord(n) {
  const seed = crypto.getRandomValues(new Uint32Array(1))[0];
  return { schema: store.SCHEMA, version: store.VERSION, id: crypto.randomUUID(), run: n, seed, calc: CALC_VERSION,
    content: { id: content.id, version: content.version, snapshot: content }, rules: structuredClone(P), startedAt: new Date().toISOString(), rev: 0, log: [], state: createSeason({ seed }) };
}

async function persist() {
  try { rec.rev = await store.save(rec, rec.rev); status = 'ok'; }
  catch (error) { status = error.message === 'conflict' ? 'conflict' : 'failed'; }
  renderStatus();
}

// Apply actions, then save the actions and their result together before showing them.
async function commit(actions) {
  if (busy || blocked || status !== 'ok') return null;
  busy = true;
  let s = rec.state;
  const log = [...rec.log], results = [];
  try {
    for (const action of actions) {
      const out = step(s, action);
      log.push({ n: log.length + 1, at: new Date().toISOString(), week: s.week, language: getLanguage(), phase: s.phase, event: s.pending, automaticHelp: Boolean(document.querySelector('.limit-note')), action, result: out.result });
      shown = feedback(action, out.result, s);
      reportAction(action, s, out.state, out.result);
      s = out.state; results.push(out.result);
    }
  } catch { busy = false; render(); return null; }
  rec = { ...rec, state: s, log };
  saving = persist().then(refreshRuns);
  await saving;
  busy = false;
  return results;
}

// Live play and reopening a record show the same facts, translated at render time.
function feedback(action, result, before) {
  if (action.type === 'run') return { kind: 'result', results: [result] };
  if (action.type === 'answer') return { kind: 'outcome', id: before.pending, result, before };
  if (action.type === 'chase') return { kind: 'notice', result };
  if (action.type === 'help') return { kind: 'help' };
  if (action.type === 'why') return { kind: 'result', results: [before.history.at(-1)] };
  return null;
}

// ---- progress reports (D-068, owner decision 2026-09-30: on by default) ----------
// Sent only if this host accepts them, unless the player turned them off under Records.
// Anonymous: a random id that is not the record id, the step reached, the week and the
// language. No money, plans, answers, names or device details. Turned off sends nothing.
const REPORT = 'mv-bs-season-telemetry';
function consent() { try { return JSON.parse(localStorage.getItem(REPORT)); } catch { return null; } }
function setConsent(yes) {
  try { localStorage.setItem(REPORT, JSON.stringify({ id: yes ? crypto.randomUUID() : null })); } catch { /* Stays unanswered. */ }
  if (yes) report('open');
  render();
}
function report(step, extra = {}) {
  if (!reportable) return;
  if (consent() === null) try { localStorage.setItem(REPORT, JSON.stringify({ id: crypto.randomUUID() })); } catch { return; }
  const id = consent()?.id;
  if (!id || !navigator.sendBeacon) return;
  // ponytail: fire-and-forget; reports made offline are lost. Queue them if offline drop-off matters.
  navigator.sendBeacon('./telemetry', JSON.stringify({ id, step, week: rec?.state.week, run: rec?.run, lang: getLanguage(), v: `${content.version}-${CALC_VERSION}`, ...extra }));
}
// One report per committed action that marks progress.
function reportAction(action, before, after, result) {
  if (action.type === 'run') report('trade', { week: result.week });
  else if (action.type === 'answer') report('event', { week: before.week, detail: before.pending });
  else if (action.type === 'review') report('review', { week: before.week });
  else if (action.type === 'close') report('closed');
  if (after.finished && !before.finished) report('finished');
}

const act = action => async () => {
  const results = await commit([action]);
  if (!results) return;
  motion = true;
  render();
};
const plan = (patch) => act({ type: 'plan', patch });

async function runWeeks(until) {
  await saving;
  const actions = [{ type: 'run' }];
  if (!can(rec.state, actions[0])) return;
  let s = step(rec.state, actions[0]).state;
  while (until && quiet(s) && !s.history.at(-1).late.length && !s.history.at(-1).notes.length && actions.length < 8) { actions.push({ type: 'run' }); s = step(s, { type: 'run' }).state; }
  const results = await commit(actions);
  if (!results) return;
  shown = { kind: 'result', results }; resultOpen = true;
  render(reduced());
  play(results.at(-1));
  if (!reduced()) $('scene').scrollIntoView({ block: 'start', behavior: 'auto' });
}

function play(result) {
  const scene = $('scene');
  clearTimeout(timer);
  if (reduced()) return;
  const ms = animateWeek(scene, result, { day: n => t('day', { n }), soldOut: t('soldOut') });
  $('skip').hidden = false;
  timer = setTimeout(stop, ms);
  // The cash counter runs from the week's opening to its closing cash, like the tin.
  const start = performance.now(), span = ms - 500;
  const tick = now => {
    const f = Math.min(1, (now - start) / span);
    $('cash').textContent = count(Math.round((result.cashStart + (result.cashEnd - result.cashStart) * f) / 10) * 10);
    if (f < 1) counting = requestAnimationFrame(tick);
  };
  counting = requestAnimationFrame(tick);
}
function stop() {
  const playing = $('scene').classList.contains('playing');
  clearTimeout(timer); cancelAnimationFrame(counting);
  $('scene').classList.remove('playing'); $('scene').classList.add('done');
  $('skip').hidden = true;
  if (rec) renderTop();
  if (playing) {
    for (const el of document.querySelectorAll('.strip .pill')) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    document.querySelector('#main [data-testid=result]')?.focus();
  }
}

    $(id).textContent = n === undefined ? '—' : count(n); $(id).title = n === undefined ? '' : money(n);
  }
  $('week').textContent = t(s.week > WEEKS ? 'weekExtra' : 'week', { n: s.week, total: WEEKS });
  $('week').closest('.meta').hidden = !last;
  const due = s.payments.find(p => p.status === 'due');
  $('due').textContent = due ? t('nextDue', { amount: money(due.amount), n: due.due }) : '';
  $('hours').textContent = t('hours', { n: hours(capacity(s), Math.min(s.plan.trays, capacity(s).trays)) });
  const cal = $('calendar'); cal.replaceChildren();

    if (w === P.awayWeek) marks.push('away');

      'aria-current': w === s.week ? 'step' : null, title: marks.map(m => t(`cal.${m}`)).join(', ') || null }, h('span', { text: w })));
  }

  const v = {
    trays: Math.min(s.plan.trays, cap.trays), stock: stock(s), pots: s.pots, helper: !!s.helper, owner: (replaying?.week ?? s.week) !== P.awayWeek,
    queue: last ? Math.round(sum(last.days.map(d => d.demand)) / 6) : P.stallDemand, invoices: s.receivables.length,
    cash: s.cash, office: !!s.office, school: !!s.school, kiosk: !!s.kiosk, rise: s.week >= P.riseWeek,

    price: money(P.price[s.plan.price]), notebook: s.notebook,

    lastView = v;

    owed: money(r.owedToYou), cash: money(r.cashEnd) };

    credit: money(r.creditSales), collected: money(f('collected')), amount: money(Math.abs(g[c.key])),

function historyDecisions(week) {
  let state = createSeason({ seed: rec.seed });
  const choices = [];
  for (const entry of rec.log) {
    if (state.week > week) break;
    const a = entry.action;
    if (state.week === week) {
      if (a.type === 'answer') choices.push(fill(ev(state.pending, 'title'), eventParams(state)) + ' — ' + fill(ev(state.pending, 'options', a.option, 'label'), eventParams(state)));
      if (a.type === 'plan') for (const [key, value] of Object.entries(a.patch)) {
        if (value === state.plan[key]) continue;
        const label = { trays: 'trays', price: 'price', household: 'household', pay: 'payWith', buyWeeks: 'buyFor', check: 'checks' }[key];
        const text = key === 'price' ? money(P.price[value]) : key === 'household' ? money(value) : key === 'trays' ? value : t(`${key}.${value}`);
        choices.push(`${t(label)}: ${text}`);
      }
      if (['buyPot', 'sellPot', 'borrow', 'repay', 'trainHelper', 'endHelper'].includes(a.type)) {
        const amount = { buyPot: P.pot.cost, sellPot: P.pot.resale, borrow: P.loan.amount, repay: state.loan?.balance, trainHelper: P.training }[a.type];
        choices.push(t(a.type, { amount: money(amount) }));
      }
      if (a.type === 'chase') choices.push(t('chase', { who: who(a.who) }));
      if (a.type === 'credit') choices.push(t(a.on ? 'creditOn' : 'creditOff', { who: who(a.who) }));
      if (a.type === 'notebook') choices.push(t(a.on ? 'notebookOn' : 'notebookOff'));
    }
    if (state.week === week && a.type === 'run') break;
    state = step(state, a).state;
  }
  return h('details', { class: 'history-decisions' }, h('summary', { text: t('history.decisions') }),
    choices.length ? h('ul', {}, choices.map(text => h('li', { text }))) : h('p', { text: t('history.unchanged') }));
}

function historyChart(history, week) {
  const keys = ['sales', 'profit', 'cashEnd'];
  const values = history.flatMap(r => keys.map(k => r[k]));
  const lo = Math.min(0, ...values), hi = Math.max(1, ...values);
  const x = i => 12 + i / Math.max(1, history.length - 1) * 276;
  const y = v => 116 - (v - lo) / (hi - lo) * 104;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 300 130'); svg.setAttribute('aria-hidden', 'true');
  const line = (tag, attrs) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); svg.append(el); };
  line('line', { x1: 12, x2: 288, y1: y(0), y2: y(0), class: 'zero' });
  line('line', { x1: x(week - 1), x2: x(week - 1), y1: 8, y2: 120, class: 'selected-week' });
  for (const key of keys) {
    line('polyline', { points: history.map((r, i) => `${x(i)},${y(r[key])}`).join(' '), class: key });
    line('circle', { cx: x(week - 1), cy: y(history[week - 1][key]), r: 3, class: key });
  }
  return h('figure', { class: 'history-chart' },
    h('figcaption', { text: t('history.range', { first: history[0].week, last: history.at(-1).week }) }),
    h('p', { class: 'small', text: `${money(lo)} — ${money(hi)}` }), svg,
    h('div', { class: 'chart-key' }, keys.map(key => h('span', { class: key, text: t(`history.${key}`) }))));
}
