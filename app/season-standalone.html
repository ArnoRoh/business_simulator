<style>
:root {
  --ink: #1f160e; --muted: #5b4a3a; --paper: #fff8ee; --card: #fff; --line: #e8d5bb;
  --teal: #0f766e; --teal-dark: #115e59; --orange: #c2410c; --gold: #facc15; --red: #b91c1c;
  font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; }
.app { max-width: 560px; margin: 0 auto; padding: 0 12px 32px; }
h1, h2, h3, h4 { line-height: 1.2; margin: .2em 0 .4em; }
h1 { font-size: 1.25rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1.05rem; } h4 { font-size: .95rem; margin-top: .8em; }
p { margin: .35em 0; }
.small { font-size: .88rem; color: var(--muted); }
.warn { color: var(--red); font-weight: 600; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0 4px; }
.top p { margin: 0; color: var(--muted); font-size: .9rem; }

/* Summary strip: cash, profit and sales are always on screen. */
.strip { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 8px;
  background: var(--teal-dark); color: #fff; border-radius: 0 0 12px 12px; padding: 8px 10px; }
.strip .label { display: block; font-size: .74rem; opacity: .9; }
.strip strong { font-size: 1.02rem; white-space: nowrap; }
.strip .meta { grid-column: 1 / -1; margin: 0; font-size: .82rem; display: flex; flex-wrap: wrap; gap: 2px 12px; }

.calendar { list-style: none; display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; padding: 0; margin: 8px 0; }
.calendar li { position: relative; height: 22px; border-radius: 3px; background: #efe2cf; font-size: .6rem; text-align: center; line-height: 22px; color: var(--muted); }
.calendar li.past { background: #cfe3dd; }
.calendar li.now { background: var(--teal); color: #fff; font-weight: 700; }
.calendar li.close { border-bottom: 3px solid var(--muted); }
.calendar li.pay::after, .calendar li.away::after, .calendar li.invoice::after { content: ""; position: absolute; top: -3px; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; }
.calendar li.pay::after { background: var(--red); }
.calendar li.away::after { background: #7c3aed; }
.calendar li.invoice::after { background: var(--gold); border: 1px solid #a16207; }

.scene-wrap { position: relative; }
.scene { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #ffe8c4; }
.scene svg { display: block; width: 100%; height: auto; }
.scene .tray { fill: #d6a664; } .scene .mz { fill: #f59e0b; stroke: #b45309; stroke-width: .8; }
.scene .pot rect { fill: #475569; } .scene .steam { fill: none; stroke: #fff; stroke-width: 2; opacity: .7; }
.scene .sack { fill: #f5f0e6; stroke: #a8927a; } .scene .paper { fill: #fff; stroke: #d6d3d1; }
.scene .awning { fill: var(--teal); } .scene .tag rect { fill: var(--red); } .scene .tag text { fill: #fff; font: 700 8px system-ui; text-anchor: middle; }
.scene .fill { transform-box: fill-box; transform-origin: 50% 100%; transition: transform 3s linear; }
.skip { position: absolute; right: 8px; bottom: 8px; min-height: 40px; padding: 4px 14px; border-radius: 20px; border: 0; background: rgba(31, 22, 14, .8); color: #fff; font: inherit; }

/* Week replay: transient marks are invisible unless a week is playing. */
.fx { opacity: 0; }
.scene .daylabel { font: 700 13px system-ui; fill: var(--ink); text-anchor: middle; }
.scene .soldout { font: 700 9px system-ui; fill: var(--red); }
.scene .coin { fill: var(--gold); stroke: #a16207; }
.scene .invoice { fill: #fff; stroke: #64748b; }
.scene .waste { fill: #92400e; }
.scene .drops path { stroke: #0369a1; stroke-width: 2; }
.playing .fx { animation: slot .5s ease both; animation-delay: calc(var(--d) * .5s); }
.playing .coin { animation-name: coin; animation-delay: calc(var(--d) * .5s + var(--i, 0) * .07s); }
.playing .invoice { animation-name: invoice; }
.playing .leave { animation-name: leave; }
.playing .waste { animation-name: waste; }
.playing .arrive { animation-name: arrive; animation-duration: .6s; }
.playing .steam { animation: steam 1s ease-in-out infinite; }
@keyframes slot { 0% { opacity: 0; } 15%, 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes coin { 0% { opacity: 1; transform: none; } 100% { opacity: .2; transform: translate(calc(-36px - var(--i, 0) * 14px), -28px); } }
@keyframes invoice { 0% { opacity: 1; transform: none; } 100% { opacity: .3; transform: translate(-148px, -22px) scale(.7); } }
@keyframes leave { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate(40px, 0); } }
@keyframes waste { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate(61px, 14px); } }
@keyframes arrive { 0% { opacity: 1; transform: translate(-40px, 0); } 100% { opacity: 0; transform: none; } }
@keyframes steam { 50% { transform: translateY(-3px); opacity: .3; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card:focus { outline: 3px solid var(--teal); }
.result, .outcome, .event { animation: rise .3s ease; }
.result .tin { font-size: 1.1rem; font-weight: 700; }
.result .compare { font-weight: 600; color: var(--teal-dark); }
.notes, .weeks { padding-left: 1.1em; margin: .4em 0; }
.kicker { text-transform: uppercase; letter-spacing: .04em; font-size: .75rem; color: var(--muted); margin: 0; }
.event { border: 2px solid var(--orange); }
.needs { background: #fff7ed; border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.needs ul { margin: 0; padding-left: 1.1em; }
.options, .goals { display: grid; gap: 8px; margin-top: 10px; }
.limit-note { border-left: 6px solid var(--orange); font-weight: 600; }
.goal-line { margin: 0; font-weight: 600; color: var(--teal-dark); }

.icon svg { width: 24px; height: 24px; fill: none; stroke: var(--teal); stroke-width: 2; stroke-linejoin: round; display: block; }
.debtor { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

button, .links a { font: inherit; min-height: 48px; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.primary { background: var(--teal); color: #fff; border: 0; font-weight: 700; width: 100%; }
.secondary { background: #fff; color: var(--teal-dark); border: 2px solid var(--teal); font-weight: 600; }
.danger { background: var(--red); color: #fff; border: 0; }
.link { background: none; border: 0; color: var(--teal-dark); text-decoration: underline; padding-left: 0; }
.choice { text-align: left; background: #fff; border: 2px solid var(--teal); color: var(--ink); font-weight: 600; display: grid; gap: 2px; }
.choice small { color: var(--red); font-weight: 400; }
.goal { text-align: left; background: #fff; border: 2px solid var(--line); color: var(--ink); display: grid; gap: 2px; }
.goal.chosen { border-color: var(--teal); background: #f0fdfa; }
.goal em { color: var(--teal-dark); font-style: normal; font-weight: 700; }
button:disabled { opacity: .55; cursor: not-allowed; }
button:focus-visible, a:focus-visible, input:focus-visible + span, summary:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.run { display: grid; gap: 8px; }

.seg { min-width: 0; border: 0; padding: 0; margin: 8px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.seg legend { max-width: 100%; overflow-wrap: anywhere; font-weight: 600; margin-bottom: 4px; padding: 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.seg span { display: flex; align-items: center; min-height: 48px; padding: 6px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
.seg input:checked + span { border-color: var(--teal); background: var(--teal); color: #fff; font-weight: 700; }
.stepper { margin: 6px 0; }
.stepper label { display: block; font-weight: 600; }
.stepper > div { display: flex; gap: 6px; align-items: stretch; }
.stepper button { min-width: 52px; font-size: 1.3rem; }
.stepper input { width: 6.5em; min-height: 48px; font: inherit; font-size: 1.1rem; text-align: center; border: 2px solid var(--line); border-radius: 10px; }

.rows { margin: 6px 0; }
.rows div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.rows dt { color: var(--muted); } .rows dd { margin: 0; font-weight: 600; text-align: right; }
details { margin: 6px 0; } summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; color: var(--teal-dark); }

.foot { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.foot h2 { font-size: 1rem; margin-top: 8px; }
#saved.ok { color: var(--teal-dark); } #saved.warn { color: var(--red); font-weight: 700; }
.runs { list-style: none; padding: 0; display: grid; gap: 6px; }
.runs li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { display: inline-flex; align-items: center; border: 2px solid var(--teal); color: var(--teal-dark); text-decoration: none; font-weight: 600; }
.links a[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.scene { scroll-margin-top: 120px; }
.plan-summary { font-weight: 600; }
.strip strong { white-space: normal; overflow-wrap: anywhere; }
@media (max-width: 359px) { .calendar { grid-template-columns: repeat(12, 1fr); } }


.top { flex-wrap: wrap; }
.top > div { flex: 1 1 160px; }
.rows div { flex-wrap: wrap; }
.rows dt, .rows dd { overflow-wrap: anywhere; max-width: 100%; }
button, summary, .links a { overflow-wrap: anywhere; max-width: 100%; }
.strip > div { min-width: 0; overflow-wrap: anywhere; }

.calendar { grid-template-columns: repeat(auto-fit, minmax(1.25rem, 1fr)); }
.stepper input { min-width: 0; flex: 1; }
.stepper button { flex-shrink: 0; }

.scene .collected { fill: var(--gold); stroke: #a16207; }
.playing .collected { animation-name: collected; }
@keyframes collected { from { opacity: 1; } to { opacity: 0; transform: translate(64px, 15px); } }


.history-open { width: 100%; margin-top: 6px; font-size: .88rem; }
.history-open[hidden] { display: none; }
.trading-picture { margin: 10px 0; }
.split-bar { display: flex; height: 12px; overflow: hidden; border-radius: 6px; background: #eee; margin: 4px 0; }
.split-bar .sold, .split-bar .paid { background: var(--teal); }
.split-bar .waste { background: #92400e; }
.split-bar .rejected { background: var(--red); }
.split-bar .credit { background: repeating-linear-gradient(135deg, #b45309 0 4px, #fcd34d 4px 8px); }
.bar-key { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: .82rem; }
.bar-key .sold, .bar-key .paid { color: var(--teal-dark); }
.bar-key .waste, .bar-key .credit { color: #92400e; }
.bar-key .rejected { color: var(--red); }
dialog { width: min(560px, calc(100% - 16px)); max-width: calc(100% - 16px); max-height: calc(100% - 24px); padding: 12px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--paper); overflow-wrap: anywhere; }
dialog::backdrop { background: rgb(31 22 14 / .65); }
.history-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; position: sticky; top: -12px; background: var(--paper); padding: 8px 0; z-index: 1; }
.history-head h2 { flex: 1 1 130px; }
.history-head button { font-size: .88rem; }
.history-chart { margin: 12px 0; }
.history-chart svg { display: block; width: 100%; }
.history-chart polyline { fill: none; stroke-width: 2; }
.history-chart circle { fill: var(--paper); stroke-width: 2; }
.history-chart .sales { stroke: #b45309; }
.history-chart .profit { stroke: #7c3aed; stroke-dasharray: 2 3; }
.history-chart .cashEnd { stroke: var(--teal); stroke-dasharray: 8 3; }
.history-chart .zero { stroke: #9a8977; }
.history-chart .selected-week { stroke: #9a8977; stroke-dasharray: 2 3; }
.chart-key { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8rem; }
.chart-key span::before { content: ''; display: inline-block; width: 20px; border-top: 3px solid; margin-right: 4px; vertical-align: middle; }
.chart-key .sales { color: #b45309; }
.chart-key .profit { color: #7c3aed; }
.chart-key .profit::before { border-top-style: dotted; }
.chart-key .cashEnd { color: var(--teal-dark); }
.chart-key .cashEnd::before { border-top-style: dashed; }
.history-controls { display: flex; align-items: end; gap: 8px; }
.history-controls > div { flex: 1; min-width: 0; }
.history-controls label { display: block; }
.history-controls select { width: 100%; min-height: 48px; font: inherit; border: 1px solid var(--teal); border-radius: 8px; color: var(--ink); background: white; }
.history-controls button { flex: 0 0 48px; padding: 8px 2px; }
select:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

.tall-summary .strip { position: static; }

/* The editable plan and its action stay together. */
.opening .scene svg { height: 100px; }
.daily-plan .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.daily-plan .seg legend { grid-column: 1 / -1; }
.daily-plan .seg span { justify-content: center; padding: 6px 2px; font-size: .9rem; }
.daily-plan .stepper { margin: 4px 0; }
.recap .compare { font-size: .95rem; }
.recap details .result { padding: 0; border: 0; }

.strip .meta[hidden] { display: none; }

.top-controls { display: flex; gap: 8px; }
.top-controls button { flex: 1; font-size: .82rem; padding: 5px 8px; }
.guide-steps { padding-left: 1.5rem; }
.guide-steps li { margin: .65rem 0; padding-left: .25rem; }
.guide-steps li::marker { color: var(--teal-dark); font-weight: 700; }
.guide-steps p { font-size: .9rem; }
#guide-close { width: 100%; margin-top: 12px; position: sticky; bottom: 0; }
.receipt { margin: 10px 0; overflow-wrap: anywhere; }
.receipt > div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.receipt dt { font-weight: 600; }
.receipt dd { margin: 0; }
.receipt .small { font-size: .82rem; }
.recap > button { width: 100%; margin-top: 12px; }
#next-step { scroll-margin-top: 150px; }
.tall-summary #next-step { scroll-margin-top: 12px; }

/* The stage: summary and stall stay on screen; the stall parts open the panels. */
.stage { position: sticky; top: 0; z-index: 2; background: var(--paper); padding-bottom: 4px; }
.stage .strip { position: static; }
.tall-summary .stage { position: static; }
.spots { position: absolute; inset: 0; pointer-events: none; }
.spots[hidden], .scene.playing + .spots { display: none; }
.spot { position: absolute; pointer-events: auto; transform: translate(-50%, -50%); min-height: 44px; width: 44px; height: 44px; padding: 0; border: 0; background: none; display: grid; place-items: center; }
.spot .badge { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 2px solid var(--teal); display: grid; place-items: center; box-shadow: 0 1px 3px rgb(0 0 0 / .3); }
.spot .badge svg { width: 18px; height: 18px; fill: none; stroke: var(--teal-dark); stroke-width: 2; stroke-linejoin: round; }
.spot.limit .badge { border-color: var(--orange); box-shadow: 0 0 0 4px #fed7aa; animation: pulse 1.4s ease-in-out 3; }
.spot:focus-visible { outline: 3px solid var(--orange); border-radius: 50%; }
[data-spot=buy] { left: 9%; top: 82%; } [data-spot=cook] { left: 14%; top: 50%; } [data-spot=collect] { left: 44%; top: 46%; }
[data-spot=money] { left: 65%; top: 58%; } [data-spot=sell] { left: 83%; top: 78%; }
@keyframes pulse { 50% { transform: scale(1.15); } }
.sheet { margin: auto auto 0; width: min(560px, 100%); max-width: 100%; border-radius: 14px 14px 0 0; border-bottom: 0; animation: sheet .25s ease; }
.sheet::backdrop { background: rgb(31 22 14 / .2); }
#sheet-title { display: flex; align-items: center; gap: 8px; }
@keyframes sheet { from { transform: translateY(40%); opacity: 0; } }
.limit-note .link { min-height: 40px; }

/* What an action changed enters with a short motion; cash moves to or from the tin. */
.scene .price rect { fill: var(--teal-dark); } .scene .price text { fill: #fff; font: 700 7px system-ui; text-anchor: middle; }
.scene .book rect { fill: #1d4ed8; } .scene .book path { stroke: #fff; }
.scene .new { transform-box: fill-box; transform-origin: 50% 100%; animation: enter .6s ease-out both; }
.scene .price.new { transform-origin: 50% 50%; animation-name: flip; }
.scene .juma.new { animation-name: walk; }
.scene .cashin, .scene .cashout { fill: var(--gold); stroke: #a16207; opacity: 0; animation: .7s ease-in both; animation-delay: calc(var(--i) * .12s); }
.scene .cashin { animation-name: cashin; } .scene .cashout { animation-name: cashout; }
.scene .fill { transition-duration: .9s; }
.playing .fill { transition-duration: 3s; }
@keyframes enter { from { opacity: 0; transform: translateY(-14px) scale(.6); } }
@keyframes flip { 40% { transform: scaleY(0); } }
@keyframes walk { from { opacity: 0; transform: translateX(-50px); } }
@keyframes cashin { 0% { opacity: 1; } 100% { opacity: 1; transform: translate(114px, 64px) scale(.6); } }
@keyframes cashout { 0% { opacity: 1; } 100% { opacity: 0; transform: translate(-110px, -40px); } }
.stage .strip strong { font-size: .9rem; }
.stage .strip .meta { font-size: .76rem; }

</style>

// Amounts are stored locale-neutral (plain integers) and formatted only at render
// time — AGENTS.md section 6. Never author a currency symbol into content.


let currency = 'TZS';

function setCurrency(nextCurrency) {
  currency = nextCurrency || currency;
}

/** Digit grouping follows the interface language. */
function localeTag() {
  return getLanguage() === 'sw' ? 'sw-TZ' : 'en-GB';
}

// Grouped integer, no decimals. Small-business amounts are whole shillings.
//
// The currency stays the ISO code in both languages. "TSh" and the local "1,500/="
// notation are both plausible for Tanzania, but inventing regulatory or commercial
// detail is exactly what AGENTS.md section 6 forbids — it is logged for local review
// instead.
function money(amount) {
  const n = Math.round(Number(amount) || 0);
  const sign = n < 0 ? '-' : '';
  const grouped = Math.abs(n).toLocaleString(localeTag(), { maximumFractionDigits: 0 });
  return `${sign}${currency} ${grouped}`;
}

// Compact form for tight spaces (stat tiles, chart axes). Carries the currency, because
// a bare "150k" sitting next to a unit count is ambiguous.
function moneyShort(amount) {
  const n = Math.round(Number(amount) || 0);
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1000000) return `${sign}${currency} ${(abs / 1000000).toFixed(1)}M`;
  if (abs >= 1000) return `${sign}${currency} ${Math.round(abs / 1000)}k`;
  return `${sign}${currency} ${abs}`;
}

// Without the currency — for axes and anywhere the unit is already established.
function compact(amount) {
  const n = Math.round(Number(amount) || 0);
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if (abs >= 1000000) return `${sign}${(abs / 1000000).toFixed(1)}M`;
  if (abs >= 1000) return `${sign}${Math.round(abs / 1000)}k`;
  return `${sign}${abs}`;
}

/** Always signed, for deltas where the direction is the point. */
function moneySigned(amount) {
  const n = Math.round(Number(amount) || 0);
  return n >= 0 ? `+${money(n)}` : money(n);
}

function count(n) {
  return Math.round(Number(n) || 0).toLocaleString(localeTag());
}

// Proportions read more reliably than percentages for this audience —
// docs/localization.md. Used for prediction accuracy.
//
// Built from a template rather than concatenated: "3 of 16" and "3 kati ya 16" do not
// share a word order, and docs/localization.md rule 2 forbids assembling sentences
// from fragments.
function proportion(part, whole) {
  const p = Math.round(Number(part) || 0);
  const w = Math.round(Number(whole) || 0);
  if (w <= 0) return '—';
  return t('profile.tally', { part: count(p), whole: count(w) });
}

function percent(fraction) {
  return `${Math.round((Number(fraction) || 0) * 100)}%`;
}

/** Long-form date for the printed record — "21 August 2026" / "21 Agosti 2026". */
function dateLong(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString(localeTag(), { year: 'numeric', month: 'long', day: 'numeric' });
}

  return { setCurrency, money, moneyShort, compact, moneySigned, count, proportion, percent, dateLong };

    const chance = (x.who === 'school' ? P.school.pay : x.who === 'kiosk' ? P.kiosk.pay : P.neighbours[x.who]) + 10 * x.late;
    if (rng(s.seed, 'collect', x.id, s.week)() * 100 < chance) collect(s, x, res);

  res && res.collected.push({ who: x.who, amount: x.amount, from: x.week });
  thread(s, 'collected', { who: x.who, amount: x.amount, from: x.week });

  for (const x of [...s.payables].sort((a, b) => a.due - b.due)) {

    if (s.cash >= x.amount) {

    layer.qty -= take; left -= take; value += take * layer.cost;
  }
  s.packs = s.packs.filter(l => l.qty > 0);
  return { trays: trays - left, value };
}

function trade(s) {
  const startCash = s.lastCash ?? P.cash;
  const res = { week: s.week, days: [], collected: [], late: [], notes: [], invoices: [], rejected: 0, waste: 0 };
  const away = awayMode(s);
  const open = away !== 'close' && away !== 'uncovered';
  const officeOn = open && (s.office || s.trial?.week === s.week);
  res.away = away;
  settleReceivables(s, res);
  payDue(s, res);
  const cap = capacity(s);
  const trays = open ? Math.min(s.plan.trays, cap.trays) : 0;
  Object.assign(res, { planned: s.plan.trays, capacity: cap, trays });
  buy(s, trays, res);
  const pp = pieces_(s), unit = price(s), r = rng(s.seed, 'week', s.week);
  const quality = s.helper ? (s.helper.trained ? pct(P.rejects[s.plan.check], 50) : P.rejects[s.plan.check]) * Math.min(trays, cap.helper) / Math.max(1, trays) : 0;
  const rev = { stall: 0, office: 0, neighbours: 0, school: 0, kiosk: 0 };
  const credit = { school: 0, kiosk: 0 }, owe = {};
  let materials = 0, chai = 0, soldOut = 0;
  for (let d = 0; d < P.days; d++) {
    const made = open ? use(s, trays) : { trays: 0, value: 0 };
    materials += made.value;
    let avail = made.trays * pp;
    const day = { made: made.trays, pieces: avail, school: 0, kiosk: 0, office: 0, neighbours: 0, stall: 0, demand: 0, waste: 0, rain: false };
    const take = n => { const got = Math.min(n, avail); avail -= got; return got; };
    const school = open && s.school ? s.school.pieces : s.trial?.school === s.week && open ? P.school.small : 0;
    if (school) {
      day.school = take(school);
      const bad = Math.floor(day.school * quality / 100);
      res.rejected += bad; day.rejected = bad;
      const value = (day.school - bad) * schoolPrice(s);
      rev.school += value; if (s.school) credit.school += value;
      res.schoolShort = (res.schoolShort || 0) + (school - day.school);
    }
    if (open && s.kiosk) {
      day.kiosk = take(P.kiosk.pieces); rev.kiosk += day.kiosk * P.kiosk.price; credit.kiosk += day.kiosk * P.kiosk.price;
      res.kioskShort = (res.kioskShort || 0) + P.kiosk.pieces - day.kiosk;
    }
    if (officeOn) {
      const buyers = Math.max(0, s.officeBase + between(r, -2, 2));
      const served = Math.min(buyers, Math.floor(avail / P.office.pieces));
      day.office = take(served * P.office.pieces); day.buyers = served;
      rev.office += day.office * unit + served * P.office.chai; chai += served * P.office.chaiCost;
      if (s.trial?.week === s.week) res.trialPaid = (res.trialPaid || 0) + served;
    }
    if (open) for (const [who, c] of Object.entries(s.customers)) {
      if (!c.credit) continue;
      const got = take(P.neighbourPieces); day.neighbours += got;
      owe[who] = (owe[who] || 0) + got * unit; rev.neighbours += got * unit;
    }
    if (open) {
      let demand = pct(pct(P.stallDemand, P.demand[s.plan.price]), between(r, 80, 120));
      if (s.competitor && s.week <= 15) demand = pct(demand, 80);
      if (s.small) demand = pct(demand, 90);
      if (s.week === s.rainWeek && d % 2 === 0) { demand = pct(demand, 60); day.rain = true; }
      day.demand = demand; day.stall = take(demand); rev.stall += day.stall * unit;
      if (demand > day.stall) soldOut++;
    }
    day.waste = avail; res.waste += avail;
    res.days.push(day);
  }
  // Cash sales go into the tin as the week runs; deliveries on credit become invoices.
  const cashSales = rev.stall + rev.office + (s.trial?.school === s.week ? rev.school : 0);
  s.cash += cashSales; add(s.flow, 'sales', cashSales);
  const invoice = (who, amount, term) => {
    if (!amount) return;
    s.receivables.push({ id: ++s.seq, who, amount, week: s.week, due: s.week + term, late: 0, noted: s.notebook });
    res.invoices.push({ who, amount, due: s.week + term });
  };
  invoice('school', credit.school, P.school.term);
  invoice('kiosk', credit.kiosk, 1);
  for (const [who, amount] of Object.entries(owe)) invoice(who, amount, 1);
  const revenue = sum(Object.values(rev));
  add(s.pnl, 'revenue', revenue); add(s.pnl, 'materials', materials); add(s.pnl, 'chai', chai);
  s.cash -= chai; add(s.flow, 'costs', -chai);
  s.totals.revenue += revenue; s.totals.profit += revenue - materials - chai;
  obligation(s, open ? P.fee : 0, 'fee', 'fee');
  if (s.helper) { obligation(s, P.wage, 'wages', 'juma'); s.helper.training = false; }
  if (s.loan) {
    obligation(s, P.loan.interest, 'interest', 'lender');
    const principal = Math.min(P.loan.principal, s.loan.balance);
    const paid = Math.min(principal, s.cash);
    s.cash -= paid; add(s.flow, 'principal', -paid); s.loan.balance -= principal;
    if (principal > paid) s.payables.push({ id: ++s.seq, who: 'lender', amount: principal - paid, due: s.week + 1, week: s.week });
    if (s.loan.balance === 0) { s.loan = null; if (principal === paid && !s.payables.some(x => x.who === 'lender')) thread(s, 'loanRepaid'); }
  }
  let dep = 0;
  for (const e of s.equipment) { const n = Math.min(e.dep, e.book); e.book -= n; dep += n; }
  add(s.pnl, 'depreciation', dep); s.totals.profit -= dep;
  // School and kiosk respond to missed deliveries; declined orders never reach here.
  if (s.school && (res.schoolShort > pct(s.school.pieces * P.days, 20) || away === 'uncovered')) {
    s.school.strikes++; res.notes.push('schoolShort');
    if (s.school.strikes >= 2) { s.school = null; res.notes.push('schoolLost'); thread(s, 'schoolLost'); }
  }
  if (s.kiosk && (res.kioskShort > pct(P.kiosk.pieces * P.days, 20) || away === 'uncovered')) {
    s.kiosk.strikes = (s.kiosk.strikes || 0) + 1; res.notes.push('kioskShort');
    if (s.kiosk.strikes >= 2 || away === 'uncovered') { s.kiosk = null; res.notes.push('kioskLost'); thread(s, 'kioskLost'); }
  }
  if (away === 'cover' && revenue > 0) {
    // Scope: sales happened without the owner while the notebook and a check were in
    // place. The model does not compare a real count with the tin, so claim no more.
    s.awayTraded = (s.awayTraded || 0) + 1;
    s.awayKept = s.notebook && s.plan.check !== 'none';
    thread(s, 'awayCovered');
  } else if (away) thread(s, away === 'close' ? 'awayClosed' : 'awayMissed');
  // Household money last, from what remains.
  const home = Math.min(s.plan.household, s.cash);
  s.cash -= home; add(s.flow, 'household', -home); s.totals.drawings += home;
  if (s.plan.household > 0 && home === s.plan.household) { s.household.paid++; s.household.streak++; }
  else if (s.plan.household > 0) {
    s.household.short++; s.household.streak = 0; s.household.unmet = (s.household.unmet || 0) + s.plan.household - home;
    res.notes.push('householdShort'); res.householdShort = s.plan.household - home;
  }
  if (s.trial?.week === s.week && res.trialPaid !== undefined) {
    res.trial = { paid: Math.round(res.trialPaid / P.days), invited: P.office.invited };
    thread(s, 'trial', res.trial);
  }
  if (s.trial?.school === s.week) thread(s, 'schoolTrialDone', { amount: rev.school });
  // Result: every tin movement since the last week card, and the profit lines.
  const pnl = s.pnl, profit = (pnl.revenue || 0) - sum(Object.entries(pnl).filter(([k]) => k !== 'revenue').map(([, v]) => v));
  Object.assign(res, {
    revenue: rev, sales: revenue, cashSales, creditSales: revenue - cashSales, profit, pnl: { ...pnl }, flow: { ...s.flow },
    cashStart: startCash, cashEnd: s.cash, soldOutDays: soldOut, household: home,
    hours: Math.ceil(hours(cap, sum(res.days.map(d => d.made)) / P.days)), noted: s.notebook, stock: stock(s), owedToYou: owedToYou(s), owedByYou: owedByYou(s),
  });
  res.limit = limit(res);
  s.history.push(res);
  s.lastCash = s.cash; s.flow = {}; s.pnl = {}; s.hours = 0; s.chased = [];
  s.week++;
  if ((s.week - 1) % 4 === 0) { s.phase = 'review'; s.pending = null; } else arrive(s);
  return res;
}

// Which stage limited the week, from the result alone.
function limit(res) {
  if (!res || !res.trays && !res.planned) return '';
  if (res.short > 0) return 'buy';
  if (res.soldOutDays >= 3) return res.planned > res.capacity.trays ? (res.capacity.by === 'pots' ? 'pots' : 'hours') : 'plan';
  if (res.waste > res.trays * P.days * P.pieces * 15 / 100) return 'demand';
  if (res.owedToYou > res.cashEnd && res.owedToYou > 0) return 'collect';
  return '';
}

// ---- dispatcher -------------------------------------------------------------

function step(state, action) {
  const s = structuredClone(state);
  const need = phase => { if (s.phase !== phase && !(phase === 'plan' && s.phase === 'event' && action.type !== 'run')) fail('phase'); };
  let result = {};
  switch (action?.type) {
    case 'plan': {
      need('plan');
      const next = { ...s.plan, ...action.patch };
      for (const [k, [lo, hi]] of Object.entries(PLAN_LIMITS)) if (!Number.isSafeInteger(next[k]) || next[k] < lo || next[k] > hi) fail('plan');
      if (next.household % 100 || !STEPS.includes(next.price) || !['cash', 'credit'].includes(next.pay) ||
        ![1, 2].includes(next.buyWeeks) || !(next.check in P.checkHours)) fail('plan');
      s.plan = next; result = { plan: next };
      break;
    }
    case 'run': need('plan'); result = trade(s); break;
    case 'answer': result = answer(s, action.option); break;
    case 'buyPot': need('plan'); if (s.pots >= P.pot.max || s.cash < P.pot.cost) fail('pot'); buyEquipment(s, 'pot'); break;
    case 'sellPot': {
      need('plan');
      const i = s.equipment.findLastIndex(e => e.kind === 'pot');
      if (i < 0) fail('pot');
      const [pot] = s.equipment.splice(i, 1); s.pots--;
      s.cash += P.pot.resale; add(s.flow, 'equipmentSold', P.pot.resale);
      const loss = pot.book - P.pot.resale; add(s.pnl, 'other', loss); s.totals.profit -= loss;
      result = { loss };
      break;
    }
    case 'borrow': need('plan'); borrow(s); break;
    case 'trainHelper': need('plan'); if (!s.helper || s.helper.trained) fail('helper'); cost(s, P.training, 'other'); s.helper.trained = true; s.helper.training = true; break;
    case 'endHelper': need('plan'); if (!s.helper) fail('helper'); s.helper = null; break;
    case 'repay': need('plan'); if (!s.loan || s.cash < s.loan.balance) fail('repay'); spend(s, s.loan.balance, 'principal'); s.loan = null; if (!s.payables.some(x => x.who === 'lender')) thread(s, 'loanRepaid'); break;
    case 'chase': {
      need('plan');
      // Only invoices already due: asking early does not shorten agreed payment terms.
      const mine = s.receivables.filter(x => x.who === action.who && x.due <= s.week);
      if (!mine.length || s.chased.includes(action.who)) fail('chase');
      s.chased.push(action.who); s.hours += 1;
      const base = action.who === 'school' ? P.school.pay : action.who === 'kiosk' ? P.kiosk.pay : P.neighbours[action.who];
      const paid = rng(s.seed, 'chase', action.who, s.week)() * 100 < base - 20 + 10 * Math.max(...mine.map(x => x.late));
      if (paid) for (const x of mine) collect(s, x, null);
      result = { who: action.who, paid, amount: paid ? sum(mine.map(x => x.amount)) : 0 };
      break;
    }
    case 'credit': need('plan'); if (!s.customers[action.who]) fail('who'); s.customers[action.who].credit = !!action.on; break;
    case 'notebook': need('plan'); s.notebook = !!action.on; if (s.notebook) s.notebookFrom = s.week; break;
    case 'help': result = { limit: limit(s.history.at(-1)), week: s.week }; s.help.push(s.week); break;
    case 'goal': if (!['income', 'customers', 'away'].includes(action.goal) || s.week < 5) fail('goal'); s.goal = action.goal; s.goals.push({ week: s.week, goal: action.goal }); break;
    case 'review': need('review'); if (s.week > WEEKS && !s.finished) { s.finished = true; } arrive(s); break;
    case 'close': if (s.phase === 'closed') fail('phase'); s.phase = 'closed'; s.pending = null; break;
    default: fail('action');
  }
  return { state: s, result };
}

function can(state, action) {
  try { step(state, action); return true; } catch { return false; }
}

function replay(seed, actions) {
  let s = createSeason({ seed });
  for (const a of actions) s = step(s, a).state;
  return s;
}

// A routine week: no event or month close waiting, the away week is not next, and the
// tin covers the planned batch and household money. Events and closes stop the loop.
function quiet(s) {
  if (s.phase !== 'plan') return false;
  const trays = Math.min(s.plan.trays, capacity(s).trays);
  const cost = Math.max(0, trays * P.days - stock(s)) * packCost(s);
  return s.cash >= cost + s.plan.household && s.week !== P.awayWeek;
}

function facts(s) {
  const last = s.history.slice(-4);
  const business = ['office', 'school', 'kiosk'].filter(k => s[k] && last.some(r => r.revenue[k] > 0)).length;
  return {
    weeks: s.history.length, householdPaid: s.household.paid, householdShort: s.household.short, streak: s.household.streak,
    householdUnmet: s.household.unmet || 0, paymentsUnmet: sum(s.payments.map(p => p.status === 'missed' ? p.amount - p.paidPart : 0)),
    buffer: s.plan.household ? Math.floor(s.cash / s.plan.household) : 0,
    hours: last.length ? Math.round(sum(last.map(r => r.hours)) / last.length) : 0,
    business, awayTraded: s.awayTraded || 0, awayKept: !!s.awayKept,
    owedToYou: owedToYou(s), owedByYou: owedByYou(s), people: s.helper ? 1 : 0,
    sales: s.totals.revenue, profit: s.totals.profit, drawings: s.totals.drawings, cash: s.cash,
    stock: stock(s), stockValue: stockValue(s), equipment: book(s),
    payments: s.payments.map(p => ({ week: p.week, amount: p.amount, status: p.status })),
  };
}

// Goal progress as facts against the prototype targets; reaching one is not ranked.
function goalProgress(s) {
  const f = facts(s);
  const onTime = ['school', 'kiosk'].every(k => !s[k] || !s.receivables.some(x => x.who === k && x.late));
  return {
    income: { now: [Math.min(f.streak, 8), Math.min(f.buffer, 4)], of: [8, 4], reached: f.streak >= 8 && f.buffer >= 4 },
    customers: { now: [f.business], of: [3], reached: f.business >= 3 && onTime },
    away: { now: [f.awayTraded && f.awayKept ? 1 : 0], of: [1], reached: !!f.awayTraded && f.awayKept },
  };
}

  return { createSeason, balance, capacity, needs, limit, step, can, replay, quiet, facts, goalProgress, CALC_VERSION, WEEKS, SAMPLE, stock, hours, committed, eventOptions };
})();

/* ---- seasonstore ---- */
const NS_seasonstore = (function () {

// Season records: a separate IndexedDB database. Legacy saves ('business-simulator'
// IndexedDB and the intro's localStorage keys) are never read for writing or changed.
//
// One record per run: { schema, version, id, run, seed, calc, content, startedAt,
// updatedAt, rev, log: [{ n, at, week, action }], state }. Each committed action and its
// resulting state are one put, so a reload shows the result and never repeats it.
// `rev` guards against a second tab: a write whose expected rev is stale is refused.
const DB = 'mv-bs-season';
const SCHEMA = 'mv-bs-season-record';
const VERSION = 1;
let db = null;

async function open() {
  db?.close();
  db = null;
  const opened = await new Promise((resolve, reject) => {
    const request = indexedDB.open(DB, 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore('runs', { keyPath: 'id' });
      request.result.createObjectStore('meta');
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('blocked'));
  });
  db = opened;
  opened.onversionchange = () => { opened.close(); if (db === opened) db = null; };
}

const tx = (stores, mode, body) => new Promise((resolve, reject) => {
  if (!db) { reject(new Error('unavailable')); return; }
  const t = db.transaction(stores, mode);
  let out;
  t.oncomplete = () => resolve(out);
  t.onabort = t.onerror = () => reject(t.error || new Error(out?.error || 'aborted'));
  out = body(t);
});


async function list() {
  return tx(['runs'], 'readonly', t => {
    const out = [];
    t.objectStore('runs').openCursor().onsuccess = e => {
      const c = e.target.result;
      if (c) { const v = c.value; out.push({ id: v.id, run: v.run, week: v.state?.week, updatedAt: v.updatedAt, phase: v.state?.phase }); c.continue(); }
    };
    return out;
  });
}

async function active() {
  const id = await tx(['meta'], 'readonly', t => { const r = t.objectStore('meta').get('active'); return r; }).then(r => r.result);
  return id ? tx(['runs'], 'readonly', t => t.objectStore('runs').get(id)).then(r => r.result || null) : null;
}

// Compare-and-put. Resolves the new rev; rejects Error('conflict') on a stale tab.
async function save(record, expected) {
  const next = { ...record, rev: expected + 1, updatedAt: new Date().toISOString() };
  let conflict = false;
  await tx(['runs', 'meta'], 'readwrite', t => {
    const runs = t.objectStore('runs');
    const r = runs.get(record.id);
    r.onsuccess = () => {
      const stored = r.result?.rev ?? 0;
      if (stored !== expected) { conflict = true; t.abort(); return; }
      runs.put(next);
      t.objectStore('meta').put(record.id, 'active');
    };
  }).catch(error => { throw conflict ? new Error('conflict') : error; });
  return next.rev;
}

async function activate(id) {
  await tx(['meta'], 'readwrite', t => { t.objectStore('meta').put(id, 'active'); });
}
async function read(id) {
  return tx(['runs'], 'readonly', t => t.objectStore('runs').get(id)).then(r => r.result || null);
}
async function remove(id) {
  await tx(['runs'], 'readwrite', t => { t.objectStore('runs').delete(id); });
}

// Detect earlier games without opening them for writing.
async function legacy() {
  const keys = ['business-simulator:asha-intro:v3', 'asha-stall-v2', 'business-simulator:v1'];
  let found = false;
  try { found = keys.some(k => localStorage.getItem(k)); } catch { /* storage blocked */ }
  try { found ||= (await indexedDB.databases?.() || []).some(d => d.name === 'business-simulator'); } catch { /* unsupported */ }
  return found;
}

  return { open, list, active, save, activate, read, remove, legacy, DB, SCHEMA, VERSION };
})();

/* ---- seasonscene ---- */
const NS_seasonscene = (function () {

// The stall as one small SVG. Its parts are drawn from saved state only: pots, packs,
// trays, helper, customers, tin level, invoices and business buyers. A finished week
// replays as a short CSS animation of its saved day results; nothing here decides
// an outcome. Reduced motion or "skip" shows the final picture at once.
// With the previous picture (prev), parts that were added enter with a short motion and
// cash moved outside trading flies into or out of the tin, so every action is seen.
const W = 360;
const cap = (n, max) => Math.max(0, Math.min(max, n));
const person = (x, y, body, cls = '') =>
  `<g class="p ${cls}" transform="translate(${x} ${y})"><circle r="7" cy="-19" fill="#8a5a3b"/><rect x="-8" y="-12" width="16" height="20" rx="6" fill="${body}"/></g>`;

// Tin fill: 0..1 of a sample scale; the label, not the height, carries the amount.
const level = cash => cap(cash / 40000, 1);

function drawScene(view, prev = null) {
  const fresh = (i, before) => prev && i >= before ? ' new' : '';
  const trays = cap(view.trays, 15), packs = cap(Math.ceil(view.stock / 6), 6);
  const queue = cap(Math.round(view.queue / 9), 8), papers = cap(view.invoices, 6);
  const trayRects = Array.from({ length: trays }, (_, i) => {

  }).join('');
  const sacks = Array.from({ length: packs }, (_, i) =>
    `<path class="sack${fresh(i, prev && Math.ceil(prev.stock / 6))}" d="M${14 + i * 13} 170 q-2 -14 5 -16 q7 2 5 16 z"/>`).join('');
  const people = Array.from({ length: queue }, (_, i) =>
    person(262 + (i % 4) * 22, 172 - Math.floor(i / 4) * 4 + (i % 2) * 3, ['#0f766e', '#b45309', '#7c3aed', '#be123c'][i % 4], 'cust')).join('');
  const clip = Array.from({ length: papers }, (_, i) =>
    `<rect class="paper${fresh(i, prev?.invoices)}" x="${152 + i * 2}" y="${100 - i * 3}" width="12" height="15" rx="1"/>`).join('');
  const buildings = [
    view.office && `<g class="bld${prev && !prev.office ? ' new' : ''}"><rect x="252" y="30" width="44" height="62" fill="#cbd5e1"/><rect x="258" y="38" width="10" height="8" fill="#fff"/><rect x="278" y="38" width="10" height="8" fill="#fff"/><rect x="258" y="54" width="10" height="8" fill="#fff"/><rect x="278" y="54" width="10" height="8" fill="#fff"/></g>`,
    view.school && `<g class="bld${prev && !prev.school ? ' new' : ''}"><path d="M300 52 l26 -18 l26 18 z" fill="#b91c1c"/><rect x="304" y="52" width="44" height="40" fill="#fde68a"/><rect x="320" y="70" width="12" height="22" fill="#92400e"/></g>`,
    view.kiosk && `<g class="bld${prev && !prev.kiosk ? ' new' : ''}"><rect x="206" y="62" width="30" height="30" fill="#bae6fd"/><rect x="202" y="58" width="38" height="6" fill="#0369a1"/></g>`,
  ].filter(Boolean).join('');
  // Cash moved by a plan action (loan, pot, wage, collection): coins to or from the tin.

// One finished week, day by day. Coins fly to the tin for cash sales, a paper flies to
// the clipboard for sales on credit, customers leave on sold-out days and leftovers go
// to the bin. Each day takes .5 s; the tin moves from its start to its end amount.
function animateWeek(host, result, labels) {
  const fx = host.querySelector('#fx');
  if (!fx) return 0;
  const parts = [];
  if (result.bought) parts.push('<g class="fx arrive" style="--d:0"><path class="sack" d="M14 170 q-2 -14 5 -16 q7 2 5 16 z"/></g>');
  if (result.flow.collected > 0) parts.push('<circle class="fx collected" cx="170" cy="105" r="4" style="--d:0"/>');
  const schoolCredit = result.invoices.some(x => x.who === 'school');
  result.days.forEach((day, d) => {
    const delay = `style="--d:${d}"`;
    parts.push(`<text class="fx daylabel" x="180" y="44" ${delay}>${labels.day(d + 1)}</text>`);
    const cashPieces = day.stall + day.office + (schoolCredit ? 0 : day.school);
    for (let i = 0; i < cap(Math.ceil(cashPieces / 15), 4); i++)
      parts.push(`<circle class="fx coin" cx="${270 + i * 14}" cy="150" r="4" style="--d:${d};--i:${i}"/>`);
    if ((schoolCredit ? day.school : 0) + day.kiosk + day.neighbours) parts.push(`<rect class="fx invoice" x="300" y="120" width="12" height="15" ${delay}/>`);
    if (day.demand > day.stall) parts.push(`<g class="fx leave" ${delay}>${person(330, 172, '#64748b')}</g><text class="fx soldout" x="300" y="112" ${delay}>${labels.soldOut}</text>`);
    if (day.waste) parts.push(`<circle class="fx waste" cx="200" cy="130" r="3" ${delay}/>`);
    if (day.rain) parts.push(`<g class="fx drops" ${delay}><path d="M40 40 v12 M100 30 v12 M160 44 v12 M220 30 v12 M280 44 v12 M330 30 v12"/></g>`);
  });
  fx.innerHTML = parts.join('');
  const fill = host.querySelector('.tin .fill');
  const set = cash => { fill.style.transform = `scaleY(${level(cash)})`; };
  set(result.cashStart);
  host.classList.remove('done'); host.classList.add('playing');
  requestAnimationFrame(() => requestAnimationFrame(() => set(result.cashEnd)));
  return result.days.length * 500 + 400;
}

  return { drawScene, animateWeek, level };
})();

function newRecord(n) {

async function persist() {
  try { rec.rev = await store.save(rec, rec.rev); status = 'ok'; }
  catch (error) { status = error.message === 'conflict' ? 'conflict' : 'failed'; }
  renderStatus();
}

// Apply actions, then save the actions and their result together before showing them.
async function commit(actions) {
  if (busy || blocked || status !== 'ok') return null;
  busy = true;
  let s = rec.state;
  const log = [...rec.log], results = [];
  try {
    for (const action of actions) {
      const out = step(s, action);
      log.push({ n: log.length + 1, at: new Date().toISOString(), week: s.week, language: getLanguage(), phase: s.phase, event: s.pending, automaticHelp: Boolean(document.querySelector('.limit-note')), action, result: out.result });
      shown = feedback(action, out.result, s);
      s = out.state; results.push(out.result);
    }
  } catch { busy = false; render(); return null; }
  rec = { ...rec, state: s, log };
  saving = persist().then(refreshRuns);
  await saving;
  busy = false;
  return results;
}

// Live play and reopening a record show the same facts, translated at render time.
function feedback(action, result, before) {
  if (action.type === 'run') return { kind: 'result', results: [result] };
  if (action.type === 'answer') return { kind: 'outcome', id: before.pending, result, before };
  if (action.type === 'chase') return { kind: 'notice', result };
  if (action.type === 'help') return { kind: 'help' };
  return null;
}

const act = action => async () => {
  const results = await commit([action]);
  if (!results) return;
  motion = true;
  render();
};
const plan = (patch) => act({ type: 'plan', patch });

async function runWeeks(until) {
  await saving;
  const actions = [{ type: 'run' }];
  if (!can(rec.state, actions[0])) return;
  let s = step(rec.state, actions[0]).state;
  while (until && quiet(s) && !s.history.at(-1).late.length && !s.history.at(-1).notes.length && actions.length < 8) { actions.push({ type: 'run' }); s = step(s, { type: 'run' }).state; }
  const results = await commit(actions);
  if (!results) return;
  shown = { kind: 'result', results };
  render(reduced());
  play(results.at(-1));
  if (!reduced()) $('scene').scrollIntoView({ block: 'start', behavior: 'auto' });
}

function play(result) {
  const scene = $('scene');

  const ms = animateWeek(scene, result, { day: n => t('day', { n }), soldOut: t('soldOut') });
  $('skip').hidden = false;
  timer = setTimeout(stop, ms);
}

  const playing = $('scene').classList.contains('playing');

function historyDecisions(week) {
  let state = createSeason({ seed: rec.seed });
  const choices = [];
  for (const entry of rec.log) {
    if (state.week > week) break;
    const a = entry.action;
    if (state.week === week) {
      if (a.type === 'answer') choices.push(fill(ev(state.pending, 'title'), eventParams(state)) + ' — ' + fill(ev(state.pending, 'options', a.option, 'label'), eventParams(state)));
      if (a.type === 'plan') for (const [key, value] of Object.entries(a.patch)) {
        if (value === state.plan[key]) continue;
        const label = { trays: 'trays', price: 'price', household: 'household', pay: 'payWith', buyWeeks: 'buyFor', check: 'checks' }[key];
        const text = key === 'price' ? money(P.price[value]) : key === 'household' ? money(value) : key === 'trays' ? value : t(`${key}.${value}`);
        choices.push(`${t(label)}: ${text}`);
      }
      if (['buyPot', 'sellPot', 'borrow', 'repay', 'trainHelper', 'endHelper'].includes(a.type)) {
        const amount = { buyPot: P.pot.cost, sellPot: P.pot.resale, borrow: P.loan.amount, repay: state.loan?.balance, trainHelper: P.training }[a.type];
        choices.push(t(a.type, { amount: money(amount) }));
      }
      if (a.type === 'chase') choices.push(t('chase', { who: who(a.who) }));
      if (a.type === 'credit') choices.push(t(a.on ? 'creditOn' : 'creditOff', { who: who(a.who) }));
      if (a.type === 'notebook') choices.push(t(a.on ? 'notebookOn' : 'notebookOff'));
    }
    if (state.week === week && a.type === 'run') break;
    state = step(state, a).state;
  }
  return h('details', { class: 'history-decisions' }, h('summary', { text: t('history.decisions') }),
    choices.length ? h('ul', {}, choices.map(text => h('li', { text }))) : h('p', { text: t('history.unchanged') }));
}

function historyChart(history, week) {
  const keys = ['sales', 'profit', 'cashEnd'];
  const values = history.flatMap(r => keys.map(k => r[k]));
  const lo = Math.min(0, ...values), hi = Math.max(1, ...values);
  const x = i => 12 + i / Math.max(1, history.length - 1) * 276;
  const y = v => 116 - (v - lo) / (hi - lo) * 104;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 300 130'); svg.setAttribute('aria-hidden', 'true');
  const line = (tag, attrs) => { const el = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); svg.append(el); };
  line('line', { x1: 12, x2: 288, y1: y(0), y2: y(0), class: 'zero' });
  line('line', { x1: x(week - 1), x2: x(week - 1), y1: 8, y2: 120, class: 'selected-week' });
  for (const key of keys) {
    line('polyline', { points: history.map((r, i) => `${x(i)},${y(r[key])}`).join(' '), class: key });
    line('circle', { cx: x(week - 1), cy: y(history[week - 1][key]), r: 3, class: key });
  }
  return h('figure', { class: 'history-chart' },
    h('figcaption', { text: t('history.range', { first: history[0].week, last: history.at(-1).week }) }),
    h('p', { class: 'small', text: `${money(lo)} — ${money(hi)}` }), svg,
    h('div', { class: 'chart-key' }, keys.map(key => h('span', { class: key, text: t(`history.${key}`) }))));
}

function stepper(field, value, stepBy, label, min, max) {

function render(focusResult = false) {
  clearTimeout(timer);
  $('scene').classList.remove('playing');
  $('skip').hidden = true;
  const planOpen = document.querySelector('[data-testid=plan-editor]')?.open;
  const active = document.activeElement;
  const focused = active?.dataset.field ? `[data-field="${active.dataset.field}"]${active.type === 'radio' ? `[value="${active.value}"]` : ''}` : active?.dataset.for ? `[data-action="${active.dataset.action}"][data-for="${active.dataset.for}"]`
    : active?.dataset.action && $('sheet').contains(active) ? `[data-action="${active.dataset.action}"]${active.dataset.who ? `[data-who="${active.dataset.who}"]` : ''}` : null;
  document.title = t('title');
  $('title').textContent = t('title'); $('sub').textContent = t('sub');
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('lang').textContent = t('otherLang'); $('lang').lang = getLanguage() === 'en' ? 'sw' : 'en';
  $('guide-lang').textContent = t('otherLang'); $('guide-lang').lang = $('lang').lang;
  const main = $('main');
  let spotHighlight = '';
  document.body.classList.toggle('opening', !blocked && !rec.state.history.length);
  main.replaceChildren();
  renderStatus();
  if (blocked) {
    $('history-open').hidden = true;
    renderSpots('');
    main.append(h('section', { class: 'card' }, h('p', { text: t('unreadable') }), btn(t('export'), 'export', { class: 'primary', onclick: exportRecord }),
      btn(t('newRun'), 'new', { onclick: newRun })));
    renderFoot(); return;
  }
  renderTop();
  const s = rec.state;
  $('history-open').hidden = !s.history.length;
  $('history-open').textContent = t('history.open');
  $('history-open').onclick = () => showHistory();
  if (shown?.kind === 'notice') {
    const r = shown.result;
    main.append(h('p', { class: 'card', role: 'status', text: t(r.paid ? 'chasePaid' : 'chaseWaiting', { who: who(r.who), amount: money(r.amount) }) }));
  }
  if (s.phase === 'closed') {
    const f = facts(s);
    main.append(h('section', { class: 'card' }, h('p', { text: t('closed') }),
      rows([[t('f.cash'), money(f.cash)], [t('f.profit'), money(f.profit)], [t('f.owedToYou'), money(f.owedToYou)], [t('f.owedByYou'), money(f.owedByYou)], [t('f.drawings'), money(f.drawings)]]),
      h('p', { class: 'small', text: t('limits') }), btn(t('newRun'), 'new', { class: 'primary', onclick: newRun })));
  }
  else if (s.phase === 'event') {
    if (shown?.kind === 'result') main.append(resultCard(shown.results, true));
    main.append(eventCard(s));
    if (shown?.kind === 'outcome') main.append(outcomeCard(shown));
    main.append(h('details', { 'data-testid': 'plan-editor', open: planOpen }, h('summary', { text: t('plan.change') }), dailyPlan(s)));
  }
  else if (s.phase === 'review') { if (shown?.kind === 'result') main.append(resultCard(shown.results, true)); main.append(reviewCard(s)); }
  else {
    if (shown?.kind === 'result') main.append(resultCard(shown.results, true));
    if (shown?.kind === 'outcome') main.append(outcomeCard(shown));
    if (s.goal) main.append(h('p', { class: 'goal-line', text: t('yourGoal', { goal: t(`goal.${s.goal}`) }) }));
    const forced = shown?.kind === 'help';
    const hint = limitCard(s, forced); if (hint) main.append(hint);
    const last = s.history.at(-1);
    const highlight = last && (s.history.length <= 3 || forced) ? TILE[last.limit] : '';
    const trays = Math.min(s.plan.trays, capacity(s).trays);
    const warn = s.cash < Math.max(0, trays * P.days - stock(s)) * (P.pack + (s.week >= P.riseWeek ? P.rise : 0)) + s.plan.household;
    const daily = dailyPlan(s);
    daily.id = 'next-step'; daily.tabIndex = -1;
    daily.append(h('div', { class: 'run' },
      warn ? h('p', { class: 'warn', role: 'alert', text: t('cashWarning') }) : null,
      h('p', { class: 'small', text: t('plan.trade', { n: P.days }) }),
      btn(t('run', { n: s.week }), 'run', { class: 'primary', onclick: () => runWeeks(false) }),
      s.history.length > 0 ? btn(t('runUntil'), 'runUntil', { onclick: () => runWeeks(true) }) : null,
      s.history.length > 3 ? btn(t('help'), 'help', { class: 'link', onclick: act({ type: 'help' }) }) : null,
      s.history.length > 3 ? h('p', { class: 'small', text: t('helpNote') }) : null));
    main.append(daily);
    spotHighlight = highlight;
  }
  renderSpots(spotHighlight);
  if ($('sheet').open) fillSheet();
  if (focused) (main.querySelector(focused) || $('sheet-body').querySelector(focused))?.focus({ preventScroll: true });
  if (status !== 'ok') for (const control of main.querySelectorAll('button, input')) control.disabled = true;
  renderFoot();
  if (focusResult) main.querySelector('[data-testid="result"]')?.focus({ preventScroll: false });
}

  }
  list.append(h('li', {}, btn(t('newRun'), 'new', { onclick: newRun })));
  $('earlier-title').textContent = t('earlier');
  $('earlier-found').textContent = legacyFound ? t('earlierFound') : '';
  $('intro-link').textContent = t('intro'); $('intro-link').href = (FILE ? ONLINE : './') + 'intro.html';
  $('chapters-link').textContent = t('chapters'); $('chapters-link').href = (FILE ? ONLINE : './') + 'practice.html';
  $('offline-file').textContent = t('offlineFile'); $('offline-file').hidden = FILE;
  $('sample').textContent = t('sample'); $('draft').textContent = getLanguage() === 'sw' ? t('draft') : '';
  $('privacy').textContent = t('privacy');
  $('skip').textContent = t('skip');
}

function exportRecord() {
  const data = { ...rec, exportedAt: new Date().toISOString(), completion: rec.state?.finished ? 'season-reviewed' : rec.state?.phase === 'closed' ? 'closed-early' : 'partial', level: 'simulated', limitations: { en: content.ui.limits.en, sw: content.ui.limits.sw } };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  const a = h('a', { href: url, download: `MV-BS-SEASON-record-run${rec.run || 0}.json` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function refreshRuns() { try { runs = await store.list(); } catch { runs = rec ? [{ id: rec.id, run: rec.run, week: rec.state.week }] : []; } }

async function newRun() {
  if (status !== 'ok' && rec && !confirm(t('unsavedLeave'))) return;
  if (rec && !blocked && !confirm(t('newRunAsk'))) return;
  await refreshRuns();
  rec = newRecord(Math.max(0, ...runs.map(r => r.run)) + 1);
  blocked = false; shown = null; status = 'ok';
  await persist(); await refreshRuns(); render();
}
async function openRun(id) {
  if (status !== 'ok' && !confirm(t('unsavedLeave'))) return;
  const r = await store.read(id);
  if (!r) return;
  status = 'ok'; load(r); await store.activate(id).catch(() => {}); render();
}
async function deleteRun(id) {
  if (!confirm(t('deleteAsk'))) return;
  await store.remove(id).catch(() => {}); await refreshRuns(); render();
}

// Reopen a saved run only if its actions reproduce its saved state under these rules.
function load(r) {
  rec = r;
  shown = null;
  try {
    blocked = r.schema !== store.SCHEMA || r.version !== store.VERSION || r.content?.id !== content.id || r.content?.version !== content.version || r.calc !== CALC_VERSION;
    if (blocked) return;
    const last = r.log.at(-1), before = replay(r.seed, r.log.slice(0, -1).map(e => e.action));
    const out = last ? step(before, last.action) : { state: before };
    blocked = JSON.stringify(out.state) !== JSON.stringify(r.state);
    if (!blocked && last) shown = feedback(last.action, out.result, before);
  }
  catch { blocked = true; }
}

async function checkOffline() {
  if (FILE) { offline = true; return renderStatus(); }
  if (!('serviceWorker' in navigator) || !self.caches) return;
  await navigator.serviceWorker.ready;
  const files = ['./index.html', './js/game.js', './js/season.js', './js/seasonscene.js', './js/seasonstore.js', './content/season.json', './css/season.css'];
  for (let i = 0; i < 40 && !offline; i++) {
    offline = (await Promise.all(files.map(f => caches.match(f)))).every(Boolean);
    if (!offline) await new Promise(resolve => setTimeout(resolve, 500));
  }
  renderStatus();
}

async function init() {
  const response = await fetch('./content/season.json');
  if (!response.ok) throw new Error('content');
  content = await response.json();
  loadStrings(content.ui); setCurrency(content.currency);
  try { setLanguage(localStorage.getItem(LANG) || localStorage.getItem('asha-language') || 'en'); } catch { setLanguage('en'); }
  $('lang').onclick = () => {
    setLanguage(getLanguage() === 'en' ? 'sw' : 'en');
    try { localStorage.setItem(LANG, getLanguage()); } catch { /* language still works without storage */ }
    render();
  };
  $('guide-lang').onclick = $('lang').onclick;
  $('guide-open').onclick = () => $('guide').showModal();
  const rememberGuide = () => {
    try { localStorage.setItem(GUIDE, '1'); } catch { /* Controls still work without preferences. */ }
  };
  $('guide-close').onclick = () => { rememberGuide(); $('guide').close(); };
  $('guide').addEventListener('cancel', rememberGuide);
  $('guide').addEventListener('close', () => {
    $('guide-open').focus({ preventScroll: true });
  });
  $('retry').onclick = async () => { try { await store.open(); } catch { /* persist shows the error */ } await persist(); render(); };
  $('reload').onclick = () => location.reload();
  $('skip').onclick = stop;
  $('history').addEventListener('close', () => $('history-body').replaceChildren());
  $('sheet-close').onclick = () => $('sheet').close();
  $('sheet').addEventListener('close', () => { const key = sheetKey; sheetKey = null; $('sheet-body').replaceChildren(); document.querySelector(`[data-spot="${key}"]`)?.focus({ preventScroll: true }); });
  // Large text must not let the summary and stall cover the operating controls.
  const fitSummary = () => document.body.classList.toggle('tall-summary', document.querySelector('.stage').offsetHeight > innerHeight * .45);
  new ResizeObserver(fitSummary).observe(document.querySelector('.stage'));
  addEventListener('resize', fitSummary);
  let saved = null;
  try { await store.open(); saved = await store.active(); } catch { status = 'failed'; }
  if (saved) load(saved);
  else { rec = newRecord(1); await persist(); }
  await refreshRuns();
  legacyFound = await store.legacy();
  render();
  let guideSeen = false;
  try { guideSeen = localStorage.getItem(GUIDE) === '1'; } catch { /* Show the guide without storage. */ }
  if (!blocked && !guideSeen) $('guide').showModal();
  checkOffline().catch(() => {});
}
init().catch(() => { $('main').textContent = 'Could not open the game. Reconnect and reload. / Mchezo haujafunguka. Unganisha intaneti na upakie upya.'; });

  return {  };
})();
})();
</script>
